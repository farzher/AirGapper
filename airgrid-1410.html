<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AirGrid 1410 Acquisition Test</title>
<style>
:root{font-family:system-ui,sans-serif;color:#eee;background:#111;color-scheme:dark}*{box-sizing:border-box}body{margin:0}.shell{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.build{font:12px ui-monospace,monospace;color:#83ef9b}.card{margin-top:14px;padding:14px;border:1px solid #333;border-radius:10px;background:#181818}button{font:inherit;padding:11px 14px;border:1px solid #555;border-radius:8px;background:#eee;color:#111}.modes button{background:#222;color:#eee}.modes button.active{background:#eee;color:#111}.hidden{display:none!important}.status{margin-top:10px;font:13px ui-monospace,monospace;white-space:pre-wrap}.preview{position:relative;margin-top:12px;background:#000;border-radius:10px;overflow:hidden}.preview video{display:block;width:100%;max-height:72vh}.preview canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.sender{position:fixed;inset:0;background:#fff;z-index:9999;display:none}.sender.active{display:block}.sender canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.sender .label{position:absolute;left:10px;bottom:10px;padding:6px 8px;background:#000d;color:#fff;font:12px ui-monospace,monospace;border-radius:6px}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div><b>AirGrid acquisition bring-up</b> <span class="build">AGRS-20260823-1410</span></div><div class="modes"><button id="send-mode">Sender</button><button id="recv-mode">Receiver</button></div></div>
  <section id="send-panel" class="card hidden">
    <button id="start-sender">Start fullscreen acquisition</button>
    <div class="status">Static acquisition only. No data renderer, animation loop, PAM4, or rolling-shutter code.</div>
  </section>
  <section id="recv-panel" class="card hidden">
    <button id="start-camera">Start camera</button> <button id="stop-camera" disabled>Stop</button>
    <div id="status" class="status">Camera stopped · AGRS-20260823-1410</div>
    <div class="preview"><video id="video" muted playsinline></video><canvas id="overlay"></canvas></div>
    <div id="details" class="status"></div>
  </section>
</div>
<div id="sender" class="sender"><canvas id="sender-canvas"></canvas><div class="label">AGRS-20260823-1410 · STATIC ACQUISITION · Esc to exit</div></div>
<script type="module" src="./airgrid-lab-1410.js"></script>
</body>
</html>
