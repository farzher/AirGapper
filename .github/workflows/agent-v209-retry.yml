name: v209 JS cleanup retry
on:
  push:
    paths:
      - .github/workflows/agent-v209-retry.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Fix cleanup ordering and apply
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/v209_cleanup.py')
          s = p.read_text()
          old = "s = s.replace('  guidedRollout.robustSinceRetry = 0;\\n', '')"
          new = "s = s.replace('  guidedRollout.robustSinceRetry = 0;\\n', '', 1)"
          if old not in s:
              raise SystemExit('staging edit target missing')
          p.write_text(s.replace(old, new, 1))
          PY
          python .github/v209_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm -f .github/v209_cleanup.py .github/workflows/agent-v209.yml .github/workflows/agent-v209-retry.yml
          git add index.html main.js receive/main.js receive/worker.js sw.js
          git commit -m "v0.5.209 remove dead receiver state"
          git push origin master
