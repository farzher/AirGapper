              p.write_text(s.replace(old, new, 1))

          def sub(path, pattern, replacement, flags=0):
              p = Path(path)
              s = p.read_text()
              out, n = re.subn(pattern, replacement, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"{path}: regex expected one match, found {n}: {pattern[:100]!r}")
              p.write_text(out)

          rep("index.html", '''            <div id="camera-optics-manual" class="optics-manual" hidden>
