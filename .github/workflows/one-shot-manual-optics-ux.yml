name: stage manual optics ux

on:
  push:
    branches: [chatgpt/manual-optics-ux-515]
    paths:
      - .github/workflows/one-shot-manual-optics-ux.yml
      - .github/scripts/manual-optics-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded source patch
        run: python3 .github/scripts/manual-optics-patch.py

      - name: Validate manual optics UX and camera safety
        run: |
          set -euo pipefail
          node --input-type=module --check < receive/runtime.js
          node --input-type=module --check < version.js
          node benchmark/camera-start-guard-smoke.mjs
          node benchmark/version-source-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text()
          css = Path("shared/style.css").read_text()
          runtime = Path("receive/runtime.js").read_text()
          start = html.index('<div id="camera-optics-manual"')
          end = html.index('<div class="receiver-dev-actions"', start)
          manual = html[start:end]

          assert "focus-" not in manual and "focus-mode" not in manual and ">Focus<" not in manual
          assert manual.count('class="axis-control"') == 2
          assert 'id="camera-exposure-manual"' in manual
          assert 'id="camera-iso-control"' in manual
          assert "Faster" in manual and "Cleaner" in manual and manual.count(">Brighter<") == 2
          assert re.search(r"\.optics-manual\s*\{[^}]*grid-template-columns:\s*repeat\(2,", css, re.S)

          for dead in (
              "manualFocusMode", "preferredFocusDistance", "focusDistanceControl",
              "focusDistanceValue", "focusAxisReset", "exposureAxisReset", "isoAxisReset"
          ):
              assert dead not in runtime, dead
          assert 'document.getElementById("focus-mode")' not in runtime
          assert 'document.getElementById("focus-distance")' not in runtime
          assert "focusController.setStrategy(" not in runtime
          assert "focusController.setManualDistance(" not in runtime
          assert '  "auto",\n  void 0,\n  "auto",' in runtime
          assert "slider.disabled = automatic;" in runtime
          assert "syncManualOpticsReadback" in runtime
          # Internal focusMode camera constraints remain intentionally allowed:
          # autofocus and the HAL exposure-write workaround still need them.
          assert "patch.focusMode" in runtime
          print("AIRGAPPER_MANUAL_OPTICS_UX_PASS")
          PY
          git diff --check

      - name: Build Android debug app
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug

      - name: Commit tested patch
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-manual-optics-ux.yml .github/scripts/manual-optics-patch.py
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add index.html shared/style.css receive/runtime.js version.js
          git commit -m "Simplify manual optics controls v0.5.515"
          git push
