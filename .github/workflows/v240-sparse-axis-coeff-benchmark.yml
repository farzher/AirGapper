name: v240 sparse axis coefficient benchmark

on:
  push:
    paths:
      - .github/v240_sparse_axis_coeff_patch.py
      - .github/workflows/v240-sparse-axis-coeff-benchmark.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply v240 candidate
        id: candidate
        run: |
          set -euo pipefail
          if [ -f .github/v240_sparse_axis_coeff_patch.py ] && ! grep -q 'SparseTileCoefficients' vendor/decimen-codec/source/wrapper/decimen_codec.cpp; then
            python3 .github/v240_sparse_axis_coeff_patch.py 2>&1 | tee /tmp/v240-patch.log
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Cache codec toolchain
        if: steps.candidate.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            vendor/decimen-codec/source/emsdk
            vendor/decimen-codec/source/third_party
            vendor/decimen-codec/source/build-simd
            vendor/decimen-codec/source/build-scalar
          key: decimen-emsdk-6.0.6-zxing-${{ hashFiles('vendor/decimen-codec/source/zxing-cpp.commit') }}

      - name: Build SIMD and scalar codecs
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v240-build-simd.log
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v240-build-scalar.log

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run existing production benchmark unchanged
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/v240-regression.log

      - name: Correctness and performance gate
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node <<'NODE' 2>&1 | tee /tmp/v240-gate.log
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('benchmark/latest-result.json','utf8')).scenarios;
          const after = JSON.parse(fs.readFileSync('benchmark/offline-summary.json','utf8')).scenarios;
          const med = (x,k) => Number(x?.trialMedians?.[k] ?? x?.normalized?.[k] ?? 0);
          const problems = [];
          const rows = {};
          for (const name of ['stable-y8','motion-y8','dense-y8','optical-dense-y8','camera-dense-y8']) {
            const b = before[name], a = after[name];
            const by = med(b,'guidedOutputYield'), ay = med(a,'guidedOutputYield');
            const tolerance = name === 'motion-y8' ? 0.02 : 0.01;
            rows[name] = {
              yieldBefore: by, yieldAfter: ay,
              guidedBefore: med(b,'guidedMsPerOutput'), guidedAfter: med(a,'guidedMsPerOutput'),
              sampleBefore: med(b,'sampleMsPerTrack'), sampleAfter: med(a,'sampleMsPerTrack')
            };
            if (ay < by - tolerance)
              problems.push(`${name} output yield regressed ${(100*by).toFixed(1)}% -> ${(100*ay).toFixed(1)}%`);
            if (a.tailFullJobs !== 0)
              problems.push(`${name} stable tail used ${a.tailFullJobs} full scans`);
            const gb = med(b,'guidedMsPerOutput'), ga = med(a,'guidedMsPerOutput');
            if (ga > gb * 1.15)
              problems.push(`${name} CPU regressed >15% (${gb.toFixed(3)} -> ${ga.toFixed(3)}ms/QR)`);
          }
          if (after['motion-y8'].finalState !== 'TRACK') problems.push(`motion ended in ${after['motion-y8'].finalState}`);
          if (after['optical-dense-y8'].finalState !== 'TRACK') problems.push(`optical ended in ${after['optical-dense-y8'].finalState}`);
          if (after['camera-dense-y8'].finalState !== 'TRACK') problems.push(`camera ended in ${after['camera-dense-y8'].finalState}`);

          const denseNames = ['optical-dense-y8','camera-dense-y8'];
          const ratios = denseNames.map(name => med(after[name],'sampleMsPerTrack') / med(before[name],'sampleMsPerTrack'));
          if (Math.min(...ratios) > 0.97)
            problems.push(`no >=3% dense sampling win (${ratios.map(x => x.toFixed(3)).join(', ')})`);
          if ((ratios[0] + ratios[1]) / 2 > 1.03)
            problems.push(`dense sampling regressed in aggregate (${ratios.map(x => x.toFixed(3)).join(', ')})`);

          console.log(JSON.stringify({scenarios: rows, denseSampleRatios: ratios}, null, 2));
          if (problems.length) throw new Error(problems.join('; '));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgapper-v240-sparse-axis-coeff-${{ github.sha }}
          path: benchmark/offline-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Promote passing v240 candidate
        if: success() && steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/v240_sparse_axis_coeff_patch.py .github/workflows/v240-sparse-axis-coeff-benchmark.yml
          git add vendor/decimen-codec/source/wrapper/decimen_codec.cpp vendor/decimen-codec/source/VERSION \
                  vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
                  vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm \
                  receive/main.js main.js index.html sw.js benchmark/latest-result.json
          git commit -m "v0.5.240 precompute sparse bilinear coefficients"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Record rejection
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "v240 sparse axis coefficient candidate rejected at $(date -u +%FT%TZ)"
            cat /tmp/v240-patch.log 2>/dev/null || true
            cat /tmp/v240-gate.log 2>/dev/null || true
            tail -n 220 /tmp/v240-build-simd.log 2>/dev/null || true
            tail -n 220 /tmp/v240-build-scalar.log 2>/dev/null || true
            tail -n 600 /tmp/v240-regression.log 2>/dev/null || true
          } > benchmark/v240-sparse-axis-coeff-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add benchmark/v240-sparse-axis-coeff-ci.log
          git rm .github/v240_sparse_axis_coeff_patch.py .github/workflows/v240-sparse-axis-coeff-benchmark.yml
          git commit -m "record v240 sparse axis coefficient rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
