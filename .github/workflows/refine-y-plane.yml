name: Refine direct Y frame lifetime

on:
  push:
    branches: [agent/refine-y-plane]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-y-plane
          fetch-depth: 0
      - name: Reuse one VideoFrame per camera callback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('receive/main.js')
          s = p.read_text()
          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          once('''const DIRECT_LUMA_FORMATS = new Set(["I420", "I420A", "I422", "I422A", "I444", "I444A", "NV12"]);\nlet directLumaJobs = 0;\nlet directLumaFallbacks = 0;\nlet directLumaFormat = "";\n''', '''const DIRECT_LUMA_FORMATS = new Set(["I420", "I420A", "I422", "I422A", "I444", "I444A", "NV12"]);\n''', 'luma counters')

          once('''function openDirectLumaFrame(source) {\n  if (source.image || captureNextScan || opticalSampleDue(source) || typeof VideoFrame !== "function") return null;\n  try {\n    const frame = new VideoFrame(video);\n    if (!DIRECT_LUMA_FORMATS.has(frame.format)) {\n      frame.close();\n      return null;\n    }\n    directLumaFormat = frame.format;\n    return frame;\n  } catch {\n    return null;\n  }\n}\n''', '''function openDirectLumaFrame(source) {\n  const frame = source.videoFrame;\n  if (source.image || captureNextScan || opticalSampleDue(source) || !frame || !DIRECT_LUMA_FORMATS.has(frame.format)) return null;\n  return frame;\n}\n''', 'luma frame helper')

          once('''    void captureFrame(frame).catch((error) => {\n      decodeExceptions++;\n      lastDecodeError = error instanceof Error ? error.message : String(error);\n    }).finally(() => {\n      if (done || gen !== captureGen) return;\n      drawOverlay(receiverNow());\n      scheduleFrame(gen);\n    });\n''', '''    if (!usesSimpleDecodeWorker && typeof VideoFrame === "function") {\n      try {\n        frame.videoFrame = new VideoFrame(video);\n      } catch {\n      }\n    }\n    void captureFrame(frame).catch((error) => {\n      decodeExceptions++;\n      lastDecodeError = error instanceof Error ? error.message : String(error);\n    }).finally(() => {\n      frame.videoFrame?.close();\n      if (done || gen !== captureGen) return;\n      drawOverlay(receiverNow());\n      scheduleFrame(gen);\n    });\n''', 'camera callback frame lifetime')

          once('''        if (laneFrame) {\n          try {\n            laneLuma = await copyDirectLumaCrop(laneFrame, x, y, w, h);\n          } finally {\n            laneFrame.close();\n          }\n        }\n        if (!laneLuma) {\n          if (laneFrame) directLumaFallbacks++;\n''', '''        if (laneFrame) laneLuma = await copyDirectLumaCrop(laneFrame, x, y, w, h);\n        if (!laneLuma) {\n''', 'lane frame reuse')
          s = s.replace('        if (laneLuma) directLumaJobs++;\n', '')

          once('''        if (sharedFrame) {\n          try {\n            sharedLuma = await copyDirectLumaCrop(sharedFrame, x, y, w, h);\n          } finally {\n            sharedFrame.close();\n          }\n          if (!sharedLuma) directLumaFallbacks++;\n        }\n''', '''        if (sharedFrame) sharedLuma = await copyDirectLumaCrop(sharedFrame, x, y, w, h);\n''', 'shared frame reuse')
          s = s.replace('          if (sharedLuma) directLumaJobs++;\n', '')

          once('''  limit.textContent = lastDecodeError ? `Scanner error: ${lastDecodeError}` : stalled ? "Scanner stalled" : directLumaJobs ? `Y ${directLumaFormat}` : "";\n''', '''  limit.textContent = lastDecodeError ? `Scanner error: ${lastDecodeError}` : stalled ? "Scanner stalled" : "";\n''', 'minimal UI')

          p.write_text(s)
          PY
          rm -rf .github
          node --check receive/main.js
          node --check receive/worker.js
          ! grep -q 'directLumaJobs\|directLumaFallbacks\|directLumaFormat' receive/main.js
          grep -q 'frame.videoFrame = new VideoFrame(video)' receive/main.js
          grep -q '_decodeTrackedBatchY' receive/worker.js
      - name: Commit refined result
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "reuse one native VideoFrame per capture"
          git push --force origin HEAD:agent/refine-y-plane-result
