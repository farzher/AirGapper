name: bump v0.5.359

on:
  push:
    branches: [fix/native-v2-preview]
    paths:
      - .github/bump-v0359.py
      - .github/workflows/bump-v0359.yml
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: fix/native-v2-preview
      - name: Apply source version bump
        run: |
          set -euo pipefail
          if grep -q 'APP_BUILD = "v0.5.359"' main.js; then
            echo "v0.5.359 source bump already present"
            exit 0
          fi
          python3 .github/bump-v0359.py
          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html main.js receive/main.js sw.js android/app/build.gradle
          git diff --cached --check
          git commit -m "bump v0.5.359"
          git push origin HEAD:fix/native-v2-preview
