name: Agent local QR recovery v2
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/agent-local-qr-recovery-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply patch
        run: python3 .github/patch-local-recovery.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/patch-local-recovery.py .github/workflows/agent-local-qr-recovery.yml .github/workflows/agent-local-qr-recovery-v2.yml
          git add receive/worker.js index.html sw.js
          git commit -m "recover locally from tracked QR misses"
          git push origin HEAD:master
