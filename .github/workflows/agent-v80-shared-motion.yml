name: Agent v80 shared motion
on:
  push:
    branches: [agent/v80-shared-motion]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v80-shared-motion
      - name: Apply patch
        shell: bash
        run: echo '' | base64 -d | python3
      - name: Build SIMD codec
        shell: bash
        run: |
          cd vendor/decimen-codec/source
          ./build.sh
      - name: Build scalar codec
        shell: bash
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android ./build.sh
      - name: Commit build
        shell: bash
        run: |
          rm .github/workflows/agent-v80-shared-motion.yml
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js sw.js vendor/decimen-codec vendor/decimen-codec-android .github/workflows/agent-v80-shared-motion.yml
          git commit -m 'share cached-map motion across each lane'
          git push origin HEAD:agent/v80-shared-motion