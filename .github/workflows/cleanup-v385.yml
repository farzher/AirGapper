name: performance cleanup v385

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cleanup-v385.yml

concurrency:
  group: cleanup-v385
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply cleanup
        run: |
          set -euo pipefail
          python3 .github/scripts/cleanup-v385.py
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-v385.yml .github/scripts/cleanup-v385.py
          git add main.js receive/main.js send/main.js send/render-worker.js vendor/qrcode.js shared/protocol.js shared/transport.js shared/worker-pool.js index.html version.js
          git commit -m "v0.5.385: simplify runtime and reduce hot-path work"
          git push origin HEAD:master
