name: Agent v161 9x5 QR layout
on:
  push:
    paths:
      - '.github/v161_patch.py'
      - '.github/workflows/agent-v161-9x5-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v161_patch.py
      - name: Smoke check
        run: |
          node --check send/main.js
          node --check receive/main.js
          node --check shared/grid-layout.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js send/main.js receive/main.js shared/grid-layout.js sw.js
          git commit -m 'v0.5.161 add 9x5 high-density QR layout'
          git push origin master
