name: v257 sender page workers correctness

on:
  push:
    paths:
      - .github/v257_sender_page_workers_patch.py
      - .github/workflows/v257-sender-page-workers.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply v257 candidate
        run: |
          set -euo pipefail
          python3 .github/v257_sender_page_workers_patch.py
      - name: Syntax check
        run: |
          set -euo pipefail
          node --check send/main.js
          node --check send/render-worker.js
          node --check receive/main.js
          node --check main.js
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Run existing benchmark unchanged
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=1 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/v257-regression.log
      - name: Promote passing v257
        if: success()
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/v257_sender_page_workers_patch.py .github/workflows/v257-sender-page-workers.yml
          git add send/main.js send/render-worker.js receive/main.js main.js index.html sw.js
          git commit -m "v0.5.257 parallel sender page rendering"
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Record rejected v257
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "v257 sender page workers rejected at $(date -u +%FT%TZ)"
            tail -n 500 /tmp/v257-regression.log 2>/dev/null || true
          } > benchmark/v257-sender-page-workers-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm -f .github/v257_sender_page_workers_patch.py .github/workflows/v257-sender-page-workers.yml || true
          git add benchmark/v257-sender-page-workers-ci.log
          git commit -m "record v257 sender page workers rejection" || true
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
