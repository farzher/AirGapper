name: Export master source
on:
  push:
    branches: [agent/locked-hotpath-verify]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Archive exact master source
        run: |
          tar --exclude=.git -czf /tmp/airgapper-master.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: airgapper-master-source
          path: /tmp/airgapper-master.tar.gz
          if-no-files-found: error
