name: lattice ownership retry once
on:
  push:
    paths:
      - .github/workflows/lattice-owner-retry-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lattice cleanup without overwriting concurrent work
        shell: bash
        run: |
          awk '/python - <<'\''PY'\''/{capture=1; next} /^          PY$/{capture=0} capture{sub(/^          /, ""); print}' .github/workflows/lattice-owner-v467-once.yml > /tmp/lattice_patch.py
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            python /tmp/lattice_patch.py
            rm -f .github/workflows/lattice-owner-v467-once.yml .github/workflows/lattice-owner-retry-once.yml
            git config user.name "AirGapper Build"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add receive/grid-lattice.js receive/main.js receive/lattice-cache-guard.js version.js .github/workflows/lattice-owner-v467-once.yml .github/workflows/lattice-owner-retry-once.yml
            git commit -m "Consolidate lattice liveness ownership v0.5.467"
            if git push origin HEAD:master; then
              exit 0
            fi
          done
          exit 1