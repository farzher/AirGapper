name: lattice ownership retry once
on:
  push:
    paths:
      - .github/workflows/lattice-owner-retry-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract lattice patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/lattice-owner-v467-once.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          code = code.replace('0.5.467', '0.5.466')
          Path('/tmp/lattice_patch.py').write_text(code)
          PY
      - name: Apply lattice ownership patch
        shell: bash
        run: python /tmp/lattice_patch.py
      - name: Commit lattice ownership patch
        shell: bash
        run: |
          rm -f .github/workflows/lattice-owner-v467-once.yml .github/workflows/lattice-owner-retry-once.yml
          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receive/grid-lattice.js receive/main.js receive/lattice-cache-guard.js version.js .github/workflows/lattice-owner-v467-once.yml .github/workflows/lattice-owner-retry-once.yml
          git commit -m "Consolidate lattice liveness ownership v0.5.466"
          git push