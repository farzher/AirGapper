name: Agent v64 final cleanup
on:
  push:
    branches: [agent/frame-coordinate-v63]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/frame-coordinate-v63
      - name: Apply final cleanup
        run: python3 .github/agent-v64-fix.py
      - name: Commit result
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/agent-v64-fix.py .github/workflows/agent-v64-fix.yml
          git add receive/main.js receive/worker.js
          git commit -m "finish hot path cleanup"
          git push origin HEAD:agent/frame-coordinate-v63
