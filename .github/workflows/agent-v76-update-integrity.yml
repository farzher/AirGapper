name: Agent v76 update integrity
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/v76_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          node --check sw.js
          grep -q 'v0.5.76' index.html
          grep -q 'RECEIVER_RUNTIME_BUILD = "v0.5.76"' receive/main.js
          grep -q 'Runtime .*RECEIVER_RUNTIME_BUILD' receive/main.js
          grep -q 'cache: "no-store"' sw.js
          grep -q 'main.js?build=v0.5.76' index.html
      - name: Commit patch
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm -f .github/v76_patch.py .github/workflows/agent-v76-update-integrity.yml
          git add index.html main.js sw.js receive/main.js
          git commit -m "make PWA updates build-consistent"
          git push origin HEAD:master
