name: Agent v157 optics rescue and cache revert
on:
  push:
    paths:
      - '.github/v157_patch.py'
      - '.github/workflows/agent-v157-optics-rescue-revert-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v157_patch.py
      - name: Smoke check
        run: |
          node --check receive/main.js
          node --check receive/worker.js
          node --check main.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add receive/main.js receive/worker.js index.html main.js sw.js \
            vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
            vendor/decimen-codec/source/CMakeLists.txt \
            vendor/decimen-codec/source/wrapper/decimen_codec.cpp \
            vendor/decimen-codec/source/wrapper/decimen_codec.h
          git commit -m 'v0.5.157 restore guided speed and rescue bad AE'
          git push origin master
