name: v209 JS cleanup
on:
  push:
    paths:
      - .github/v209_cleanup.py
      - .github/workflows/agent-v209.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply cleanup
        run: python .github/v209_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm -f .github/v209_cleanup.py .github/workflows/agent-v209.yml
          git add index.html main.js receive/main.js receive/worker.js sw.js
          git commit -m "v0.5.209 remove dead receiver state"
          git push origin master
