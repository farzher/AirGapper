name: Agent v173 portfolio stability
on:
  push:
    paths:
      - '.github/v173_patch.py'
      - '.github/workflows/agent-v173-portfolio-stability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v173_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          git diff --check
          grep -q 'PORTFOLIO_POST_OPTICS_CLEAN_MS = PORTFOLIO_EVAL_MS' receive/main.js
          grep -q 'decodePortfolio.cleanAfter = now + PORTFOLIO_POST_OPTICS_CLEAN_MS' receive/main.js
          grep -q 'decodePortfolio.mode = "clean-window"' receive/main.js
          grep -q 'region.slotState === "LOST" ? 0.9' receive/main.js
          grep -q 'v0.5.173' receive/main.js
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js sw.js
          git commit -m 'v0.5.173 fence portfolio after optics changes'
          git push origin master
