name: one-shot master cleanup

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-master-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Optimize Auto QR packing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('send/main.js')
          text = path.read_text()

          replacements = [
              (
                  'const SEND_RUNTIME_BUILD = "v0.5.357";',
                  'const SEND_RUNTIME_BUILD = window.AIRGAPPER_BUILD || "dev";'
              ),
              (
                  '''  // Size remains a real user control in Auto. It is the preferred QR payload\n  // ceiling; Auto only steps down when that size cannot preserve the requested\n  // module density in the current viewport.\n  cfgSize.disabled = false;\n  cfgSize.title = automatic\n    ? `Auto ${autoGridTargetModulePx()}px uses this Size when it fits and steps down only when needed`\n    : "";''',
                  '''  // In Auto, Size is a ceiling. Smaller QR versions may fit many more\n  // independent symbols and therefore deliver more useful bytes per display frame.\n  cfgSize.disabled = false;\n  cfgSize.title = automatic\n    ? `Auto ${autoGridTargetModulePx()}px uses up to this Size and picks the fastest wall`\n    : "";'''
              ),
              (
                  '''  // Size is a preference, not something Auto is free to ignore. Find the\n  // largest selected-or-smaller Size that can actually preserve Auto N's\n  // module density, then optimize the grid only within that Size.\n  const densityCandidates = candidates.filter((candidate) => candidate.displayModulePx + 1e-9 >= densityTarget);\n  if (!densityCandidates.length) {\n    throw new Error(\n      `Auto ${densityTarget}px cannot fit ${formatBytes(requestedMaximumFrameBytes)} or any smaller Size at ${densityTarget} on-screen px/module in this viewport.`\n    );\n  }\n  const resolvedMaximumFrameBytes = allowedFrameBytes.find((bytes) =>\n    densityCandidates.some((candidate) => candidate.maximumFrameBytes === bytes)\n  );\n  const sizePool = densityCandidates.filter((candidate) => candidate.maximumFrameBytes === resolvedMaximumFrameBytes);\n  const strict = sizePool.filter((candidate) => candidate.changesPerRefresh <= AUTO_GRID_MAX_CHANGES_PER_REFRESH);\n  const pool = strict.length ? strict : sizePool;''',
                  '''  // Size is a ceiling, not a forced packet size. Score every selected-or-smaller\n  // QR version that preserves the requested module density. A smaller QR can fit\n  // enough extra independent symbols to beat a larger QR in aggregate bandwidth.\n  const densityCandidates = candidates.filter((candidate) => candidate.displayModulePx + 1e-9 >= densityTarget);\n  if (!densityCandidates.length) {\n    throw new Error(\n      `Auto ${densityTarget}px cannot fit ${formatBytes(requestedMaximumFrameBytes)} or any smaller Size at ${densityTarget} on-screen px/module in this viewport.`\n    );\n  }\n  const strict = densityCandidates.filter((candidate) => candidate.changesPerRefresh <= AUTO_GRID_MAX_CHANGES_PER_REFRESH);\n  const pool = strict.length ? strict : densityCandidates;'''
              ),
              (
                  '    sizeFallback: resolvedMaximumFrameBytes !== requestedMaximumFrameBytes',
                  '    sizeFallback: pool[0].maximumFrameBytes !== requestedMaximumFrameBytes'
              ),
              (
                  '''  // Size is meaningful in both manual and Auto layouts. Auto may step down\n  // from this value to preserve its module-density target, but never above it.''',
                  '''  // Size is exact in manual layouts and a ceiling in Auto. Auto may choose a\n  // smaller QR version when the denser wall has higher aggregate throughput.'''
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          version = Path('version.js')
          version_text = version.read_text()
          old = 'export const APP_VERSION = "0.5.376";'
          new = 'export const APP_VERSION = "0.5.377";'
          if version_text.count(old) != 1:
              raise SystemExit('unexpected version.js; refusing to guess the next version')
          version.write_text(version_text.replace(old, new, 1))
          PY

      - name: Commit optimized master
        run: |
          set -euo pipefail
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-master-cleanup.yml
          git add send/main.js version.js
          git commit -m "optimize Auto QR packing"
          git push origin HEAD:master

      - name: Remove stale branches
        run: |
          set -u
          failed=()
          while read -r _ ref; do
            branch="${ref#refs/heads/}"
            case "$branch" in
              master|airgrid-rs) continue ;;
            esac
            echo "Deleting $branch"
            if ! git push origin --delete "$branch"; then
              failed+=("$branch")
            fi
          done < <(git ls-remote --heads origin)
          if ((${#failed[@]})); then
            printf 'Failed to delete: %s\n' "${failed[*]}" >&2
            exit 1
          fi
