name: Agent v178 AF retry timing
on:
  push:
    paths:
      - '.github/v178_patch.py'
      - '.github/workflows/agent-v178-af-timing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v178_patch.py
      - name: Check syntax
        run: |
          node --check main.js
          node --check receive/main.js
          node --check receive/focus-controller.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js receive/focus-controller.js sw.js
          git commit -m 'v0.5.178 fence acquisition AF retry timing'
          git push origin master
