name: Agent v183 shared guided fallback
on:
  push:
    paths:
      - '.github/v183_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v183_patch.py
      - name: Check JS and source diff
        run: |
          node --check receive/main.js
          node --check receive/worker.js
          node --check main.js
          git diff --check
      - name: Build SIMD codec
        run: |
          cd vendor/decimen-codec/source
          ./build.sh
      - name: Build scalar codec
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android ./build.sh
      - name: Check product diff
        run: |
          git diff --check
          git status --short
          git diff --stat
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js receive/worker.js sw.js vendor/decimen-codec/source/VERSION vendor/decimen-codec/source/wrapper/decimen_codec.cpp vendor/decimen-codec/source/wrapper/decimen_codec.h vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm
          git commit -m 'v0.5.183 share guided fallback policy across workers'
          git push
