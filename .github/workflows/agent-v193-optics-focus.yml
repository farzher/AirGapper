name: v193 focus and acquisition optics race

on:
  push:
    paths:
      - .github/v193_patch.py
      - .github/workflows/agent-v193-optics-focus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.5.193
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          python3 .github/v193_patch.py
          rm -f .github/v193_patch.py .github/workflows/agent-v193-optics-focus.yml
          git add -A
          git commit -m "v0.5.193 make AF real and race frame-safe optics"
          git push origin HEAD:master
