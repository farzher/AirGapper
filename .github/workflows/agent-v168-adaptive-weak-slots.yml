name: Agent v168 adaptive weak slots
on:
  push:
    paths:
      - '.github/v168_patch.py'
      - '.github/workflows/agent-v168-adaptive-weak-slots.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v168_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          git diff --check
          grep -q 'SLOT_WEAK_PROBE_EVERY = 8' receive/main.js
          grep -q 'adaptiveWeakSlotScheduling' receive/main.js
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js sw.js
          git commit -m 'v0.5.168 adaptively thin persistently weak QR slots'
          git push origin master
