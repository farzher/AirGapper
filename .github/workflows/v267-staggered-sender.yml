name: v267 staggered sender correctness

on:
  push:
    paths:
      - .github/v267_staggered_sender_patch.py
      - .github/workflows/v267-staggered-sender.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Apply v267 candidate
        run: |
          set -euo pipefail
          python3 .github/v267_staggered_sender_patch.py 2>&1 | tee /tmp/v267-patch.log
          grep -q 'cellInterval = pageInterval / gridCodes' send/main.js
          grep -q 'if (selectedFile && !applyLiveSenderFps())' send/main.js

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Start server
        run: |
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          echo $! > /tmp/airgapper-http.pid

      - name: Check live FPS switch and staggered phases
        run: |
          set -euo pipefail
          node <<'NODE' 2>&1 | tee /tmp/v267-sender-ui.log
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true, args: ['--no-sandbox','--disable-dev-shm-usage','--disable-gpu'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 2560 } });
            const errors=[];
            page.on('pageerror', e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8080/', { waitUntil:'networkidle' });
            await page.locator('[data-mode="send"]').click();
            await page.evaluate(() => {
              for (const [id,value] of [
                ['cfg-layout','four-seven'],
                ['cfg-orientation','portrait'],
                ['cfg-scaling','integer'],
                ['cfg-fps','30'],
                ['cfg-size','1']
              ]) {
                const el=document.getElementById(id);
                el.value=value;
                el.dispatchEvent(new Event('change',{bubbles:true}));
              }
            });
            let seed=0x6d2b79f5, payload='';
            for(let i=0;i<48000;i++) { seed=(Math.imul(seed,1664525)+1013904223)>>>0; payload+=String.fromCharCode(33+seed%90); }
            await page.fill('#snippet-text', payload);
            await page.locator('#send-snippet').click();
            await page.waitForFunction(() => {
              const c=document.getElementById('qr');
              return c && c.width>100 && c.height>100 && !document.getElementById('stage').hidden;
            });
            await page.waitForTimeout(500);

            const wallStats = () => page.locator('#qr').evaluate((canvas) => {
              const probe=document.createElement('canvas'); probe.width=196; probe.height=343;
              const ctx=probe.getContext('2d',{alpha:false}); ctx.imageSmoothingEnabled=false;
              ctx.drawImage(canvas,0,0,probe.width,probe.height);
              const d=ctx.getImageData(0,0,probe.width,probe.height).data;
              let dark=0;
              for(let i=0;i<d.length;i+=4) if(d[i]+d[i+1]+d[i+2] < 180) dark++;
              return { width:canvas.width, height:canvas.height, dark:dark/(d.length/4) };
            });
            const before=await wallStats();
            if(before.dark < 0.08) throw new Error(`sender wall is already blank: ${JSON.stringify(before)}`);
            await page.selectOption('#cfg-fps','20');
            const samples=[];
            for(let i=0;i<16;i++) { samples.push(await wallStats()); await page.waitForTimeout(8); }
            const minDark=Math.min(...samples.map(x=>x.dark));
            if(samples.some(x=>x.width!==before.width || x.height!==before.height)) throw new Error('FPS switch resized/cleared sender canvas');
            if(minDark < before.dark*0.55) throw new Error(`FPS switch flashed blank: before=${before.dark} min=${minDark}`);

            await page.selectOption('#cfg-fps','30');
            await page.waitForTimeout(100);
            const phase = await page.locator('#qr').evaluate(async (canvas) => {
              const cols=4, rows=7;
              const probe=document.createElement('canvas'); probe.width=280; probe.height=490;
              const ctx=probe.getContext('2d',{alpha:false}); ctx.imageSmoothingEnabled=false;
              const hashes=()=>{
                ctx.drawImage(canvas,0,0,probe.width,probe.height);
                const d=ctx.getImageData(0,0,probe.width,probe.height).data;
                const out=[]; const cw=probe.width/cols, ch=probe.height/rows;
                for(let gy=0;gy<rows;gy++) for(let gx=0;gx<cols;gx++) {
                  let h=2166136261>>>0;
                  const x0=Math.floor(gx*cw), x1=Math.floor((gx+1)*cw);
                  const y0=Math.floor(gy*ch), y1=Math.floor((gy+1)*ch);
                  for(let y=y0;y<y1;y+=3) for(let x=x0;x<x1;x+=3) {
                    const i=(y*probe.width+x)*4;
                    h=Math.imul(h ^ d[i], 16777619)>>>0;
                  }
                  out.push(h);
                }
                return out;
              };
              const frames=[];
              for(let i=0;i<12;i++) {
                await new Promise(requestAnimationFrame);
                frames.push(hashes());
              }
              const changed=[];
              for(let i=1;i<frames.length;i++) {
                let n=0;
                for(let j=0;j<frames[i].length;j++) if(frames[i][j]!==frames[i-1][j]) n++;
                changed.push(n);
              }
              return changed;
            });
            const partial=phase.some(n=>n>0 && n<24);
            if(!partial) throw new Error(`QR phases still look synchronized: ${JSON.stringify(phase)}`);
            if(errors.length) throw new Error(`browser errors: ${errors.join('; ')}`);
            console.log(JSON.stringify({before,minDark,phase},null,2));
            await browser.close();
          })().catch(err=>{ console.error(err); process.exit(1); });
          NODE

      - name: Run production regression
        run: |
          set -euo pipefail
          AIRGAPPER_TRIALS=2 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/v267-regression.log

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/airgapper-http.pid)" 2>/dev/null || true

      - name: Promote v267
        if: success()
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/v267_staggered_sender_patch.py .github/workflows/v267-staggered-sender.yml
          git add send/main.js main.js index.html sw.js benchmark/latest-result.json
          git commit -m "v0.5.267 stagger sender QR phases"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Record v267 rejection
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "v267 staggered sender rejected at $(date -u +%FT%TZ)"
            cat /tmp/v267-patch.log 2>/dev/null || true
            cat /tmp/v267-sender-ui.log 2>/dev/null || true
            tail -n 520 /tmp/v267-regression.log 2>/dev/null || true
          } > benchmark/v267-staggered-sender-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/v267_staggered_sender_patch.py .github/workflows/v267-staggered-sender.yml
          git add benchmark/v267-staggered-sender-ci.log
          git commit -m "record v267 staggered sender rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
