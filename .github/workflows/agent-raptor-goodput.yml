name: Agent Raptor goodput metric fix
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/agent-raptor-goodput.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Fix RaptorQ useful-symbol accounting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("shared/transport.js")
          text = p.read_text()
          pattern = re.compile(r'''  addRaptor\(block\) \{\n    const payload = this\.raptor\.add\(block\);\n    if \(payload\) \{\n      this\.raptorPayload = payload;\n      this\.solvedCount = this\.k;\n      return;\n    \}\n    if \(this\.framesNew < this\.k\) \{\n      this\.solvedCount = this\.framesNew;\n    \} else \{\n      this\.framesRedundant\+\+;\n      this\.solvedCount = this\.k - 1;\n    \}\n  \}\n''')
          replacement = '''  addRaptor(block) {
            const payload = this.raptor.add(block);
            if (payload) {
              this.raptorPayload = payload;
              this.solvedCount = this.k;
              return;
            }
            // The streaming RaptorQ API only reports completion, not whether an
            // individual fresh repair symbol was algebraically redundant. Fresh
            // ESIs can be the coding overhead that completes the transfer, so do
            // not mark every post-k symbol redundant and make live KB/s drop to 0.
            this.solvedCount = Math.min(this.framesNew, this.k - 1);
          }
          '''
          text, n = pattern.subn(replacement, text)
          if n != 1:
              raise SystemExit(f"shared/transport.js: expected one addRaptor match, got {n}")
          p.write_text(text)

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match, got {text.count(old)}")
              p.write_text(text.replace(old, new))

          replace("index.html", '<span class="brand">AirGapper <span class="app-version">v0.5.45</span></span>', '<span class="brand">AirGapper <span class="app-version">v0.5.46</span></span>')
          replace("sw.js", 'const CACHE = "airgapper-static-js-v8";', 'const CACHE = "airgapper-static-js-v9";')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-raptor-goodput.yml
          git add shared/transport.js index.html sw.js
          git commit -m "fix RaptorQ live goodput accounting"
          git push origin HEAD:master
