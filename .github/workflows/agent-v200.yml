name: v200 fast camera-bump recovery
on:
  push:
    paths:
      - .github/v200_patch.py
      - .github/workflows/agent-v200.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/v200_patch.py
      - name: Commit source changes
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/v200_patch.py .github/workflows/agent-v200.yml
          git add index.html main.js receive/main.js sw.js
          git commit -m "v0.5.200 reacquire on catastrophic tracked coverage collapse"
          git push origin master
