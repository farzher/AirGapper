name: Agent v74 fast hot path
on:
  push:
    branches: [agent/v74-fast-hot-path]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v74-fast-hot-path
      - name: Apply patch
        run: python3 .github/v74_patch.py
      - name: Build SIMD and scalar codecs
        run: |
          cd vendor/decimen-codec/source
          ./build.sh
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android ./build.sh
      - name: Smoke check
        run: |
          node --check receive/main.js
          node --check receive/worker.js
          grep -q 'v0.5.74' index.html
          grep -q 'Sampler sparse CRC' receive/main.js
          grep -q 'tryDecodeBatchSparseAll' vendor/decimen-codec/source/wrapper/decimen_codec.cpp
      - name: Commit patch
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/v74_patch.py .github/workflows/agent-v74-fast-hot-path.yml
          git add index.html sw.js receive/main.js receive/worker.js vendor/decimen-codec vendor/decimen-codec-android
          git commit -m "add CRC-gated sparse tracked hot path"
          git push origin HEAD:agent/v74-fast-hot-path
