name: Agent v146 seamless optics
on:
  push:
    paths:
      - '.github/v146_patch.py'
      - '.github/workflows/agent-v146-seamless-optics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v146_patch.py
      - name: Smoke check
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add receive/main.js receive/worker.js index.html main.js sw.js
          git commit -m 'v0.5.146 make optics handoff seamless and bound robust tail'
          git push origin master
