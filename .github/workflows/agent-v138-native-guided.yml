name: Agent v138 native guided assist
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply patch
        run: python3 .github/v138_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          node --check receive/worker.js
          node --check sw.js
          grep -q 'nativeAssistHits' receive/worker.js
          grep -q 'v0.5.138' index.html
          grep -q 'v0.5.138' main.js
          grep -q 'v0.5.138' receive/main.js
          grep -q 'airgapper-static-js-v101' sw.js
      - name: Commit patch
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm -f .github/v138_patch.py .github/workflows/agent-v138-native-guided.yml
          git add index.html main.js sw.js receive/main.js receive/worker.js
          git commit -m "v0.5.138 add guarded native assist before guided decode"
          git push origin HEAD:master
