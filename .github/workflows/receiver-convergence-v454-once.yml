name: receiver convergence v454 once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/receiver-convergence-v454-once.yml"

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Apply receiver convergence
        run: python3 .github/receiver-convergence-v454.py

      - name: Commit receiver convergence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/receiver-convergence-v454.py
          rm -f .github/workflows/receiver-convergence-once.yml
          rm -f .github/workflows/receiver-convergence-v454-once.yml
          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A receive/runtime.js receive/worker-capacity-guard.js receive/worker.js version.js .github
          git commit -m "Converge receiver acquisition and recovery v0.5.454"
          git push origin HEAD:master
