name: receiver convergence v454 once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/receiver-convergence-v454-once.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Converge receiver owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime_path = Path("receive/runtime.js")
          source = runtime_path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              source = source.replace(old, new, 1)

          def replace_after(marker, old, new, label):
              global source
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f"{label}: marker missing")
              at = source.find(old, start)
              if at < 0:
                  raise SystemExit(f"{label}: target missing")
              source = source[:at] + new + source[at + len(old):]

          def regex_once(pattern, replacement, label):
              global source
              source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")

          # Runtime source patch is atomic: either a prior run already committed
          # every owner-level change, or this run applies the complete set.
          if "automaticOpticsHoldEligible," not in source:
              replace_once(
          '''import {
            acquisitionRacePolicy,
            automaticOpticsHoldThreshold,
            legacyTemporalRiskWeight
          } from "./performance-policy.js";''',
          '''import {
            acquisitionRacePolicy,
            automaticOpticsAcquisitionSeed,
            automaticOpticsHasAnotherAcquisitionSeed,
            automaticOpticsHoldEligible,
            automaticOpticsHoldThreshold,
            legacyTemporalRiskWeight,
            lockedRecoveryPolicy
          } from "./performance-policy.js";''', "policy imports")

              replace_once('''const AUTO_QR_EV_BIAS = -0.75;\nconst AUTO_QR_LIGHT_SCALE = Math.pow(2, AUTO_QR_EV_BIAS);''',
                           '''const AUTO_QR_EV_BIAS = -0.75;''', "fixed light scale")
              replace_once('''const AUTO_OPTICS_SHUTTER_FRAME_FRACTION = 0.10;\nconst AUTO_OPTICS_MAX_SHORT_EXPOSURE = 35; // 3.5 ms; exposureTime uses 0.1 ms units\n// After the motion-safe shutter handoff, tune gain against the decoder itself.''',
                           '''// After the motion-safe shutter handoff, tune gain against the decoder itself.''', "fixed shutter seed")
              replace_once('''let autoOpticsAeRescueStep = 0;\nlet autoOpticsAeBias = 0;''',
                           '''let autoOpticsAeRescueStep = 0;\nlet autoOpticsSeedAttempt = 0;\nlet autoOpticsAeBias = 0;''', "seed state")
              replace_after("function resetAutomaticOpticsRuntime() {",
                            '''  autoOpticsAeRescueStep = 0;\n  autoOpticsAeBias = 0;''',
                            '''  autoOpticsAeRescueStep = 0;\n  autoOpticsSeedAttempt = 0;\n  autoOpticsAeBias = 0;''', "seed runtime reset")
              replace_after("async function primeAutomaticQrOpticsStartup(track) {",
                            '''    autoOpticsAeRescueStep = 0;\n    autoOpticsAeBias = 0;''',
                            '''    autoOpticsAeRescueStep = 0;\n    autoOpticsSeedAttempt = 0;\n    autoOpticsAeBias = 0;''', "seed startup reset")

              replace_once(
          '''function automaticShortShutterSeed(baseline, exposureRange, isoRange, fps) {
            const aeProduct = baseline.exposure * baseline.iso;
            // readAutomaticAeBaseline() is neutral. Apply AirGapper's deliberate darkness
            // preference exactly once here; remembered/manual winners bypass this meter.
            const targetProduct = Math.max(exposureRange.min * isoRange.min, aeProduct * AUTO_QR_LIGHT_SCALE);
            let exposure = quantizeCameraRange(
              Math.min(exposureRange.max, AUTO_OPTICS_MAX_SHORT_EXPOSURE, 1e4 / fps * AUTO_OPTICS_SHUTTER_FRAME_FRACTION),
              exposureRange
            );''',
          '''function automaticShortShutterSeed(baseline, exposureRange, isoRange, fps) {
            const aeProduct = baseline.exposure * baseline.iso;
            const seedPolicy = automaticOpticsAcquisitionSeed(autoOpticsSeedAttempt);
            // Acquisition can explore both sides of the meter, but every seed
            // keeps a short shutter so rolling-shutter safety is never traded away.
            const targetProduct = Math.max(exposureRange.min * isoRange.min, aeProduct * seedPolicy.lightScale);
            let exposure = quantizeCameraRange(
              Math.min(exposureRange.max, seedPolicy.maxExposure, 1e4 / fps * seedPolicy.frameFraction),
              exposureRange
            );''', "seed policy wiring")
              replace_once('''  return { exposure, iso, aeProduct, targetProduct };\n}''',
                           '''  return { exposure, iso, aeProduct, targetProduct, seedPolicy };\n}''', "seed metadata")
              replace_once('''  autoOpticsTuneSummary = `${reason} · ${formatExposureMs(actual.exposureTime ?? seed.exposure)} · ISO ${Math.round(actual.iso ?? seed.iso)}`;''',
                           '''  autoOpticsTuneSummary = `${reason} · ${seed.seedPolicy.label} ${seed.seedPolicy.index + 1}/${seed.seedPolicy.count} · ${formatExposureMs(actual.exposureTime ?? seed.exposure)} · ISO ${Math.round(actual.iso ?? seed.iso)}`;''', "seed diagnostics")

              regex_once(r'''async function abandonAutomaticShortSeed\(track, reason = "fast-dark seed produced no QR"\) \{.*?\n\}\n(?=async function abandonAutomaticOpticsStartupMemory)''',
          '''async function advanceAutomaticOpticsAcquisitionSeed(track, reason) {
            if (!automaticOpticsSessionAlive(track) || !autoOpticsAeBaseline ||
                !automaticOpticsHasAnotherAcquisitionSeed(autoOpticsSeedAttempt)) return false;
            autoOpticsSeedAttempt++;
            const next = automaticOpticsAcquisitionSeed(autoOpticsSeedAttempt);
            return applyAutomaticShortSeed(track, autoOpticsAeBaseline, `${reason} · trying ${next.label}`);
          }
          async function abandonAutomaticShortSeed(track, reason = "short-shutter seed produced no QR") {
            if (autoOpticsMutationRunning || !automaticOpticsSessionAlive(track) || autoOpticsRuntimeState !== "seed") return;
            autoOpticsMutationRunning = true;
            try {
              if (await advanceAutomaticOpticsAcquisitionSeed(track, reason)) return;
              const baseline = await readAutomaticAeBaseline(track);
              if (!automaticOpticsSessionAlive(track)) return;
              const now = receiverNow();
              autoOpticsAeBaseline = baseline;
              autoOpticsSeedAttempt = 0;
              autoOpticsRuntimeState = "ae";
              autoOpticsControllerState = "ACQUIRE";
              autoOpticsMemoryBootAt = 0;
              autoOpticsMemoryBoot = void 0;
              autoOpticsLockSince = 0;
              autoOpticsAcquisitionSince = now;
              autoOpticsRetryAt = Infinity;
              autoOpticsRescueRetryAt = now + 300;
              autoOpticsHoldSample = void 0;
              autoOpticsHoldCollapseSince = 0;
              autoOpticsHeldYield = 0;
              autoOpticsTuneSummary = `${reason} · QR seed ladder exhausted · hardware AE fallback`;
              focusController.adoptAutomaticCameraState("QR-specific short-shutter acquisition exhausted; hardware AE remains in control");
            } finally {
              autoOpticsMutationRunning = false;
            }
          }
          ''', "bounded seed ladder")

              # Remembered optics is a prior, not proof. One lucky packet cannot
              # promote stale lighting directly into HOLD.
              regex_once(r'''(if \(autoOpticsRuntimeState === "memory"\) \{.*?const recentDecode = .*?;\n)    if \(gridLattice\.locked && recentDecode\) \{.*?\n    \}\n(    if \(!recentDecode)''',
          r'''\1    if (gridLattice.locked && recentDecode) {
              autoOpticsTuneSummary = "remembered winner reacquired · validating live QR cohort";
              autoOpticsLockSince = now - AUTO_OPTICS_LOCK_SETTLE_MS;
              autoOpticsRetryAt = 0;
              void settleAutomaticQrOptics(track, now);
              return;
            }
\2''', "memory validation")
              replace_once('''async function settleAutomaticQrOptics(track, now) {\n  if (autoOpticsMutationRunning || !automaticOptics || now < autoOpticsRetryAt) return;''',
                           '''async function settleAutomaticQrOptics(track, now) {\n  if (autoOpticsMutationRunning || !automaticOptics || now < autoOpticsRetryAt) return;\n  const startedFromMemory = autoOpticsRuntimeState === "memory";''', "settle source")

              regex_once(r'''    const cohortSize = beginAutomaticOpticsMeasurementCohort\(\);\n    if \(!cohortSize\) \{.*?\n      return;\n    \}\n\n    const baseline = await sampleAutomaticOpticsQuality''',
          '''    const cohortSize = beginAutomaticOpticsMeasurementCohort();
            if (!cohortSize) {
              autoOpticsMeasurementSlots = void 0;
              const fallback = await readAutomaticAeBaseline(track);
              if (!automaticOpticsSessionAlive(track)) return;
              autoOpticsAeBaseline = fallback;
              autoOpticsRuntimeState = "ae";
              autoOpticsControllerState = "ACQUIRE";
              autoOpticsLockSince = 0;
              autoOpticsAcquisitionSince = receiverNow();
              autoOpticsRetryAt = Infinity;
              autoOpticsHeldYield = 0;
              autoOpticsHoldSample = void 0;
              autoOpticsTuneSummary = "QR geometry not measurable · hardware AE fallback; no HOLD";
              focusController.adoptAutomaticCameraState("no measurable QR cohort; unproven manual exposure was not held");
              return;
            }

            const baseline = await sampleAutomaticOpticsQuality''', "no cohort HOLD")
              regex_once(r'''    if \(!baseline \|\| baseline\.unstable \|\| !baseline\.valid\) \{.*?\n      return;\n    \}''',
          '''    if (!baseline || baseline.unstable || !baseline.valid) {
              autoOpticsMeasurementSlots = void 0;
              const fallback = await readAutomaticAeBaseline(track);
              if (!automaticOpticsSessionAlive(track)) return;
              autoOpticsAeBaseline = fallback;
              autoOpticsRuntimeState = "ae";
              autoOpticsControllerState = "ACQUIRE";
              autoOpticsLockSince = 0;
              autoOpticsAcquisitionSince = receiverNow();
              autoOpticsRetryAt = Infinity;
              autoOpticsHeldYield = 0;
              autoOpticsHoldSample = void 0;
              autoOpticsTuneSummary = "QR optics measurement inconclusive · hardware AE fallback; no HOLD";
              focusController.adoptAutomaticCameraState("QR optics evidence was incomplete; unproven manual exposure was not held");
              return;
            }''', "invalid baseline HOLD")
              replace_once('''    const winnerExposure = quantizeCameraRange(best.exposure || frozenExposure, exposureRange);\n    const winnerIso = quantizeCameraRange(best.iso || frozenIso, isoRange);\n    await applyCameraConstraint(track, {''',
          '''    if (!automaticOpticsHoldEligible(best)) {
              const measuredYield = Math.max(0, Number(best.yieldRate) || 0);
              const measuredBreadth = Math.max(0, Number(best.breadth) || 0);
              const reason = `QR bracket unproven ${(measuredYield * 100).toFixed(0)}% · breadth ${(measuredBreadth * 100).toFixed(0)}%`;
              if (startedFromMemory) forgetAutomaticOptics(track);
              autoOpticsMeasurementSlots = void 0;
              if (await advanceAutomaticOpticsAcquisitionSeed(track, reason)) return;
              const fallback = await readAutomaticAeBaseline(track);
              if (!automaticOpticsSessionAlive(track)) return;
              autoOpticsAeBaseline = fallback;
              autoOpticsRuntimeState = "ae";
              autoOpticsControllerState = "ACQUIRE";
              autoOpticsLockSince = 0;
              autoOpticsAcquisitionSince = receiverNow();
              autoOpticsRetryAt = Infinity;
              autoOpticsHeldYield = 0;
              autoOpticsHoldSample = void 0;
              autoOpticsHoldCollapseSince = 0;
              autoOpticsTuneSummary = `${reason} · hardware AE fallback; no HOLD`;
              focusController.adoptAutomaticCameraState("no QR-tested optics candidate met HOLD quality; hardware AE remains in control");
              return;
            }

            const winnerExposure = quantizeCameraRange(best.exposure || frozenExposure, exposureRange);
            const winnerIso = quantizeCameraRange(best.iso || frozenIso, isoRange);
            await applyCameraConstraint(track, {''', "HOLD evidence gate")
              replace_once('''    autoOpticsHeldYield = Math.max(0.01, Number(best.yieldRate) || Number(baseline.yieldRate) || 0.5);''',
                           '''    autoOpticsHeldYield = Math.max(0.01, Number(best.yieldRate) || 0);''', "synthetic HOLD yield")

              # A no-op correction drop must not reset scheduler history or count
              # as a self-heal.
              replace_once(
          '''            if (geometryEligible && recoveryNow >= slotGeometryRetryAt[slot]) {
                        const healed = gridLattice.dropSlotCorrection(slot);
                        resetSlotSchedulingHistory(slot, recoveryNow);
                        slotGeometryProbeUntil[slot] = recoveryNow + 900;
                        slotGeometryRetryAt[slot] = recoveryNow + 3000;
                        region.consecutiveMisses = 0;
                        region.decodeConfidence = Math.max(region.decodeConfidence, 0.65);
                        resetTrackBudgetController();
                        geometrySlotCorrectionResets++;
                        if (healed) syncGrid(healed, recoveryNow);
                        const refreshed = regions.find((item) => Number(item.gridSlot) === slot);
                        if (refreshed) {
                          refreshed.consecutiveMisses = 0;
                          refreshed.decodeConfidence = Math.max(refreshed.decodeConfidence, 0.65);
                        }
                        lastRecoveryReason = `slot s${slot} geometry self-heal reprobe (${geometrySlotCorrectionResets})`;
                      }''',
          '''            if (geometryEligible && recoveryNow >= slotGeometryRetryAt[slot]) {
                        const healed = gridLattice.dropSlotCorrection(slot);
                        slotGeometryRetryAt[slot] = recoveryNow + 3000;
                        if (healed) {
                          resetSlotSchedulingHistory(slot, recoveryNow);
                          slotGeometryProbeUntil[slot] = recoveryNow + 900;
                          region.consecutiveMisses = 0;
                          region.decodeConfidence = Math.max(region.decodeConfidence, 0.65);
                          resetTrackBudgetController();
                          geometrySlotCorrectionResets++;
                          syncGrid(healed, recoveryNow);
                          const refreshed = regions.find((item) => Number(item.gridSlot) === slot);
                          if (refreshed) {
                            refreshed.consecutiveMisses = 0;
                            refreshed.decodeConfidence = Math.max(refreshed.decodeConfidence, 0.65);
                          }
                          lastRecoveryReason = `slot s${slot} geometry self-heal reprobe (${geometrySlotCorrectionResets})`;
                        }
                      }''', "no-op self heal")

              replace_once(
          '''  const allLockedCandidatesCold = lockedGeometryTrusted && recentLockedHits === 0 &&
            lockedGeometryCandidates.every((region) => region.consecutiveMisses >= GEOMETRY_COLD_MISSES);
            // Three tracked misses are evidence for a rescue probe, not evidence that the
            // wall geometry vanished. Previously this destroyed a good lattice after
            // roughly 0.9 s of optical misses and forced dense generic reacquisition.
            // Preserve the hot geometry while rescue scans run in parallel; only abandon
            // it after sustained decoder silence.
            // A proven lattice is sticky for the life of this receive session.
            // `allLockedCandidatesCold` escalates to bounded full-frame recovery below,
            // but ordinary decoder silence must never destroy stream identity/geometry.
            // A newly found CRC-valid QR will reject stale pose anchors and re-anchor the
            // existing wall in place, even when only that one QR is visible.''',
          '''  const allLockedCandidatesCold = lockedGeometryTrusted && recentLockedHits === 0 &&
            lockedGeometryCandidates.every((region) => region.consecutiveMisses >= GEOMETRY_COLD_MISSES);
            const lockedRecovery = lockedRecoveryPolicy({
              geometryProbeDue,
              allCandidatesCold: allLockedCandidatesCold,
              decodeSilenceMs: lockedDecodeSilenceMs,
              globalSilenceMs: GEOMETRY_PROBE_SILENCE_MS,
              hasCandidates: lockedGeometryCandidates.length > 0
            });
            // Cold slots are a local known-grid repair signal. Only real payload
            // silence can promote recovery to the generic whole-frame finder.''', "recovery policy")
              replace_once('''  const needsRecoveryScan = strictLockedAudit ? false : preLatticeDiscovery ? true : lockedGeometryTrusted\n    ? geometryProbeDue || allLockedCandidatesCold\n    : live === 0 || live < expectedRegions || trackingUnhealthy || gridNeedsDiscovery;''',
                           '''  const needsRecoveryScan = strictLockedAudit ? false : preLatticeDiscovery ? true : lockedGeometryTrusted\n    ? lockedRecovery.needsRecovery\n    : live === 0 || live < expectedRegions || trackingUnhealthy || gridNeedsDiscovery;''', "recovery scheduling")
              replace_once('''  const globalRecoverySeedScan = fullScanDue && !captureNextScan && !autoOpticsMeasurementSlots?.size && gridLattice.locked &&\n    (allLockedCandidatesCold || lockedDecodeSilenceMs >= GEOMETRY_PROBE_SILENCE_MS);\n  const localRecoverySeedScan = fullScanDue && !captureNextScan && !autoOpticsMeasurementSlots?.size && gridLattice.locked &&\n    geometryProbeDue && !globalRecoverySeedScan && lockedGeometryCandidates.length > 0;''',
                           '''  const globalRecoverySeedScan = fullScanDue && !captureNextScan && !autoOpticsMeasurementSlots?.size && gridLattice.locked &&\n    lockedRecovery.globalRecovery;\n  const localRecoverySeedScan = fullScanDue && !captureNextScan && !autoOpticsMeasurementSlots?.size && gridLattice.locked &&\n    lockedRecovery.localRecovery;''', "local/global recovery")
              replace_once('''  geometryRecoveryProbes = 0;\n  geometryRecoveryResets = 0;\n  geometryMotionNudges = 0;''',
                           '''  geometryRecoveryProbes = 0;\n  geometryRecoveryResets = 0;\n  geometrySlotCorrectionResets = 0;\n  geometrySightingNudges = 0;\n  geometryMotionNudges = 0;''', "diagnostic reset")
              runtime_path.write_text(source)
          else:
              print("runtime convergence already present")

          # Fold v0.5.438's proven camera-buffer liveness into the existing
          # worker-capacity owner. DecodeWorkerPool remains the sole watchdog:
          # only the active job deadline changes stage after copyTo completes.
          guard_path = Path("receive/worker-capacity-guard.js")
          guard = guard_path.read_text()
          if "function copyStageTimeout(meta)" not in guard:
              needle = '''function activeNativeCopies(pool) {
            let count = 0;
            for (const meta of pool.activeMeta ?? []) {
              if (meta?.__airgapperNativeFrameCopy && !meta.__airgapperCopyComplete) count++;
            }
            return count;
          }
          '''
              replacement = needle + '''
          function copyStageTimeout(meta) {
            const normal = Math.max(1, Number(meta?.timeoutMs) || 1);
            return Math.max(250, Math.min(600, normal * 0.20));
          }
          '''
              if guard.count(needle) != 1:
                  raise SystemExit("copy timeout helper anchor mismatch")
              guard = guard.replace(needle, replacement, 1)

              needle = '''  const configureWorker = function(slot, worker) {
              baseConfigureWorker.call(this, slot, worker);
              const baseOnMessage = worker.onmessage;'''
              replacement = '''  const configureWorker = function(slot, worker) {
              baseConfigureWorker.call(this, slot, worker);
              worker.__airgapperCameraCopyWarm = false;
              const baseOnMessage = worker.onmessage;'''
              if guard.count(needle) != 1:
                  raise SystemExit("worker warm anchor mismatch")
              guard = guard.replace(needle, replacement, 1)

              needle = '''      if (message?.__airgapperCameraCopyComplete) {
                if (activeMeta && activeMeta.id === message.id) {
                  activeMeta.__airgapperCopyComplete = true;
                  activeMeta.__airgapperPreflight = true;
                }
                return;
              }'''
              replacement = '''      if (message?.__airgapperCameraCopyComplete) {
                if (activeMeta && activeMeta.id === message.id) {
                  activeMeta.__airgapperCopyComplete = true;
                  activeMeta.__airgapperPreflight = true;
                  // Same watchdog, next stage: the native camera buffer is now
                  // released, so the remaining decoder gets its normal budget.
                  activeMeta.deadlineAt = performance.now() + Math.max(1, Number(activeMeta.timeoutMs) || 1);
                  worker.__airgapperCameraCopyWarm = true;
                }
                return;
              }'''
              if guard.count(needle) != 1:
                  raise SystemExit("copy-complete anchor mismatch")
              guard = guard.replace(needle, replacement, 1)

              needle = '''    const cameraLive = liveReceiveCamera();
              const native = nativeFrame(message?.videoFrame);'''
              replacement = '''    const cameraLive = liveReceiveCamera();
              const native = nativeFrame(message?.videoFrame);
              const worker = this.workers?.[slot];'''
              if guard.count(needle) != 1:
                  raise SystemExit("submit worker anchor mismatch")
              guard = guard.replace(needle, replacement, 1)

              needle = '''      if (native) {
                meta.__airgapperNativeFrameCopy = true;
                meta.__airgapperCopyComplete = false;
              }'''
              replacement = '''      if (native) {
                meta.__airgapperNativeFrameCopy = true;
                meta.__airgapperCopyComplete = false;
                // Never shorten a newly-created worker's first camera job; its
                // decoder may still be doing one-time initialization. Once a
                // real copy has succeeded, a later 250-600 ms copy stall is a
                // wedged camera buffer and should be reclaimed promptly.
                if (worker?.__airgapperCameraCopyWarm) {
                  meta.deadlineAt = Math.min(meta.deadlineAt, meta.startedAt + copyStageTimeout(meta));
                }
              }'''
              if guard.count(needle) != 1:
                  raise SystemExit("copy deadline anchor mismatch")
              guard = guard.replace(needle, replacement, 1)
              guard_path.write_text(guard)
          else:
              print("copy-stage deadline already present")

          # Permanent regression coverage for the staged native-buffer deadline.
          smoke_path = Path("benchmark/worker-pool-reuse-smoke.mjs")
          smoke = smoke_path.read_text()
          if "AIRGAPPER_COPY_STAGE_DEADLINE" not in smoke:
              marker = '''capPool.resize(0);\n\nconsole.log("AIRGAPPER_WORKER_POOL_REUSE_PASS"'''
              test = '''capPool.resize(0);

// Native camera buffers get a short deadline only after the worker has proven
// one copy. copyTo-complete then restores the normal decode budget using the
// same DecodeWorkerPool watchdog; no second timeout authority exists.
class FakeVideoFrame {
  constructor() { this.closed = false; }
  close() { this.closed = true; }
}
globalThis.VideoFrame = FakeVideoFrame;
const copyWorkers = [];
const copyPool = new DecodeWorkerPool(
  () => {
    const next = new FakeWorker();
    copyWorkers.push(next);
    return next;
  },
  () => void 0,
  () => void 0,
  () => void 0,
  () => void 0
);
copyPool.resize(1);
const copyWorker = copyWorkers[0];
copyWorker.onmessage({ data: { id: -1, bytes: null } });
const coldFrame = new FakeVideoFrame();
if (!copyPool.submit({ id: 60, full: false, w: 32, h: 32, tracks: [], videoFrame: coldFrame, pixelFormat: "y8" }, [coldFrame]))
  throw new Error("cold native camera job rejected");
const coldMeta = copyPool.activeMeta[0];
if (coldMeta.deadlineAt - coldMeta.startedAt < 2000)
  throw new Error("first native camera job incorrectly received short copy deadline");
copyWorker.onmessage({ data: { __airgapperCameraCopyComplete: true, id: 60 } });
if (!copyWorker.__airgapperCameraCopyWarm)
  throw new Error("native camera worker did not become copy-warm");
copyWorker.onmessage({ data: { id: 60, full: false, symbols: [], sightings: [], latencyMs: 1 } });

const warmFrame = new FakeVideoFrame();
if (!copyPool.submit({ id: 61, full: false, w: 32, h: 32, tracks: [], videoFrame: warmFrame, pixelFormat: "y8" }, [warmFrame]))
  throw new Error("warm native camera job rejected");
const warmMeta = copyPool.activeMeta[0];
const copyBudget = warmMeta.deadlineAt - warmMeta.startedAt;
if (copyBudget < 240 || copyBudget > 650)
  throw new Error(`native copy-stage deadline outside bounded range: ${copyBudget}`);
const shortDeadline = warmMeta.deadlineAt;
copyWorker.onmessage({ data: { __airgapperCameraCopyComplete: true, id: 61 } });
if (warmMeta.deadlineAt <= shortDeadline + 1000)
  throw new Error("copy-complete did not restore normal decode deadline");
copyWorker.onmessage({ data: { id: 61, full: false, symbols: [], sightings: [], latencyMs: 1 } });
copyPool.resize(0);
console.log("AIRGAPPER_COPY_STAGE_DEADLINE", Math.round(copyBudget));

console.log("AIRGAPPER_WORKER_POOL_REUSE_PASS"'''
              if smoke.count(marker) != 1:
                  raise SystemExit("worker smoke insertion marker mismatch")
              smoke = smoke.replace(marker, test, 1)
              smoke_path.write_text(smoke)
          else:
              print("copy-stage smoke already present")

          version_path = Path("version.js")
          version = version_path.read_text()
          if 'APP_VERSION = "0.5.453"' in version:
