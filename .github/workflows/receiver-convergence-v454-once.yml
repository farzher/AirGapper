          assert "automaticOpticsHoldEligible(best)" in r
          assert "autoOpticsHeldYield = 0.5" not in r
          assert "autoOpticsHeldYield = Math.max(0.35" not in r
          assert "Number(best.yieldRate) || Number(baseline.yieldRate) || 0.5" not in r
          assert "lockedRecovery.globalRecovery" in r and "lockedRecovery.localRecovery" in r
          heal = r.index("const healed = gridLattice.dropSlotCorrection(slot);")
          assert heal < r.index("if (healed) {", heal) < r.index("resetSlotSchedulingHistory(slot, recoveryNow);", heal)
          assert "function copyStageTimeout(meta)" in g
