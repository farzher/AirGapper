name: v268 dense erasure sampler

on:
  push:
    paths:
      - .github/workflows/v268-erasure-hardware.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Apply proven dense erasure candidate
        run: |
          set -euo pipefail
          git fetch origin agent/ambiguity-erasures:refs/remotes/origin/agent/ambiguity-erasures
          git show origin/agent/ambiguity-erasures:.github/ambiguity_erasures_patch.py >/tmp/erasure.py
          git show origin/agent/ambiguity-erasures:.github/ambiguity_dense_fence.py >/tmp/fence.py
          python3 /tmp/erasure.py
          python3 /tmp/fence.py

      - name: Add hardware diagnostics and one-shot startup timing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          # Guided metrics ABI: split mesh/exact perspective and expose whether
          # erasure-assisted dense sampling avoids five-point repair.
          once('vendor/decimen-codec/source/wrapper/decimen_codec.h',
               '\tuint32_t perspectiveWarpTracks;\n',
               '\tuint32_t perspectiveWarpTracks;\n\tuint32_t perspectiveMeshWarpTracks;\n\tuint32_t erasureRsAttempts;\n\tuint32_t erasureRsSuccesses;\n\tuint32_t erasureRepairCodewords;\n')

          p=Path('vendor/decimen-codec/source/wrapper/decimen_codec.cpp'); s=p.read_text()
          s,n=re.subn(r'static_assert\(sizeof\(DecimenGuidedMetrics\) == 176',
                      'static_assert(sizeof(DecimenGuidedMetrics) == 192',s,count=1)
          if n!=1: raise SystemExit('guided metrics static_assert anchor missing')

          warp_re=re.compile(r'''if \(frameTransform\.translationOnly\)\s*\n\s*\+\+metrics->translationWarpTracks;\s*\n\s*else if \(frameTransform\.affineOnly\)\s*\n\s*\+\+metrics->affineWarpTracks;\s*\n\s*else\s*\n\s*\+\+metrics->perspectiveWarpTracks;''')
          s,n=warp_re.subn('''if (frameTransform.translationOnly)\n                            ++metrics->translationWarpTracks;\n                        else if (frameTransform.affineOnly)\n                            ++metrics->affineWarpTracks;\n                        else if (frameTransform.perspectiveMesh)\n                            ++metrics->perspectiveMeshWarpTracks;\n                        else\n                            ++metrics->perspectiveWarpTracks;''',s,count=1)
          if n!=1: raise SystemExit('warp metric anchor missing')

          old='''    if (erasureSampling && ambiguousCount > 0) {\n        const double erasureDecodeStarted = guidedNowMs();'''
          new='''    if (erasureSampling && ambiguousCount > 0) {\n        ++metrics.erasureRsAttempts;\n        const double erasureDecodeStarted = guidedNowMs();'''
          if old not in s: raise SystemExit('erasure attempt anchor missing')
          s=s.replace(old,new,1)
          old='''        if (erasureDecoded.isValid() && !erasureDecoded.content().bytes.empty() &&\n            hasValidCRC32(erasureDecoded.content().bytes))\n            return erasureDecoded;'''
          new='''        if (erasureDecoded.isValid() && !erasureDecoded.content().bytes.empty() &&\n            hasValidCRC32(erasureDecoded.content().bytes)) {\n            ++metrics.erasureRsSuccesses;\n            return erasureDecoded;\n        }'''
          if old not in s: raise SystemExit('erasure success anchor missing')
          s=s.replace(old,new,1)
          old='''        const double repairSampleStarted = guidedNowMs();\n        for (int codeword = 0; codeword < totalCodewords; ++codeword) {'''
          new='''        metrics.erasureRepairCodewords += uint32_t(ambiguousCount);\n        const double repairSampleStarted = guidedNowMs();\n        for (int codeword = 0; codeword < totalCodewords; ++codeword) {'''
          if old not in s: raise SystemExit('erasure repair anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Worker ABI.
          once('receive/worker.js','const GUIDED_METRICS_BYTES = 176;','const GUIDED_METRICS_BYTES = 192;')
          once('receive/worker.js',
               '    perspectiveWarpTracks: metricsView.getUint32(172, true)\n',
               '    perspectiveWarpTracks: metricsView.getUint32(172, true),\n    perspectiveMeshWarpTracks: metricsView.getUint32(176, true),\n    erasureRsAttempts: metricsView.getUint32(180, true),\n    erasureRsSuccesses: metricsView.getUint32(184, true),\n    erasureRepairCodewords: metricsView.getUint32(188, true)\n')

          p=Path('receive/main.js'); s=p.read_text()
          s=s.replace('const RECEIVER_RUNTIME_BUILD = "v0.5.263";','const RECEIVER_RUNTIME_BUILD = "v0.5.268";',1)
          # Persistent aggregate fields.
          old='''  startedAt: 0,\n  captures: 0,'''
          new='''  startedAt: 0,\n  firstCaptureAt: 0,\n  firstJobAt: 0,\n  firstQrAt: 0,\n  captures: 0,'''
          if old not in s: raise SystemExit('livePipeline start anchor missing')
          s=s.replace(old,new,1)
          old='''  guidedPerspectiveWarpTracks: 0,\n  guidedJobs: 0,'''
          new='''  guidedPerspectiveWarpTracks: 0,\n  guidedPerspectiveMeshWarpTracks: 0,\n  guidedErasureRsAttempts: 0,\n  guidedErasureRsSuccesses: 0,\n  guidedErasureRepairCodewords: 0,\n  guidedJobs: 0,'''
          if old not in s: raise SystemExit('livePipeline metric anchor missing')
          s=s.replace(old,new,1)
          old='''    startedAt: now, captures: 0, submittedJobs: 0,'''
          new='''    startedAt: now, firstCaptureAt: 0, firstJobAt: 0, firstQrAt: 0, captures: 0, submittedJobs: 0,'''
          if old not in s: raise SystemExit('pipeline reset start missing')
          s=s.replace(old,new,1)
          old='''    guidedStableRsAttempts: 0, guidedStableRsSuccesses: 0, guidedStableEligibleTracks: 0,\n    guidedJobs: 0,'''
          new='''    guidedStableRsAttempts: 0, guidedStableRsSuccesses: 0, guidedStableEligibleTracks: 0,\n    guidedTranslationWarpTracks: 0, guidedAffineWarpTracks: 0, guidedPerspectiveWarpTracks: 0, guidedPerspectiveMeshWarpTracks: 0,\n    guidedErasureRsAttempts: 0, guidedErasureRsSuccesses: 0, guidedErasureRepairCodewords: 0,\n    guidedJobs: 0,'''
          if old not in s: raise SystemExit('pipeline reset guided anchor missing')
          s=s.replace(old,new,1)

          old='''      livePipeline.guidedPerspectiveWarpTracks += Math.max(0, Number(guided.perspectiveWarpTracks) || 0);\n      livePipeline.guidedFinderAttempts'''
          new='''      livePipeline.guidedPerspectiveWarpTracks += Math.max(0, Number(guided.perspectiveWarpTracks) || 0);\n      livePipeline.guidedPerspectiveMeshWarpTracks += Math.max(0, Number(guided.perspectiveMeshWarpTracks) || 0);\n      livePipeline.guidedErasureRsAttempts += Math.max(0, Number(guided.erasureRsAttempts) || 0);\n      livePipeline.guidedErasureRsSuccesses += Math.max(0, Number(guided.erasureRsSuccesses) || 0);\n      livePipeline.guidedErasureRepairCodewords += Math.max(0, Number(guided.erasureRepairCodewords) || 0);\n      livePipeline.guidedFinderAttempts'''
          if old not in s: raise SystemExit('pipeline aggregation anchor missing')
          s=s.replace(old,new,1)

          # True first-event timestamps. Rolling 1-second arrays are pruned and
          # therefore can never represent startup latency after the first second.
          old='''    const submittedAt = receiverNow();\n    if (!replayRunning && livePipeline.startedAt) {'''
          new='''    const submittedAt = receiverNow();\n    if (!replayRunning && livePipeline.startedAt && !livePipeline.firstJobAt) livePipeline.firstJobAt = submittedAt;\n    if (!replayRunning && livePipeline.startedAt) {'''
          if old not in s: raise SystemExit('first job anchor missing')
          s=s.replace(old,new,1)
          old='''  const decodedAt = receiverNow();\n  if (done) return;\n  qrReadTimes.push(decodedAt);'''
          new='''  const decodedAt = receiverNow();\n  if (done) return;\n  if (!replayRunning && livePipeline.startedAt && !livePipeline.firstQrAt) livePipeline.firstQrAt = decodedAt;\n  qrReadTimes.push(decodedAt);'''
          if old not in s: raise SystemExit('first QR anchor missing')
          s=s.replace(old,new,1)
          old='''      livePipeline.captures++;'''
          new='''      if (!livePipeline.firstCaptureAt) livePipeline.firstCaptureAt = now;\n      livePipeline.captures++;'''
          if old not in s: raise SystemExit('first capture anchor missing')
          s=s.replace(old,new,1)
          old='''  const firstCaptureAt = captureTimes[0] ?? 0;\n  const firstJobAt = hotJobSubmitSamples[0]?.at ?? 0;\n  const firstQrAt = qrReadTimes[0] ?? 0;'''
          new='''  const firstCaptureAt = livePipeline.firstCaptureAt;\n  const firstJobAt = livePipeline.firstJobAt;\n  const firstQrAt = livePipeline.firstQrAt;'''
          if old not in s: raise SystemExit('startup diagnostics anchor missing')
          s=s.replace(old,new,1)

          old='''warp T/A/P ${lastGuidedMetrics.translationWarpTracks ?? 0}/${lastGuidedMetrics.affineWarpTracks ?? 0}/${lastGuidedMetrics.perspectiveWarpTracks ?? 0} · profile'''
          new='''warp T/A/M/P ${lastGuidedMetrics.translationWarpTracks ?? 0}/${lastGuidedMetrics.affineWarpTracks ?? 0}/${lastGuidedMetrics.perspectiveMeshWarpTracks ?? 0}/${lastGuidedMetrics.perspectiveWarpTracks ?? 0} · erasure ${lastGuidedMetrics.erasureRsSuccesses ?? 0}/${lastGuidedMetrics.erasureRsAttempts ?? 0} repair ${lastGuidedMetrics.erasureRepairCodewords ?? 0} · profile'''
          if old not in s: raise SystemExit('live guided diagnostic anchor missing')
          s=s.replace(old,new,1)
          old='''warp T/A/P ${livePipeline.guidedTranslationWarpTracks}/${livePipeline.guidedAffineWarpTracks}/${livePipeline.guidedPerspectiveWarpTracks} · finders'''
          new='''warp T/A/M/P ${livePipeline.guidedTranslationWarpTracks}/${livePipeline.guidedAffineWarpTracks}/${livePipeline.guidedPerspectiveMeshWarpTracks}/${livePipeline.guidedPerspectiveWarpTracks} · erasure ${livePipeline.guidedErasureRsSuccesses}/${livePipeline.guidedErasureRsAttempts} repair ${livePipeline.guidedErasureRepairCodewords} · finders'''
          if old not in s: raise SystemExit('aggregate guided diagnostic anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # App/cache versions.
          once('main.js','const APP_BUILD = "v0.5.267";','const APP_BUILD = "v0.5.268";')
          idx=Path('index.html'); t=idx.read_text()
          if 'v0.5.267' not in t: raise SystemExit('index v267 missing')
          idx.write_text(t.replace('v0.5.267','v0.5.268'))
          once('sw.js','airgapper-static-js-v215','airgapper-static-js-v216')
          PY

      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/decimen-codec/source/emsdk
            vendor/decimen-codec/source/third_party
            vendor/decimen-codec/source/build-simd
            vendor/decimen-codec/source/build-scalar
          key: decimen-emsdk-6.0.6-zxing-${{ hashFiles('vendor/decimen-codec/source/zxing-cpp.commit') }}

      - name: Build SIMD and scalar codecs
        run: |
          set -euo pipefail
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v268-build-simd.log
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v268-build-scalar.log

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Run unchanged correctness regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=2 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/v268-regression.log

      - name: Promote v268
        if: success()
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/workflows/v268-erasure-hardware.yml
          git add vendor/decimen-codec/source/wrapper/decimen_codec.cpp vendor/decimen-codec/source/wrapper/decimen_codec.h vendor/decimen-codec/source/VERSION \
                  vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
                  vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm \
                  receive/worker.js receive/main.js main.js index.html sw.js benchmark/latest-result.json
          git commit -m "v0.5.268 use RS erasures for dense ambiguity"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Record rejection
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "v268 dense erasure candidate rejected at $(date -u +%FT%TZ)"
            tail -n 180 /tmp/v268-build-simd.log 2>/dev/null || true
            tail -n 180 /tmp/v268-build-scalar.log 2>/dev/null || true
            tail -n 520 /tmp/v268-regression.log 2>/dev/null || true
          } > benchmark/v268-erasure-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/workflows/v268-erasure-hardware.yml
          git add benchmark/v268-erasure-ci.log
          git commit -m "record v268 dense erasure rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
