name: Agent v171 throughput-first portfolio
on:
  push:
    paths:
      - '.github/v171_patch.py'
      - '.github/workflows/agent-v171-throughput-first-portfolio.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v171_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          git diff --check
          grep -q 'PORTFOLIO_EVAL_MS = 2200' receive/main.js
          grep -q 'PORTFOLIO_SHRINK_STEP = 1' receive/main.js
          grep -q 'PORTFOLIO_KEEP_SHRINK_RATIO = 1.01' receive/main.js
          grep -q 'coverage < PORTFOLIO_PRESSURE_COVERAGE && overloaded' receive/main.js
          grep -q 'v0.5.171' receive/main.js
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js sw.js
          git commit -m 'v0.5.171 make decode portfolio throughput-first'
          git push origin master
