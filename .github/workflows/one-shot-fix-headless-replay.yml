name: fix headless replay lazy load

on:
  push:
    branches: [chatgpt/auto-optics-dark-ci-515]
    paths: [.github/workflows/one-shot-fix-headless-replay.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch benchmark lazy-load assumptions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: anchor count {n}: {old[:180]!r}")
              p.write_text(s.replace(old, new, 1))

          rep("benchmark/offline-runner.mjs",
              '''  console.log(`AIRGAPPER_AGCAP_RAW_Y_PASS ${JSON.stringify(rawYRoundTrip)}`);\n  const corpusRunnerReady = await page.evaluate(() => typeof window.__airgapperRunLoadedCorpus === "function" && typeof window.__airgapperLoadedCorpusHeader === "function");\n  if (!corpusRunnerReady) throw new Error("Headless .agcap replay API unavailable");\n  await import("./run-agcap.mjs");\n  await import("./corpus-suite.mjs");\n  await page.evaluate(() => document.getElementById("home-button").click());''',
              '''  console.log(`AIRGAPPER_AGCAP_RAW_Y_PASS ${JSON.stringify(rawYRoundTrip)}`);\n  // Receive is intentionally lazy-loaded by main.js. Enter it before checking\n  // receiver benchmark globals; do not make the production home/send path eager\n  // merely to satisfy headless regression infrastructure.\n  await page.evaluate(() => {\n    document.getElementById("home-button").click();\n    document.querySelector('[data-mode="receive"]').click();\n  });\n  await page.waitForFunction(() => typeof window.__airgapperRunLoadedCorpus === "function" &&\n    typeof window.__airgapperLoadedCorpusHeader === "function");\n  await import("./run-agcap.mjs");\n  await import("./corpus-suite.mjs");\n  await page.evaluate(() => document.getElementById("home-button").click());''')

          rep("benchmark/run-agcap.mjs",
              '''    await page.goto(baseUrl, { waitUntil: "networkidle", timeout: 30000 });\n    await page.waitForFunction(() => typeof window.__airgapperRunLoadedCorpus === "function");\n    await page.locator("#corpus-file").setInputFiles(absolute);''',
              '''    await page.goto(baseUrl, { waitUntil: "networkidle", timeout: 30000 });\n    // The receiver bundle is intentionally absent from Home until Receive is\n    // selected. Load that real product path instead of requiring eager globals.\n    await page.locator('[data-mode="receive"]').click();\n    await page.waitForFunction(() => typeof window.__airgapperRunLoadedCorpus === "function" &&\n      typeof window.__airgapperLoadedCorpusHeader === "function");\n    await page.locator("#corpus-file").setInputFiles(absolute);''')
          PY
          node --input-type=module --check < benchmark/offline-runner.mjs
          node --input-type=module --check < benchmark/run-agcap.mjs
          git diff --check

      - name: Run actual browser regression stage
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs
          node benchmark/direct-y8-worker-smoke.mjs
          node benchmark/repeat-signature-worker-smoke.mjs
          node benchmark/rvfc-wrapper-smoke.mjs
          node benchmark/corpus-suite.mjs

      - name: Commit tested harness fix
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fix-headless-replay.yml
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add benchmark/offline-runner.mjs benchmark/run-agcap.mjs
          git commit -m "Fix lazy-loaded headless replay harness"
          git push
