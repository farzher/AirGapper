name: v195 remove cached prepass tax
on:
  push:
    paths:
      - .github/v195_patch.py
      - .github/workflows/agent-v195-hotpath.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v195_patch.py
      - name: Commit source changes and remove patch scaffold
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/v195_patch.py .github/workflows/agent-v195-hotpath.yml
          git add index.html main.js receive/main.js receive/worker.js sw.js
          git commit -m "v0.5.195 remove cached prepass tax"
          git push origin master
