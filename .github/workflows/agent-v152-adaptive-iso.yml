name: Agent v152 adaptive ISO refinement
on:
  push:
    paths:
      - '.github/v152_patch.py'
      - '.github/workflows/agent-v152-adaptive-iso.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v152_patch.py
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add receive/main.js index.html main.js sw.js
          git commit -m 'v0.5.152 refine Auto Optics uphill'
          git push origin master
