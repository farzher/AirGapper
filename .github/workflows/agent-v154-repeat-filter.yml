name: Agent v154 adjacent page repeat filter
on:
  push:
    paths:
      - '.github/v154_patch.py'
      - '.github/workflows/agent-v154-repeat-filter.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v154_patch.py
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add receive/main.js receive/worker.js shared/worker-pool.js index.html main.js sw.js
          git commit -m 'v0.5.154 skip adjacent repeated sender pages'
          git push origin master
