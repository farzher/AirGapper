name: Agent v170 adaptive decode portfolio
on:
  push:
    paths:
      - '.github/v170_patch.py'
      - '.github/workflows/agent-v170-adaptive-decode-portfolio.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v170_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          git diff --check
          grep -q 'PORTFOLIO_SHRINK_STEP = 2' receive/main.js
          grep -q 'selectDecodePortfolio' receive/main.js
          grep -q 'decodePortfolioSummary' receive/main.js
          grep -q 'v0.5.170' receive/main.js
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js sw.js
          git commit -m 'v0.5.170 adapt decode portfolio to CPU pressure'
          git push origin master
