name: v238 progressive Stable-RS benchmark

on:
  push:
    paths:
      - .github/v238_progressive_stable_patch.py
      - .github/workflows/v238-progressive-stable-benchmark.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply v238 candidate
        id: candidate
        run: |
          set -euo pipefail
          if [ -f .github/v238_progressive_stable_patch.py ] && ! grep -q 'Stable-RS is now progressive' vendor/decimen-codec/source/wrapper/decimen_codec.cpp; then
            python3 .github/v238_progressive_stable_patch.py 2>&1 | tee /tmp/v238-patch.log
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Cache codec toolchain
        if: steps.candidate.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            vendor/decimen-codec/source/emsdk
            vendor/decimen-codec/source/third_party
            vendor/decimen-codec/source/build-simd
            vendor/decimen-codec/source/build-scalar
          key: decimen-emsdk-6.0.6-zxing-${{ hashFiles('vendor/decimen-codec/source/zxing-cpp.commit') }}

      - name: Build SIMD and scalar codecs
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v238-build-simd.log
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v238-build-scalar.log

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run existing production benchmark unchanged
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/v238-regression.log

      - name: Correctness and broad regression gate
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node <<'NODE' 2>&1 | tee /tmp/v238-gate.log
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('benchmark/latest-result.json','utf8')).scenarios;
          const after = JSON.parse(fs.readFileSync('benchmark/offline-summary.json','utf8')).scenarios;
          const med = (x,k) => Number(x?.trialMedians?.[k] ?? x?.normalized?.[k] ?? 0);
          const problems = [];
          const rows = {};
          for (const name of ['stable-y8','motion-y8','dense-y8','optical-dense-y8','camera-dense-y8']) {
            const b = before[name], a = after[name];
            const by = med(b,'guidedOutputYield'), ay = med(a,'guidedOutputYield');
            const tolerance = name === 'motion-y8' ? 0.02 : 0.01;
            rows[name] = {
              yieldBefore: by,
              yieldAfter: ay,
              guidedMsPerOutputBefore: med(b,'guidedMsPerOutput'),
              guidedMsPerOutputAfter: med(a,'guidedMsPerOutput'),
              sampleMsPerTrackBefore: med(b,'sampleMsPerTrack'),
              sampleMsPerTrackAfter: med(a,'sampleMsPerTrack'),
              dataOnlyAttempts: a.guided?.dataOnlyAttempts ?? 0,
              dataOnlySuccesses: a.guided?.dataOnlySuccesses ?? 0,
              stableAttempts: a.guided?.stableRsAttempts ?? 0,
              stableSuccesses: a.guided?.stableRsSuccesses ?? 0
            };
            if (ay < by - tolerance)
              problems.push(`${name} output yield regressed ${(100*by).toFixed(1)}% -> ${(100*ay).toFixed(1)}%`);
            if (a.tailFullJobs !== 0)
              problems.push(`${name} stable tail used ${a.tailFullJobs} full scans`);
          }
          for (const name of ['stable-y8','motion-y8','dense-y8','optical-dense-y8','camera-dense-y8']) {
            const b = med(before[name],'guidedMsPerOutput');
            const a = med(after[name],'guidedMsPerOutput');
            if (a > b * 1.15)
              problems.push(`${name} CPU regressed >15% (${b.toFixed(3)} -> ${a.toFixed(3)}ms/QR)`);
          }
          if (after['motion-y8'].finalState !== 'TRACK') problems.push(`motion ended in ${after['motion-y8'].finalState}`);
          if (after['optical-dense-y8'].finalState !== 'TRACK') problems.push(`optical ended in ${after['optical-dense-y8'].finalState}`);
          if (after['camera-dense-y8'].finalState !== 'TRACK') problems.push(`camera ended in ${after['camera-dense-y8'].finalState}`);
          console.log(JSON.stringify({note:'correctness is primary; timing only rejects a gross regression', scenarios:rows}, null, 2));
          if (problems.length) throw new Error(problems.join('; '));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgapper-v238-progressive-stable-${{ github.sha }}
          path: benchmark/offline-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Promote passing v238 candidate
        if: success() && steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/v238_progressive_stable_patch.py .github/workflows/v238-progressive-stable-benchmark.yml
          git add vendor/decimen-codec/source/wrapper/decimen_codec.cpp vendor/decimen-codec/source/VERSION \
                  vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
                  vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm \
                  receive/main.js main.js index.html sw.js benchmark/latest-result.json
          git commit -m "v0.5.238 progressive Stable-RS decode"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Record rejection
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "v238 progressive Stable-RS candidate rejected at $(date -u +%FT%TZ)"
            cat /tmp/v238-patch.log 2>/dev/null || true
            cat /tmp/v238-gate.log 2>/dev/null || true
            tail -n 220 /tmp/v238-build-simd.log 2>/dev/null || true
            tail -n 220 /tmp/v238-build-scalar.log 2>/dev/null || true
            tail -n 600 /tmp/v238-regression.log 2>/dev/null || true
          } > benchmark/v238-progressive-stable-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add benchmark/v238-progressive-stable-ci.log
          git rm .github/v238_progressive_stable_patch.py .github/workflows/v238-progressive-stable-benchmark.yml
          git commit -m "record v238 progressive Stable-RS rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
