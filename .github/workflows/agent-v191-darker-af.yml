name: v191 darker optics and acquisition AF

on:
  push:
    paths:
      - .github/v191_patch.py
      - .github/workflows/agent-v191-darker-af.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.5.191
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          python3 .github/v191_patch.py
          node --check main.js
          node --check receive/main.js
          node --check receive/focus-controller.js
          git diff --check
          rm -f .github/v191_patch.py .github/workflows/agent-v191-darker-af.yml
          git add -A
          git commit -m "v0.5.191 keep auto optics at or below AE and drive acquisition AF"
          git push origin HEAD:master
