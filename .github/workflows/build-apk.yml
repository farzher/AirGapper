name: finish receiver cleanup v398

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Finish receiver cleanup
        run: |
          set -euo pipefail
          python3 .github/scripts/strip-native-runtime-v398.py
          python3 - <<'PY'
          from pathlib import Path

          # platform.js is genuinely shared again; receiver camera policy is direct.
          p = Path('shared/platform.js')
          s = p.read_text()
          start = s.find('let cameraConstraintApply;')
          end = s.find('export {', start)
          if start < 0 or end < 0:
              raise SystemExit('missing shared platform camera wrapper')
          s = s[:start] + s[end:]
          if '  applyAdvancedConstraint,\n' not in s:
              raise SystemExit('missing platform constraint export')
          s = s.replace('  applyAdvancedConstraint,\n', '', 1)
          p.write_text(s)

          # RaptorQ repair(requestId) owns the serialized FEC ESI. The lean
          # envelope may derive the receiver sequence from that packet ID, but
          # must not require it to equal our repair request ordinal.
          p = Path('shared/protocol.js')
          s = p.read_text()
          old = '      h.mode === "raptorq" && (!fitsBits(h.seq, 24) || raptorPacketEsi(block) !== h.seq) ||\n'
          new = '      h.mode === "raptorq" && raptorPacketEsi(block) < 0 ||\n'
          if old not in s:
              raise SystemExit('missing invalid RaptorQ ESI equality guard')
          p.write_text(s.replace(old, new, 1))

          # Native camera adapters are gone; they must not remain offline dependencies.
          p = Path('sw.js')
          s = p.read_text()
          for line in [
              '    "./shared/native-camera.js",\n',
              '    "./shared/native-camera-v2.js",\n',
          ]:
              if line not in s:
                  raise SystemExit(f'missing service-worker entry: {line.strip()}')
              s = s.replace(line, '', 1)
          p.write_text(s)

          # Remove any remaining native-preview CSS left from the retired backend.
          p = Path('shared/style.css')
          s = p.read_text()
          old = '.preview video, .native-camera-preview { position: relative; z-index: 0; width: 100%; height: 100%; display: block; object-fit: contain; background: transparent; }\n.native-camera-preview { image-rendering: auto; }'
          if old in s:
              s = s.replace(old, '.preview video { position: relative; z-index: 0; width: 100%; height: 100%; display: block; object-fit: contain; background: transparent; }', 1)
          p.write_text(s)

          p = Path('version.js')
          s = p.read_text()
          old = 'export const APP_VERSION = "0.5.397";'
          if old not in s:
              raise SystemExit('unexpected app version')
          p.write_text(s.replace(old, 'export const APP_VERSION = "0.5.398";', 1))
          PY

          git rm shared/native-camera.js shared/native-camera-v2.js
          git rm -f .github/workflows/cleanup-native-v398.yml .github/scripts/strip-native-runtime-v398.py .github/cleanup-native-v398.trigger .github/CLEANUP_V392_TRIGGER

          # Restore the known-good permanent APK workflow after this one-shot executor.
          git show 49f780f9e29a9cb3adeb3040574da2d7b26ac2df:.github/workflows/build-apk.yml > .github/workflows/build-apk.yml

          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.5.398: finish cleanup and fix RaptorQ send"
          git push origin HEAD:master
