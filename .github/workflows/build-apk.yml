name: build APK

on:
  push:
    branches: [master]
    paths:
      - android/**
      - codec/**
      - receive/**
      - send/**
      - shared/**
      - version.js
      - main.js
      - index.html
      - manifest.webmanifest
      - sw.js
      - icon-*.png
      - .github/workflows/build-apk.yml
  workflow_dispatch:

concurrency:
  group: build-apk-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply v0.5.423 generic hotpath pass
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'APP_VERSION = "0.5.423"' version.js && ! grep -Fq 'AUTO_WORKER_LATENCY_WINDOW = 40' receive/runtime.js; then
            python3 - <<'PY'
          from pathlib import Path

          runtime = Path("receive/runtime.js")
          text = runtime.read_text()

          old = "let benchmarkRecorder;\nlet sourceFrameSequence = 0;\nlet benchmarkTraces = [];"
          new = "let benchmarkRecorder;\nlet sourceFrameSequence = 0;\nlet sourceFrameCameraTimestampUs = NaN;\nlet sourceFrameRate = 0;\nlet benchmarkTraces = [];"
          if text.count(old) != 1:
              raise SystemExit(f"runtime source sequence declaration: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = "  framePumpStartedAt = 0;\n  framePumpFirstFrameAt = 0;\n  rvfcLastPresentedFrames = 0;"
          new = "  framePumpStartedAt = 0;\n  framePumpFirstFrameAt = 0;\n  sourceFrameCameraTimestampUs = NaN;\n  sourceFrameRate = 0;\n  rvfcLastPresentedFrames = 0;"
          if text.count(old) != 1:
              raise SystemExit(f"runtime stop pump marker: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = "function startFramePump(gen, track) {\n  stopFramePump();\n  framePumpStartedAt = receiverNow();"
          new = "function startFramePump(gen, track) {\n  stopFramePump();\n  framePumpStartedAt = receiverNow();\n  sourceFrameRate = Math.max(0, Number(track?.getSettings?.().frameRate) || 0);"
          if text.count(old) != 1:
              raise SystemExit(f"runtime start pump marker: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = "  const sequence = sourceFrameSequence++;\n  latestSourceFrameSequence = sequence;"
          new = '''  // This sequence is also the rolling-shutter model's camera clock. Advance
  // it by elapsed sensor time when intermediate frames were discarded so model
  // velocity stays in real camera-frame units on any capture rate.
  let sequenceStep = 1;
  if (videoFrame && Number.isFinite(timestamp) && sourceFrameRate > 0) {
    if (Number.isFinite(sourceFrameCameraTimestampUs) && timestamp > sourceFrameCameraTimestampUs) {
      const elapsedFrames = (timestamp - sourceFrameCameraTimestampUs) * sourceFrameRate / 1e6;
      if (Number.isFinite(elapsedFrames) && elapsedFrames > 1.5)
        sequenceStep = Math.max(1, Math.min(8, Math.round(elapsedFrames)));
    }
    sourceFrameCameraTimestampUs = timestamp;
  } else if (!videoFrame) {
    sourceFrameCameraTimestampUs = NaN;
  }
  const sequence = sourceFrameSequence;
  sourceFrameSequence += sequenceStep;
  latestSourceFrameSequence = sequence;'''
          if text.count(old) != 1:
              raise SystemExit(f"runtime frame sequence marker: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''  void captureFrame(frame).catch((error) => {
    decodeExceptions++;
    lastDecodeError = `captureFrame: ${error instanceof Error ? error.message : String(error)}`;
    console.error("AirGapper captureFrame failed", error);
  }).finally(() => {
    releaseSourceFrame(frame);
    if (done || gen !== captureGen) return;
    queueOverlayDraw();
  });'''
          new = '''  // Yield back to pumpTrackFrames first so it can register the next read before
  // captureFrame's synchronous geometry/temporal scheduling prefix. This keeps
  // native camera buffering independent of main-thread scheduling latency.
  queueMicrotask(() => {
    if (done || gen !== captureGen) {
      releaseSourceFrame(frame);
      return;
    }
    void captureFrame(frame).catch((error) => {
      decodeExceptions++;
      lastDecodeError = `captureFrame: ${error instanceof Error ? error.message : String(error)}`;
      console.error("AirGapper captureFrame failed", error);
    }).finally(() => {
      releaseSourceFrame(frame);
      if (done || gen !== captureGen) return;
      queueOverlayDraw();
    });
  });'''
          if text.count(old) != 1:
              raise SystemExit(f"runtime process frame marker: {text.count(old)}")
          text = text.replace(old, new, 1)

          start = text.find("const autoWorkerMax =")
          end = text.find('const TRACKS_PER_FRAME_KEY =', start)
          if start < 0 or end < 0:
              raise SystemExit("runtime auto worker block markers missing")
          auto = '''const autoWorkerMax = Math.max(1, hardwareThreadCount);
let autoWorkerTarget = Math.min(autoWorkerMax, hardwareThreadCount <= 2 ? 1 : 2);
let autoWorkerPressureSince = 0;
let autoWorkerHeadroomSince = 0;
let autoWorkerLastUpdate = -Infinity;
const AUTO_WORKER_LATENCY_WINDOW = 40;
const autoWorkerLatencies = new Float64Array(AUTO_WORKER_LATENCY_WINDOW);
const autoWorkerLatencySort = new Float64Array(AUTO_WORKER_LATENCY_WINDOW);
let autoWorkerLatencyCount = 0;
let autoWorkerLatencyCursor = 0;
let autoWorkerSourceTotal = NaN;
let autoWorkerSourceAt = 0;
let autoWorkerSourceRate = 0;
const autoWorkerOption = decodeWorkers.querySelector('option[value="auto"]');
function syncAutoWorkerLabel() {
  autoWorkerOption.textContent = `Auto (${autoWorkerTarget})`;
}
syncAutoWorkerLabel();
for (let count = 1; count <= hardwareThreadCount; count++) {
  decodeWorkers.add(new Option(String(count), String(count)));
}
function selectedWorkerCount() {
  return decodeWorkers.value === "auto" ? autoWorkerTarget : Math.max(1, Math.min(hardwareThreadCount, Number(decodeWorkers.value) || autoWorkerTarget));
}
function noteAutoWorkerLatency(completion) {
  if (completion?.full) return;
  const latency = Number(completion?.latencyMs);
  if (!Number.isFinite(latency) || latency <= 0 || latency >= 10e3) return;
  autoWorkerLatencies[autoWorkerLatencyCursor] = latency;
  autoWorkerLatencyCursor = (autoWorkerLatencyCursor + 1) % AUTO_WORKER_LATENCY_WINDOW;
  autoWorkerLatencyCount = Math.min(AUTO_WORKER_LATENCY_WINDOW, autoWorkerLatencyCount + 1);
}
function autoWorkerLatencyPercentiles() {
  const count = autoWorkerLatencyCount;
  for (let index = 0; index < count; index++) autoWorkerLatencySort[index] = autoWorkerLatencies[index];
  for (let index = 1; index < count; index++) {
    const value = autoWorkerLatencySort[index];
    let at = index;
    while (at > 0 && autoWorkerLatencySort[at - 1] > value) {
      autoWorkerLatencySort[at] = autoWorkerLatencySort[at - 1];
      at--;
    }
    autoWorkerLatencySort[at] = value;
  }
  return {
    p50: autoWorkerLatencySort[Math.floor(count * 0.5)],
    p95: autoWorkerLatencySort[Math.min(count - 1, Math.floor(count * 0.95))]
  };
}
function measuredCameraSourceRate(now, deliveredFps) {
  const total = framePumpMode === "MediaStreamTrackProcessor" ? Number(framePumpProcessorTotal) : NaN;
  if (Number.isFinite(total) && total >= 0) {
    if (Number.isFinite(autoWorkerSourceTotal) && total >= autoWorkerSourceTotal && autoWorkerSourceAt > 0) {
      const elapsed = now - autoWorkerSourceAt;
      if (elapsed >= 250) {
        const instant = (total - autoWorkerSourceTotal) * 1000 / elapsed;
        if (Number.isFinite(instant) && instant > 0)
          autoWorkerSourceRate = autoWorkerSourceRate > 0 ? autoWorkerSourceRate * 0.7 + instant * 0.3 : instant;
        autoWorkerSourceTotal = total;
        autoWorkerSourceAt = now;
      }
    } else {
      autoWorkerSourceTotal = total;
      autoWorkerSourceAt = now;
    }
  } else {
    autoWorkerSourceTotal = NaN;
    autoWorkerSourceAt = now;
    autoWorkerSourceRate = 0;
  }
  if (autoWorkerSourceRate > 0) return Math.max(1, deliveredFps, autoWorkerSourceRate);
  const negotiated = Number(stream?.getVideoTracks?.()[0]?.getSettings?.().frameRate) || 0;
  return Math.max(1, deliveredFps, negotiated);
}
function updateAutoWorkerController(completion) {
  if (decodeWorkers.value !== "auto" || replayRunning || !stream || done) return;
  noteAutoWorkerLatency(completion);
  const now = receiverNow();
  if (now - autoWorkerLastUpdate < 750 || autoWorkerLatencyCount < 5) return;
  autoWorkerLastUpdate = now;
  const { p50, p95 } = autoWorkerLatencyPercentiles();
  const deliveredFps = captureTimes.reduce((count, at) => count + Number(at > now - 1000), 0);
  const sourceFps = measuredCameraSourceRate(now, deliveredFps);
  const serviceDemand = sourceFps * p50 / 1000;
  const jitterHeadroom = Math.max(0, Math.min(1.5, p95 / Math.max(1, p50) - 1));
  const demand = Math.max(1, Math.min(autoWorkerMax, Math.ceil(serviceDemand + jitterHeadroom)));
  const framePeriodMs = 1000 / Math.max(1, sourceFps);
  const pressured = recentTrackPressure(now) || p95 > Math.max(p50 * 1.75, framePeriodMs * 4);
  if (autoOpticsControllerState === "HOLD" && !pressured) return;
  if (pressured && demand > autoWorkerTarget) {
    if (!autoWorkerPressureSince) autoWorkerPressureSince = now;
    autoWorkerHeadroomSince = 0;
    if (now - autoWorkerPressureSince >= 1200) {
      autoWorkerTarget = Math.min(autoWorkerMax, autoWorkerTarget + 1, demand);
      autoWorkerPressureSince = now;
      pool.resize(autoWorkerTarget);
      syncAutoWorkerLabel();
    }
  } else {
    autoWorkerPressureSince = 0;
    if (!autoWorkerHeadroomSince) autoWorkerHeadroomSince = now;
    if (demand < autoWorkerTarget && now - autoWorkerHeadroomSince >= 10e3 && pool.busyCount === 0) {
      autoWorkerTarget = Math.max(1, autoWorkerTarget - 1, demand);
      pool.resize(autoWorkerTarget);
      syncAutoWorkerLabel();
      autoWorkerHeadroomSince = now;
    }
  }
}
'''
          text = text[:start] + auto + text[end:]
          runtime.write_text(text)

          worker = Path("receive/worker.js")
          text = worker.read_text()
          old = 'import { gridLayoutById } from "../shared/grid-layout.js";\n'
          new = old + 'import { GuidedMotionAccumulator } from "./guided-motion.js";\n'
          if text.count(old) != 1:
              raise SystemExit(f"worker import marker: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = 'const ready = import(scalarCodec ? "../codec/scalar/airgapper_codec.js" : "../codec/airgapper_codec.js").then(({ default: AirGapperCodec }) => AirGapperCodec());'
          new = 'let codec;\nconst ready = import(scalarCodec ? "../codec/scalar/airgapper_codec.js" : "../codec/airgapper_codec.js").then(({ default: AirGapperCodec }) => AirGapperCodec()).then((instance) => (codec = instance));'
          if text.count(old) != 1:
              raise SystemExit(f"worker ready marker: {text.count(old)}")
          text = text.replace(old, new, 1)
          text = text.replace('const zx = await ready;', 'const zx = codec ?? await ready;')

          old = 'const guidedWallMotionScratch = [];\n'
          new = 'const guidedMotion = new GuidedMotionAccumulator(GUIDED_BATCH_MAX_TRACKS);\n'
          if text.count(old) != 1:
              raise SystemExit(f"worker motion scratch marker: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''  const symbols = guidedSymbolsScratch;
  const wallMotionSamples = guidedWallMotionScratch;
  symbols.length = 0;
  wallMotionSamples.length = 0;'''
          new = '''  const symbols = guidedSymbolsScratch;
  symbols.length = 0;
  guidedMotion.reset();'''
          if text.count(old) != 1:
              raise SystemExit(f"worker motion reset marker: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '        wallMotionSamples.push({ dx, dy, x, y, edge, slot, measured: geometryMeasured });'
          new = '        guidedMotion.add(dx, dy, x, y, edge);'
          if text.count(old) != 1:
              raise SystemExit(f"worker motion add marker: {text.count(old)}")
          text = text.replace(old, new, 1)

          motion_start = text.find('  // Full independently measured finder geometry remains absolute authority.')
          motion_end = text.find('  return { symbols, metrics, outputBuffer: output.buffer };', motion_start)
          if motion_start < 0 or motion_end < 0:
              raise SystemExit("worker motion estimator block markers missing")
          replacement = '''  // Current-frame CRC-valid residuals feed a fixed-scratch estimator. The
  // estimator preserves the previous similarity/translation acceptance policy
  // without allocating sample objects, filter/map arrays or RANSAC inlier lists.
  const wallMotion = guidedMotion.fit();
  if (wallMotion)
    for (const symbol of symbols) symbol.wallMotion = wallMotion;
'''
          text = text[:motion_start] + replacement + text[motion_end:]

          old = '''function quadShapeResidual(a, b) {
  if (!validQuad(a) || !validQuad(b)) return Infinity;
  const names = ["topLeft", "topRight", "bottomRight", "bottomLeft"];
  const deltas = names.map((name) => ({
    x: b[name].x - a[name].x,
    y: b[name].y - a[name].y
  }));
  const meanX = deltas.reduce((sum, p) => sum + p.x, 0) / deltas.length;
  const meanY = deltas.reduce((sum, p) => sum + p.y, 0) / deltas.length;
  return Math.max(...deltas.map((p) => Math.hypot(p.x - meanX, p.y - meanY)));
}
function quadModuleSize(q, dim) {
  if (!validQuad(q) || !dim) return 0;
  const edge = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  return Math.min(
    edge(q.topLeft, q.topRight),
    edge(q.topRight, q.bottomRight),
    edge(q.bottomRight, q.bottomLeft),
    edge(q.bottomLeft, q.topLeft)
  ) / dim;
}'''
          new = '''function quadShapeResidual(a, b) {
  if (!validQuad(a) || !validQuad(b)) return Infinity;
  const dx0 = b.topLeft.x - a.topLeft.x, dy0 = b.topLeft.y - a.topLeft.y;
  const dx1 = b.topRight.x - a.topRight.x, dy1 = b.topRight.y - a.topRight.y;
  const dx2 = b.bottomRight.x - a.bottomRight.x, dy2 = b.bottomRight.y - a.bottomRight.y;
  const dx3 = b.bottomLeft.x - a.bottomLeft.x, dy3 = b.bottomLeft.y - a.bottomLeft.y;
  const meanX = (dx0 + dx1 + dx2 + dx3) * 0.25;
  const meanY = (dy0 + dy1 + dy2 + dy3) * 0.25;
  return Math.max(
    Math.hypot(dx0 - meanX, dy0 - meanY),
    Math.hypot(dx1 - meanX, dy1 - meanY),
    Math.hypot(dx2 - meanX, dy2 - meanY),
    Math.hypot(dx3 - meanX, dy3 - meanY)
  );
}
function quadModuleSize(q, dim) {
  if (!validQuad(q) || !dim) return 0;
  return Math.min(
    Math.hypot(q.topLeft.x - q.topRight.x, q.topLeft.y - q.topRight.y),
    Math.hypot(q.topRight.x - q.bottomRight.x, q.topRight.y - q.bottomRight.y),
    Math.hypot(q.bottomRight.x - q.bottomLeft.x, q.bottomRight.y - q.bottomLeft.y),
    Math.hypot(q.bottomLeft.x - q.topLeft.x, q.bottomLeft.y - q.topLeft.y)
  ) / dim;
}'''
          if text.count(old) != 1:
              raise SystemExit(f"worker quad helpers marker: {text.count(old)}")
          worker.write_text(text)
          PY

            node --check receive/runtime.js
            node --check receive/worker.js
            node --check receive/guided-motion.js
            git show bb92129644cb8b081d699249771984de7c0009e5:.github/workflows/build-apk.yml > .github/workflows/build-apk.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add receive/runtime.js receive/worker.js .github/workflows/build-apk.yml
            git commit -m "v0.5.423: generic camera and worker hotpath"
            git push origin HEAD:master
            exit 0
          fi

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^export const APP_VERSION = "\([^"]*\)";$/\1/p' version.js | head -1)"
          test -n "$VERSION" || { echo "::error::Could not read APP_VERSION from version.js"; exit 1; }
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=v$VERSION" >> "$GITHUB_ENV"
          echo "build=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare release signing
        env:
          AIRGAPPER_ANDROID_KEYSTORE_B64: ${{ secrets.AIRGAPPER_ANDROID_KEYSTORE_B64 }}
          AIRGAPPER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AIRGAPPER_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${AIRGAPPER_ANDROID_KEYSTORE_B64:-}" || { echo "::error::Missing AIRGAPPER_ANDROID_KEYSTORE_B64 repository secret"; exit 1; }
          test -n "${AIRGAPPER_ANDROID_KEYSTORE_PASSWORD:-}" || { echo "::error::Missing AIRGAPPER_ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          printf '%s' "$AIRGAPPER_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/airgapper-release.jks"
          chmod 600 "$RUNNER_TEMP/airgapper-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/airgapper-release.jks" \
            -storepass "$AIRGAPPER_ANDROID_KEYSTORE_PASSWORD" \
            -alias airgapper >/dev/null

      - name: Build release APK
        env:
          AIRGAPPER_RELEASE_KEYSTORE: ${{ runner.temp }}/airgapper-release.jks
          AIRGAPPER_RELEASE_PASSWORD: ${{ secrets.AIRGAPPER_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon clean assembleRelease
          cd ..
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -n "$APK"
          cp "$APK" AirGapper.apk

      - name: Verify packaged app and signer
        run: |
          set -euo pipefail
          unzip -p AirGapper.apk assets/version.js | grep -Fq "APP_VERSION = \"$APP_VERSION\""
          unzip -p AirGapper.apk assets/main.js | grep -Fq 'from "./version.js"'
          unzip -l AirGapper.apk | grep -q 'assets/shared/camera-start-guard.js'
          unzip -l AirGapper.apk | grep -q 'assets/codec/airgapper_codec.js'
          unzip -l AirGapper.apk | grep -q 'assets/codec/airgapper_codec.wasm'
          unzip -l AirGapper.apk | grep -q 'assets/codec/scalar/airgapper_codec.js'
          unzip -l AirGapper.apk | grep -q 'assets/codec/scalar/airgapper_codec.wasm'

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs AirGapper.apk | tee /tmp/airgapper-apksigner.txt
          ACTUAL_CERT="$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/airgapper-apksigner.txt | head -1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="6B75F5F6021C56E1598180D1318807EF84DF757FA7E0A59D019F83C07F9CFB24"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || { echo "::error::Unexpected AirGapper signing certificate: $ACTUAL_CERT"; exit 1; }
          ls -lh AirGapper.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirGapper-${{ steps.version.outputs.build }}
          path: AirGapper.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish AirGapper.apk
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]; then
            echo "master moved while building; its push will produce the newer APK"
            exit 0
          fi
          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AirGapper.apk
          if git diff --cached --quiet; then
            echo "AirGapper.apk is already current"
            exit 0
          fi
          git commit -m "build AirGapper.apk $APP_BUILD"
          git push origin HEAD:master
