name: Agent v164 sparse geometry reuse
on:
  push:
    paths:
      - '.github/v164_patch.py'
      - '.github/v164_buildfix.py'
      - '.github/workflows/agent-v164-sparse-geometry-reuse.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: |
          python .github/v164_patch.py
          python .github/v164_buildfix.py
      - name: Rebuild SIMD codec
        run: bash vendor/decimen-codec/source/build.sh
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js receive/worker.js sw.js \
            vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
            vendor/decimen-codec/source/wrapper/decimen_codec.cpp \
            vendor/decimen-codec/source/wrapper/decimen_codec.h
          git commit -m 'v0.5.164 reuse sparse distortion geometry'
          git push origin master
