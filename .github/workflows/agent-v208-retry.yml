name: v208 cleanup retry
on:
  push:
    paths:
      - .github/workflows/agent-v208-retry.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Fix staging typo and apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/v208_cleanup.py')
          s = p.read_text()
          s = s.replace('"++metrics->turboAttempts", 1)', '"++metrics->turboAttempts;", 1)')
          s = s.replace('"++metrics->turboSuccesses", 1)', '"++metrics->turboSuccesses;", 1)')
          p.write_text(s)
          PY
          python .github/v208_cleanup.py
      - name: Build SIMD codec
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. ./build.sh
      - name: Build scalar codec
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android ./build.sh
      - name: Commit source and generated codecs
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm -f .github/v208_cleanup.py .github/workflows/agent-v208.yml .github/workflows/agent-v208-retry.yml
          git add index.html main.js receive/main.js receive/grid-lattice.js receive/worker.js sw.js \
            vendor/decimen-codec/source/VERSION \
            vendor/decimen-codec/source/wrapper/decimen_codec.cpp \
            vendor/decimen-codec/source/wrapper/decimen_codec.h \
            vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
            vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm
          git commit -m "v0.5.208 simplify guided turbo hot path"
          git push origin master
