name: receiver v457 once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/receiver-v457-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Apply receiver convergence patch
        run: python3 .github/receiver-v457.py
      - name: Commit receiver convergence
        run: |
          rm -f .github/receiver-v456.py .github/receiver-v457.py
          rm -f .github/workflows/receiver-v456-once.yml .github/workflows/receiver-v457-once.yml
          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receive/runtime.js version.js .github
          git commit -m "Converge live lattice and hardware AE hold v0.5.457"
          git push origin HEAD:master
