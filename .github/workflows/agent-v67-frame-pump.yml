name: Agent v67 frame pump fix
on:
  push:
    branches: [agent/fix-v66-sampler-remnant]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-v66-sampler-remnant
      - name: Decouple frame intake from processing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('receive/main.js')
          s = p.read_text()

          old = '''  const next = (callbackTime = performance.now(), metadata = {}) => {\n    var _a, _b, _c, _d, _e, _f;\n    if (done || gen !== captureGen) return;\n    const width = video.videoWidth;'''
          new = '''  const next = (callbackTime = performance.now(), metadata = {}) => {\n    var _a, _b, _c, _d, _e, _f;\n    if (done || gen !== captureGen) return;\n    // Keep camera delivery continuously armed. Previously the next\n    // requestVideoFrameCallback was registered only after captureFrame() and\n    // overlay work completed, so a few milliseconds of main-thread work could\n    // miss the next 60 Hz presentation entirely. Decoding is allowed to drop\n    // work when workers are busy; frame delivery itself must never wait for it.\n    scheduleFrame(gen);\n    const width = video.videoWidth;'''
          if s.count(old) != 1:
              raise SystemExit(f'frame callback header match count {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''      if (recorder.complete) void finishCorpusRecording(recorder);\n      scheduleFrame(gen);\n      return;'''
          new = '''      if (recorder.complete) void finishCorpusRecording(recorder);\n      return;'''
          if s.count(old) != 1:
              raise SystemExit(f'recorder scheduling match count {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''    }).finally(() => {\n      frame.videoFrame?.close();\n      if (done || gen !== captureGen) return;\n      drawOverlay(receiverNow());\n      scheduleFrame(gen);\n    });'''
          new = '''    }).finally(() => {\n      frame.videoFrame?.close();\n      if (done || gen !== captureGen) return;\n      drawOverlay(receiverNow());\n    });'''
          if s.count(old) != 1:
              raise SystemExit(f'finally scheduling match count {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)

          index = Path('index.html')
          t = index.read_text()
          if t.count('v0.5.66') != 1:
              raise SystemExit('expected v0.5.66 once')
          index.write_text(t.replace('v0.5.66', 'v0.5.67', 1))

          sw = Path('sw.js')
          t = sw.read_text()
          if t.count('airgapper-static-js-v29') != 1:
              raise SystemExit('expected cache v29 once')
          sw.write_text(t.replace('airgapper-static-js-v29', 'airgapper-static-js-v30', 1))
          PY
          node --check receive/main.js
          grep -q 'scheduleFrame(gen);' receive/main.js
          grep -q 'v0.5.67' index.html
          grep -q 'airgapper-static-js-v30' sw.js
      - name: Commit fix
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/workflows/agent-v67-frame-pump.yml
          git add receive/main.js index.html sw.js
          git commit -m "decouple camera frame intake from processing"
          git push origin HEAD:agent/fix-v66-sampler-remnant
