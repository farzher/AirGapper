name: compact-optics-landscape-517

on:
  push:
    branches:
      - chatgpt/auto-optics-dark-ci-515
    paths:
      - .github/workflows/one-shot-compact-optics-landscape-517.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: |
          sed -i 's/"v0\.5\.516"/"0.5.516"/g; s/"v0\.5\.517"/"0.5.517"/g' benchmark/one-shot-patch-517.py
          python3 benchmark/one-shot-patch-517.py
      - name: Test
        run: |
          set -euo pipefail
          node --input-type=module --check < receive/runtime.js
          node --input-type=module --check < receive/user-overlay.js
          node benchmark/version-source-smoke.mjs
          node benchmark/camera-start-guard-smoke.mjs
          node benchmark/camera-constraints-smoke.mjs
          node benchmark/browser-performance-policy-smoke.mjs
          node benchmark/grid-lattice-regression.mjs
          node benchmark/track-processor-proxy-smoke.mjs
          node benchmark/worker-pool-reuse-smoke.mjs
          grep -q 'status.style.display = developer ? "" : "none"' receive/user-overlay.js
          grep -q '@media (orientation: landscape) and (max-height: 600px)' shared/style.css
          if grep -Eq 'axis-auto-toggle|axis-scale|exposure-axis-auto|iso-axis-auto' index.html; then exit 1; fi
          git diff --check
      - name: Commit
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-compact-optics-landscape-517.yml benchmark/one-shot-patch-517.py
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html shared/style.css receive/runtime.js receive/user-overlay.js version.js
          git commit -m 'Compact manual optics and landscape receiver v0.5.517'
          git push
