name: Agent v147 guided primary
on:
  push:
    paths:
      - '.github/v147_patch.py'
      - '.github/workflows/agent-v147-guided-primary.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v147_patch.py
      - name: Smoke check
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add receive/main.js index.html main.js sw.js
          git commit -m 'v0.5.147 make guided decode the tracked primary'
          git push origin master
