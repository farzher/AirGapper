name: Dev-only Optimize
on:
  push:
    branches: [agent/dev-only-optimize]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev-only-optimize
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Optimize dev-only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          old = '''            <div id="optics-auto-actions" hidden><button class="secondary-button" id="optics-optimize" type="button" aria-pressed="false">Optimize</button><button class="secondary-button" id="optics-keep" type="button" hidden>Keep</button><span id="optics-optimize-status" role="status">Off</span></div>\n            <div class="receiver-dev-actions" hidden>\n              <label id="decode-workers-control">'''
          new = '''            <div class="receiver-dev-actions" hidden>\n              <div id="optics-auto-actions" hidden><button class="secondary-button" id="optics-optimize" type="button" aria-pressed="false">Optimize</button><button class="secondary-button" id="optics-keep" type="button" hidden>Keep</button><span id="optics-optimize-status" role="status">Off</span></div>\n              <label id="decode-workers-control">'''
          if s.count(old) != 1:
              raise SystemExit('Optimize/dev-actions markup did not match expected source')
          s = s.replace(old, new, 1).replace('v0.5.38', 'v0.5.39', 1)
          p.write_text(s)

          p = Path('sw.js')
          s = p.read_text()
          if s.count('const CACHE = "airgapper-static-js-v2";') != 1:
              raise SystemExit('service worker cache version mismatch')
          p.write_text(s.replace('const CACHE = "airgapper-static-js-v2";', 'const CACHE = "airgapper-static-js-v3";', 1))

          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'versionCode 96' not in s or 'versionName "0.5.38"' not in s:
              raise SystemExit('Android version mismatch')
          s = s.replace('versionCode 96', 'versionCode 97', 1).replace('versionName "0.5.38"', 'versionName "0.5.39"', 1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          dev = s.index('<div class="receiver-dev-actions" hidden>')
          opt = s.index('id="optics-optimize"')
          end = s.index('</div>\n              </div>\n            </details>', dev)
          assert dev < opt < end
          assert 'v0.5.39' in s
          assert 'airgapper-static-js-v3' in Path('sw.js').read_text()
          print('Optimize is nested under receiver-dev-actions')
          PY
      - name: Rebuild APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew --no-daemon clean assembleRelease && cd ..
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" AirGapper.apk
          unzip -p AirGapper.apk assets/index.html | grep -q 'v0.5.39'
          unzip -p AirGapper.apk assets/index.html | grep -q 'receiver-dev-actions'
          unzip -p AirGapper.apk assets/index.html | grep -q 'optics-optimize'
      - name: Publish result branch
        shell: bash
        run: |
          rm -rf .github
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "show Optimize only in dev mode"
          git push --force origin HEAD:agent/dev-only-optimize-result
