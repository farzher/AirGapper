name: Agent v140 canvas cursor
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply patch
        run: python3 .github/v140_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check send/main.js
          node --check receive/main.js
          node --check sw.js
          grep -q 'CURSOR_IDLE_MS = 1000' send/main.js
          grep -q '#qr.cursor-idle { cursor: none; }' shared/style.css
          grep -q 'v0.5.140' index.html
          grep -q 'v0.5.140' main.js
          grep -q 'v0.5.140' receive/main.js
          grep -q 'airgapper-static-js-v103' sw.js
      - name: Commit patch
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm -f .github/v140_patch.py .github/workflows/agent-v140-canvas-cursor.yml
          git add index.html main.js sw.js send/main.js receive/main.js shared/style.css
          git commit -m "v0.5.140 hide canvas cursor only when idle"
          git push origin HEAD:master
