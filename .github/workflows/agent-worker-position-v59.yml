name: Agent worker position v59
on:
  push:
    branches: [agent/worker-position-v59]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/worker-position-v59
      - name: Apply patch
        run: python3 .github/patch-worker-position-v59.py
      - name: Verify syntax
        run: |
          node --check receive/worker.js
      - name: Verify invariants
        run: |
          grep -q 'function validQuad' receive/worker.js
          grep -q 'if (box && box.w > 0 && box.h > 0)' receive/worker.js
          grep -q 'decoder returned incomplete position' receive/worker.js
          grep -q 'v0.5.59' index.html
          grep -q 'airgapper-static-js-v22' sw.js
      - name: Commit result
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/patch-worker-position-v59.py .github/workflows/agent-worker-position-v59.yml
          git add receive/worker.js index.html sw.js
          git commit -m "guard incomplete QR positions"
          git push origin HEAD:agent/worker-position-v59
