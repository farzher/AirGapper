name: Agent v155 guided-seeded sampling cache
on:
  push:
    paths:
      - '.github/v155_patch.py'
      - '.github/workflows/agent-v155-guided-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v155_patch.py
      - name: Rebuild SIMD codec
        run: bash vendor/decimen-codec/source/build.sh
      - name: Smoke check
        run: |
          node --check receive/main.js
          node --check receive/worker.js
          node --check shared/worker-pool.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add receive/main.js receive/worker.js index.html main.js sw.js \
            vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
            vendor/decimen-codec/source/CMakeLists.txt \
            vendor/decimen-codec/source/wrapper/decimen_codec.cpp \
            vendor/decimen-codec/source/wrapper/decimen_codec.h
          git commit -m 'v0.5.155 seed fast sampling cache from guided decode'
          git push origin master
