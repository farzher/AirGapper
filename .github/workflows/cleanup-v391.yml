name: cleanup v391

on:
  push:
    branches: [master]
    paths:
      - .github/scripts/cleanup-v391.py
      - .github/workflows/cleanup-v391.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply cleanup
        run: |
          set -euo pipefail
          python3 .github/scripts/cleanup-v391.py
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-v391.yml .github/scripts/cleanup-v391.py
          git add receive/main.js shared/transport.js shared/worker-pool.js version.js
          git commit -m "v0.5.391: trim receiver allocation churn"
          git push origin HEAD:master
