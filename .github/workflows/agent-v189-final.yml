name: v189 optics cleanup and cold acquisition

on:
  push:
    paths:
      - .github/v189_cold_patch.py
      - .github/workflows/agent-v189-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.5.189
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          python3 .github/v189_patch.py
          python3 .github/v189_cold_patch.py
          node --check main.js
          node --check receive/main.js
          git diff --check
          rm -f .github/v189_patch.py .github/v189_cold_patch.py
          rm -f .github/workflows/agent-v189-auto-optics-cleanup.yml .github/workflows/agent-v189-final.yml
          git add -A
          git commit -m "v0.5.189 simplify and bootstrap automatic optics"
          git push origin HEAD:master
