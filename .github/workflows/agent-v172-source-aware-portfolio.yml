name: Agent v172 source-aware portfolio
on:
  push:
    paths:
      - '.github/v172_patch.py'
      - '.github/workflows/agent-v172-source-aware-portfolio.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v172_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          git diff --check
          grep -q 'PORTFOLIO_GROW_STEP = 2' receive/main.js
          grep -q 'portfolioSourceDemandRate' receive/main.js
          grep -q 'cold AE · motion-safe; rescue deferred' receive/main.js
          grep -q 'AUTO_OPTICS_ACQUISITION_RESCUE_MS = 2500' receive/main.js
          grep -q 'PORTFOLIO_KEEP_SHRINK_RATIO = 1.04' receive/main.js
          grep -q 'v0.5.172' receive/main.js
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js sw.js
          git commit -m 'v0.5.172 fix cold acquisition and source-aware portfolio'
          git push origin master
