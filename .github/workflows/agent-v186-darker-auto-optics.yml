name: v186 darker auto optics

on:
  push:
    paths:
      - .github/workflows/agent-v186-darker-auto-optics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.5.186
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"replacement not found in {path}: {old[:140]!r}")
              p.write_text(s.replace(old, new, count))

          replace("index.html", "v0.5.185", "v0.5.186")
          replace("main.js", 'const APP_BUILD = "v0.5.185";', 'const APP_BUILD = "v0.5.186";')
          replace("receive/main.js", 'const RECEIVER_RUNTIME_BUILD = "v0.5.185";', 'const RECEIVER_RUNTIME_BUILD = "v0.5.186";')
          replace("sw.js", 'const CACHE = "airgapper-static-js-v147";', 'const CACHE = "airgapper-static-js-v148";')

          p = Path("receive/main.js")
          s = p.read_text()

          old = '''const AUTO_QR_EV_BIAS = -0.7;\nlet automaticOptics = true;'''
          new = '''const AUTO_QR_EV_BIAS = -0.7;\nconst AUTO_QR_LIGHT_SCALE = Math.pow(2, AUTO_QR_EV_BIAS);\nlet automaticOptics = true;'''
          if old not in s: raise SystemExit("EV bias anchor missing")
          s = s.replace(old, new, 1)

          old = '''const AUTO_OPTICS_GAIN_IMPROVEMENT = 1.03;\nconst AUTO_OPTICS_GAIN_MAX_PROBES = 5;'''
          new = '''const AUTO_OPTICS_GAIN_IMPROVEMENT = 1.03;\n// AirGapper is looking at an emissive black/white modem, not making a pleasing\n// photograph. Prefer less light when two candidates decode essentially alike.\nconst AUTO_OPTICS_DARK_TIE_RATIO = 0.985;\nconst AUTO_OPTICS_STARTUP_HEALTHY_YIELD = 0.45;\nconst AUTO_OPTICS_MEMORY_MIN_YIELD = 0.35;\nconst AUTO_OPTICS_GAIN_MAX_PROBES = 5;'''
          if old not in s: raise SystemExit("gain constants anchor missing")
          s = s.replace(old, new, 1)

          # Hardware AE must be a neutral scene meter. The QR-specific darkness\n          # bias is applied exactly once when we take manual control, otherwise\n          # the old -0.7 exposure compensation plus manual bias would stack.
          old = '''    if (caps.exposureCompensation && caps.exposureCompensation.min <= 0 && caps.exposureCompensation.max >= 0) {\n      const step = Math.max((_b = caps.exposureCompensation.step) != null ? _b : 0, 0.01);\n      const raw = Math.max(caps.exposureCompensation.min, Math.min(0, AUTO_QR_EV_BIAS));\n      patch.exposureCompensation = Math.max(\n        caps.exposureCompensation.min,\n        Math.min(0, Math.round((raw - caps.exposureCompensation.min) / step) * step + caps.exposureCompensation.min)\n      );\n    }'''
          new = '''    if (caps.exposureCompensation && caps.exposureCompensation.min <= 0 && caps.exposureCompensation.max >= 0) {\n      patch.exposureCompensation = quantizeCameraRange(0, caps.exposureCompensation);\n    }'''
          if old not in s: raise SystemExit("AE compensation anchor missing")
          s = s.replace(old, new, 1)

          # Forget catastrophically bad remembered automatic settings so a fresh\n          # hardware-AE session cannot be pulled back into the same local trap.
          anchor = '''function autoOpticsPipelineSnapshot() {'''
          insert = '''function forgetAutomaticOptics(track) {\n  try {\n    const all = JSON.parse(localStorage.getItem(AUTO_OPTICS_MEMORY_KEY) || "{}");\n    const key = autoOpticsMemoryKey(track);\n    if (!(key in all)) return;\n    delete all[key];\n    localStorage.setItem(AUTO_OPTICS_MEMORY_KEY, JSON.stringify(all));\n  } catch {\n  }\n}\nfunction autoOpticsPipelineSnapshot() {'''
          if anchor not in s: raise SystemExit("forget memory anchor missing")
          s = s.replace(anchor, insert, 1)

          # Rebuild startup search around a fresh AE-derived darker baseline. A\n          # brighter remembered point is evidence, not authority, and is only\n          # sampled at startup when the new baseline is actually weak.
          start = s.index('  const cap = Math.max(isoRange.min, Math.min(isoRange.max, maxAutoIso));', s.index('async function tuneAutomaticQrIso'))
          end = s.index('  const valid = probes.filter((item) => item.valid);', start)
          block = '''  const cap = Math.max(isoRange.min, Math.min(isoRange.max, maxAutoIso));\n  const aeBase = quantizeCameraRange(Math.min(cap, aeBaseIso), isoRange);\n  const remembered = Number.isFinite(rememberedIso)\n    ? quantizeCameraRange(Math.min(cap, Math.max(isoRange.min, rememberedIso)), isoRange)\n    : void 0;\n  // Always establish the fresh AE-derived QR baseline first. Memory is only an\n  // additional candidate and never replaces the current scene measurement.\n  const base = aeBase;\n  const probes = [];\n  const measured = new Set();\n  const probe = async (candidate) => {\n    const requested = quantizeCameraRange(Math.min(cap, Math.max(isoRange.min, candidate)), isoRange);\n    const key = String(requested);\n    if (measured.has(key)) return probes.find((item) => String(item.requestedIso) === key) || null;\n    if (measured.size >= AUTO_OPTICS_GAIN_MAX_PROBES) return null;\n    measured.add(key);\n    let result = null;\n    for (let window = 0; window < 2 && automaticOpticsSessionAlive(track); window++) {\n      result = await measureAutomaticIsoCandidate(track, exposure, requested, isoRange);\n      if (!result?.unstable) break;\n      autoOpticsTuneSummary = `QR ${AUTO_QR_EV_BIAS.toFixed(1)}EV · ${probes.map(describeAutoIsoProbe).join(" · ")}${probes.length ? " · " : ""}${Math.round(requested)}:hold framing`;\n    }\n    if (result) probes.push(result);\n    autoOpticsTuneSummary = `QR ${AUTO_QR_EV_BIAS.toFixed(1)}EV · ${probes.map(describeAutoIsoProbe).join(" · ")}`;\n    return result;\n  };\n  const scoreOf = (item) => item?.valid ? item.score : 0;\n  const better = (candidate, incumbent) => scoreOf(candidate) > scoreOf(incumbent) * AUTO_OPTICS_GAIN_IMPROVEMENT;\n  const chooseWinner = (items) => {\n    const validItems = items.filter((item) => item?.valid);\n    if (!validItems.length) return null;\n    return validItems.reduce((winner, item) => {\n      if (better(item, winner)) return item;\n      // Within ~1.5% confidence, lower ISO wins. On an emissive QR wall this\n      // reduces clipping/bloom and leaves more motion/noise headroom.\n      if (item.score >= winner.score * AUTO_OPTICS_DARK_TIE_RATIO && item.requestedIso < winner.requestedIso) return item;\n      return winner;\n    });\n  };\n\n  const baseline = await probe(base);\n  if (!automaticOpticsSessionAlive(track)) return { iso: base, probes };\n\n  // A remembered setting darker than today's baseline is safe to test early. A\n  // brighter memory is deferred unless today's darker baseline is struggling.\n  if (remembered !== void 0 && remembered < base * 0.96) {\n    await probe(remembered);\n    if (!automaticOpticsSessionAlive(track)) return { iso: base, probes };\n  }\n\n  let incumbent = chooseWinner(probes) || baseline;\n  const darkAnchor = Math.min(base, incumbent?.requestedIso || base);\n  const darker = await probe(darkAnchor / Math.SQRT2);\n  if (!automaticOpticsSessionAlive(track)) return { iso: base, probes };\n  const darkHeld = darker?.valid && (better(darker, incumbent) || darker.score >= scoreOf(incumbent) * AUTO_OPTICS_DARK_TIE_RATIO);\n  incumbent = chooseWinner(probes) || incumbent;\n\n  if (darkHeld) {\n    autoOpticsFineTuneDirection = -1;\n    await probe(darker.requestedIso / Math.SQRT2);\n    if (!automaticOpticsSessionAlive(track)) return { iso: base, probes };\n  } else {\n    const baselineWeak = !baseline?.valid || baseline.yieldRate < AUTO_OPTICS_STARTUP_HEALTHY_YIELD;\n    if (remembered !== void 0 && remembered > base * 1.04 && baselineWeak) {\n      await probe(remembered);\n      if (!automaticOpticsSessionAlive(track)) return { iso: base, probes };\n      incumbent = chooseWinner(probes) || incumbent;\n    }\n    // Do not brighten a healthy darker baseline just because we have probe\n    // budget. Brighter settings must be justified by weak decode evidence.\n    if (baselineWeak && measured.size < AUTO_OPTICS_GAIN_MAX_PROBES) {\n      const brightAnchor = Math.max(base, incumbent?.requestedIso || base);\n      const brighter = await probe(brightAnchor * Math.SQRT2);\n      if (!automaticOpticsSessionAlive(track)) return { iso: base, probes };\n      if (better(brighter, incumbent) && measured.size < AUTO_OPTICS_GAIN_MAX_PROBES)\n        await probe(brighter.requestedIso * Math.SQRT2);\n      autoOpticsFineTuneDirection = 1;\n    } else {\n      autoOpticsFineTuneDirection = -1;\n    }\n  }\n\n'''
          s = s[:start] + block + s[end:]

          old = '''  const best = valid.reduce((winner, item) => item.score > winner.score ? item : winner);'''
          new = '''  const best = chooseWinner(valid);'''
          if old not in s: raise SystemExit("final winner anchor missing")
          s = s.replace(old, new, 1)

          # Apply the QR darkness prior to exposure product, not as lingering AE\n          # compensation. This guarantees the manual target is ~0.7 EV darker\n          # than the neutral hardware-AE scene reading.
          old = '''  const exposureProduct = settings.exposureTime * settings.iso;\n  const maxAutoIso = Math.min(isoRange.max, Math.max(isoRange.min, settings.iso * 4));\n  let exposure = quantizeCameraRange(Math.min(settings.exposureTime, motionSafeExposure), exposureRange);\n  let iso = quantizeCameraRange(exposureProduct / Math.max(exposureRange.min, exposure), isoRange);'''
          new = '''  const aeExposureProduct = settings.exposureTime * settings.iso;\n  const exposureProduct = aeExposureProduct * AUTO_QR_LIGHT_SCALE;\n  const maxAutoIso = Math.min(isoRange.max, Math.max(isoRange.min, settings.iso * 4));\n  let exposure = quantizeCameraRange(Math.min(settings.exposureTime, motionSafeExposure), exposureRange);\n  let iso = quantizeCameraRange(exposureProduct / Math.max(exposureRange.min, exposure), isoRange);'''
          if old not in s: raise SystemExit("settle exposure product anchor missing")
          s = s.replace(old, new, 1)

          old = '''  // Re-quantize gain after shutter quantization so brightness remains close to\n  // the hardware-AE baseline rather than accidentally changing EV.'''
          new = '''  // Re-quantize gain after shutter quantization so the final manual state stays\n  // at the deliberate QR darkness target rather than drifting back toward AE.'''
          if old not in s: raise SystemExit("requantize comment anchor missing")
          s = s.replace(old, new, 1)

          # Cold motion-clamp rescue uses the same single QR-specific darkness\n          # prior. It no longer preserves neutral AE brightness exactly.
          old = '''  const exposureProduct = settings.exposureTime * settings.iso;\n  const exposure = quantizeCameraRange(Math.min(settings.exposureTime, motionSafeExposure), exposureRange);\n  const requiredIso = exposureProduct / Math.max(exposureRange.min, exposure);'''
          new = '''  const exposureProduct = settings.exposureTime * settings.iso * AUTO_QR_LIGHT_SCALE;\n  const exposure = quantizeCameraRange(Math.min(settings.exposureTime, motionSafeExposure), exposureRange);\n  const requiredIso = exposureProduct / Math.max(exposureRange.min, exposure);'''
          if old not in s: raise SystemExit("rescue exposure product anchor missing")
          s = s.replace(old, new, 1)

          # Remove poisoned auto memory on collapse and only retain settings that\n          # were genuinely useful, not merely barely above the collapse floor.
          old = '''      if (tuned.collapsed) {\n        autoOpticsTuneSummary = `collapsed ${(collapsedYield * 100).toFixed(0)}% · hardware AE reacquire`;'''
          new = '''      if (tuned.collapsed) {\n        forgetAutomaticOptics(track);\n        autoOpticsTuneSummary = `collapsed ${(collapsedYield * 100).toFixed(0)}% · memory cleared · hardware AE reacquire`;'''
          if old not in s: raise SystemExit("settle collapse anchor missing")
          s = s.replace(old, new, 1)

          old = '''    if (tuned.best?.valid) rememberAutomaticOptics(track, tunedExposure, tunedIso, tuned.best.score);'''
          new = '''    if (tuned.best?.valid && tuned.best.yieldRate >= AUTO_OPTICS_MEMORY_MIN_YIELD)\n      rememberAutomaticOptics(track, tunedExposure, tunedIso, tuned.best.score);'''
          if old not in s: raise SystemExit("settle memory anchor missing")
          s = s.replace(old, new, 1)

          old = '''    if (baseline.yieldRate < AUTO_OPTICS_COLLAPSE_YIELD) {\n      const collapsedYield = baseline.yieldRate;\n      await applyExposureSetting(track);'''
          new = '''    if (baseline.yieldRate < AUTO_OPTICS_COLLAPSE_YIELD) {\n      const collapsedYield = baseline.yieldRate;\n      forgetAutomaticOptics(track);\n      await applyExposureSetting(track);'''
          if old not in s: raise SystemExit("fine collapse anchor missing")
          s = s.replace(old, new, 1)

          old = '''      rememberAutomaticOptics(track, exposure, candidate.iso, candidate.score);'''
          new = '''      if (candidate.yieldRate >= AUTO_OPTICS_MEMORY_MIN_YIELD)\n        rememberAutomaticOptics(track, exposure, candidate.iso, candidate.score);'''
          if old not in s: raise SystemExit("fine candidate memory anchor missing")
          s = s.replace(old, new, 1)

          old = '''      rememberAutomaticOptics(track, exposure, currentIso, baseline.score);'''
          new = '''      if (baseline.yieldRate >= AUTO_OPTICS_MEMORY_MIN_YIELD)\n        rememberAutomaticOptics(track, exposure, currentIso, baseline.score);'''
          if old not in s: raise SystemExit("fine baseline memory anchor missing")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          node --check main.js
          node --check receive/main.js
          git diff --check
          rm -f .github/workflows/agent-v186-darker-auto-optics.yml
          git add -A
          git commit -m "v0.5.186 bias automatic optics darker"
          git push origin HEAD:master
