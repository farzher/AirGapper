name: memory cleanup v390

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cleanup-v390.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply memory cleanup
        run: |
          set -euo pipefail
          python3 .github/scripts/cleanup-v390.py
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-v390.yml .github/scripts/cleanup-v390.py
          git add receive/main.js shared/protocol.js shared/transport.js sw.js version.js
          git commit -m "v0.5.390: reduce retained and peak transfer memory"
          git push origin HEAD:master
