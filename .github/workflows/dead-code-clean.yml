name: Remove dead code and harden Y fallback
on:
  push:
    branches: [agent/dead-code-clean]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dead-code-clean
          fetch-depth: 0
      - name: Remove dead bindings and add Y self-disable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('receive/main.js')
          s = p.read_text()

          for line in (
              '  if (diagnosticsEl) diagnosticsEl.style.display = "none";\n',
              '  if (diagnosticsEl) diagnosticsEl.style.display = "block";\n',
          ):
              if s.count(line) != 1: raise SystemExit(f'missing stale diagnostics line: {line.strip()}')
              s = s.replace(line, '', 1)

          dead = {
              'reportStreamId','totalUsefulSymbols','cheapFullScans','thoroughFullScans',
              'localReacquisitions','globalReacquisitions','cropsSubmitted','trackedDecodes',
              'trackedAttempts','zeroRegionMs','degradedMs','schedulerNoJobs','cropMisses',
              'fullDetectorMisses','fullSightings','trackedMissFallbacks','regionExpiries',
              'regionCreations','submittedJobs','completedJobs','workerLatencyTotalMs',
              'fullLatencyTotalMs','fullLatencyCount','lastFullLatencyMs','currentScanningState'
          }
          lines = []
          for line in s.splitlines(True):
              stripped = line.strip()
              m = re.fullmatch(r'let\s+([A-Za-z_$][\w$]*)\s*=.*;', stripped)
              if m and m.group(1) in dead:
                  continue
              if any(re.search(rf'(?<![.\w$]){re.escape(name)}\s*(?:\+\+|--|[+\-*/]?=)', stripped) for name in dead):
                  continue
              lines.append(line)
          s = ''.join(lines)
          s = s.replace('  const expectedNow = gridLattice.active ? activeGrid.length : expectedRegions;\n', '')
          s = s.replace('async function finish(container, hashOk, seconds) {\n  var _a, _b;\n', 'async function finish(container, hashOk, seconds) {\n')

          marker = 'const DIRECT_LUMA_FORMATS = new Set(["I420", "I420A", "I422", "I422A", "I444", "I444A", "NV12"]);\n'
          if s.count(marker) != 1: raise SystemExit('direct luma marker missing')
          s = s.replace(marker, marker + 'let directLumaDisabled = false;\n', 1)
          old = '  if (source.image || captureNextScan || opticalSampleDue(source) || !frame || !DIRECT_LUMA_FORMATS.has(frame.format)) return null;'
          new = '  if (directLumaDisabled || optimizerPipelineActive || source.image || captureNextScan || opticalSampleDue(source) || !frame || !DIRECT_LUMA_FORMATS.has(frame.format)) return null;'
          if s.count(old) != 1: raise SystemExit('cloneDirectLumaFrame guard missing')
          s = s.replace(old, new, 1)
          old = 'async function start() {\n  var _a;\n  const startAttempt = cameraStartGen;'
          new = 'async function start() {\n  var _a;\n  const startAttempt = cameraStartGen;\n  directLumaDisabled = false;'
          if s.count(old) != 1: raise SystemExit('start marker missing')
          s = s.replace(old, new, 1)

          old = '''        if (!accepted) {\n          laneFrame?.close();\n          cropAttempts.delete(id);\n          continue;\n        }'''
          new = '''        if (!accepted) {\n          if (laneFrame) directLumaDisabled = true;\n          laneFrame?.close();\n          cropAttempts.delete(id);\n          continue;\n        }'''
          if s.count(old) != 1: raise SystemExit('lane rejection marker missing')
          s = s.replace(old, new, 1)
          old = '''        )) {\n          sharedFrame?.close();\n          cropAttempts.delete(id2);'''
          new = '''        )) {\n          if (sharedFrame) directLumaDisabled = true;\n          sharedFrame?.close();\n          cropAttempts.delete(id2);'''
          if s.count(old) != 1: raise SystemExit('shared rejection marker missing')
          s = s.replace(old, new, 1)

          marker = '  focusController.noteDecoderCompletion(id);\n'
          insert = '''  focusController.noteDecoderCompletion(id);\n  if (completion.yPlaneFailed) {\n    directLumaDisabled = true;\n    finishScanCapture(id, completion);\n    scanOutcomes.delete(id);\n    cropAttempts.delete(id);\n    optimizerAttributionComplete(id);\n    return;\n  }\n'''
          if s.count(marker) != 1: raise SystemExit('decoder completion marker missing')
          s = s.replace(marker, insert, 1)
          p.write_text(s)

          p = Path('shared/progress.js'); s = p.read_text()
          s = s.replace('function expectedCodingOverhead(_mode) {', 'function expectedCodingOverhead() {')
          s = s.replace('function estimateTransferProgress(sourceBlocks, usefulSymbols, elapsedSeconds, sourceRank = usefulSymbols, _mode = "raptorq") {', 'function estimateTransferProgress(sourceBlocks, usefulSymbols, elapsedSeconds, sourceRank = usefulSymbols) {')
          p.write_text(s)

          p = Path('shared/transport.js'); s = p.read_text()
          s = s.replace('function scheduledEsi(k, ordinal, _slotIndex, _gridCodes) {', 'function scheduledEsi(k, ordinal) {')
          p.write_text(s)

          p = Path('receive/worker.js'); s = p.read_text()
          old = '''  } catch (error) {\n    ownedVideoFrame?.close();\n    ownedVideoFrame = null;\n    ctx.postMessage({\n      id,\n      symbols: [],\n      sightings: [],\n      full,\n      workerWaitMs,\n      readFullAttempts,\n      latencyMs: performance.now() - startedAt,\n      error: error instanceof Error ? error.message : String(error)\n    });\n  }'''
          new = '''  } catch (error) {\n    ownedVideoFrame?.close();\n    ownedVideoFrame = null;\n    const yPlaneFailed = pixelFormat === "y8";\n    ctx.postMessage({\n      id,\n      symbols: [],\n      sightings: [],\n      full,\n      trackedAttempted: yPlaneFailed,\n      trackedHit: false,\n      workerWaitMs,\n      readFullAttempts,\n      yPlaneFailed,\n      latencyMs: performance.now() - startedAt,\n      error: yPlaneFailed ? void 0 : error instanceof Error ? error.message : String(error)\n    });\n  }'''
          if s.count(old) != 1: raise SystemExit('worker catch marker missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('shared/worker-pool.js'); s = p.read_text()
          marker = '        trackedHit: Boolean(message.trackedHit),\n'
          if s.count(marker) != 1: raise SystemExit('pool completion marker missing')
          s = s.replace(marker, marker + '        yPlaneFailed: Boolean(message.yPlaneFailed),\n', 1)
          p.write_text(s)
          PY

      - name: Temporary strict JS audit
        shell: bash
        run: |
          mkdir -p /tmp/jsaudit
          npm install --prefix /tmp/jsaudit --no-package-lock --no-save eslint globals >/dev/null
          cat >/tmp/eslint.config.mjs <<'EOF'
          import globals from "/tmp/jsaudit/node_modules/globals/index.js";
          export default [{
            files: ["main.js", "receive/*.js", "send/*.js", "shared/*.js"],
            languageOptions: {
              ecmaVersion: "latest",
              sourceType: "module",
              globals: { ...globals.browser, ...globals.worker, ...globals.es2021 }
            },
            rules: {
              "no-undef": "error",
              "no-unused-vars": ["error", { "args": "after-used", "caughtErrors": "none" }]
            }
          }];
          EOF
          /tmp/jsaudit/node_modules/.bin/eslint --config /tmp/eslint.config.mjs main.js receive/*.js send/*.js shared/*.js
          for f in main.js receive/*.js send/*.js shared/*.js; do node --check "$f"; done
          ! grep -RIn 'diagnosticsEl\|import.meta.env\|?worker\|?url' main.js receive send shared

      - name: Commit clean result
        shell: bash
        run: |
          rm -rf .github
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove dead runtime counters and harden direct Y fallback"
          git push --force origin HEAD:agent/dead-code-clean-result
