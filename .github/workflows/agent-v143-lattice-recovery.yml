name: Agent v143 lattice recovery
on:
  push:
    branches: [master]
    paths:
      - '.github/v143_patch.py'
      - '.github/workflows/agent-v143-lattice-recovery.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v143_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          node --check receive/grid-lattice.js
          node --check receive/worker.js
          node --check sw.js
      - name: Commit patch
        run: |
          rm .github/v143_patch.py .github/workflows/agent-v143-lattice-recovery.yml
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'v0.5.143 preserve lattice through transient misses'
          git push origin master
