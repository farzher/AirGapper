name: Agent v71 fit filter
on:
  push:
    branches: [agent/v71-fit-filter]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v71-fit-filter
      - name: Apply fit filter patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/workflows/agent-v71-fit-filter.yml
          git add send/main.js shared/style.css index.html sw.js
          git commit -m "use filtered fit-screen QR downsampling"
          git push origin HEAD:agent/v71-fit-filter
