name: v268 dense erasure retry 3

on:
  push:
    paths:
      - .github/v268_diagnostics_patch3.py
      - .github/workflows/v268-erasure-retry3.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Apply dense erasure candidate and diagnostics
        run: |
          set -euo pipefail
          git fetch origin agent/ambiguity-erasures:refs/remotes/origin/agent/ambiguity-erasures
          git show origin/agent/ambiguity-erasures:.github/ambiguity_erasures_patch.py >/tmp/erasure.py
          git show origin/agent/ambiguity-erasures:.github/ambiguity_dense_fence.py >/tmp/fence.py
          python3 /tmp/erasure.py 2>&1 | tee /tmp/v268-apply.log
          python3 /tmp/fence.py 2>&1 | tee -a /tmp/v268-apply.log
          python3 .github/v268_diagnostics_patch3.py 2>&1 | tee -a /tmp/v268-apply.log
          grep -q 'const APP_BUILD = "v0.5.268"' main.js
          grep -q 'const RECEIVER_RUNTIME_BUILD = "v0.5.268"' receive/main.js
          grep -q 'GUIDED_METRICS_BYTES = 192' receive/worker.js
          grep -q 'warp T/A/M/P' receive/main.js

      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/decimen-codec/source/emsdk
            vendor/decimen-codec/source/third_party
            vendor/decimen-codec/source/build-simd
            vendor/decimen-codec/source/build-scalar
          key: decimen-emsdk-6.0.6-zxing-${{ hashFiles('vendor/decimen-codec/source/zxing-cpp.commit') }}

      - name: Build SIMD and scalar codecs
        run: |
          set -euo pipefail
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v268-build-simd.log
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v268-build-scalar.log

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Run unchanged correctness regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=2 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/v268-regression.log

      - name: Promote v268
        if: success()
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/v268_diagnostics_patch3.py .github/workflows/v268-erasure-retry3.yml
          git add vendor/decimen-codec/source/wrapper/decimen_codec.cpp vendor/decimen-codec/source/wrapper/decimen_codec.h vendor/decimen-codec/source/VERSION \
                  vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
                  vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm \
                  receive/worker.js receive/main.js main.js index.html sw.js benchmark/latest-result.json
          git commit -m "v0.5.268 use RS erasures for dense ambiguity"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Record rejection
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "v268 dense erasure retry3 rejected at $(date -u +%FT%TZ)"
            cat /tmp/v268-apply.log 2>/dev/null || true
            tail -n 220 /tmp/v268-build-simd.log 2>/dev/null || true
            tail -n 220 /tmp/v268-build-scalar.log 2>/dev/null || true
            tail -n 600 /tmp/v268-regression.log 2>/dev/null || true
          } > benchmark/v268-erasure-retry3-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/v268_diagnostics_patch3.py .github/workflows/v268-erasure-retry3.yml
          git add benchmark/v268-erasure-retry3-ci.log
          git commit -m "record v268 dense erasure retry3 rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
