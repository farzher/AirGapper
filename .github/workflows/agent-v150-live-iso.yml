name: Agent v150 live ISO tuning
on:
  push:
    paths:
      - '.github/v150_patch.py'
      - '.github/workflows/agent-v150-live-iso.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v150_patch.py
      - name: Smoke check
        run: |
          node --check receive/main.js
          node --check receive/grid-lattice.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add receive/main.js receive/grid-lattice.js index.html main.js sw.js
          git commit -m 'v0.5.150 tune ISO against live decoder yield'
          git push origin master
