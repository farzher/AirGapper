name: v188 CPU spatial track budget

on:
  push:
    paths:
      - .github/workflows/agent-v188-cpu-spatial-budget.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.5.188
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          python3 .github/v188_patch.py
          node --check main.js
          node --check receive/main.js
          git diff --check
          rm -f .github/v188_patch.py .github/workflows/agent-v188-cpu-spatial-budget.yml
          git add -A
          git commit -m "v0.5.188 rotate CPU-limited spatial QR bands"
          git push origin HEAD:master
