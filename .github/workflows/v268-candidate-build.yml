name: v268 clean candidate build

on:
  push:
    paths:
      - .github/workflows/v268-candidate-build.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/decimen-codec/source/emsdk
            vendor/decimen-codec/source/third_party
            vendor/decimen-codec/source/build-simd
            vendor/decimen-codec/source/build-scalar
          key: decimen-emsdk-6.0.6-zxing-${{ hashFiles('vendor/decimen-codec/source/zxing-cpp.commit') }}

      - name: Apply v268 source
        run: |
          set -euo pipefail
          python3 .github/ambiguity_erasures_patch.py
          python3 .github/ambiguity_dense_fence.py
          python3 .github/v268_diagnostics_patch3.py
          node --check receive/main.js
          node --check receive/worker.js
          git diff --check

      - name: Build SIMD and scalar codecs
        run: |
          set -euo pipefail
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. vendor/decimen-codec/source/build.sh
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android vendor/decimen-codec/source/build.sh

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Regression gate
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=2 node benchmark/offline-runner.mjs | tee /tmp/v268-regression.log

      - name: Commit exact tested candidate
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          rm -f .github/ambiguity_erasures_patch.py .github/ambiguity_dense_fence.py
          rm -f .github/v268*.py
          rm -f .github/workflows/v268-*.yml
          rm -f benchmark/v268*-ci.log benchmark/v268*-pass.log
          git add -A
          git commit -m "v0.5.268 dense ambiguity erasure sampling"
          git push origin HEAD:agent/v268-candidate

# retrigger
