name: Finish throughput hot path
on:
  push:
    branches: [agent/throughput-final]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/throughput-final
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Finish hot-path cleanup
        run: python3 .github/finalize-throughput.py
      - name: Rebuild APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleRelease
          cd ..
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          cp "$APK" AirGapper.apk
      - name: Publish final result
        shell: bash
        run: |
          rm -rf .github
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finish QR throughput hot path"
          git push --force origin HEAD:agent/throughput-final-result
