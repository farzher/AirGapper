name: Finish throughput hot path
on:
  push:
    branches: [agent/throughput-final]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/throughput-final
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Finish hot-path cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('receive/main.js')
          s = p.read_text()
          old = 'const autoWorkerCount = usesScalarCodec ? Math.max(1, Math.min(3, hardwareThreadCount - 1)) : Math.max(1, Math.min(6, hardwareThreadCount - 1));'
          new = 'const autoWorkerCount = Math.max(1, Math.min(6, hardwareThreadCount - 1));'
          if s.count(old) != 1: raise SystemExit('worker count mismatch')
          s = s.replace(old, new, 1)
          old = 'function drawOverlay(now) {\n'
          new = 'let lastOverlayDrawAt = -Infinity;\nfunction drawOverlay(now) {\n  if (now - lastOverlayDrawAt < 50) return;\n  lastOverlayDrawAt = now;\n'
          if s.count(old) != 1: raise SystemExit('overlay function mismatch')
          p.write_text(s.replace(old, new, 1))

          p = Path('shared/worker-pool.js')
          s = p.read_text()
          old = '''      this.busy[slot] = false;
      this.activeIds[slot] = void 0;
              this.activeFull[slot] = false;
        this.onAvailable?.(slot);
        const completion = {'''
          new = '''      this.busy[slot] = false;
      this.activeIds[slot] = void 0;
      this.activeFull[slot] = false;
      this.onAvailable?.(slot);
      const completion = {'''
          if s.count(old) != 1: raise SystemExit('pool formatting mismatch')
          s = s.replace(old, new, 1)
          s = s.replace('        yPlaneFailed: Boolean(message.yPlaneFailed),\n', '', 1)
          old = '''      this.busy[slot] = id === void 0;
      this.activeIds[slot] = void 0;
      this.activeFull[slot] = false;'''
          new = '''      this.busy[slot] = false;
      this.activeIds[slot] = void 0;
      this.activeFull[slot] = false;'''
          if s.count(old) != 1: raise SystemExit('worker error busy mismatch')
          s = s.replace(old, new, 1)
          old = '''      worker.terminate();
      if (id !== void 0) {
        const replacement = this.create();
        this.workers[slot] = replacement;
        this.configureWorker(slot, replacement);
      }'''
          new = '''      worker.terminate();
      const replacement = this.create();
      this.workers[slot] = replacement;
      this.configureWorker(slot, replacement);'''
          if s.count(old) != 1: raise SystemExit('worker replacement mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Rebuild APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleRelease
          cd ..
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          cp "$APK" AirGapper.apk
      - name: Publish final result
        shell: bash
        run: |
          rm -rf .github
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finish QR throughput hot path"
          git push --force origin HEAD:agent/throughput-final-result
