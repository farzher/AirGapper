name: Agent v137 guided throughput
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/agent-v137-guided-throughput.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply guarded guided-throughput patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  ('AirGapper <span class="app-version">v0.5.136</span>', 'AirGapper <span class="app-version">v0.5.137</span>'),
              ],
              'main.js': [
                  ('const APP_BUILD = "v0.5.136";', 'const APP_BUILD = "v0.5.137";'),
              ],
              'receive/main.js': [
                  ('const RECEIVER_RUNTIME_BUILD = "v0.5.136";', 'const RECEIVER_RUNTIME_BUILD = "v0.5.137";'),
                  ('const GUIDED_MIN_TRACKS = 12;', 'const GUIDED_MIN_TRACKS = 6;'),
                  ('const minOutput = Math.max(4, Math.ceil(Math.max(1, tracks) / 3));', 'const minOutput = Math.max(2, Math.ceil(Math.max(1, tracks) / 3));'),
              ],
              'receive/worker.js': [
                  ('if (guidedDecode && decodePixelFormat === "y8" && tracks.length >= 12) {', 'if (guidedDecode && decodePixelFormat === "y8" && tracks.length >= 6) {'),
                  ('Math.min(12, tracks.length), guidedMetricsPtr', 'tracks.length, guidedMetricsPtr'),
              ],
              'sw.js': [
                  ('const CACHE = "airgapper-static-js-v99";', 'const CACHE = "airgapper-static-js-v100";'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          node --check receive/worker.js
          node --check sw.js
          grep -q 'v0.5.137' index.html
          grep -q 'const GUIDED_MIN_TRACKS = 6;' receive/main.js
          grep -q 'tracks.length >= 6' receive/worker.js
          grep -q 'tracks.length, guidedMetricsPtr' receive/worker.js
          grep -q 'airgapper-static-js-v100' sw.js
      - name: Commit patch
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm -f .github/workflows/agent-v137-guided-throughput.yml
          git add index.html main.js receive/main.js receive/worker.js sw.js
          git commit -m "v0.5.137 broaden guarded guided QR throughput"
          git push origin HEAD:master
