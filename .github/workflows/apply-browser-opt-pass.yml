name: apply browser optimization patch

on:
  push:
    branches:
      - opt/browser-acquisition-autooptics
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opt/browser-acquisition-autooptics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relax duplicate camera-session reset assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-browser-opt-pass.py')
          s = p.read_text()
          old = '''text = once(text,
          ''' + "'''  cameraStartedTs = receiverNow();\n  resetLivePipeline(cameraStartedTs);'''" + ''',
          ''' + "'''  cameraStartedTs = receiverNow();\n  acquisitionRaceStartedAt = 0;\n  acquisitionHuntScans = 0;\n  acquisitionSightingScans = 0;\n  acquisitionSightings = 0;\n  resetLivePipeline(cameraStartedTs);'''" + ''',
          "acquisition session reset")'''
          new = '''text = text.replace(
          ''' + "'''  cameraStartedTs = receiverNow();\n  resetLivePipeline(cameraStartedTs);'''" + ''',
          ''' + "'''  cameraStartedTs = receiverNow();\n  acquisitionRaceStartedAt = 0;\n  acquisitionHuntScans = 0;\n  acquisitionSightingScans = 0;\n  acquisitionSightings = 0;\n  resetLivePipeline(cameraStartedTs);'''" + ''')'''
          if old not in s:
              raise SystemExit('expected acquisition session reset patch block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply browser acquisition and optics patch
        run: python3 tools/apply-browser-opt-pass.py
      - name: Validate policy and JavaScript syntax
        run: |
          node benchmark/browser-performance-policy-smoke.mjs
          node --check receive/main.js
          node --check receive/worker.js
          node --check receive/performance-policy.js
      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git config user.name 'AirGapper Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add receive/main.js receive/worker.js receive/performance-policy.js benchmark/browser-performance-policy-smoke.mjs main.js send/main.js index.html sw.js android/app/build.gradle
          git commit -m 'optimize browser acquisition and automatic optics'
          git push origin HEAD:opt/browser-acquisition-autooptics
