name: receiver worker cleanup v387

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/worker-v387.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply
        run: |
          set -euo pipefail
          python3 .github/scripts/worker-v387.py
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/worker-v387.yml .github/scripts/worker-v387.py
          git add receive/worker.js version.js
          git commit -m "v0.5.387: trim receiver frame allocation churn"
          git push origin HEAD:master
