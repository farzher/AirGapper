name: Agent v181 manual optics persistence
on:
  push:
    paths:
      - '.github/v181_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v181_patch.py
      - name: Check syntax and diff
        run: |
          node --check receive/main.js
          node --check main.js
          git diff --check
          git diff -- receive/main.js index.html main.js sw.js
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js sw.js
          git commit -m 'v0.5.181 preserve manual optics profile'
          git push
