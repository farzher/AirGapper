name: v210 turbo evidence fix
on:
  push:
    paths:
      - .github/v210_patch.py
      - .github/workflows/agent-v210.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/v210_patch.py
      - name: Build SIMD codec
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. ./build.sh
      - name: Build scalar codec
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android ./build.sh
      - name: Commit source and generated codecs
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/v210_patch.py .github/workflows/agent-v210.yml
          git add index.html main.js receive/main.js sw.js \
            vendor/decimen-codec/source/VERSION \
            vendor/decimen-codec/source/wrapper/decimen_codec.cpp \
            vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
            vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm
          git commit -m "v0.5.210 fix turbo evidence starvation"
          git push origin master
