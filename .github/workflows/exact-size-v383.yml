name: exact QR Size semantics

on:
  push:
    branches: [master]
    paths:
      - version.js
      - .github/workflows/exact-size-v383.yml

concurrency:
  group: exact-size-v383
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply after sender performance patch
        run: |
          set -euo pipefail
          if ! grep -q 'APP_VERSION = "0.5.382"' version.js; then
            echo 'Waiting for v0.5.382; keeping exact-size workflow armed.'
            exit 0
          fi
          python3 .github/scripts/apply-exact-size-v383.py
          grep -q 'exactSourcePlan' shared/frame-capacity.js
          grep -q 'selectTransportPlan(payload.length, frameBytes, false, true)' send/main.js
          grep -q 'APP_VERSION = "0.5.383"' version.js
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/exact-size-v383.yml .github/scripts/apply-exact-size-v383.py
          git add shared/frame-capacity.js send/main.js version.js
          git commit -m "v0.5.383: make numeric QR Size exact"
          git push origin HEAD:master
