name: settings reset v388

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/settings-v388.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply
        run: |
          set -euo pipefail
          python3 .github/scripts/settings-v388.py
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/settings-v388.yml .github/scripts/settings-v388.py
          git add send/main.js version.js
          git commit -m "v0.5.388: reset sender settings and default Auto Size"
          git push origin HEAD:master
