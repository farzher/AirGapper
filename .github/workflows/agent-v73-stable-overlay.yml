name: Agent v73 stable overlay
on:
  push:
    branches: [agent/v73-stable-overlay]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v73-stable-overlay
      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/workflows/agent-v73-stable-overlay.yml
          git add receive/main.js index.html sw.js
          git commit -m "stabilize receiver quality overlay"
          git push origin HEAD:agent/v73-stable-overlay