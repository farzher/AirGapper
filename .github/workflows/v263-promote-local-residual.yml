name: v263 local residual promotion retry

on:
  push:
    paths:
      - .github/v263_promote_patch.py
      - .github/workflows/v263-promote-local-residual.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact passing v263 candidate
        run: |
          set -euo pipefail
          python3 .github/v263_promote_patch.py
      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/decimen-codec/source/emsdk
            vendor/decimen-codec/source/third_party
            vendor/decimen-codec/source/build-simd
            vendor/decimen-codec/source/build-scalar
          key: decimen-emsdk-6.0.6-zxing-${{ hashFiles('vendor/decimen-codec/source/zxing-cpp.commit') }}
      - name: Build SIMD and scalar codecs
        run: |
          set -euo pipefail
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. vendor/decimen-codec/source/build.sh
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android vendor/decimen-codec/source/build.sh
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Reconfirm existing benchmark
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=1 node benchmark/offline-runner.mjs
      - name: Promote v263
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/v263_promote_patch.py .github/workflows/v263-promote-local-residual.yml
          git add vendor/decimen-codec/source/wrapper/decimen_codec.cpp vendor/decimen-codec/source/VERSION \
                  vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
                  vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm \
                  receive/main.js main.js index.html sw.js
          git commit -m "v0.5.263 local handheld residual retry"
          # The benchmark may update tracked result artifacts that are intentionally
          # not part of production. Clear those before rebasing the production commit.
          git reset --hard HEAD
          git pull --rebase origin master
          git push origin HEAD:master
