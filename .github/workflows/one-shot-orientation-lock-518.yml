name: orientation-lock-518

on:
  push:
    branches:
      - chatgpt/auto-optics-dark-ci-515
    paths:
      - .github/workflows/one-shot-orientation-lock-518.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply portrait lock patch
        run: python3 benchmark/one-shot-orientation-lock-518.py
      - name: Verify
        run: |
          set -euo pipefail
          node --input-type=module --check < main.js
          node --input-type=module --check < send/main.js
          node --input-type=module --check < receive/runtime.js
          node benchmark/version-source-smoke.mjs
          node benchmark/camera-start-guard-smoke.mjs
          node benchmark/camera-constraints-smoke.mjs
          node benchmark/browser-performance-policy-smoke.mjs
          node benchmark/grid-lattice-regression.mjs
          node benchmark/track-processor-proxy-smoke.mjs
          node benchmark/worker-pool-reuse-smoke.mjs
          grep -q 'orientation":"portrait-primary"' manifest.webmanifest
          grep -q 'android:screenOrientation="portrait"' android/app/src/main/AndroidManifest.xml
          grep -q 'portrait-fallback' main.js
          grep -q 'senderViewportCss' send/main.js
          if grep -q 'spend the height on the camera instead' shared/style.css; then exit 1; fi
          git diff --check
      - name: Commit tested patch
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-orientation-lock-518.yml benchmark/one-shot-orientation-lock-518.py
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add main.js send/main.js shared/style.css manifest.webmanifest android/app/src/main/AndroidManifest.xml version.js
          git commit -m 'Lock AirGapper to portrait v0.5.518'
          git push
