name: v245 adaptive dense Stable-RS

on:
  push:
    paths:
      - .github/v245_adaptive_dense_stable.py
      - .github/workflows/v245-adaptive-dense-stable.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate
        run: python3 .github/v245_adaptive_dense_stable.py
      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/decimen-codec/source/emsdk
            vendor/decimen-codec/source/third_party
            vendor/decimen-codec/source/build-simd
            vendor/decimen-codec/source/build-scalar
          key: decimen-emsdk-6.0.6-zxing-${{ hashFiles('vendor/decimen-codec/source/zxing-cpp.commit') }}
      - name: Build codecs
        run: |
          set -euo pipefail
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v245-build-simd.log
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v245-build-scalar.log
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Run existing receiver benchmark
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/v245-regression.log
      - name: Correctness gate
        run: |
          node <<'NODE' 2>&1 | tee /tmp/v245-gate.log
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('benchmark/latest-result.json','utf8')).scenarios;
          const after=JSON.parse(fs.readFileSync('benchmark/offline-summary.json','utf8')).scenarios;
          const med=(x,k)=>Number(x?.trialMedians?.[k] ?? x?.normalized?.[k] ?? 0);
          const problems=[];
          const rows={};
          for(const name of ['stable-y8','motion-y8','dense-y8','optical-dense-y8','camera-dense-y8']){
            const b=before[name],a=after[name];
            const by=med(b,'guidedOutputYield'), ay=med(a,'guidedOutputYield');
            rows[name]={yieldBefore:by,yieldAfter:ay,stableRS:[a.guided?.stableRsSuccesses||0,a.guided?.stableRsAttempts||0],stableEligible:a.guided?.stableEligibleTracks||0,guidedMs:med(a,'guidedMsPerOutput')};
            if(!a?.ok) problems.push(`${name} failed`);
            if(ay < by-(name==='motion-y8'?0.03:0.02)) problems.push(`${name} output yield regressed`);
            if(a.tailFullJobs!==0) problems.push(`${name} stable tail used full scans`);
            if(med(b,'guidedMsPerOutput')>0 && med(a,'guidedMsPerOutput')>med(b,'guidedMsPerOutput')*1.25) problems.push(`${name} CPU regressed >25%`);
          }
          for(const name of ['motion-y8','optical-dense-y8','camera-dense-y8']) if(after[name].finalState!=='TRACK') problems.push(`${name} ended in ${after[name].finalState}`);
          console.log(JSON.stringify({note:'dense handheld Stable-RS adaptation; hardware is performance target',rows,problems},null,2));
          if(problems.length) throw new Error(problems.join('; '));
          NODE
      - name: Promote passing candidate
        if: success()
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/v245_adaptive_dense_stable.py .github/workflows/v245-adaptive-dense-stable.yml
          git add vendor/decimen-codec/source/wrapper/decimen_codec.cpp vendor/decimen-codec/source/VERSION \
                  vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
                  vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm \
                  receive/main.js main.js index.html sw.js benchmark/latest-result.json
          git commit -m "v0.5.245 bypass losing dense Stable-RS"
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Record rejection
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "v245 adaptive Stable-RS candidate rejected at $(date -u +%FT%TZ)"
            cat /tmp/v245-gate.log 2>/dev/null || true
            tail -n 220 /tmp/v245-build-simd.log 2>/dev/null || true
            tail -n 220 /tmp/v245-build-scalar.log 2>/dev/null || true
            tail -n 600 /tmp/v245-regression.log 2>/dev/null || true
          } > benchmark/v245-adaptive-stable-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add benchmark/v245-adaptive-stable-ci.log
          git rm .github/v245_adaptive_dense_stable.py .github/workflows/v245-adaptive-dense-stable.yml
          git commit -m "record v245 adaptive Stable-RS rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
