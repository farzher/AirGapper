name: v252 live stats correctness

on:
  push:
    paths:
      - .github/v252_live_stats_patch.py
      - .github/workflows/v252-live-stats.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Apply v252 candidate
        run: |
          set -euo pipefail
          python3 .github/v252_live_stats_patch.py 2>&1 | tee /tmp/v252-patch.log

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run existing receiver benchmark unchanged
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=1 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/v252-regression.log

      - name: Promote passing v252
        if: success()
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/v252_live_stats_patch.py .github/workflows/v252-live-stats.yml
          git add benchmark/README.md index.html main.js receive/main.js sw.js
          git commit -m "v0.5.252 restore CPU fps and live rolling stats"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Record rejected v252
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "v252 live stats candidate rejected at $(date -u +%FT%TZ)"
            cat /tmp/v252-patch.log 2>/dev/null || true
            tail -n 400 /tmp/v252-regression.log 2>/dev/null || true
          } > benchmark/v252-live-stats-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add benchmark/v252-live-stats-ci.log
          git commit -m "record v252 live stats rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
