name: v213 completion snapshot
on:
  push:
    paths:
      - .github/v213_completion_snapshot.py
      - .github/workflows/agent-v213.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply completion snapshot patch
        run: python .github/v213_completion_snapshot.py
      - name: Commit completion snapshot fix
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm -f .github/v213_completion_snapshot.py .github/workflows/agent-v213.yml
          git add index.html main.js receive/main.js sw.js
          git commit -m "v0.5.213 snapshot diagnostics at decoder completion"
          git push origin master
