name: Agent v144 one-way auto optics
on:
  push:
    branches: [master]
    paths:
      - '.github/v144_patch.py'
      - '.github/workflows/agent-v144-oneway-auto-optics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v144_patch.py
      - name: Smoke check
        run: |
          grep -q 'v0.5.144' receive/main.js
          grep -q 'v0.5.144' index.html
          grep -q 'locked for session' receive/main.js
          grep -q 'AUTO_OPTICS_MIN_SETTLE_QR_PER_SECOND' receive/main.js
          ! grep -q 'AUTO_OPTICS_MAX_STRUGGLING_QR_PER_SECOND' receive/main.js
      - name: Commit patch
        run: |
          rm .github/v144_patch.py .github/workflows/agent-v144-oneway-auto-optics.yml
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'v0.5.144 lock automatic optics after bootstrap'
          git push origin master
