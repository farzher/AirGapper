name: focus ownership cleanup v465 once
on:
  push:
    paths:
      - .github/workflows/focus-owner-v465-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate focus ownership
        shell: bash
        run: |
          echo '' | base64 --decode | python
          rm .github/workflows/focus-owner-v465-once.yml
          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receive/focus-controller.js receive/main.js receive/acquisition-focus-recovery.js version.js .github/workflows/focus-owner-v465-once.yml
          git commit -m "Consolidate focus mutation ownership v0.5.465"
          git push