name: one-shot v0.5.368 patch

on:
  push:
    branches: [fix/auto-optics-motion-recovery]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-optics-motion-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply v0.5.368 source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('receive/main.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { AgcapCorpus, AgcapRecorder, copyVideoFrameY, yToImageData } from "./agcap.js";\nconst RECEIVER_RUNTIME_BUILD = "v0.5.361";',
              'import { AgcapCorpus, AgcapRecorder, copyVideoFrameY, yToImageData } from "./agcap.js";\nimport { APP_BUILD } from "../version.js";\nconst RECEIVER_RUNTIME_BUILD = APP_BUILD;',
              'runtime build source'
          )

          replace_once(
              'const AUTO_OPTICS_AE_RESCUE_DWELL_MS = 700;\nconst AUTO_OPTICS_AE_RESCUE_RETRY_MS = 3000;\nconst AUTO_OPTICS_SHORT_EXPOSURE_TRIGGER = 55; // 5.5 ms\nlet autoOpticsTuneSummary = "";',
              'const AUTO_OPTICS_AE_RESCUE_DWELL_MS = 700;\nconst AUTO_OPTICS_AE_RESCUE_RETRY_MS = 3000;\nconst AUTO_OPTICS_SHORT_EXPOSURE_TRIGGER = 55; // 5.5 ms\nconst AUTO_OPTICS_SEED_RETRY_MS = 2500;\nlet autoOpticsTuneSummary = "";',
              'auto optics seed retry constant'
          )

          replace_once(
              'let autoOpticsAeBaseline;\nlet autoOpticsMemoryBootAt = 0;\nlet autoOpticsMemoryBoot;\nlet autoOpticsMeasurementSlots;',
              'let autoOpticsAeBaseline;\nlet autoOpticsMemoryBootAt = 0;\nlet autoOpticsMemoryBoot;\nlet autoOpticsMeasurementSlots;\nlet autoOpticsSeedQrProven = false;',
              'auto optics seed proof state'
          )

          replace_once(
              '  autoOpticsMemoryBoot = void 0;\n  autoOpticsMeasurementSlots = void 0;\n  autoOpticsTuneSummary = "";',
              '  autoOpticsMemoryBoot = void 0;\n  autoOpticsMeasurementSlots = void 0;\n  autoOpticsSeedQrProven = false;\n  autoOpticsTuneSummary = "";',
              'reset seed proof state'
          )

          replace_once(
              '    const shortSettle = (ms = 120) => new Promise((resolve) => setTimeout(resolve, ms));\n    if (touchesFocus && !touchesExposure) {',
              '''    const shortSettle = (ms = 120) => new Promise((resolve) => setTimeout(resolve, ms));
    // Camera constraint writes are surprisingly expensive on Android and can
    // themselves perturb AE/AF. A HOLD request that already matches the sensor
    // is not a mutation and must not count as one.
    if (touchesExposure && !touchesFocus) {
      const modeMatches = patch.exposureMode === void 0 || before.exposureMode === patch.exposureMode;
      const exposureMatches = numericClose(before.exposureTime, patch.exposureTime, caps.exposureTime?.step);
      const isoMatches = numericClose(before.iso, patch.iso, caps.iso?.step);
      const evMatches = numericClose(before.exposureCompensation, patch.exposureCompensation, caps.exposureCompensation?.step);
      if (modeMatches && exposureMatches && isoMatches && evMatches) return;
    }
    if (touchesFocus && !touchesExposure) {''',
              'dedupe camera exposure writes'
          )

          replace_once(
              '  autoOpticsMemoryBootAt = 0;\n  autoOpticsMemoryBoot = void 0;\n  autoOpticsLockSince = 0;\n  autoOpticsAcquisitionSince = receiverNow();\n  autoOpticsRetryAt = 0;\n  autoOpticsRescueRetryAt = autoOpticsAcquisitionSince + AUTO_OPTICS_ACQUISITION_RESCUE_MS;',
              '  autoOpticsMemoryBootAt = 0;\n  autoOpticsMemoryBoot = void 0;\n  autoOpticsSeedQrProven = false;\n  autoOpticsLockSince = 0;\n  autoOpticsAcquisitionSince = receiverNow();\n  autoOpticsRetryAt = 0;\n  autoOpticsRescueRetryAt = autoOpticsAcquisitionSince + AUTO_OPTICS_SEED_RETRY_MS;',
              'short shutter seed state'
          )

          replace_once(
              '''    const baseline = await readAutomaticAeBaseline(track);
    if (!automaticOpticsSessionAlive(track)) return;
    const now = receiverNow();
    autoOpticsAeBaseline = baseline;
    autoOpticsRuntimeState = "ae";
    autoOpticsMemoryBootAt = 0;
    autoOpticsMemoryBoot = void 0;
    autoOpticsLockSince = 0;
    autoOpticsAcquisitionSince = now;
    autoOpticsRetryAt = 0;
    autoOpticsRescueRetryAt = now + 300;
    autoOpticsHoldSample = void 0;
    autoOpticsHoldCollapseSince = 0;
    autoOpticsHeldYield = 0;
    autoOpticsTuneSummary = `${reason} · neutral AE rescue`;
    focusController.adoptAutomaticCameraState("fast-dark startup failed; hardware AE rescue enabled");
    notePipelineEvent("auto-optics-seed-fallback");''',
              '''    // AE is a light meter, not a scan mode. Re-meter briefly, then
    // immediately return to a motion-safe manual shutter. Never leave the
    // receiver parked in photographic AE while it is trying to reacquire QRs.
    const baseline = await readAutomaticAeBaseline(track);
    if (!automaticOpticsSessionAlive(track)) return;
    if (baseline && await applyAutomaticShortSeed(track, baseline, `${reason} · AE re-metered`)) {
      autoOpticsRescueRetryAt = receiverNow() + AUTO_OPTICS_SEED_RETRY_MS;
      notePipelineEvent("auto-optics-seed-remeter");
      return;
    }
    const now = receiverNow();
    autoOpticsAeBaseline = baseline;
    autoOpticsRuntimeState = "ae";
    autoOpticsMemoryBootAt = 0;
    autoOpticsMemoryBoot = void 0;
    autoOpticsLockSince = 0;
    autoOpticsAcquisitionSince = now;
    autoOpticsRetryAt = 0;
    autoOpticsRescueRetryAt = now + AUTO_OPTICS_AE_RESCUE_RETRY_MS;
    autoOpticsHoldSample = void 0;
    autoOpticsHoldCollapseSince = 0;
    autoOpticsHeldYield = 0;
    autoOpticsTuneSummary = `${reason} · manual short shutter unavailable; hardware AE fallback`;
    focusController.adoptAutomaticCameraState("manual motion-safe exposure unavailable; hardware AE fallback");
    notePipelineEvent("auto-optics-seed-fallback");''',
              'seed fallback uses AE only as meter'
          )

          replace_once(
              '''    const baseline = await readAutomaticAeBaseline(track);
    if (!automaticOpticsSessionAlive(track)) return;
    autoOpticsAeBaseline = baseline;
    autoOpticsRuntimeState = "ae";
    const now = receiverNow();
    autoOpticsLockSince = gridLattice.locked ? now : 0;
    autoOpticsAcquisitionSince = now;
    autoOpticsRetryAt = now + AUTO_OPTICS_COLLAPSE_RETRY_MS;
    autoOpticsRescueRetryAt = now + AUTO_OPTICS_ACQUISITION_RESCUE_MS;
    autoOpticsAeRescueStep = 0;
    autoOpticsAeBias = 0;
    autoOpticsHoldSample = void 0;
    autoOpticsHoldCollapseSince = 0;
    autoOpticsHeldYield = 0;
    autoOpticsTuneSummary = `${reason} ${(yieldRate * 100).toFixed(0)}% · neutral hardware AE recovery`;
    focusController.adoptAutomaticCameraState("held QR-proven optics genuinely collapsed; neutral hardware AE restored");
    notePipelineEvent("auto-optics-hold-collapse");''',
              '''    const baseline = await readAutomaticAeBaseline(track);
    if (!automaticOpticsSessionAlive(track)) return;
    // Even after a genuine brightness collapse, AE only measures the new light
    // level. Convert that meter reading straight back to a short shutter + ISO.
    if (baseline && await applyAutomaticShortSeed(track, baseline, `${reason} · AE re-metered recovery`)) {
      autoOpticsControllerState = "RECOVER";
      notePipelineEvent("auto-optics-hold-remeter");
      return;
    }
    autoOpticsAeBaseline = baseline;
    autoOpticsRuntimeState = "ae";
    const now = receiverNow();
    autoOpticsLockSince = gridLattice.locked ? now : 0;
    autoOpticsAcquisitionSince = now;
    autoOpticsRetryAt = now + AUTO_OPTICS_COLLAPSE_RETRY_MS;
    autoOpticsRescueRetryAt = now + AUTO_OPTICS_AE_RESCUE_RETRY_MS;
    autoOpticsAeRescueStep = 0;
    autoOpticsAeBias = 0;
    autoOpticsHoldSample = void 0;
    autoOpticsHoldCollapseSince = 0;
    autoOpticsHeldYield = 0;
    autoOpticsTuneSummary = `${reason} ${(yieldRate * 100).toFixed(0)}% · manual short shutter unavailable; hardware AE fallback`;
    focusController.adoptAutomaticCameraState("held optics collapsed and manual exposure is unavailable; hardware AE fallback");
    notePipelineEvent("auto-optics-hold-collapse");''',
              'collapsed optics uses AE only as meter'
          )

          replace_once(
              '''  const seededStartup = autoOpticsRuntimeState === "seed";
  if (autoOpticsRuntimeState !== "ae" && !seededStartup) return;

  if (!gridLattice.locked) {
    autoOpticsLockSince = 0;
    const recentDecode = Boolean(lastStreamDecodeAt && lastStreamDecodeAt >= autoOpticsAcquisitionSince && now - lastStreamDecodeAt < AUTO_OPTICS_RECENT_DECODE_MS);
    if (seededStartup) {
      if (!recentDecode && now - autoOpticsAcquisitionSince >= AUTO_OPTICS_ACQUISITION_RESCUE_MS)
        void abandonAutomaticShortSeed(track);
    } else if (!recentDecode && now - autoOpticsAcquisitionSince >= AUTO_OPTICS_ACQUISITION_RESCUE_MS && now >= autoOpticsRescueRetryAt) {
      void rescueAutomaticQrAcquisition(track, now);
    }
    return;
  }

  if (!autoOpticsPoseUsable(autoOpticsPoseSnapshot())) {''',
              '''  const seededStartup = autoOpticsRuntimeState === "seed";
  if (autoOpticsRuntimeState !== "ae" && !seededStartup) return;

  // A short-shutter seed becomes protected as soon as it produces a real QR.
  // Geometry may subsequently disappear because the phone moved; that is never
  // evidence that the exposure was wrong.
  if (seededStartup && gridLattice.locked && lastStreamDecodeAt && lastStreamDecodeAt >= autoOpticsAcquisitionSince) {
    autoOpticsSeedQrProven = true;
  }

  if (!gridLattice.locked) {
    autoOpticsLockSince = 0;
    const recentDecode = Boolean(lastStreamDecodeAt && lastStreamDecodeAt >= autoOpticsAcquisitionSince && now - lastStreamDecodeAt < AUTO_OPTICS_RECENT_DECODE_MS);
    if (seededStartup) {
      if (autoOpticsSeedQrProven) {
        autoOpticsRuntimeState = "manual";
        autoOpticsControllerState = "HOLD";
        autoOpticsHeldYield = Math.max(0.35, autoOpticsHeldYield || 0);
        autoOpticsHoldSample = void 0;
        autoOpticsHoldCollapseSince = 0;
        autoOpticsRetryAt = Infinity;
        autoOpticsTuneSummary = "QR-proven short shutter retained through geometry reacquire";
        notePipelineEvent("auto-optics-motion-hold");
        return;
      }
      if (!recentDecode && now >= autoOpticsRescueRetryAt)
        void abandonAutomaticShortSeed(track);
    } else if (!recentDecode && now - autoOpticsAcquisitionSince >= AUTO_OPTICS_ACQUISITION_RESCUE_MS && now >= autoOpticsRescueRetryAt) {
      void rescueAutomaticQrAcquisition(track, now);
    }
    return;
  }

  // Break the AE/geometry deadlock immediately. Once even one QR decodes under
  // long photographic AE, preserve its measured light product but shorten the
  // shutter before asking the camera to sit still for calibration.
  if (autoOpticsRuntimeState === "ae" && lastStreamDecodeAt && now - lastStreamDecodeAt < AUTO_OPTICS_RECENT_DECODE_MS) {
    const aeSettings = track.getSettings();
    const aeExposure = Number(aeSettings.exposureTime);
    const aeIso = Number(aeSettings.iso);
    if (aeExposure > AUTO_OPTICS_SHORT_EXPOSURE_TRIGGER && aeIso > 0) {
      void applyAutomaticShortSeed(track, { exposure: aeExposure, iso: aeIso, at: now, neutral: true }, "QR found under long AE; motion-safe handoff");
      return;
    }
  }

  if (!autoOpticsPoseUsable(autoOpticsPoseSnapshot())) {''',
              'motion-safe seed protection and AE escape'
          )

          replace_once(
              '      enterGeometryRecovery("whole lattice timed out; fresh acquisition", now, true);',
              '      enterGeometryRecovery("whole lattice timed out; fresh acquisition", now, false);',
              'geometry reacquire keeps workers warm'
          )

          path.write_text(text)

          version = Path('version.js')
          vtext = version.read_text()
          old = 'export const APP_VERSION = "0.5.367";'
          if vtext.count(old) != 1:
              raise SystemExit('version.js: expected v0.5.367 exactly once')
          version.write_text(vtext.replace(old, 'export const APP_VERSION = "0.5.368";', 1))

          smoke = Path('benchmark/auto-optics-motion-policy-smoke.mjs')
          smoke.write_text(r'''import assert from "node:assert/strict";
import { readFile } from "node:fs/promises";

const source = await readFile(new URL("../receive/main.js", import.meta.url), "utf8");

assert.match(source, /const RECEIVER_RUNTIME_BUILD = APP_BUILD;/, "runtime diagnostics must use the centralized build version");
assert.match(source, /autoOpticsSeedQrProven = true;/, "a QR-decoding short shutter must become protected");
assert.match(source, /QR-proven short shutter retained through geometry reacquire/, "camera motion must preserve proven exposure");
assert.match(source, /QR found under long AE; motion-safe handoff/, "long AE must escape to a short shutter before stable-pose calibration");
assert.match(source, /AE re-metered recovery/, "brightness recovery must use AE as a meter, not a persistent scan mode");
assert.match(source, /touchesExposure && !touchesFocus/, "redundant exposure-only camera writes must be deduplicated");
assert.match(source, /enterGeometryRecovery\("whole lattice timed out; fresh acquisition", now, false\)/, "ordinary geometry reacquire must keep decoder workers warm");
assert.doesNotMatch(source, /const RECEIVER_RUNTIME_BUILD = "v0\.5\.361";/);
console.log("auto optics motion policy smoke: ok");
''')

          workflow = Path('.github/workflows/fast-regression.yml')
          wtext = workflow.read_text()
          old = '          node benchmark/optics-guard-smoke.mjs\n          node benchmark/version-source-smoke.mjs'
          new = '          node benchmark/optics-guard-smoke.mjs\n          node benchmark/auto-optics-motion-policy-smoke.mjs\n          node benchmark/version-source-smoke.mjs'
          if wtext.count(old) != 1:
              raise SystemExit('fast-regression.yml: insertion point not unique')
          workflow.write_text(wtext.replace(old, new, 1))
          PY

      - name: Run focused checks
        run: |
          set -euo pipefail
          node --input-type=module --check < receive/main.js
          node benchmark/grid-lattice-regression.mjs
          node benchmark/browser-performance-policy-smoke.mjs
          node benchmark/optics-guard-smoke.mjs
          node benchmark/auto-optics-motion-policy-smoke.mjs
          node benchmark/version-source-smoke.mjs

      - name: Commit v0.5.368
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-v0.5.368.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- receive/main.js version.js benchmark/auto-optics-motion-policy-smoke.mjs .github/workflows/fast-regression.yml .github/workflows/one-shot-v0.5.368.yml
          git commit -m "v0.5.368: keep QR-proven exposure through motion"
          git push origin HEAD:fix/auto-optics-motion-recovery
