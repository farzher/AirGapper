name: cleanup migration validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply cleanup migration
        run: |
          set -euo pipefail
          python3 .github/receiver_candidate.py
          if [ -f .github/receiver_cleanup_extra.py ]; then
            python3 .github/receiver_cleanup_extra.py
          fi
          git diff --check

      - name: Assert clean ownership
        run: |
          set -euo pipefail
          test -d codec/source
          test -f codec/airgapper_codec.js
          test -f codec/airgapper_codec.wasm
          test -f codec/scalar/airgapper_codec.js
          test -f codec/scalar/airgapper_codec.wasm
          test ! -e vendor/decimen-codec
          test ! -e vendor/decimen-codec-android
          if find . -path ./.git -prune -o -path ./.github/receiver_candidate.py -prune -o -iname '*decimen*' -print | grep -q .; then
            echo 'Historical Decimen path remains:'
            find . -path ./.git -prune -o -path ./.github/receiver_candidate.py -prune -o -iname '*decimen*' -print
            exit 1
          fi
          if grep -RIni --exclude-dir=.git --exclude='receiver_candidate.py' --exclude='*.wasm' --exclude='*.apk' 'decimen' .; then
            echo 'Historical Decimen text remains'
            exit 1
          fi

      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            codec/source/emsdk
            codec/source/third_party
            codec/source/build-simd
            codec/source/build-scalar
          key: airgapper-codec-emsdk-6.0.6-zxing-${{ hashFiles('codec/source/zxing-cpp.commit') }}

      - name: Build SIMD codec
        run: |
          set -euo pipefail
          AIRGAPPER_CODEC_SIMD=1 AIRGAPPER_CODEC_OUTPUT_DIR=.. codec/source/build.sh

      - name: Build scalar codec
        run: |
          set -euo pipefail
          AIRGAPPER_CODEC_SIMD=0 AIRGAPPER_CODEC_OUTPUT_DIR=../scalar codec/source/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run grid regression
        run: node benchmark/grid-lattice-regression.mjs

      - name: Install browser benchmark dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run production regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs
          node benchmark/corpus-suite.mjs

      - name: Build Android app
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug

      - name: Publish validated cleanup
        if: success() && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json benchmark/hardware-corpus-summary.json
          rm -f .github/receiver_candidate.py .github/receiver_candidate_message.txt .github/receiver_cleanup_extra.py
          rm -f .github/workflows/cleanup-validation.yml
          rm -f .github/ambiguity_erasures_patch.py .github/ambiguity_dense_fence.py
          rm -f .github/v268*.py .github/workflows/v268-*.yml
          rm -f benchmark/v268*-ci.log benchmark/v268*-pass.log
          git add -A
          git commit -m "v0.5.349 own AirGapper codec and simplify codebase"
          git push origin HEAD:"$HEAD_REF"
