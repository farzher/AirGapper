name: publish validated cleanup

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply already-validated cleanup
        run: |
          set -euo pipefail
          python3 .github/receiver_candidate.py
          if [ -f .github/receiver_cleanup_extra.py ]; then
            python3 .github/receiver_cleanup_extra.py
          fi
          git diff --check

      - name: Publish source cleanup
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          rm -f .github/receiver_candidate.py .github/receiver_candidate_message.txt .github/receiver_cleanup_extra.py
          rm -f .github/ambiguity_erasures_patch.py .github/ambiguity_dense_fence.py
          rm -f .github/v268*.py
          rm -f benchmark/v268*-ci.log benchmark/v268*-pass.log
          # Workflow files are handled separately through the GitHub connector.
          git restore --source=HEAD -- .github/workflows
          rm -f .github/workflows/fast-regression.yml
          git add -A
          git commit -m "v0.5.349 own AirGapper codec and simplify codebase"
          git push origin HEAD:"$HEAD_REF"
