name: Agent camera session v58
on:
  push:
    branches: [agent/camera-session-v58]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/camera-session-v58
      - name: Apply patch
        run: python3 .github/agent-camera-session-v58.py
      - name: Verify syntax
        run: |
          node --check receive/main.js
          node --check receive/grid-lattice.js
      - name: Verify invariants
        run: |
          grep -q 'id="camera-device"' index.html
          grep -q 'deviceId: { exact: preferredCameraDeviceId }' receive/main.js
          grep -q 'video.srcObject = null' receive/main.js
          grep -q 'validQuadObject' receive/main.js
          grep -q 'validPoints' receive/grid-lattice.js
          grep -q 'v0.5.58' index.html
          grep -q 'airgapper-static-js-v21' sw.js
      - name: Commit result
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/agent-camera-session-v58.py .github/workflows/agent-camera-session-v58.yml
          git add receive/main.js receive/grid-lattice.js index.html sw.js
          git commit -m "fix camera session isolation"
          git push origin HEAD:agent/camera-session-v58
# trigger
