name: v240 adaptive no-RS retry

on:
  push:
    paths:
      - .github/v240_adaptive_nors_retry.py
      - .github/workflows/v240-adaptive-nors-retry.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Apply candidate
        id: candidate
        run: |
          set -euo pipefail
          python3 .github/v240_adaptive_nors_retry.py 2>&1 | tee /tmp/v240-patch.log
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/decimen-codec/source/emsdk
            vendor/decimen-codec/source/third_party
            vendor/decimen-codec/source/build-simd
            vendor/decimen-codec/source/build-scalar
          key: decimen-emsdk-6.0.6-zxing-${{ hashFiles('vendor/decimen-codec/source/zxing-cpp.commit') }}

      - name: Build codecs
        run: |
          set -euo pipefail
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v240-build-simd.log
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/v240-build-scalar.log

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run unchanged receiver benchmark
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/v240-regression.log

      - name: Correctness gate
        run: |
          node <<'NODE' 2>&1 | tee /tmp/v240-gate.log
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('benchmark/latest-result.json','utf8')).scenarios;
          const after=JSON.parse(fs.readFileSync('benchmark/offline-summary.json','utf8')).scenarios;
          const med=(x,k)=>Number(x?.trialMedians?.[k] ?? x?.normalized?.[k] ?? 0);
          const problems=[], rows={};
          for(const name of ['stable-y8','motion-y8','dense-y8','optical-dense-y8','camera-dense-y8']){
            const b=before[name],a=after[name], by=med(b,'guidedOutputYield'),ay=med(a,'guidedOutputYield');
            const gb=med(b,'guidedMsPerOutput'),ga=med(a,'guidedMsPerOutput');
            rows[name]={yieldBefore:by,yieldAfter:ay,cpuBefore:gb,cpuAfter:ga,noRS:[a.guided?.sparseNoRsSuccesses||0,a.guided?.sparseNoRsAttempts||0]};
            if(ay < by-(name==='motion-y8'?0.03:0.02)) problems.push(`${name} output yield regressed`);
            if(a.tailFullJobs!==0) problems.push(`${name} stable tail used full scans`);
            if(gb>0 && ga>gb*1.25) problems.push(`${name} CPU regressed >25%`);
          }
          for(const name of ['motion-y8','optical-dense-y8','camera-dense-y8']) if(after[name].finalState!=='TRACK') problems.push(`${name} ended in ${after[name].finalState}`);
          console.log(JSON.stringify({note:'hardware handheld motion is the performance target; benchmark is correctness/regression only',scenarios:rows},null,2));
          if(problems.length) throw new Error(problems.join('; '));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgapper-v240-adaptive-nors-retry-${{ github.sha }}
          path: benchmark/offline-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Promote passing candidate
        if: success()
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/v240_adaptive_nors_retry.py .github/workflows/v240-adaptive-nors-retry.yml
          git add vendor/decimen-codec/source/wrapper/decimen_codec.cpp vendor/decimen-codec/source/VERSION \
                  vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
                  vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm \
                  receive/main.js main.js index.html sw.js benchmark/latest-result.json
          git commit -m "v0.5.240 adapt no-RS ordering for handheld optics"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Record rejection
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "v240 adaptive no-RS retry rejected at $(date -u +%FT%TZ)"
            cat /tmp/v240-patch.log 2>/dev/null || true
            cat /tmp/v240-gate.log 2>/dev/null || true
            tail -n 200 /tmp/v240-build-simd.log 2>/dev/null || true
            tail -n 200 /tmp/v240-build-scalar.log 2>/dev/null || true
            tail -n 500 /tmp/v240-regression.log 2>/dev/null || true
          } > benchmark/v240-adaptive-nors-retry-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add benchmark/v240-adaptive-nors-retry-ci.log
          git rm .github/v240_adaptive_nors_retry.py .github/workflows/v240-adaptive-nors-retry.yml
          git commit -m "record v240 adaptive no-RS retry rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
