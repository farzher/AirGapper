name: Move Y extraction into workers
on:
  push:
    branches: [agent/worker-y-plane]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/worker-y-plane
          fetch-depth: 0
      - name: Move VideoFrame crop copies off the main thread
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          main_path = Path('receive/main.js')
          s = main_path.read_text()
          old_helper = '''function openDirectLumaFrame(source) {\n  const frame = source.videoFrame;\n  if (source.image || captureNextScan || opticalSampleDue(source) || !frame || !DIRECT_LUMA_FORMATS.has(frame.format)) return null;\n  return frame;\n}\nasync function copyDirectLumaCrop(frame, x, y, w, h) {\n  try {\n    const rect = { x, y, width: w, height: h };\n    const buffer = new ArrayBuffer(frame.allocationSize({ rect }));\n    const planes = await frame.copyTo(buffer, { rect });\n    const yPlane = planes[0];\n    if (!yPlane || yPlane.stride < w) return null;\n    const payloadBytes = yPlane.offset + (h - 1) * yPlane.stride + w;\n    if (payloadBytes > buffer.byteLength) return null;\n    return { buffer, yOffset: yPlane.offset, yStride: yPlane.stride, payloadBytes };\n  } catch {\n    return null;\n  }\n}\n'''
          new_helper = '''function cloneDirectLumaFrame(source) {\n  const frame = source.videoFrame;\n  if (source.image || captureNextScan || opticalSampleDue(source) || !frame || !DIRECT_LUMA_FORMATS.has(frame.format)) return null;\n  try {\n    return frame.clone();\n  } catch {\n    return null;\n  }\n}\n'''
          s = replace_once(s, old_helper, new_helper, 'direct luma helper')

          old_lane = '''        let laneImage;\n        let laneLuma;\n        const laneFrame = openDirectLumaFrame(source);\n        if (laneFrame) laneLuma = await copyDirectLumaCrop(laneFrame, x, y, w, h);\n        if (!laneLuma) {\n          laneImage = readBoundedVideoCrop(source, x, y, w, h);\n          if (laneJobsSubmitted === 0) inspectStaticQrOptics(source, laneImage, x, y);\n        }\n        const id = frameId++;\n        const laneBuffer = laneLuma ? laneLuma.buffer : laneImage.data.buffer;\n        const laneMessage = laneLuma\n          ? { id, buf: laneBuffer, w, h, ox: x, oy: y, full: false, tracks: group.tracks, pixelFormat: "y8", yOffset: laneLuma.yOffset, yStride: laneLuma.yStride, payloadBytes: laneLuma.payloadBytes }\n          : { id, buf: laneBuffer, w, h, ox: x, oy: y, full: false, tracks: group.tracks };\n        cropAttempts.set(id, group.regions.map((region) => ({ region, quad: region.quad })));\n        const accepted = submitReceiverJob(\n          laneMessage,\n          [laneBuffer],\n          laneLuma ? "Y8 TRACKED GRID" : "NATIVE TRACKED GRID",\n'''
          new_lane = '''        let laneImage;\n        const laneFrame = cloneDirectLumaFrame(source);\n        if (!laneFrame) {\n          laneImage = readBoundedVideoCrop(source, x, y, w, h);\n          if (laneJobsSubmitted === 0) inspectStaticQrOptics(source, laneImage, x, y);\n        }\n        const id = frameId++;\n        const laneMessage = laneFrame\n          ? { id, videoFrame: laneFrame, cropX: x, cropY: y, w, h, ox: x, oy: y, full: false, tracks: group.tracks, pixelFormat: "y8", payloadBytes: w * h }\n          : { id, buf: laneImage.data.buffer, w, h, ox: x, oy: y, full: false, tracks: group.tracks };\n        const laneTransfer = laneFrame ? [laneFrame] : [laneImage.data.buffer];\n        cropAttempts.set(id, group.regions.map((region) => ({ region, quad: region.quad })));\n        const accepted = submitReceiverJob(\n          laneMessage,\n          laneTransfer,\n          laneFrame ? "Y8 TRACKED GRID" : "NATIVE TRACKED GRID",\n'''
          s = replace_once(s, old_lane, new_lane, 'lane worker frame path')
          s = replace_once(s, '''        if (!accepted) {\n          cropAttempts.delete(id);\n          continue;\n        }\n''', '''        if (!accepted) {\n          laneFrame?.close();\n          cropAttempts.delete(id);\n          continue;\n        }\n''', 'lane rejection cleanup')

          old_shared = '''      let shared;\n      let sharedLuma;\n      if (healthyGrid) {\n        const sharedFrame = openDirectLumaFrame(source);\n        if (sharedFrame) sharedLuma = await copyDirectLumaCrop(sharedFrame, x, y, w, h);\n      }\n      if (!sharedLuma) {\n        shared = readBoundedVideoCrop(source, x, y, w, h);\n        inspectStaticQrOptics(source, shared, x, y);\n        captureSubmittedScan(shared, x, y, false, batchTracks.map((track) => track.quad));\n      }\n      if (healthyGrid) {\n        activeDecodeBudget = batchTracks.length;\n        const id2 = frameId++;\n        const sharedBuffer = sharedLuma ? sharedLuma.buffer : shared.data.buffer;\n        const sharedMessage = sharedLuma\n          ? { id: id2, buf: sharedBuffer, w, h, ox: x, oy: y, full: false, tracks: batchTracks, pixelFormat: "y8", yOffset: sharedLuma.yOffset, yStride: sharedLuma.yStride, payloadBytes: sharedLuma.payloadBytes }\n          : { id: id2, buf: sharedBuffer, w, h, ox: x, oy: y, full: false, tracks: batchTracks };\n        cropAttempts.set(id2, batchRegions.map((region) => ({ region, quad: region.quad })));\n        if (!submitReceiverJob(\n          sharedMessage,\n          [sharedBuffer],\n          sharedLuma ? "Y8 TRACKED GRID" : "NATIVE TRACKED GRID",\n'''
          new_shared = '''      let shared;\n      const sharedFrame = healthyGrid ? cloneDirectLumaFrame(source) : null;\n      if (!sharedFrame) {\n        shared = readBoundedVideoCrop(source, x, y, w, h);\n        inspectStaticQrOptics(source, shared, x, y);\n        captureSubmittedScan(shared, x, y, false, batchTracks.map((track) => track.quad));\n      }\n      if (healthyGrid) {\n        activeDecodeBudget = batchTracks.length;\n        const id2 = frameId++;\n        const sharedMessage = sharedFrame\n          ? { id: id2, videoFrame: sharedFrame, cropX: x, cropY: y, w, h, ox: x, oy: y, full: false, tracks: batchTracks, pixelFormat: "y8", payloadBytes: w * h }\n          : { id: id2, buf: shared.data.buffer, w, h, ox: x, oy: y, full: false, tracks: batchTracks };\n        const sharedTransfer = sharedFrame ? [sharedFrame] : [shared.data.buffer];\n        cropAttempts.set(id2, batchRegions.map((region) => ({ region, quad: region.quad })));\n        if (!submitReceiverJob(\n          sharedMessage,\n          sharedTransfer,\n          sharedFrame ? "Y8 TRACKED GRID" : "NATIVE TRACKED GRID",\n'''
          s = replace_once(s, old_shared, new_shared, 'shared worker frame path')
          s = replace_once(s, '''        )) {\n          cropAttempts.delete(id2);\n          poolBusyTimes.push(now);\n''', '''        )) {\n          sharedFrame?.close();\n          cropAttempts.delete(id2);\n          poolBusyTimes.push(now);\n''', 'shared rejection cleanup')
          main_path.write_text(s)

          worker_path = Path('receive/worker.js')
          w = worker_path.read_text()
          w = replace_once(w,
            'const { id, buf, w = 0, h = 0, ox = 0, oy = 0, full = true, quad, dim, tracks, isolated = false, oracle = false, oracleSeeds = [], sentAt, pixelFormat = "rgba", yOffset = 0, yStride = 0, payloadBytes = 0 } = e.data;',
            'const { id, buf, videoFrame, cropX = 0, cropY = 0, w = 0, h = 0, ox = 0, oy = 0, full = true, quad, dim, tracks, isolated = false, oracle = false, oracleSeeds = [], sentAt, pixelFormat = "rgba", yOffset: messageYOffset = 0, yStride: messageYStride = 0, payloadBytes = 0 } = e.data;',
            'worker message destructure')
          old_input = '''  let readFullAttempts = 0;\n  try {\n    const yRowStride = yStride || w;\n    const byteLength = pixelFormat === "y8" ? Math.min(buf.byteLength, payloadBytes || yOffset + Math.max(0, h - 1) * yRowStride + w) : buf.byteLength;\n    const pixels = new Uint8Array(buf, 0, byteLength);\n    const zx = await ready;\n'''
          new_input = '''  let readFullAttempts = 0;\n  let ownedVideoFrame = videoFrame;\n  try {\n    let yOffset = messageYOffset;\n    let yRowStride = messageYStride || w;\n    let pixels;\n    if (ownedVideoFrame) {\n      const rect = { x: cropX, y: cropY, width: w, height: h };\n      const frameBuffer = new ArrayBuffer(ownedVideoFrame.allocationSize({ rect }));\n      const planes = await ownedVideoFrame.copyTo(frameBuffer, { rect });\n      const yPlane = planes[0];\n      if (!yPlane || yPlane.stride < w) throw new Error("Camera frame has no usable Y plane");\n      yOffset = yPlane.offset;\n      yRowStride = yPlane.stride;\n      const byteLength = yOffset + Math.max(0, h - 1) * yRowStride + w;\n      if (byteLength > frameBuffer.byteLength) throw new Error("Camera Y plane is truncated");\n      pixels = new Uint8Array(frameBuffer, 0, byteLength);\n      ownedVideoFrame.close();\n      ownedVideoFrame = null;\n    } else {\n      const byteLength = pixelFormat === "y8" ? Math.min(buf.byteLength, payloadBytes || yOffset + Math.max(0, h - 1) * yRowStride + w) : buf.byteLength;\n      pixels = new Uint8Array(buf, 0, byteLength);\n    }\n    const zx = await ready;\n'''
          w = replace_once(w, old_input, new_input, 'worker-side frame copy')
          # Ensure a transferred frame is released even when copy/decode throws.
          catch_marker = '''  } catch (error) {\n    ctx.postMessage({\n'''
          if catch_marker not in w: raise SystemExit('worker catch marker missing')
          w = w.replace(catch_marker, '''  } catch (error) {\n    ownedVideoFrame?.close();\n    ownedVideoFrame = null;\n    ctx.postMessage({\n''', 1)
          worker_path.write_text(w)

          # Temporary workflow never belongs in the result.
          Path('.github/workflows/worker-y-plane.yml').unlink()
          try: Path('.github/workflows').rmdir(); Path('.github').rmdir()
          except OSError: pass
          PY
          node --check receive/main.js
          node --check receive/worker.js
          grep -q 'videoFrame: laneFrame' receive/main.js
          grep -q 'ownedVideoFrame.copyTo' receive/worker.js
          ! grep -q 'copyDirectLumaCrop' receive/main.js
      - name: Commit result
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "move Y-plane extraction into decode workers"
          git push --force origin HEAD:agent/worker-y-plane-result
