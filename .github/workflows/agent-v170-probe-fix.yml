name: Agent v170 weak probe preservation
on:
  push:
    paths:
      - '.github/v170_probe_fix.py'
      - '.github/workflows/agent-v170-probe-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v170_probe_fix.py
      - name: Smoke check
        run: |
          node --check receive/main.js
          git diff --check
          grep -q 'const dueWeak = excluded.filter' receive/main.js
          grep -q 'SLOT_WEAK_PROBE_EVERY) % dueWeak.length' receive/main.js
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add receive/main.js
          git commit -m 'v0.5.170 preserve weak-slot recovery probes'
          git push origin master
