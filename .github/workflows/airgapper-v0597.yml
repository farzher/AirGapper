name: AirGapper v0.5.97 motion-warped exact sampler

on:
  push:
    paths:
      - .github/workflows/airgapper-v0597.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.5.97 source patch
        run: python3 tools/apply_v0597.py

      - name: Validate JavaScript
        run: |
          node --check receive/main.js
          node --check receive/worker.js
          node --check shared/worker-pool.js
          node --check main.js

      - name: Build SIMD codec
        run: |
          cd vendor/decimen-codec/source
          ./build.sh

      - name: Build scalar codec
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android ./build.sh

      - name: Keep only product build artifacts
        run: |
          git checkout HEAD -- vendor/decimen-codec/source/build-simd vendor/decimen-codec/source/build-scalar

      - name: Validate generated JavaScript
        run: |
          node --check vendor/decimen-codec/decimen_codec.js
          node --check vendor/decimen-codec-android/decimen_codec.js

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/airgapper-v0597.yml tools/apply_v0597.py
          git config user.name 'AirGapper Build'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'warp exact sampler with tracked geometry'
          git push origin HEAD:master
