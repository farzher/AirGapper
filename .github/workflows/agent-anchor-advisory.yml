name: Agent anchor advisory build
on:
  push:
    branches: [agent/anchor-advisory-v2]
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/anchor-advisory-v2
      - name: Apply patch
        run: python3 .github/agent-anchor-advisory.py
      - name: Verify JS syntax
        run: |
          node --check receive/main.js
          node --check receive/worker.js
      - name: Rebuild SIMD codec
        run: |
          cd vendor/decimen-codec/source
          ./build.sh
      - name: Rebuild scalar codec
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=OFF ./build.sh android
      - name: Verify invariants
        run: |
          grep -q 'anchorBypassAttempts' receive/worker.js
          grep -q 'Anchor bypass CRC' receive/main.js
          grep -q 'setTrackedDecoderFallbackBudget(nativeBatchHandle, 0)' receive/worker.js
          grep -q 'v0.5.55' index.html
      - name: Commit result
        run: |
          rm -f .github/agent-anchor-advisory.py .github/workflows/agent-anchor-advisory.yml
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'make tracked anchor advisory'
          git push origin HEAD:agent/anchor-advisory-v2
