name: Agent v172 comment fix
on:
  push:
    paths:
      - '.github/v172_comment_fix.py'
      - '.github/workflows/agent-v172-comment-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v172_comment_fix.py
      - name: Smoke check
        run: |
          node --check receive/main.js
          git diff --check
          grep -q 'Remembered ISO is deliberately not used before first lock' receive/main.js
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add receive/main.js
          git commit -m 'v0.5.172 document cold acquisition behavior'
          git push origin master
