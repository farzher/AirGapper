name: apply v0.5.350 fixes

on:
  push:
    branches: [fix/receiver-restart-camera-install]
    paths:
      - .github/apply-v350-fixes.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/receiver-restart-camera-install
          fetch-depth: 1

      - name: Apply fixes
        run: python3 .github/apply-v350-fixes.py

      - name: Validate source
        run: |
          set -euo pipefail
          node --check main.js
          node --check send/main.js
          node --check receive/main.js
          git diff --check
          grep -q 'versionCode 350' android/app/build.gradle
          grep -q 'versionName "0.5.350"' android/app/build.gradle
          grep -q '2560, 1440' receive/main.js
          grep -q 'isAndroidApp() ||' receive/main.js
          grep -q 'transferFinalizing = false;' receive/main.js

      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "AirGapper Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js index.html sw.js send/main.js receive/main.js android/app/build.gradle
          git commit -m "v0.5.350 fix receiver restart and install UI"
          git push origin HEAD:fix/receiver-restart-camera-install
