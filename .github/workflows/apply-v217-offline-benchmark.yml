name: fast receiver regression

on:
  push:
    paths:
      - receive/**
      - shared/**
      - codec/**
      - vendor/decimen-codec/**
      - vendor/decimen-codec-android/**
      - send/main.js
      - main.js
      - index.html
      - sw.js
      - benchmark/offline-runner.mjs
      - benchmark/grid-lattice-regression.mjs
      - benchmark/run-agcap.mjs
      - benchmark/corpus-suite.mjs
      - benchmark/corpora/**
      - .github/receiver_candidate.py
      - .github/receiver_candidate_message.txt
      - .github/workflows/apply-v217-offline-benchmark.yml
  workflow_dispatch:

permissions: { contents: write }

concurrency:
  group: fast-receiver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Apply receiver candidate
        id: candidate
        run: |
          set -euo pipefail
          if [ -f .github/receiver_candidate.py ]; then
            python3 .github/receiver_candidate.py 2>&1 | tee /tmp/receiver-candidate-patch.log
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            if git diff --quiet -- codec/source vendor/decimen-codec/source; then
              echo 'codec_changed=false' >> "$GITHUB_OUTPUT"
            else
              echo 'codec_changed=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'codec_changed=false' >> "$GITHUB_OUTPUT"
          fi
          git diff --check

      - name: Cache codec toolchain
        if: steps.candidate.outputs.codec_changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            codec/source/emsdk
            codec/source/third_party
            codec/source/build-simd
            codec/source/build-scalar
            vendor/decimen-codec/source/emsdk
            vendor/decimen-codec/source/third_party
            vendor/decimen-codec/source/build-simd
            vendor/decimen-codec/source/build-scalar
          key: airgapper-codec-emsdk-6.0.6-zxing-${{ hashFiles('codec/source/zxing-cpp.commit', 'vendor/decimen-codec/source/zxing-cpp.commit') }}

      - name: Build SIMD and scalar codecs
        if: steps.candidate.outputs.codec_changed == 'true'
        run: |
          set -euo pipefail
          if [ -d codec/source ]; then
            AIRGAPPER_CODEC_SIMD=1 AIRGAPPER_CODEC_OUTPUT_DIR=.. codec/source/build.sh 2>&1 | tee /tmp/receiver-build-simd.log
            AIRGAPPER_CODEC_SIMD=0 AIRGAPPER_CODEC_OUTPUT_DIR=../scalar codec/source/build.sh 2>&1 | tee /tmp/receiver-build-scalar.log
          else
            DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/receiver-build-simd.log
            DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android vendor/decimen-codec/source/build.sh 2>&1 | tee /tmp/receiver-build-scalar.log
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Run grid lattice regression
        run: node benchmark/grid-lattice-regression.mjs

      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run production regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/receiver-regression.log
          node benchmark/corpus-suite.mjs 2>&1 | tee /tmp/hardware-corpus.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgapper-fast-regression-${{ github.sha }}
          path: |
            benchmark/offline-summary.json
            benchmark/hardware-corpus-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Promote passing candidate
        if: success() && steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json benchmark/hardware-corpus-summary.json
          MESSAGE="$(cat .github/receiver_candidate_message.txt 2>/dev/null || echo 'promote receiver candidate')"
          rm -f .github/receiver_candidate.py .github/receiver_candidate_message.txt
          rm -f .github/ambiguity_erasures_patch.py .github/ambiguity_dense_fence.py
          rm -f .github/v268*.py .github/workflows/v268-*.yml
          rm -f benchmark/v268*-ci.log benchmark/v268*-pass.log
          git add -A
          git commit -m "$MESSAGE"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Record normal regression
        if: success() && steps.candidate.outputs.changed != 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json benchmark/hardware-corpus-summary.json
          git add benchmark/latest-result.json
          if ! git diff --cached --quiet; then
            git commit -m "record latest fast receiver regression"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Record candidate rejection
        if: failure() && steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "receiver candidate rejected at $(date -u +%FT%TZ)"
            cat /tmp/receiver-candidate-patch.log 2>/dev/null || true
            tail -n 180 /tmp/receiver-build-simd.log 2>/dev/null || true
            tail -n 180 /tmp/receiver-build-scalar.log 2>/dev/null || true
            tail -n 500 /tmp/receiver-regression.log 2>/dev/null || true
            tail -n 300 /tmp/hardware-corpus.log 2>/dev/null || true
          } > benchmark/receiver-candidate-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          rm -f .github/receiver_candidate.py .github/receiver_candidate_message.txt
          rm -f .github/ambiguity_erasures_patch.py .github/ambiguity_dense_fence.py
          rm -f .github/v268*.py .github/workflows/v268-*.yml
          git add -A benchmark/receiver-candidate-ci.log .github
          git commit -m "record receiver candidate rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
