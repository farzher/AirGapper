name: fast receiver regression

on:
  push:
    paths:
      - receive/**
      - shared/**
      - vendor/decimen-codec/**
      - vendor/decimen-codec-android/**
      - send/main.js
      - main.js
      - index.html
      - sw.js
      - benchmark/offline-runner.mjs
      - .github/camera_regression_patch.py
      - .github/benchmark_lock_semantics_patch.py
      - .github/workflows/apply-v217-offline-benchmark.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply benchmark infrastructure updates
        id: candidate
        run: |
          set -euo pipefail
          changed=false
          if [ -f .github/camera_regression_patch.py ] && ! grep -q 'optical-dense-y8' benchmark/offline-runner.mjs; then
            python3 .github/camera_regression_patch.py 2>&1 | tee /tmp/camera-patch.log
            changed=true
          fi
          if [ -f .github/benchmark_lock_semantics_patch.py ] && ! grep -q 'lockTriggerSourceFrame' receive/main.js; then
            python3 .github/benchmark_lock_semantics_patch.py 2>&1 | tee /tmp/lock-patch.log
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run production regression
        id: regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node benchmark/offline-runner.mjs 2>&1 | tee /tmp/regression.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgapper-fast-regression-${{ github.sha }}
          path: benchmark/offline-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit benchmark infrastructure update
        if: success() && steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          [ ! -f .github/camera_regression_patch.py ] || git rm .github/camera_regression_patch.py
          [ ! -f .github/benchmark_lock_semantics_patch.py ] || git rm .github/benchmark_lock_semantics_patch.py
          git add benchmark/offline-runner.mjs receive/main.js benchmark/latest-result.json
          git commit -m "add camera-realistic receiver regression"
          git push origin HEAD:master

      - name: Record normal regression
        if: success() && steps.candidate.outputs.changed != 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git add benchmark/latest-result.json
          git diff --cached --quiet || (git commit -m "record latest fast receiver regression" && git push origin HEAD:master)

      - name: Record regression failure
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "camera benchmark failed at $(date -u +%FT%TZ)"
            echo "candidate changed=${{ steps.candidate.outputs.changed }}"
            cat /tmp/camera-patch.log 2>/dev/null || true
            cat /tmp/lock-patch.log 2>/dev/null || true
            tail -n 320 /tmp/regression.log 2>/dev/null || true
            tail -n 100 /tmp/airgapper-http.log 2>/dev/null || true
          } > benchmark/camera-regression-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add benchmark/camera-regression-ci.log
          git commit -m "record camera regression setup failure"
          git push origin HEAD:master
          exit 1
