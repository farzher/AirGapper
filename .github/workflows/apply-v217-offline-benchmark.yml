name: fast receiver regression

on:
  push:
    paths:
      - receive/**
      - shared/**
      - vendor/decimen-codec/**
      - vendor/decimen-codec-android/**
      - send/main.js
      - main.js
      - index.html
      - sw.js
      - benchmark/offline-runner.mjs
      - .github/camera_regression_patch.py
      - .github/workflows/apply-v217-offline-benchmark.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply camera-realistic benchmark update
        id: candidate
        run: |
          set -euo pipefail
          if [ -f .github/camera_regression_patch.py ] && ! grep -q 'camera-dense-y8' benchmark/offline-runner.mjs; then
            python3 .github/camera_regression_patch.py
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run production regression
        id: regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node benchmark/offline-runner.mjs 2>&1 | tee /tmp/regression.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgapper-fast-regression-${{ github.sha }}
          path: benchmark/offline-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit camera benchmark update
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/camera_regression_patch.py
          git add benchmark/offline-runner.mjs benchmark/latest-result.json
          git commit -m "add camera-realistic dense receiver regression"
          git push origin HEAD:master

      - name: Record normal regression
        if: steps.candidate.outputs.changed != 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git add benchmark/latest-result.json
          git diff --cached --quiet || (git commit -m "record latest fast receiver regression" && git push origin HEAD:master)
