name: fast receiver regression

on:
  push:
    paths:
      - receive/**
      - shared/**
      - vendor/decimen-codec/**
      - vendor/decimen-codec-android/**
      - send/main.js
      - main.js
      - index.html
      - sw.js
      - benchmark/offline-runner.mjs
      - .github/repeated_trials_patch.py
      - .github/workflows/apply-v217-offline-benchmark.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply median-trial benchmark update
        id: candidate
        run: |
          set -euo pipefail
          if [ -f .github/repeated_trials_patch.py ] && ! grep -q 'selectMedianTrial' benchmark/offline-runner.mjs; then
            python3 .github/repeated_trials_patch.py 2>&1 | tee /tmp/trials-patch.log
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Prepare Chrome
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run production regression
        id: regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/regression.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgapper-fast-regression-${{ github.sha }}
          path: benchmark/offline-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit median-trial benchmark
        if: success() && steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/repeated_trials_patch.py
          git add benchmark/offline-runner.mjs benchmark/latest-result.json
          git commit -m "use median trials for receiver performance regression"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Record normal regression
        if: success() && steps.candidate.outputs.changed != 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git add benchmark/latest-result.json
          if ! git diff --cached --quiet; then
            git commit -m "record latest fast receiver regression"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Record benchmark failure
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "median benchmark failed at $(date -u +%FT%TZ)"
            cat /tmp/trials-patch.log 2>/dev/null || true
            tail -n 420 /tmp/regression.log 2>/dev/null || true
          } > benchmark/median-trials-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add benchmark/median-trials-ci.log
          git commit -m "record median benchmark rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
