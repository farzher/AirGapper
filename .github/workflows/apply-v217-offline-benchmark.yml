name: v217 offline benchmark build

on:
  push:
    paths:
      - .github/v217_offline_patch.py
      - benchmark/offline-runner.mjs
      - .github/workflows/apply-v217-offline-benchmark.yml

permissions:
  contents: write

jobs:
  apply-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.5.217 offline benchmark harness
        run: |
          set -euo pipefail
          python3 .github/v217_offline_patch.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install headless browser
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run deterministic production receiver benchmark
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node benchmark/offline-runner.mjs
          echo '--- offline summary ---'
          cat benchmark/offline-summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: airgapper-v217-offline-benchmark
          path: benchmark/offline-summary.json
          retention-days: 14

      - name: Commit v0.5.217
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          rm -rf node_modules benchmark/offline-summary.json
          rm -f .github/v217_offline_patch.py .github/workflows/apply-v217-offline-benchmark.yml
          git add -A
          git commit -m "v0.5.217 add deterministic offline receiver benchmark"
          git push origin HEAD:master
