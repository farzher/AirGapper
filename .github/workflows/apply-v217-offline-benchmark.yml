name: fast receiver regression

on:
  push:
    paths:
      - receive/**
      - shared/**
      - vendor/decimen-codec/**
      - vendor/decimen-codec-android/**
      - send/main.js
      - main.js
      - index.html
      - benchmark/offline-runner.mjs
      - .github/v223_fast_metrics_patch.py
      - .github/workflows/apply-v217-offline-benchmark.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Add detailed fast-path metrics
        id: metrics
        run: |
          set -euo pipefail
          if ! grep -q 'dataOnlyAttempts: sumGuided' receive/main.js; then
            python3 .github/v223_fast_metrics_patch.py
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare runner Chrome
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          google-chrome --version

      - name: Run production-only receiver regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node benchmark/offline-runner.mjs
          echo '--- fast regression summary ---'
          cat benchmark/offline-summary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgapper-fast-regression-${{ github.sha }}
          path: benchmark/offline-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit one-run v222 measurements
        if: steps.metrics.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/v222-result.json
          rm -f benchmark/v222-ci.log
          rm -rf node_modules benchmark/offline-summary.json
          git add receive/main.js benchmark/v222-result.json
          git add -u benchmark/v222-ci.log || true
          git commit -m "record v222 stable-path measurements"
          git push origin HEAD:master
