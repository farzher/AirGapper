name: fast receiver regression

on:
  push:
    paths:
      - receive/**
      - shared/**
      - vendor/decimen-codec/**
      - vendor/decimen-codec-android/**
      - send/main.js
      - main.js
      - index.html
      - benchmark/offline-runner.mjs
      - .github/workflows/apply-v217-offline-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare runner Chrome
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          google-chrome --version

      - name: Run production-only receiver regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node benchmark/offline-runner.mjs
          echo '--- fast regression summary ---'
          cat benchmark/offline-summary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgapper-fast-regression-${{ github.sha }}
          path: benchmark/offline-summary.json
          if-no-files-found: ignore
          retention-days: 14
