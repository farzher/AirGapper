name: v217 fast receiver regression

on:
  push:
    paths:
      - receive/**
      - shared/**
      - vendor/decimen-codec/**
      - vendor/decimen-codec-android/**
      - send/main.js
      - main.js
      - index.html
      - benchmark/offline-runner.mjs
      - .github/v217_offline_patch.py
      - .github/workflows/apply-v217-offline-benchmark.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Apply initial v0.5.217 regression harness
        id: bootstrap
        run: |
          set -euo pipefail
          if grep -q 'RECEIVER_RUNTIME_BUILD = "v0.5.216"' receive/main.js; then
            python3 .github/v217_offline_patch.py
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare runner Chrome
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          google-chrome --version

      - name: Run fast production receiver regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node benchmark/offline-runner.mjs
          echo '--- fast regression summary ---'
          cat benchmark/offline-summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: airgapper-fast-regression-${{ github.sha }}
          path: benchmark/offline-summary.json
          retention-days: 14

      - name: Commit initial v0.5.217 harness
        if: steps.bootstrap.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          rm -rf node_modules benchmark/offline-summary.json
          git add index.html main.js receive/main.js sw.js benchmark/offline-runner.mjs
          git commit -m "v0.5.217 add fast offline receiver regression"
          git push origin HEAD:master
