name: apply v358 CI fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'verify/v357-green'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Apply and clean staging patch
        run: |
          set -euo pipefail
          python3 .github/apply-v358-ci-fix.py
          rm -f .github/apply-v358-ci-fix.py .github/workflows/apply-v358-ci-fix.yml
          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.5.358 keep native CRC proof out of recovery"
          git push origin HEAD:${{ github.head_ref }}
