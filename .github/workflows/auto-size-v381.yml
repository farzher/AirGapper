name: add Auto QR size optimization

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/auto-size-v381.yml

concurrency:
  group: auto-size-v381
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply Auto Size
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-auto-size-v381.py
          grep -q 'new Option("Auto", "auto"' send/main.js
          grep -q 'autoSize: optimizeSize' send/main.js
          grep -q 'APP_VERSION = "0.5.381"' version.js
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/auto-size-v381.yml .github/scripts/apply-auto-size-v381.py
          git add send/main.js index.html version.js
          git commit -m "v0.5.381: add Auto QR size optimization"
          git push origin HEAD:master
