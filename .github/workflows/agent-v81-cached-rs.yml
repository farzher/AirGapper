name: Agent v81 cached RS
on:
  push:
    branches: [agent/v81-cached-rs]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v81-cached-rs
      - name: Apply patch
        shell: bash
        run: python3 .github/agent-v81-patch.py
      - name: Build SIMD codec
        shell: bash
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. ./build.sh
      - name: Build scalar codec
        shell: bash
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android ./build.sh
      - name: Commit build
        shell: bash
        run: |
          rm .github/workflows/agent-v81-cached-rs.yml .github/agent-v81-patch.py
          git checkout HEAD -- vendor/decimen-codec/source/build-simd vendor/decimen-codec/source/build-scalar || true
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js receive/worker.js sw.js vendor/decimen-codec vendor/decimen-codec-android .github/workflows/agent-v81-cached-rs.yml .github/agent-v81-patch.py
          git commit -m 'use cached matrix correction without calibration churn'
          git push origin HEAD:agent/v81-cached-rs