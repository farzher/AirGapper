name: prune stale branches

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/branch-prune.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete all branches except master and airgrid-rs
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              grep -vE '^(master|airgrid-rs)$' || true
          )
          echo "Deleting ${#branches[@]} stale branches"
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch"
          done

      - name: Remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/branch-prune.yml
          git commit -m "remove branch cleanup workflow"
          git push origin HEAD:master
