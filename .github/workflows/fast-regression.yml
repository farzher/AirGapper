name: fast regression

on:
  push:
    paths:
      - receive/**
      - send/**
      - shared/**
      - codec/**
      - android/**
      - main.js
      - index.html
      - sw.js
      - benchmark/**
      - .github/workflows/fast-regression.yml
  pull_request:
    branches: [master]
    paths:
      - receive/**
      - send/**
      - shared/**
      - codec/**
      - android/**
      - main.js
      - index.html
      - sw.js
      - benchmark/**
      - .github/workflows/fast-regression.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-camera-v2:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/apk-camera-v2') || (github.event_name == 'pull_request' && github.head_ref == 'feature/apk-camera-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apk-camera-v2
          fetch-depth: 1
      - name: Repair bounded native-v2 receiver block
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('receive/main.js')
          text = path.read_text()
          start_marker = 'function nativeV2PreviewBounds(quad) {\\n'
          end_marker = '   // Y8 share this ArrayBuffer'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          repaired = text[start:end].replace('\\n', '\n')
          text = text[:start] + repaired + text[end:]
          path.write_text(text)
          PY

          git fetch origin master --depth=1
          git checkout origin/master -- .github/workflows/fast-regression.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/fast-regression.yml')
          text = path.read_text()
          needle = "      - name: Run grid regression\n"
          syntax = """      - name: Check JavaScript syntax\n        run: |\n          set -euo pipefail\n          node --input-type=module --check < main.js\n          node --input-type=module --check < receive/main.js\n          node --input-type=module --check < shared/native-camera-v2.js\n\n"""
          if syntax not in text:
              text = text.replace(needle, syntax + needle, 1)
          path.write_text(text)
          PY

          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receive/main.js .github/workflows/fast-regression.yml
          git commit -m "fix Camera2 native receiver integration"
          git push origin HEAD:feature/apk-camera-v2

  regression:
    if: github.ref != 'refs/heads/feature/apk-camera-v2' && github.head_ref != 'feature/apk-camera-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            codec/source/emsdk
            codec/source/third_party
            codec/source/build-simd
            codec/source/build-scalar
          key: airgapper-codec-emsdk-6.0.6-zxing-${{ hashFiles('codec/source/zxing-cpp.commit') }}

      - name: Build codecs
        run: |
          set -euo pipefail
          AIRGAPPER_CODEC_SIMD=1 AIRGAPPER_CODEC_OUTPUT_DIR=.. codec/source/build.sh
          AIRGAPPER_CODEC_SIMD=0 AIRGAPPER_CODEC_OUTPUT_DIR=../scalar codec/source/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run grid regression
        run: |
          node benchmark/grid-lattice-regression.mjs
          node benchmark/browser-performance-policy-smoke.mjs

      - name: Install browser benchmark dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run production regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs
          node benchmark/native-y8-worker-smoke.mjs
          node benchmark/native-camera-bridge-smoke.mjs
          node benchmark/corpus-suite.mjs

      - name: Build Android app
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug