name: fast regression

on:
  push:
    paths:
      - receive/**
      - send/**
      - shared/**
      - codec/**
      - android/**
      - main.js
      - index.html
      - sw.js
      - benchmark/**
      - .github/workflows/fast-regression.yml
  pull_request:
    branches: [master]
    paths:
      - receive/**
      - send/**
      - shared/**
      - codec/**
      - android/**
      - main.js
      - index.html
      - sw.js
      - benchmark/**
      - .github/workflows/fast-regression.yml
  workflow_dispatch:

concurrency:
  group: fast-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-native-camera2:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/native-camera2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-camera2
          fetch-depth: 1
      - name: Apply native Camera2 integration
        run: |
          set -euo pipefail
          if grep -q 'nativeCameraAvailable' receive/main.js; then
            echo 'native Camera2 integration already applied'
            exit 0
          fi
          python3 .github/run-native-camera2-patch.py
          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/airgapper/app/MainActivity.java \
                  android/app/src/main/java/com/airgapper/app/NativeCameraBridge.java \
                  index.html shared/style.css receive/main.js receive/worker.js \
                  main.js send/main.js sw.js .github/workflows/build-apk.yml
          git diff --cached --check
          git commit -m "integrate native Camera2 receiver"
          git push origin HEAD:feature/native-camera2

  regression:
    needs: [apply-native-camera2]
    if: always() && (needs.apply-native-camera2.result == 'success' || needs.apply-native-camera2.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            codec/source/emsdk
            codec/source/third_party
            codec/source/build-simd
            codec/source/build-scalar
          key: airgapper-codec-emsdk-6.0.6-zxing-${{ hashFiles('codec/source/zxing-cpp.commit') }}

      - name: Build codecs
        run: |
          set -euo pipefail
          AIRGAPPER_CODEC_SIMD=1 AIRGAPPER_CODEC_OUTPUT_DIR=.. codec/source/build.sh
          AIRGAPPER_CODEC_SIMD=0 AIRGAPPER_CODEC_OUTPUT_DIR=../scalar codec/source/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run grid regression
        run: node benchmark/grid-lattice-regression.mjs

      - name: Install browser benchmark dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run production regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs
          node benchmark/corpus-suite.mjs

      - name: Build Android app
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug
