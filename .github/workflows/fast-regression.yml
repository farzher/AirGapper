name: fast regression

on:
  push:
    paths:
      - receive/**
      - send/**
      - shared/**
      - codec/**
      - android/**
      - main.js
      - index.html
      - sw.js
      - benchmark/**
      - .github/patch-native-crc-parser.py
      - .github/workflows/fast-regression.yml
  pull_request:
    branches: [master]
    paths:
      - receive/**
      - send/**
      - shared/**
      - codec/**
      - android/**
      - main.js
      - index.html
      - sw.js
      - benchmark/**
      - .github/workflows/fast-regression.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply CRC-stripped native parser fix
        if: github.event_name == 'push' && github.ref_name == 'feature/apk-camera-v2'
        run: |
          set -euo pipefail
          python3 .github/patch-native-crc-parser.py
          if git diff --quiet -- shared/protocol.js receive/worker.js; then
            exit 0
          fi
          node --input-type=module --check < shared/protocol.js
          node --input-type=module --check < receive/worker.js
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add -- shared/protocol.js receive/worker.js
          git commit -m "fix CRC-stripped native frame parsing"
          git push origin HEAD:feature/apk-camera-v2

      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            codec/source/emsdk
            codec/source/third_party
            codec/source/build-simd
            codec/source/build-scalar
          key: airgapper-codec-emsdk-6.0.6-zxing-${{ hashFiles('codec/source/zxing-cpp.commit') }}

      - name: Build codecs
        run: |
          set -euo pipefail
          AIRGAPPER_CODEC_SIMD=1 AIRGAPPER_CODEC_OUTPUT_DIR=.. codec/source/build.sh
          AIRGAPPER_CODEC_SIMD=0 AIRGAPPER_CODEC_OUTPUT_DIR=../scalar codec/source/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < main.js
          node --input-type=module --check < receive/main.js
          node --input-type=module --check < shared/native-camera-v2.js

      - name: Run grid regression
        run: |
          node benchmark/grid-lattice-regression.mjs
          # Keep browser scheduling/AutoOptics policy behavior covered without camera hardware.
          node benchmark/browser-performance-policy-smoke.mjs

      - name: Install browser benchmark dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run production regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs
          node benchmark/native-y8-worker-smoke.mjs
          node benchmark/native-camera-bridge-smoke.mjs
          node benchmark/corpus-suite.mjs

      - name: Build Android app
        if: always()
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug
