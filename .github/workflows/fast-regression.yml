name: fast regression

on:
  push:
    paths:
      - receive/**
      - send/**
      - shared/**
      - codec/**
      - android/**
      - version.js
      - main.js
      - index.html
      - airgrid.html
      - airgrid-*.html
      - airgrid-lab*.js
      - sw.js
      - benchmark/**
      - .github/workflows/fast-regression.yml
  pull_request:
    branches: [master]
    paths:
      - receive/**
      - send/**
      - shared/**
      - codec/**
      - android/**
      - version.js
      - main.js
      - index.html
      - airgrid.html
      - airgrid-*.html
      - airgrid-lab*.js
      - sw.js
      - benchmark/**
      - .github/workflows/fast-regression.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache codec toolchain
        if: github.ref != 'refs/heads/airgrid-rs' && github.head_ref != 'airgrid-rs'
        uses: actions/cache@v4
        with:
          path: |
            codec/source/emsdk
            codec/source/third_party
            codec/source/build-simd
            codec/source/build-scalar
          key: airgapper-codec-emsdk-6.0.6-zxing-${{ hashFiles('codec/source/zxing-cpp.commit') }}

      - name: Build codecs
        if: github.ref != 'refs/heads/airgrid-rs' && github.head_ref != 'airgrid-rs'
        run: |
          set -euo pipefail
          AIRGAPPER_CODEC_SIMD=1 AIRGAPPER_CODEC_OUTPUT_DIR=.. codec/source/build.sh
          AIRGAPPER_CODEC_SIMD=0 AIRGAPPER_CODEC_OUTPUT_DIR=../scalar codec/source/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < version.js
          node --input-type=module --check < airgrid-lab.js
          node --input-type=module --check < airgrid-lab-v2.js
          node --input-type=module --check < airgrid-lab-1356.js
          node --input-type=module --check < airgrid-lab-1400.js
          node --input-type=module --check < airgrid-lab-1410.js
          node --input-type=module --check < airgrid-lab-1420.js
          node --input-type=module --check < receive/airgrid-sampler.js
          node --input-type=module --check < receive/airgrid-pam4-sampler.js
          node --input-type=module --check < receive/airgrid-worker.js
          node --input-type=module --check < send/airgrid-renderer.js
          node --input-type=module --check < send/airgrid-acquisition-renderer.js
          node --input-type=module --check < send/airgrid-qr-acquisition-renderer.js
          node --input-type=module --check < send/airgrid-present-diagnostics.js
          node --input-type=module --check < shared/airgrid-phy.js
          node --input-type=module --check < shared/airgrid-pam4.js
          node --input-type=module --check < shared/airgrid-acquisition.js
          node --input-type=module --check < shared/airgrid-qr-acquisition.js
          node --input-type=module --check < shared/airgrid-diagnostics.js

      - name: Run AirGrid fast proofs
        run: |
          set -euo pipefail
          node benchmark/airgrid-qr-acquisition-proof.mjs
          node benchmark/airgrid-acquisition-proof.mjs
          node benchmark/airgrid-acquisition-orientation-proof.mjs
          node benchmark/airgrid-rolling-shutter-proof.mjs
          node benchmark/airgrid-y8-proof.mjs
          node benchmark/airgrid-pam4-y8-proof.mjs
          node benchmark/airgrid-diagnostics-proof.mjs
          node benchmark/airgrid-throughput-budget.mjs

      - name: Run QR/core regression
        if: github.ref != 'refs/heads/airgrid-rs' && github.head_ref != 'airgrid-rs'
        run: |
          set -euo pipefail
          node --input-type=module --check < main.js
          node --input-type=module --check < receive/main.js
          node --input-type=module --check < receive/auto-phase.js
          node --input-type=module --check < receive/auto-phase-policy.js
          node --input-type=module --check < receive/optics-guard.js
          node --input-type=module --check < shared/camera-start-guard.js
          node --input-type=module --check < shared/native-camera-v2.js
          node --input-type=module --check < shared/receiver-recovery-state.js
          node --input-type=module --check < shared/receiver-recovery-policy.js
          node benchmark/grid-lattice-regression.mjs
          node benchmark/browser-performance-policy-smoke.mjs
          node benchmark/camera-start-guard-smoke.mjs
          node benchmark/auto-phase-policy-smoke.mjs
          node benchmark/optics-guard-smoke.mjs
          node benchmark/receiver-recovery-policy-smoke.mjs
          node benchmark/version-source-smoke.mjs

      - name: Install browser benchmark dependency
        if: github.ref != 'refs/heads/airgrid-rs' && github.head_ref != 'airgrid-rs'
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run production regression
        if: github.ref != 'refs/heads/airgrid-rs' && github.head_ref != 'airgrid-rs'
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs
          node benchmark/native-y8-worker-smoke.mjs
          node benchmark/native-camera-bridge-smoke.mjs
          node benchmark/native-camera-v2-bridge-smoke.mjs
          node benchmark/corpus-suite.mjs

      - name: Build Android app
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug
