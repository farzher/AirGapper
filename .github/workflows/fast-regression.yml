name: Reliable diagnostic

on:
  push:
    branches: [debug-reliable]
    paths:
      - audio/**
      - vendor/**
      - benchmark/audio-reliable-loopback.mjs
      - .github/workflows/fast-regression.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliable-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Diagnose Reliable
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node benchmark/audio-reliable-loopback.mjs
