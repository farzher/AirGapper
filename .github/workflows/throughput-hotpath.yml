          s = replace_one(s, busy_block, busy_replacement, 'busy active-grid pass-through')

          scalar_branch = re.search(r'\n  if \(usesSimpleDecodeWorker\) \{.*?\n  \}\n  for \(let i = regions.length - 1;', s, re.S)
