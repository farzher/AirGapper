          s = replace_one(s, old_input, new_input, 'worker direct copy')
          s = s.replace('ptr + (pixelFormat === "y8" ? yOffset : 0),', 'ptr + inputOffset,')
          s = s.replace('pixelFormat,\n        pixelFormat === "y8" ? yRowStride : pw * 4', 'decodePixelFormat,\n        inputStride')

          old_native_reply = r'''      if (native || pixelFormat === "y8") {
        const nativeSymbols = native?.symbols ?? [];
        ctx.postMessage({
          id,
