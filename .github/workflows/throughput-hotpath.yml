          s = s[:start] + parser + s[end:]
          old_crc = r'''function crc32(bytes) {
  let crc = 4294967295;
  for (const value of bytes) {
    crc ^= value;
    for (let bit = 0; bit < 8; bit++) crc = crc >>> 1 ^ 3988292384 & -(crc & 1);
