name: AirGapper throughput hot path
on:
  push:
    branches: [agent/throughput-hotpath]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/throughput-hotpath
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rewrite receive hot path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/rewrite-throughput.py')
          s = p.read_text()
          old = '''def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)
          '''
          new = '''def replace_one(text, old, new, label):
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              pattern = r'\\s+'.join(re.escape(part) for part in old.split())
              matches = list(re.finditer(pattern, text))
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found exact={count}, flexible={len(matches)}')
              return text[:matches[0].start()] + new + text[matches[0].end():]
          '''
          if old not in s:
              raise SystemExit('rewrite helper definition mismatch')
          s = s.replace(old, new, 1)
          old = '''    '          latencyMs: message.latencyMs ?? 0,\\n          error: message.error\\n',
              '          latencyMs: message.latencyMs ?? 0,\\n          frameCopyMs: message.frameCopyMs ?? 0,\\n          nativeMetrics: message.nativeMetrics,\\n          directFrameFailed: Boolean(message.directFrameFailed),\\n          error: message.error\\n','''
          new = '''    '          latencyMs: (_h = message.latencyMs) != null ? _h : 0,\\n          symbols,\\n          sightings,\\n          error: message.error\\n',
              '          latencyMs: (_h = message.latencyMs) != null ? _h : 0,\\n          frameCopyMs: message.frameCopyMs ?? 0,\\n          nativeMetrics: message.nativeMetrics,\\n          directFrameFailed: Boolean(message.directFrameFailed),\\n          symbols,\\n          sightings,\\n          error: message.error\\n','''
          if old not in s:
              raise SystemExit('pool metadata rewrite source mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 .github/rewrite-throughput.py
      - name: Rebuild SIMD and scalar QR codecs
        shell: bash
        run: |
          chmod +x vendor/decimen-codec/source/build.sh
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. ./build.sh
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android ./build.sh
          cd ../../..
      - name: Rebuild APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleRelease
          cd ..
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          cp "$APK" AirGapper.apk
      - name: Publish result branch
        shell: bash
        run: |
          rm -rf .github
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "optimize QR decode hot path"
          git push --force origin HEAD:agent/throughput-hotpath-result
