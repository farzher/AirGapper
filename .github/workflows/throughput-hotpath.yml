name: AirGapper throughput hot path
on:
  push:
    branches: [agent/throughput-hotpath]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/throughput-hotpath
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rewrite receive hot path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # shared/protocol.js: trusted native payload parser + table CRC.
          p = Path('shared/protocol.js')
          s = p.read_text()
          start = s.index('function parseFrame(bytes) {')
          end = s.index('function streamIdentity', start)
          parser = r'''function parseFrameBody(bytes, hasCrc) {
  var _a;
  const mode = modeForMagic((_a = bytes[0]) != null ? _a : -1);
  if (!mode) return null;
  const headerLen = frameHeaderLength(mode);
  if (bytes.length < headerLen + 1 + (hasCrc ? FRAME_CRC_LEN : 0)) return null;
  let bit = 8;
  let seq = 0;
  let layoutId = 0;
  let slotIndex = 0;
  let blockLen;
  let totalLen;
  if (mode === "direct") {
    const total = readBits(bytes, bit, DIRECT_TOTAL_BITS);
    bit = total.next;
    totalLen = total.value + 1;
    blockLen = totalLen;
