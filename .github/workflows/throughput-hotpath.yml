name: AirGapper throughput hot path
on:
  push:
    branches: [agent/throughput-hotpath]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/throughput-hotpath
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rewrite receive hot path
        run: python3 .github/rewrite-throughput.py
      - name: Rebuild SIMD and scalar QR codecs
        shell: bash
        run: |
          chmod +x vendor/decimen-codec/source/build.sh
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. ./build.sh
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android ./build.sh
          cd ../../..
      - name: Rebuild APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleRelease
          cd ..
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          cp "$APK" AirGapper.apk
      - name: Publish result branch
        shell: bash
        run: |
          rm -rf .github
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "optimize QR decode hot path"
          git push --force origin HEAD:agent/throughput-hotpath-result
