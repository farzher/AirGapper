name: optimize sync sender performance v382

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/sender-perf-v382b.yml

concurrency:
  group: sender-perf-v382b
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and apply
        run: |
          set -euo pipefail
          grep -q 'APP_VERSION = "0.5.381"' version.js
          cp vendor/qrcode.js /tmp/qrcode-before.mjs
          node .github/scripts/hash-qrs-v382.mjs /tmp/qrcode-before.mjs >/tmp/qrs-before.txt
          python3 .github/scripts/apply-qrcode-perf-v382.py
          cp vendor/qrcode.js /tmp/qrcode-after.mjs
          node .github/scripts/hash-qrs-v382.mjs /tmp/qrcode-after.mjs >/tmp/qrs-after.txt
          diff -u /tmp/qrs-before.txt /tmp/qrs-after.txt
          cp .github/scripts/render-worker-v382.js send/render-worker.js
          cp send/render-worker.js /tmp/render-worker.mjs
          node --check /tmp/render-worker.mjs
          grep -q 'APP_VERSION = "0.5.382"' version.js
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sender-perf-v382.yml .github/workflows/sender-perf-v382b.yml
          git rm .github/scripts/hash-qrs-v382.mjs .github/scripts/apply-qrcode-perf-v382.py .github/scripts/render-worker-v382.js
          git add vendor/qrcode.js send/render-worker.js version.js
          git commit -m "v0.5.382: reduce sync sender CPU and allocations"
          git push origin HEAD:master
