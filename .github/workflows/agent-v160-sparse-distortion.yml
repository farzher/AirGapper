name: Agent v160 sparse distortion sampler
on:
  push:
    paths:
      - '.github/v160_patch.py'
      - '.github/v160_buildfix.py'
      - '.github/workflows/agent-v160-sparse-distortion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: |
          python .github/v160_patch.py
          python .github/v160_buildfix.py
      - name: Rebuild SIMD codec
        run: bash vendor/decimen-codec/source/build.sh
      - name: Smoke check
        run: |
          node --check receive/main.js
          node --check receive/worker.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js sw.js \
            vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
            vendor/decimen-codec/source/wrapper/decimen_codec.cpp
          git commit -m 'v0.5.160 sparsify guided distortion fitting'
          git push origin master
