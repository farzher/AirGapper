name: optimize Auto Size across all QR versions

on:
  push:
    branches: [master]
    paths:
      - .github/scripts/apply-auto-all-qr-v384.py

concurrency:
  group: auto-all-qr-v384
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply all-version Auto Size solver
        run: |
          set -euo pipefail
          grep -q 'APP_VERSION = "0.5.383"' version.js
          python3 .github/scripts/apply-auto-all-qr-v384.py
          node --check send/main.js
          node --input-type=module -e 'import("./shared/frame-capacity.js").then(m => { if (m.QR_BYTE_CAPACITY_L.length !== 40) process.exit(1); })'
          grep -q 'optimizeSize ? QR_BYTE_CAPACITY_L' send/main.js
          grep -q 'maxPayloadPerSecond \* 0.95' send/main.js
          grep -q 'APP_VERSION = "0.5.384"' version.js
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/sender-perf-v382b.yml
          git rm .github/workflows/auto-all-qr-v384.yml .github/scripts/apply-auto-all-qr-v384.py
          git add send/main.js shared/frame-capacity.js version.js
          git commit -m "v0.5.384: optimize Auto Size across all QR versions"
          git push origin HEAD:master
