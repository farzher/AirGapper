name: apply APK camera v2 integration

on:
  push:
    branches: [feature/apk-camera-v2]
    paths:
      - .github/apply-apk-camera-v2-integration.py
      - .github/workflows/apply-apk-camera-v2.yml

permissions:
  contents: write

concurrency:
  group: apply-apk-camera-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apk-camera-v2
          fetch-depth: 1
      - name: Apply integration
        run: python3 .github/apply-apk-camera-v2-integration.py
      - name: Commit integration and remove staging machinery
        run: |
          set -euo pipefail
          rm .github/apply-apk-camera-v2-integration.py .github/workflows/apply-apk-camera-v2.yml
          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "integrate Camera2 native decode backend"
          git push origin HEAD:feature/apk-camera-v2
