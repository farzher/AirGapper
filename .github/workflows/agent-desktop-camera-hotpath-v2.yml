name: Agent desktop camera hot path v2
on:
  push:
    branches: [master]
    paths:
      - .github/patch-desktop-camera.py
      - .github/workflows/agent-desktop-camera-hotpath-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply patch
        run: python3 .github/patch-desktop-camera.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-desktop-camera.py
          git rm .github/workflows/agent-desktop-camera-hotpath.yml
          git rm .github/workflows/agent-desktop-camera-hotpath-v2.yml
          git add receive/main.js index.html sw.js
          git commit -m "fix desktop camera receive hot path"
          git push origin HEAD:master
