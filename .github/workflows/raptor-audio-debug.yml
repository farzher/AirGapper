name: Reliable RaptorQ diagnostic

on:
  push:
    branches: [debug-raptor-audio]
    paths:
      - audio/ultra-format.js
      - benchmark/audio-reliable-loopback.mjs
      - shared/coding-mode.js
      - shared/raptorq.js
      - shared/transport.js
      - vendor/raptorq/**
      - .github/workflows/raptor-audio-debug.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raptorq:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Run Reliable RaptorQ regression
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node benchmark/audio-reliable-loopback.mjs
