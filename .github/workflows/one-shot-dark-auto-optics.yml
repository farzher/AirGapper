name: stage dark auto optics startup

on:
  push:
    branches: [chatgpt/auto-optics-dark-start-515]
    paths: [.github/workflows/one-shot-dark-auto-optics.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path); s = p.read_text(); n = s.count(old)
              if n != 1: raise SystemExit(f"{path}: anchor count {n}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          rep("receive/runtime.js",
              'const AUTO_OPTICS_MEMORY_KEY = "airgapper:auto-optics-memory:v5";',
              'const AUTO_OPTICS_MEMORY_KEY = "airgapper:auto-optics-memory:v6";')

          rep("receive/runtime.js",
              '''let autoOpticsHeldYield = 0;\nlet autoOpticsAeBaseline;\nlet autoOpticsMemoryBootAt = 0;''',
              '''let autoOpticsHeldYield = 0;\nlet autoOpticsAeBaseline;\n// Pre-play manual bootstrap for cameras with shutter+ISO but no negative EV axis.\nconst autoOpticsPreplaySeeds = new WeakMap();\nlet autoOpticsMemoryBootAt = 0;''')

          rep("receive/runtime.js",
              '''function automaticShortShutterSeed(baseline, exposureRange, isoRange, fps) {\n  const aeProduct = baseline.exposure * baseline.iso;\n  const seedPolicy = automaticOpticsAcquisitionSeed(autoOpticsSeedAttempt);\n  // Acquisition can explore both sides of the meter, but every seed keeps a\n  // short shutter so rolling-shutter safety is never traded away.\n  const targetProduct = Math.max(exposureRange.min * isoRange.min, aeProduct * seedPolicy.lightScale);''',
              '''function automaticShortShutterSeed(baseline, exposureRange, isoRange, fps, attempt = autoOpticsSeedAttempt) {\n  const aeProduct = baseline.exposure * baseline.iso;\n  const seedPolicy = automaticOpticsAcquisitionSeed(attempt);\n  // lightScale is absolute relative to photographic neutral. Normalize against\n  // the EV scale the meter actually accepted so a biased baseline is not darkened twice.\n  const baselineScale = Number.isFinite(baseline.lightScale) && baseline.lightScale > 0 ? baseline.lightScale : 1;\n  const targetProduct = Math.max(\n    exposureRange.min * isoRange.min,\n    aeProduct * seedPolicy.lightScale / baselineScale\n  );''')

          rep("receive/runtime.js",
              '''  const patch = { exposureMode: "continuous" };\n  if (caps.exposureCompensation && caps.exposureCompensation.min <= 0 && caps.exposureCompensation.max >= 0) {\n    patch.exposureCompensation = quantizeCameraRange(0, caps.exposureCompensation);\n  }''',
              '''  const patch = { exposureMode: "continuous" };\n  if (caps.exposureCompensation && caps.exposureCompensation.min <= 0 && caps.exposureCompensation.max >= 0) {\n    // Meter below photographic neutral; do not brighten back to 0 EV while settling.\n    patch.exposureCompensation = quantizeCameraRange(\n      Math.max(caps.exposureCompensation.min, Math.min(0, AUTO_QR_EV_BIAS)),\n      caps.exposureCompensation\n    );\n  }''')

          rep("receive/runtime.js",
              '''  const exposure = Number(settings.exposureTime);\n  const iso = Number(settings.iso);\n  if (!(exposure > 0) || !(iso > 0)) return void 0;\n  return { exposure, iso, at: receiverNow(), neutral: true };\n}\nasync function applyAutomaticShortSeed''',
              '''  const exposure = Number(settings.exposureTime);\n  const iso = Number(settings.iso);\n  if (!(exposure > 0) || !(iso > 0)) return void 0;\n  const actualEv = Number(settings.exposureCompensation);\n  const lightScale = Number.isFinite(actualEv) ? Math.min(1, Math.pow(2, actualEv)) : 1;\n  return { exposure, iso, at: receiverNow(), neutral: lightScale >= 0.999, lightScale };\n}\nasync function applyAutomaticShortSeed''')

          rep("receive/runtime.js",
              '''  focusController.adoptAutomaticCameraState("short-shutter automatic optics bootstrap active before QR lock");\n  return true;\n}\nasync function applyAutomaticOpticsMemoryBoot''',
              '''  focusController.adoptAutomaticCameraState("short-shutter automatic optics bootstrap active before QR lock");\n  return true;\n}\nasync function primeAutomaticQrOpticsBeforePlayback(track) {\n  if (!track || track.readyState !== "live") return false;\n  const caps = track.getCapabilities?.() ?? {};\n  const evRange = caps.exposureCompensation;\n\n  // Preferred path: install the negative QR EV bias before preview/frame capture.\n  if (evRange && evRange.min < 0 && evRange.max >= 0) {\n    await applyExposureSetting(track);\n    return true;\n  }\n\n  // No EV axis: if real sensor controls exist, derive a dark short-shutter seed\n  // from the initial AE numbers without ever presenting that AE state to decoding.\n  const exposureRange = caps.exposureTime;\n  const isoRange = caps.iso;\n  const modes = Array.isArray(caps.exposureMode) ? caps.exposureMode : [];\n  const settings = track.getSettings();\n  const exposure = Number(settings.exposureTime);\n  const iso = Number(settings.iso);\n  if (modes.includes("manual") && exposureRange && isoRange && exposure > 0 && iso > 0) {\n    const fps = Math.max(12, Math.min(120, Number(settings.frameRate) || 30));\n    const baseline = { exposure, iso, at: receiverNow(), neutral: true, lightScale: 1 };\n    const seed = automaticShortShutterSeed(baseline, exposureRange, isoRange, fps, 0);\n    const accepted = await applyCameraConstraint(track, { exposureMode: "manual", exposureTime: seed.exposure, iso: seed.iso });\n    if (accepted && track.readyState === "live") {\n      const actual = track.getSettings();\n      autoOpticsPreplaySeeds.set(track, {\n        baseline,\n        exposure: Number(actual.exposureTime) || seed.exposure,\n        iso: Number(actual.iso) || seed.iso,\n        policy: seed.seedPolicy\n      });\n      return true;\n    }\n  }\n\n  // No browser-exposed way to darken this camera; preserve compatibility.\n  await applyExposureSetting(track);\n  return false;\n}\nasync function applyAutomaticOpticsMemoryBoot''')

          rep("receive/runtime.js",
              '''    const memory = usableAutomaticOpticsMemory(track);\n    if (memory && await applyAutomaticOpticsMemoryBoot(track, memory)) return;\n\n    // No usable memory: consult AE only as a brief light meter, then immediately\n    // leave it for a faster, deliberately darker shutter seed. Neutral AE remains\n    // the final rescue path, not the default operating point.\n    const baseline = await readAutomaticAeBaseline(track);''',
              '''    const preplaySeed = autoOpticsPreplaySeeds.get(track);\n    autoOpticsPreplaySeeds.delete(track);\n    const memory = usableAutomaticOpticsMemory(track);\n    if (memory && await applyAutomaticOpticsMemoryBoot(track, memory)) return;\n\n    if (preplaySeed) {\n      const now = receiverNow();\n      autoOpticsAeBaseline = preplaySeed.baseline;\n      autoOpticsRuntimeState = "seed";\n      autoOpticsSeedFullScansAt = fullScans;\n      autoOpticsLockSince = 0;\n      autoOpticsAcquisitionSince = now;\n      autoOpticsRetryAt = 0;\n      autoOpticsRescueRetryAt = now + AUTO_OPTICS_ACQUISITION_RESCUE_MS;\n      autoOpticsTuneSummary = `pre-play ${preplaySeed.policy.label} · ${formatExposureMs(preplaySeed.exposure)} · ISO ${Math.round(preplaySeed.iso)}`;\n      focusController.adoptAutomaticCameraState("dark short-shutter seed installed before first receiver frame");\n      return;\n    }\n\n    // No usable memory: use already-biased AE only as a meter, then switch short.\n    const baseline = await readAutomaticAeBaseline(track);''')

          rep("receive/runtime.js",
              '''  stream = acquiredStream;\n  const startupOpticsTrack = stream.getVideoTracks()[0];\n  if (startupOpticsTrack && !automaticOptics) {\n    seedDesiredCamera(startupOpticsTrack);\n    await applyExposureSetting(startupOpticsTrack);\n  }''',
              '''  stream = acquiredStream;\n  const startupOpticsTrack = stream.getVideoTracks()[0];\n  if (startupOpticsTrack) {\n    seedDesiredCamera(startupOpticsTrack);\n    if (automaticOptics) await primeAutomaticQrOpticsBeforePlayback(startupOpticsTrack);\n    else await applyExposureSetting(startupOpticsTrack);\n  }''')

          rep("receive/runtime.js",
              '''  if (range.min < 0) add(Math.max(range.min, -1), "dark rescue");\n  if (range.max > 0) add(Math.min(range.max, 1), "bright rescue");\n  add(0, "neutral retry");''',
              '''  // Stay below photographic neutral during AE rescue too.\n  if (range.min < 0) {\n    add(Math.max(range.min, AUTO_QR_EV_BIAS - 0.5), "extra-dark rescue");\n    add(Math.max(range.min, AUTO_QR_EV_BIAS), "dark retry");\n    if (range.max > AUTO_QR_EV_BIAS) add(Math.min(-0.25, range.max), "less-dark rescue");\n  }''')

          rep("receive/performance-policy.js",
              '''const AUTO_OPTICS_ACQUISITION_SEEDS = Object.freeze([\n  // Default QR seed: short enough to avoid rolling-shutter smear and darker\n  // than photographic AE so white modules do not bloom into their neighbors.\n  Object.freeze({ lightScale: Math.pow(2, -0.75), maxExposure: 35, frameFraction: 0.10, label: "fast-dark" }),\n  // A noisy/max-ISO camera can still be much too bright for a binary modem.\n  // Explore the darker direction before assuming the first miss meant "more light".\n  Object.freeze({ lightScale: Math.pow(2, -1.5), maxExposure: 35, frameFraction: 0.10, label: "extra-dark" }),\n  // Then try neutral short-shutter exposure if the darker seeds were starved.\n  Object.freeze({ lightScale: 1, maxExposure: 45, frameFraction: 0.14, label: "neutral-short" }),\n  // Last QR-specific rescue before handing control back to hardware AE.\n  Object.freeze({ lightScale: Math.pow(2, 0.5), maxExposure: 55, frameFraction: 0.18, label: "bright-short" })\n]);''',
              '''const AUTO_OPTICS_ACQUISITION_SEEDS = Object.freeze([\n  // Absolute light products relative to photographic neutral. Every candidate\n  // stays darker; runtime normalizes these against the AE bias actually accepted.\n  Object.freeze({ lightScale: Math.pow(2, -0.75), maxExposure: 35, frameFraction: 0.10, label: "fast-dark" }),\n  Object.freeze({ lightScale: Math.pow(2, -1.5), maxExposure: 35, frameFraction: 0.10, label: "extra-dark" }),\n  Object.freeze({ lightScale: Math.pow(2, -0.5), maxExposure: 45, frameFraction: 0.14, label: "less-dark-short" }),\n  Object.freeze({ lightScale: Math.pow(2, -0.25), maxExposure: 55, frameFraction: 0.18, label: "least-dark-short" })\n]);''')

          rep("benchmark/browser-performance-policy-smoke.mjs",
              '''const source = fs.readFileSync(new URL("../receive/performance-policy.js", import.meta.url), "utf8");\nconst policy = await import(`data:text/javascript;base64,${Buffer.from(source).toString("base64")}`);''',
              '''const decodeHealthSource = fs.readFileSync(new URL("../receive/decode-health.js", import.meta.url), "utf8");\nconst decodeHealthUrl = `data:text/javascript;base64,${Buffer.from(decodeHealthSource).toString("base64")}`;\nconst source = fs.readFileSync(new URL("../receive/performance-policy.js", import.meta.url), "utf8")\n  .replace('from "./decode-health.js";', `from "${decodeHealthUrl}";`);\nconst policy = await import(`data:text/javascript;base64,${Buffer.from(source).toString("base64")}`);''')

          rep("benchmark/browser-performance-policy-smoke.mjs",
              '''// Auto Optics explores both sides of the initial QR exposure before AE fallback.\nconst seeds = [0, 1, 2, 3].map((index) => policy.automaticOpticsAcquisitionSeed(index));\nassert.deepEqual(seeds.map((seed) => seed.label), ["fast-dark", "extra-dark", "neutral-short", "bright-short"]);\nassert(seeds[1].lightScale < seeds[0].lightScale);\nassert(seeds[2].lightScale > seeds[0].lightScale);\nassert(seeds[3].lightScale > seeds[2].lightScale);\nassert.equal(policy.automaticOpticsHasAnotherAcquisitionSeed(0), true);\nassert.equal(policy.automaticOpticsHasAnotherAcquisitionSeed(2), true);\nassert.equal(policy.automaticOpticsHasAnotherAcquisitionSeed(3), false);''',
              '''// Every QR-specific acquisition candidate stays below photographic neutral.\nconst seeds = [0, 1, 2, 3].map((index) => policy.automaticOpticsAcquisitionSeed(index));\nassert.deepEqual(seeds.map((seed) => seed.label), ["fast-dark", "extra-dark", "less-dark-short", "least-dark-short"]);\nassert(seeds.every((seed) => seed.lightScale < 1));\nassert(seeds[1].lightScale < seeds[0].lightScale);\nassert(seeds[2].lightScale > seeds[0].lightScale);\nassert(seeds[3].lightScale > seeds[2].lightScale);\nassert.equal(policy.automaticOpticsHasAnotherAcquisitionSeed(0), true);\nassert.equal(policy.automaticOpticsHasAnotherAcquisitionSeed(2), true);\nassert.equal(policy.automaticOpticsHasAnotherAcquisitionSeed(3), false);\n\nconst runtimeSource = fs.readFileSync(new URL("../receive/runtime.js", import.meta.url), "utf8");\nassert(runtimeSource.includes('const AUTO_OPTICS_MEMORY_KEY = "airgapper:auto-optics-memory:v6";'));\nassert(runtimeSource.includes('if (automaticOptics) await primeAutomaticQrOpticsBeforePlayback(startupOpticsTrack);'));\nassert(runtimeSource.includes('async function primeAutomaticQrOpticsBeforePlayback(track)'));\nassert(runtimeSource.includes('const evRange = caps.exposureCompensation;'));\nassert(runtimeSource.includes('const seed = automaticShortShutterSeed(baseline, exposureRange, isoRange, fps, 0);'));\nassert(runtimeSource.includes('Math.min(0, AUTO_QR_EV_BIAS)'));\nassert(!runtimeSource.includes('"bright rescue"'));\nassert(!runtimeSource.includes('"neutral retry"'));''')

          rep("version.js", 'export const APP_VERSION = "0.5.514";', 'export const APP_VERSION = "0.5.515";')
          PY

      - name: Run targeted regressions
        run: |
          set -euo pipefail
          node --input-type=module --check < receive/runtime.js
          node --input-type=module --check < receive/performance-policy.js
          node --input-type=module --check < benchmark/browser-performance-policy-smoke.mjs
          node benchmark/browser-performance-policy-smoke.mjs
          node benchmark/camera-start-guard-smoke.mjs
          node benchmark/camera-constraints-smoke.mjs
          node benchmark/version-source-smoke.mjs
          git diff --check
      - name: Commit tested patch
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-dark-auto-optics.yml
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add receive/runtime.js receive/performance-policy.js benchmark/browser-performance-policy-smoke.mjs version.js
          git commit -m "Stage dark Auto Optics startup v0.5.515"
          git push
