name: one-shot replay readiness repair

on:
  push:
    branches:
      - chatgpt/auto-optics-dark-ci-515

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/auto-optics-dark-ci-515
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch replay worker readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('receive/runtime.js')
          s = p.read_text()
          old = '''function waitForWorkers() {
  return new Promise((resolve) => {
    const poll = () => pool.busyCount ? setTimeout(poll, 10) : resolve();
    poll();
  });
}
'''
          new = '''function waitForWorkers() {
  return new Promise((resolve) => {
    const poll = () => pool.busyCount ? setTimeout(poll, 10) : resolve();
    poll();
  });
}
function waitForWorkerPoolReady(timeoutMs = 30000) {
  return new Promise((resolve, reject) => {
    const started = performance.now();
    const poll = () => {
      if (pool.size > 0 && pool.freeSlots.length === pool.size) {
        resolve();
        return;
      }
      if (performance.now() - started >= timeoutMs) {
        reject(new Error(`Decode workers did not become ready (${pool.freeSlots.length}/${pool.size})`));
        return;
      }
      setTimeout(poll, 10);
    };
    poll();
  });
}
'''
          if old not in s:
              raise SystemExit('waitForWorkers anchor not found')
          s = s.replace(old, new, 1)
          old2 = '''  done = false;
  pool.resize(selectedWorkerCount());
  const firstTime ='''
          new2 = '''  done = false;
  pool.resize(selectedWorkerCount());
  // Maximum-speed replay can consume an entire synthetic corpus before a cold
  // WASM worker reaches its id:-1 ready handshake. Real camera startup merely
  // drops those early frames; the benchmark must start frame 0 from a warm pool
  // so it measures decoding rather than worker initialization scheduling.
  await waitForWorkerPoolReady();
  const firstTime ='''
          if old2 not in s:
              raise SystemExit('benchmark pool resize anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          node --input-type=module --check < receive/runtime.js
          git diff --check
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-replay-ready.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add receive/runtime.js .github/workflows/one-shot-replay-ready.yml
          git commit -m 'Wait for replay workers before synthetic regression'
          git push origin HEAD:chatgpt/auto-optics-dark-ci-515
