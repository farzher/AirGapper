name: v187 optics hold watchdog

on:
  push:
    paths:
      - .github/workflows/agent-v187-optics-hold-watchdog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.5.187
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"replacement not found in {path}: {old[:140]!r}")
              p.write_text(s.replace(old, new, count))

          replace("index.html", "v0.5.186", "v0.5.187")
          replace("main.js", 'const APP_BUILD = "v0.5.186";', 'const APP_BUILD = "v0.5.187";')
          replace("receive/main.js", 'const RECEIVER_RUNTIME_BUILD = "v0.5.186";', 'const RECEIVER_RUNTIME_BUILD = "v0.5.187";')
          replace("sw.js", 'const CACHE = "airgapper-static-js-v148";', 'const CACHE = "airgapper-static-js-v149";')

          p = Path("receive/main.js")
          s = p.read_text()

          old = '''const AUTO_OPTICS_COLLAPSE_YIELD = 0.12;\nconst AUTO_OPTICS_COLLAPSE_RETRY_MS = 900;'''
          new = '''const AUTO_OPTICS_COLLAPSE_YIELD = 0.12;\nconst AUTO_OPTICS_COLLAPSE_RETRY_MS = 900;\nconst AUTO_OPTICS_HOLD_SAMPLE_MS = 700;\nconst AUTO_OPTICS_HOLD_COLLAPSE_MS = 1400;\nconst AUTO_OPTICS_HOLD_MIN_ATTEMPTS = 40;'''
          if old not in s: raise SystemExit("collapse constants anchor missing")
          s = s.replace(old, new, 1)

          old = '''let autoOpticsFineTuneDirection = 1;\n// These are the user's persistent MANUAL optics profile.'''
          new = '''let autoOpticsFineTuneDirection = 1;\nlet autoOpticsHoldSample;\nlet autoOpticsHoldCollapseSince = 0;\n// These are the user's persistent MANUAL optics profile.'''
          if old not in s: raise SystemExit("hold vars anchor missing")
          s = s.replace(old, new, 1)

          old = '''  autoOpticsFineTuneAt = 0;\n  autoOpticsFineTuneDirection = 1;\n  autoOpticsTuneSummary = "";'''
          new = '''  autoOpticsFineTuneAt = 0;\n  autoOpticsFineTuneDirection = 1;\n  autoOpticsHoldSample = void 0;\n  autoOpticsHoldCollapseSince = 0;\n  autoOpticsTuneSummary = "";'''
          if old not in s: raise SystemExit("runtime reset anchor missing")
          s = s.replace(old, new, 1)

          anchor = '''function autoOpticsPipelineSnapshot() {\n  return {\n    at: receiverNow(),\n    outputs: Number(livePipeline?.trackedOutputSymbols || 0),\n    attempts: Number(livePipeline?.submittedTracks || 0),\n    jobs: Number(livePipeline?.submittedTracked || 0)\n  };\n}\n'''
          insert = anchor + '''async function recoverCollapsedAutomaticOptics(track, yieldRate, reason = "held optics collapsed") {\n  if (autoOpticsMutationRunning || !automaticOptics || !automaticOpticsSessionAlive(track)) return;\n  autoOpticsMutationRunning = true;\n  try {\n    forgetAutomaticOptics(track);\n    await applyExposureSetting(track);\n    if (!automaticOpticsSessionAlive(track)) return;\n    autoOpticsRuntimeState = "ae";\n    autoOpticsLockSince = 0;\n    autoOpticsAcquisitionSince = receiverNow();\n    autoOpticsRetryAt = receiverNow() + AUTO_OPTICS_COLLAPSE_RETRY_MS;\n    autoOpticsHoldSample = void 0;\n    autoOpticsHoldCollapseSince = 0;\n    autoOpticsTuneSummary = `${reason} ${(yieldRate * 100).toFixed(0)}% · memory cleared · hardware AE reacquire`;\n    focusController.adoptAutomaticCameraState("automatic optics live yield collapsed; hardware AE reacquire");\n    notePipelineEvent("auto-optics-hold-collapse");\n  } finally {\n    autoOpticsMutationRunning = false;\n  }\n}\n'''
          if anchor not in s: raise SystemExit("pipeline snapshot anchor missing")
          s = s.replace(anchor, insert, 1)

          # Start hold monitoring only after startup tuning has committed a real\n          # winner, so probe transitions never count against the held setting.
          old = '''    autoOpticsRuntimeState = "manual";\n    // Hold the winner, but keep Auto Optics alive as a very low-duty-cycle'''
          new = '''    autoOpticsRuntimeState = "manual";\n    autoOpticsHoldSample = autoOpticsPipelineSnapshot();\n    autoOpticsHoldCollapseSince = 0;\n    // Hold the winner, but keep Auto Optics alive as a very low-duty-cycle'''
          if old not in s: raise SystemExit("settle manual anchor missing")
          s = s.replace(old, new, 1)

          # Fine-tune probes are intentional temporary mutations. Reset the live\n          # hold window after they finish rather than interpreting probe frames\n          # as a degradation of the selected setting.
          old = '''  } finally {\n    if (autoOpticsRuntimeState === "fine") autoOpticsRuntimeState = "manual";\n    autoOpticsMutationRunning = false;\n  }\n}\n\nasync function releaseAutomaticQrOptics'''
          new = '''  } finally {\n    if (autoOpticsRuntimeState === "fine") autoOpticsRuntimeState = "manual";\n    if (autoOpticsRuntimeState === "manual") {\n      autoOpticsHoldSample = autoOpticsPipelineSnapshot();\n      autoOpticsHoldCollapseSince = 0;\n    }\n    autoOpticsMutationRunning = false;\n  }\n}\n\nasync function releaseAutomaticQrOptics'''
          if old not in s: raise SystemExit("fine finally anchor missing")
          s = s.replace(old, new, 1)

          old = '''  if (autoOpticsRuntimeState === "manual") {\n    if (now >= autoOpticsFineTuneAt && gridLattice.locked && autoOpticsPoseUsable(autoOpticsPoseSnapshot()))\n      void fineTuneAutomaticQrOptics(track, now);\n    return;\n  }'''
          new = '''  if (autoOpticsRuntimeState === "manual") {\n    const poseUsable = gridLattice.locked && autoOpticsPoseUsable(autoOpticsPoseSnapshot());\n    if (!poseUsable) {\n      autoOpticsHoldSample = void 0;\n      autoOpticsHoldCollapseSince = 0;\n    } else if (!autoOpticsHoldSample || now - autoOpticsHoldSample.at >= AUTO_OPTICS_HOLD_SAMPLE_MS) {\n      const sample = autoOpticsPipelineSnapshot();\n      if (autoOpticsHoldSample) {\n        const attempts = Math.max(0, sample.attempts - autoOpticsHoldSample.attempts);\n        const outputs = Math.max(0, sample.outputs - autoOpticsHoldSample.outputs);\n        if (attempts >= AUTO_OPTICS_HOLD_MIN_ATTEMPTS) {\n          const yieldRate = outputs / attempts;\n          if (yieldRate < AUTO_OPTICS_COLLAPSE_YIELD) {\n            if (!autoOpticsHoldCollapseSince) autoOpticsHoldCollapseSince = now;\n            else if (now - autoOpticsHoldCollapseSince >= AUTO_OPTICS_HOLD_COLLAPSE_MS) {\n              void recoverCollapsedAutomaticOptics(track, yieldRate);\n              return;\n            }\n          } else {\n            autoOpticsHoldCollapseSince = 0;\n          }\n        }\n      }\n      autoOpticsHoldSample = sample;\n    }\n    if (now >= autoOpticsFineTuneAt && poseUsable)\n      void fineTuneAutomaticQrOptics(track, now);\n    return;\n  }'''
          if old not in s: raise SystemExit("manual hold anchor missing")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          node --check main.js
          node --check receive/main.js
          git diff --check
          rm -f .github/workflows/agent-v187-optics-hold-watchdog.yml
          git add -A
          git commit -m "v0.5.187 recover degraded optics holds"
          git push origin HEAD:master
