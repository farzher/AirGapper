name: Agent v165 revert cache and 7 workers
on:
  push:
    paths:
      - '.github/v165_patch.py'
      - '.github/workflows/agent-v165-revert-cache-7-workers.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v165_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          node --check receive/worker.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js receive/worker.js sw.js \
            vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
            vendor/decimen-codec/source/wrapper/decimen_codec.cpp \
            vendor/decimen-codec/source/wrapper/decimen_codec.h
          git commit -m 'v0.5.165 revert sparse cache and try 7 workers'
          git push origin master
