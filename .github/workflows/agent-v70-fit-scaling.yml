name: Agent v70 fit scaling
on:
  push:
    branches: [agent/v70-fit-scaling]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v70-fit-scaling
      - name: Improve fit-screen QR scaling
        run: echo '' | base64 -d | python3
      - name: Commit patch
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/workflows/agent-v70-fit-scaling.yml
          git add send/main.js index.html sw.js
          git commit -m "supersample fit-screen QR rendering"
          git push origin HEAD:agent/v70-fit-scaling
