name: Agent v177 sparse no-RS
on:
  push:
    paths:
      - '.github/v177_patch.py'
      - '.github/workflows/agent-v177-sparse-nors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v177_patch.py
      - name: Build SIMD codec
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=1 DECIMEN_OUTPUT_DIR=.. ./build.sh
      - name: Build scalar codec
        run: |
          cd vendor/decimen-codec/source
          DECIMEN_SIMD=0 DECIMEN_OUTPUT_DIR=../../decimen-codec-android ./build.sh
      - name: Check syntax and diff
        run: |
          node --check main.js
          node --check receive/main.js
          node --check receive/worker.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js receive/worker.js sw.js \
            vendor/decimen-codec/source/VERSION \
            vendor/decimen-codec/source/wrapper/decimen_codec.h \
            vendor/decimen-codec/source/wrapper/decimen_codec.cpp \
            vendor/decimen-codec/decimen_codec.js vendor/decimen-codec/decimen_codec.wasm \
            vendor/decimen-codec-android/decimen_codec.js vendor/decimen-codec-android/decimen_codec.wasm
          git commit -m 'v0.5.177 keep sparse decoder hot and gate no-RS'
          git push origin master
