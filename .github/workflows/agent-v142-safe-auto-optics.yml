name: Agent v142 safe auto optics
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/agent-v142-safe-auto-optics.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply patch
        run: python .github/v142_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          node --check receive/worker.js
          node --check sw.js
      - name: Commit patch
        run: |
          rm .github/v142_patch.py .github/workflows/agent-v142-safe-auto-optics.yml
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'v0.5.142 make automatic optics non-disruptive'
          git push origin master
