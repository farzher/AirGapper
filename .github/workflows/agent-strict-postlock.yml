name: Agent strict post-lock audit
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/agent-strict-postlock.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patch-strict-postlock.py
      - name: Verify
        run: |
          node --check receive/main.js
          node --check receive/worker.js
          grep -q 'strictLockedAudit ? false : gridNeedsDiscovery' receive/main.js
          grep -q 'postLockRecoverySuppressed' receive/main.js
          grep -q 'v0.5.52' index.html
          grep -q 'airgapper-static-js-v15' sw.js
          ! grep -R 'strictTracked\|nativeFallbackBudget' receive/main.js receive/worker.js
      - name: Commit
        run: |
          rm -f .github/patch-strict-postlock.py .github/workflows/agent-strict-postlock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'make strict mode expose locked misses'
          git push origin master
