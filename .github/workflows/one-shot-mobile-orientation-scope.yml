name: mobile-orientation-scope

on:
  push:
    branches:
      - chatgpt/auto-optics-dark-ci-515
    paths:
      - .github/workflows/one-shot-mobile-orientation-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scope portrait fallback to mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text()
          old = '''function syncPortraitFallback() {
  const landscape = window.innerWidth > window.innerHeight;
  document.body.classList.toggle("portrait-fallback", landscape);
  if (landscape) document.documentElement.style.setProperty("--portrait-fallback-rotation", portraitFallbackRotation());
  else document.documentElement.style.removeProperty("--portrait-fallback-rotation");
}
async function requestPortraitLock() {
  try {
    await screen.orientation?.lock?.("portrait-primary");
  } catch {
'''
          new = '''const portraitLockEnabled = isIOS || isAndroid || isAndroidApp();
function syncPortraitFallback() {
  const landscape = portraitLockEnabled && window.innerWidth > window.innerHeight;
  document.body.classList.toggle("portrait-fallback", landscape);
  if (landscape) document.documentElement.style.setProperty("--portrait-fallback-rotation", portraitFallbackRotation());
  else document.documentElement.style.removeProperty("--portrait-fallback-rotation");
}
async function requestPortraitLock() {
  if (!portraitLockEnabled) return;
  try {
    await screen.orientation?.lock?.("portrait-primary");
  } catch {
'''
          if s.count(old) != 1:
            raise SystemExit(f'orientation scope anchor count {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          node --input-type=module --check < main.js
          node benchmark/version-source-smoke.mjs
          node benchmark/camera-start-guard-smoke.mjs
          git diff --check
      - name: Commit
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-mobile-orientation-scope.yml
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add main.js
          git commit -m 'Scope portrait fallback to mobile devices'
          git push
