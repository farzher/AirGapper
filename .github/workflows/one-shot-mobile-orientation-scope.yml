name: mobile-orientation-scope

on:
  push:
    branches:
      - chatgpt/auto-optics-dark-ci-515
    paths:
      - .github/workflows/one-shot-mobile-orientation-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply mobile scope patch
        run: python3 benchmark/one-shot-mobile-scope.py
      - name: Verify
        run: |
          set -euo pipefail
          node --input-type=module --check < main.js
          node benchmark/version-source-smoke.mjs
          node benchmark/camera-start-guard-smoke.mjs
          grep -q 'const portraitLockEnabled = isIOS || isAndroid || isAndroidApp();' main.js
          git diff --check
      - name: Commit
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-mobile-orientation-scope.yml benchmark/one-shot-mobile-scope.py
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add main.js
          git commit -m 'Scope portrait fallback to mobile devices'
          git push
