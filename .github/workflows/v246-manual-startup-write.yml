name: v246 manual startup optics

on:
  push:
    paths:
      - .github/v246_manual_startup_write_patch.py
      - .github/workflows/v246-manual-startup-write.yml
  workflow_dispatch:

permissions: { contents: write }

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate
        run: python3 .github/v246_manual_startup_write_patch.py
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Run existing receiver benchmark
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs 2>&1 | tee /tmp/v246-regression.log
      - name: Correctness gate
        run: |
          node <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('benchmark/latest-result.json','utf8')).scenarios;
          const after=JSON.parse(fs.readFileSync('benchmark/offline-summary.json','utf8')).scenarios;
          const med=(x,k)=>Number(x?.trialMedians?.[k] ?? x?.normalized?.[k] ?? 0);
          const problems=[];
          for(const name of ['stable-y8','motion-y8','dense-y8','optical-dense-y8','camera-dense-y8']){
            const b=before[name],a=after[name];
            if(!a?.ok) problems.push(`${name} failed`);
            if(med(a,'guidedOutputYield') < med(b,'guidedOutputYield')-(name==='motion-y8'?0.03:0.02)) problems.push(`${name} output yield regressed`);
            if(a.tailFullJobs!==0) problems.push(`${name} stable tail used full scans`);
          }
          for(const name of ['motion-y8','optical-dense-y8','camera-dense-y8']) if(after[name].finalState!=='TRACK') problems.push(`${name} ended in ${after[name].finalState}`);
          console.log(JSON.stringify({note:'manual camera startup write removal; hardware decides startup latency',problems},null,2));
          if(problems.length) throw new Error(problems.join('; '));
          NODE
      - name: Promote passing candidate
        if: success()
        run: |
          set -euo pipefail
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          cp benchmark/offline-summary.json benchmark/latest-result.json
          rm -rf node_modules benchmark/offline-summary.json
          git rm .github/v246_manual_startup_write_patch.py .github/workflows/v246-manual-startup-write.yml
          git add receive/main.js main.js index.html sw.js benchmark/latest-result.json
          git commit -m "v0.5.246 avoid redundant manual camera write"
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Record rejection
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          {
            echo "v246 manual startup candidate rejected at $(date -u +%FT%TZ)"
            tail -n 600 /tmp/v246-regression.log 2>/dev/null || true
          } > benchmark/v246-manual-startup-ci.log
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add benchmark/v246-manual-startup-ci.log
          git rm .github/v246_manual_startup_write_patch.py .github/workflows/v246-manual-startup-write.yml
          git commit -m "record v246 manual startup rejection"
          git pull --rebase origin master
          git push origin HEAD:master
          exit 1
