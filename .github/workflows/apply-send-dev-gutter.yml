name: apply send developer gutter

on:
  push:
    paths:
      - .github/workflows/apply-send-dev-gutter.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-send-dev-gutter-master
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and push
        shell: bash
        run: |
          set -euo pipefail
          node benchmark/apply-send-dev-gutter.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receive/runtime.js index.html shared/style.css send/main.js version.js
          git commit -m "v0.5.414: add sender curved-display gutter"
          git push origin HEAD:master
