name: Agent unique throughput optimization
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/agent-unique-throughput.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply receiver duplicate-work optimization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              before = p.read_text()
              after = fn(before)
              if after == before:
                  raise SystemExit(f"{path}: edit made no change")
              p.write_text(after)

          def replace_exact(path, old, new, count=1):
              def apply(text):
                  actual = text.count(old)
                  if actual != count:
                      raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old[:100]!r}")
                  return text.replace(old, new)
              edit(path, apply)

          def insert_after(path, anchor, addition, count=1):
              replace_exact(path, anchor, anchor + addition, count)

          visual_block = '''const TRACKED_VISUAL_GRID = 5;
          const TRACKED_VISUAL_LARGE_DELTA = 48;
          const TRACKED_VISUAL_MEAN_DELTA = 10;
          const TRACKED_VISUAL_MAX_AGE_MS = 800;
          const TRACKED_VISUAL_MAX_SKIP_STREAK = 12;
          let previousTrackedVisual;
          function trackedVisualKey(tracks, pixelFormat) {
            return `${pixelFormat}|${tracks.map((track) => `${track.slot ?? track.id}:${track.dim}`).join(",")}`;
          }
          function sampleTrackedVisual(zx, ptr, width, height, ox, oy, tracks, pixelFormat, stride) {
            const values = new Uint8Array(tracks.length * TRACKED_VISUAL_GRID * TRACKED_VISUAL_GRID);
            let at = 0;
            for (const track of tracks) {
              const q = track.quad;
              for (let gy = 0; gy < TRACKED_VISUAL_GRID; gy++) {
                const v = (gy + 0.5) / TRACKED_VISUAL_GRID;
                for (let gx = 0; gx < TRACKED_VISUAL_GRID; gx++) {
                  const u = (gx + 0.5) / TRACKED_VISUAL_GRID;
                  const topX = q.topLeft.x * (1 - u) + q.topRight.x * u;
                  const topY = q.topLeft.y * (1 - u) + q.topRight.y * u;
                  const bottomX = q.bottomLeft.x * (1 - u) + q.bottomRight.x * u;
                  const bottomY = q.bottomLeft.y * (1 - u) + q.bottomRight.y * u;
                  const x = Math.max(0, Math.min(width - 1, Math.round(topX * (1 - v) + bottomX * v - ox)));
                  const y = Math.max(0, Math.min(height - 1, Math.round(topY * (1 - v) + bottomY * v - oy)));
                  const offset = ptr + y * stride + (pixelFormat === "y8" ? x : x * 4);
                  values[at++] = zx.HEAPU8[offset];
                }
              }
            }
            return { key: trackedVisualKey(tracks, pixelFormat), values };
          }
          function trackedVisualUnchanged(previous, current) {
            if (!previous || previous.key !== current.key || previous.values.length !== current.values.length) return false;
            let largeChanges = 0;
            let totalDelta = 0;
            for (let i = 0; i < current.values.length; i++) {
              const delta = Math.abs(current.values[i] - previous.values[i]);
              totalDelta += delta;
              if (delta >= TRACKED_VISUAL_LARGE_DELTA) largeChanges++;
            }
            const allowedLargeChanges = Math.max(1, Math.floor(current.values.length * 0.02));
            return largeChanges <= allowedLargeChanges && totalDelta <= current.values.length * TRACKED_VISUAL_MEAN_DELTA;
          }
          function shouldSkipTrackedVisual(current, now) {
            if (!previousTrackedVisual || now - previousTrackedVisual.at > TRACKED_VISUAL_MAX_AGE_MS || previousTrackedVisual.skipStreak >= TRACKED_VISUAL_MAX_SKIP_STREAK || !trackedVisualUnchanged(previousTrackedVisual, current)) return false;
            previousTrackedVisual.skipStreak++;
            return true;
          }
          function rememberTrackedVisual(current, now) {
            previousTrackedVisual = { key: current.key, values: current.values, at: now, skipStreak: 0 };
          }
          '''
          insert_after("receive/worker.js", "const nativeRefresh = /* @__PURE__ */ new Set();\n", visual_block)

          replace_exact("receive/worker.js",
              'const { id, buf, videoFrame, cropX = 0, cropY = 0, w = 0, h = 0, ox = 0, oy = 0, full = true, quad, dim, tracks, isolated = false, oracle = false, oracleSeeds = [], sentAt, pixelFormat = "rgba", yOffset: messageYOffset = 0, yStride: messageYStride = 0, payloadBytes = 0, strictTracked = false } = e.data;',
              'const { id, buf, videoFrame, cropX = 0, cropY = 0, w = 0, h = 0, ox = 0, oy = 0, full = true, quad, dim, tracks, isolated = false, oracle = false, oracleSeeds = [], sentAt, pixelFormat = "rgba", yOffset: messageYOffset = 0, yStride: messageYStride = 0, payloadBytes = 0, strictTracked = false, skipUnchanged = false, visualTrackId = -1 } = e.data;')

          batch_anchor = "    if (!full && (tracks == null ? void 0 : tracks.length)) {\n"
          batch_gate = '''      const trackedVisual = strictTracked ? null : sampleTrackedVisual(zx, ptr + inputOffset, pw, ph, ox, oy, tracks, decodePixelFormat, inputStride);
          if (trackedVisual && shouldSkipTrackedVisual(trackedVisual, performance.now())) {
            ctx.postMessage({
              id,
              symbols: [],
              sightings,
              full: false,
              trackedAttempted: false,
              trackedHit: false,
              unchangedTracked: true,
              unchangedTrackCount: tracks.length,
              fallbackAttempted: false,
              fallbackSucceeded: false,
              readFullAttempts: 0,
              workerWaitMs,
              targetedAttempts: 0,
              targetedPixels: 0,
              targetedSuccesses: 0,
              frameCopyMs,
              latencyMs: performance.now() - startedAt
            });
            return;
          }
          '''
          insert_after("receive/worker.js", batch_anchor, batch_gate)
          insert_after("receive/worker.js", "        const nativeSymbols = native?.symbols ?? [];\n", "        if (nativeSymbols.length > 0 && trackedVisual) rememberTrackedVisual(trackedVisual, performance.now());\n")

          single_anchor = "    if (!full && quad && dim) {\n"
          single_gate = '''      const trackedVisual = skipUnchanged && !strictTracked ? sampleTrackedVisual(zx, ptr + inputOffset, pw, ph, ox, oy, [{ id: visualTrackId, quad, dim }], decodePixelFormat, inputStride) : null;
          if (trackedVisual && shouldSkipTrackedVisual(trackedVisual, performance.now())) {
            ctx.postMessage({
              id,
              symbols: [],
              sightings,
              full: false,
              trackedAttempted: false,
              trackedHit: false,
              unchangedTracked: true,
              unchangedTrackCount: 1,
              fallbackAttempted: false,
              fallbackSucceeded: false,
              readFullAttempts: 0,
              workerWaitMs,
              frameCopyMs,
              latencyMs: performance.now() - startedAt
            });
            return;
          }
          '''
          insert_after("receive/worker.js", single_anchor, single_gate)
          replace_exact("receive/worker.js", "        trackedHit = true;\n      }\n    }\n    if (shouldRunFullDecode(full, trackedAttempted, trackedHit)) {\n", "        trackedHit = true;\n        if (trackedVisual) rememberTrackedVisual(trackedVisual, performance.now());\n      }\n    }\n    if (shouldRunFullDecode(full, trackedAttempted, trackedHit)) {\n")

          insert_after("shared/worker-pool.js", "          directFrameFailed: Boolean(message.directFrameFailed),\n", "          unchangedTracked: Boolean(message.unchangedTracked),\n          unchangedTrackCount: message.unchangedTrackCount ?? 0,\n")

          insert_after("receive/main.js", 'const focusDiagnostics = document.getElementById("focus-diagnostics");\n', 'const transportDiagnostics = document.getElementById("transport-diagnostics");\n')
          replace_exact("receive/main.js", '  const text = (_a = focusDiagnostics.textContent) != null ? _a : "";\n', '  const focusText = (_a = focusDiagnostics.textContent) != null ? _a : "";\n  const text = [focusText, transportDiagnostics?.textContent ?? ""].filter(Boolean).join("\\n\\n");\n')
          insert_after("receive/main.js", "const qrReadTimes = [];\n", "const uniqueQrTimes = [];\nconst duplicateQrTimes = [];\nconst unchangedSkipEvents = [];\n")
          replace_exact("receive/main.js", "  optimizerAttributionComplete(id);\n  if (!attempts) return;\n", "  optimizerAttributionComplete(id);\n  if (completion.unchangedTracked) {\n    unchangedSkipEvents.push({ at: receiverNow(), tracks: completion.unchangedTrackCount || attempts?.length || 0 });\n    return;\n  }\n  if (!attempts) return;\n")
          replace_exact("receive/main.js", "  decoder.addFrame(header.seq, block);\n  const receivedAt = receiverNow();\n", "  decoder.addFrame(header.seq, block);\n  const receivedAt = receiverNow();\n  (decoder.framesNew === framesNewBefore ? duplicateQrTimes : uniqueQrTimes).push(receivedAt);\n")
          replace_exact("receive/main.js", "  qrReadTimes.length = 0;\n", "  qrReadTimes.length = 0;\n  uniqueQrTimes.length = 0;\n  duplicateQrTimes.length = 0;\n  unchangedSkipEvents.length = 0;\n", count=2)
          replace_exact("receive/main.js", "    decoder = new TransportDecoder(header.k, header.blockLen, header.payloadId, header.totalLen);\n    usefulFrameTimes.length = 0;\n    streamKey = identity;\n", "    decoder = new TransportDecoder(header.k, header.blockLen, header.payloadId, header.totalLen);\n    usefulFrameTimes.length = 0;\n    uniqueQrTimes.length = 0;\n    duplicateQrTimes.length = 0;\n    unchangedSkipEvents.length = 0;\n    streamKey = identity;\n")
          replace_exact("receive/main.js", "const perRegionCapacity = Math.max(1, Math.floor(trackedCapacity / Math.max(1, scheduledRegions.length)));", "const perRegionCapacity = gridLattice.locked ? 1 : Math.max(1, Math.floor(trackedCapacity / Math.max(1, scheduledRegions.length)));")
          replace_exact("receive/main.js", "      { id, buf: img.data.buffer, w, h, ox: x, oy: y, full: false, quad: r.quad, dim: r.dim },\n", "      { id, buf: img.data.buffer, w, h, ox: x, oy: y, full: false, quad: r.quad, dim: r.dim, strictTracked: Boolean(source.image), skipUnchanged: gridLattice.locked && r.gridSlot !== void 0, visualTrackId: r.gridSlot ?? r.id },\n")
          replace_exact("receive/main.js", "  prune(decodeFrameTimes);\n  const perSecond = (a) => a.length / (STATS_WINDOW_MS / 1e3);\n", "  prune(decodeFrameTimes);\n  prune(uniqueQrTimes);\n  prune(duplicateQrTimes);\n  prune(usefulFrameTimes);\n  while (unchangedSkipEvents.length > 0 && unchangedSkipEvents[0].at < now - STATS_WINDOW_MS) unchangedSkipEvents.shift();\n  const perSecond = (a) => a.length / (STATS_WINDOW_MS / 1e3);\n")
          insert_after("receive/main.js", "  const qrRate = perSecond(qrReadTimes);\n", '''  const uniqueRate = perSecond(uniqueQrTimes);
          const duplicateRate = perSecond(duplicateQrTimes);
          const usefulRate = perSecond(usefulFrameTimes);
          const skippedJobRate = unchangedSkipEvents.length / (STATS_WINDOW_MS / 1e3);
          const skippedTrackRate = unchangedSkipEvents.reduce((sum, event) => sum + event.tracks, 0) / (STATS_WINDOW_MS / 1e3);
          if (!receiverDevActions.hidden && transportDiagnostics) {
            const transportRate = uniqueRate + duplicateRate;
            const duplicatePercent = transportRate > 0 ? duplicateRate / transportRate * 100 : 0;
            const totals = decoder ? `${decoder.framesNew} unique · ${decoder.framesDup} duplicate · ${decoder.framesRedundant} redundant` : "no active transport";
            transportDiagnostics.textContent = `Transport\nUnique ${uniqueRate.toFixed(1)} QR/s · duplicate ${duplicateRate.toFixed(1)} QR/s (${duplicatePercent.toFixed(0)}%)\nUseful ${usefulRate.toFixed(1)} QR/s · ${liveGoodputKbs(now).toFixed(1)} KB/s\nUnchanged visual skips ${skippedJobRate.toFixed(1)} jobs/s · ${skippedTrackRate.toFixed(1)} QR attempts/s avoided\n${totals}`;
          }
          ''')

          replace_exact("index.html", '<span class="brand">AirGapper <span class="app-version">v0.5.44</span></span>', '<span class="brand">AirGapper <span class="app-version">v0.5.45</span></span>')
          insert_after("index.html", '              <button class="secondary-button scan-capture-button" id="capture-scan" type="button">Capture</button><button class="secondary-button" id="copy-diagnostics" type="button">Copy diagnostics</button><button class="secondary-button" id="record-corpus" type="button">Record</button><button class="secondary-button" id="load-corpus" type="button">Replay</button><input id="corpus-file" type="file" accept=".agcap,application/vnd.airgapper.capture" hidden />\n', '              <pre id="transport-diagnostics" class="transport-diagnostics"></pre>\n')
          insert_after("shared/style.css", '.receiver-dev-actions button { padding: 5px 9px; min-height: 34px; }\n', '.transport-diagnostics { flex: 1 0 100%; margin: 0; padding: 8px; overflow: auto; color: var(--muted); background: var(--bg); border-radius: 8px; font: 10px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; }\n')
          replace_exact("sw.js", 'const CACHE = "airgapper-static-js-v7";', 'const CACHE = "airgapper-static-js-v8";')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-unique-throughput.yml
          git add receive/worker.js receive/main.js shared/worker-pool.js shared/style.css index.html sw.js
          git commit -m "skip duplicate locked QR work"
          git push origin HEAD:master
