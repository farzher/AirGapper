name: Agent v62 strict acquisition
on:
  push:
    branches: [agent/strict-acquisition-v62]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strict-acquisition-v62
      - name: Apply patch
        run: python3 .github/agent-v62.py
      - name: Verify syntax
        run: |
          node --check receive/main.js
          node --check receive/worker.js
      - name: Verify strict invariants
        run: |
          grep -q 'let strictHotPathEnabled = strictHotPathToggle.checked' receive/main.js
          grep -q 'if (message.strictHotPath === void 0) message.strictHotPath = strictHotPathActive()' receive/main.js
          grep -q 'const strictAcquiring = strictHotPathActive() && !gridLattice.locked' receive/main.js
          grep -q 'if ((full || !strictHotPath) && shouldRunFullDecode' receive/worker.js
          ! grep -q 'if (box && !optimizerAttribution) noteRegion(box, decodedAt, true, info)' receive/main.js
          grep -q 'v0.5.62' index.html
          grep -q 'airgapper-static-js-v25' sw.js
      - name: Commit result
        run: |
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git rm .github/agent-v62.py .github/workflows/agent-v62.yml
          git add receive/main.js receive/worker.js index.html sw.js
          git commit -m "separate strict acquisition from tracked recovery"
          git push origin HEAD:agent/strict-acquisition-v62
