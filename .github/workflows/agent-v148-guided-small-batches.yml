name: Agent v148 guided small batches
on:
  push:
    paths:
      - '.github/v148_patch.py'
      - '.github/workflows/agent-v148-guided-small-batches.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v148_patch.py
      - name: Smoke check
        run: |
          git diff --check
          grep -q 'const RECEIVER_RUNTIME_BUILD = "v0.5.148"' receive/main.js
          grep -q 'const GUIDED_MIN_TRACKS = 2' receive/main.js
          grep -q 'tracks.length >= 2' receive/worker.js
          grep -q 'nativeAssistTracks: 0' receive/worker.js
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          rm -f .github/v146_patch.py .github/v147_patch.py .github/v148_patch.py
          rm -f .github/workflows/agent-v146-seamless-optics.yml .github/workflows/agent-v147-guided-primary.yml .github/workflows/agent-v148-guided-small-batches.yml
          git add -A
          git commit -m 'v0.5.148 use guided decode for small tracked batches'
          git push origin master
