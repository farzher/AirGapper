name: Agent sampler oracle
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/agent-sampler-oracle.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply sampler oracle patch
        run: python3 .github/patch-sampler-oracle.py
      - name: Verify syntax
        shell: bash
        run: |
          node --check receive/worker.js
          node --check receive/main.js
          node --check shared/worker-pool.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/patch-sampler-oracle.py .github/workflows/agent-sampler-oracle.yml
          git add receive/worker.js receive/main.js shared/worker-pool.js index.html sw.js
          git commit -m "diagnose tracked sampler mismatches"
          git push origin HEAD:master
          git push origin --delete agent/synthetic-tracked-debug agent/synthetic-tracked-debug-2 agent/synthetic-tracked-debug-3 agent/synthetic-tracked-debug-4 || true
