name: clean dark auto optics diagnostics

on:
  push:
    branches: [chatgpt/auto-optics-dark-start-515]
    paths: [.github/workflows/one-shot-dark-auto-optics-labels.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix stale recovery wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('receive/runtime.js')
          s = p.read_text()
          replacements = {
            '`${reason} ${(yieldRate * 100).toFixed(0)}% · neutral hardware AE recovery`': '`${reason} ${(yieldRate * 100).toFixed(0)}% · QR-biased hardware AE recovery`',
            '"held QR-proven optics genuinely collapsed; neutral hardware AE restored"': '"held QR-proven optics genuinely collapsed; QR-biased hardware AE restored"',
            '// neutral hardware AE instead of allowing motion to protect a blind HOLD': '// QR-biased hardware AE instead of allowing motion to protect a blind HOLD',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected one runtime wording anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('receive/performance-policy.js')
          s = p.read_text()
          old = '''// designed for animated QR capture rather than immediately handing control back\n// to photographic AE. The ladder is intentionally tiny and bounded; once all\n// entries fail, hardware AE remains the universal fallback.'''
          new = '''// designed for animated QR capture rather than immediately handing control back\n// to photographic AE. The ladder is intentionally tiny and bounded; if it is\n// exhausted, runtime falls back to hardware AE while retaining the QR bias where supported.'''
          if s.count(old) != 1:
              raise SystemExit('expected policy fallback comment anchor')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify
        run: |
          set -euo pipefail
          node --input-type=module --check < receive/runtime.js
          node --input-type=module --check < receive/performance-policy.js
          node benchmark/browser-performance-policy-smoke.mjs
          node benchmark/camera-start-guard-smoke.mjs
          node benchmark/camera-constraints-smoke.mjs
          git diff --check
      - name: Commit cleanup
        run: |
          git rm .github/workflows/one-shot-dark-auto-optics-labels.yml
          git config user.name "AirGapper Agent"
          git config user.email "actions@github.com"
          git add receive/runtime.js receive/performance-policy.js
          git commit -m "Clarify QR-biased Auto Optics recovery"
          git push
