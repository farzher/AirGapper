name: Agent v149 fresh lattice
on:
  push:
    paths:
      - '.github/v149_patch.py'
      - '.github/workflows/agent-v149-fresh-lattice.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v149_patch.py
      - name: Smoke check
        run: |
          node --check receive/grid-lattice.js
          node --check receive/main.js
          grep -q 'v0.5.149' receive/main.js
          grep -q 'OBSERVATION_HISTORY_MS = 2500' receive/grid-lattice.js
          grep -q 'CURRENT_FIT_MS = 420' receive/grid-lattice.js
          grep -q 'EXACT_GEOMETRY_MS = 420' receive/grid-lattice.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add receive/grid-lattice.js receive/main.js index.html main.js sw.js
          git commit -m 'v0.5.149 keep tracked lattice geometry fresh'
          git push origin master
