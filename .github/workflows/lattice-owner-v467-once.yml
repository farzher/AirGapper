name: lattice ownership cleanup v467 once
on:
  push:
    paths:
      - .github/workflows/lattice-owner-v467-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Consolidate lattice ownership
        shell: bash
        run: |
          STAGED_SHA="$GITHUB_SHA"
          BASE_SHA="$(git rev-parse HEAD^)"
          git checkout --detach "$BASE_SHA"
          python - <<'PY'
          from pathlib import Path

          grid_path = Path("receive/grid-lattice.js")
          main_path = Path("receive/main.js")
          version_path = Path("version.js")
          guard_path = Path("receive/lattice-cache-guard.js")

          text = grid_path.read_text()
          main = main_path.read_text()
          version = version_path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "const EXACT_GEOMETRY_MS = 420;\n",
              "const EXACT_GEOMETRY_MS = 420;\n"
              "const SLOT_CORRECTION_REFRESH_MS = 180;\n"
              "const FULL_FIT_REFRESH_MS = 160;\n",
              "lattice cache constants"
          )

          replace_once(
              '''    this.pendingInvalidationReason = "";
              this.slotCorrectionDropTimes = [];
              this.orientationAngle = orientationAngle();''',
              '''    this.pendingInvalidationReason = "";
              this.slotCorrectionDropTimes = [];
              this.frameAt = void 0;
              this.frameSnapshot = void 0;
              this.correctionAt = void 0;
              this.lastFullFitAt = void 0;
              this.fullFitAttemptAt = void 0;
              this.lastPayloadAt = void 0;
              this.orientationAngle = orientationAngle();''',
              "owned runtime fields"
          )

          replace_once(
              '''    globalThis.screen?.orientation?.addEventListener?.("change", this.onOrientationChange);
              globalThis.addEventListener?.("orientationchange", this.onOrientationChange);
            }
            transition(next, reason, at) {''',
              '''    globalThis.screen?.orientation?.addEventListener?.("change", this.onOrientationChange);
              globalThis.addEventListener?.("orientationchange", this.onOrientationChange);
            }
            clearRuntimeCache() {
              this.frameAt = void 0;
              this.frameSnapshot = void 0;
              this.correctionAt = void 0;
              this.lastFullFitAt = void 0;
              this.fullFitAttemptAt = void 0;
              this.lastPayloadAt = void 0;
            }
            cacheFrameSnapshot(at, snapshot) {
              const frameAt = Number(at);
              if (snapshot && Number.isFinite(frameAt)) {
                this.frameAt = frameAt;
                this.frameSnapshot = snapshot;
              }
              return snapshot;
            }
            cacheOutOfBandSnapshot(snapshot) {
              if (snapshot) {
                this.frameSnapshot = snapshot;
                this.frameAt = void 0;
              }
              return snapshot;
            }
            notePayloadAlive(now = monotonicNow()) {
              if (!this.candidate || this.pendingInvalidationReason) return false;
              this.lastPayloadAt = now;
              const geometryAge = now - this.lastHitAt;
              this.transition(
                geometryAge > WHOLE_GRID_SOFT_LOSS_MS ? "PARTIAL_LOSS" : "TRACK",
                geometryAge > WHOLE_GRID_SOFT_LOSS_MS
                  ? "valid payload kept wall alive; geometry awaiting refresh"
                  : "valid payload kept lattice alive",
                now
              );
              return true;
            }
            sameFrameCompatible(detection) {
              const at = Number(detection?.at);
              const candidate = this.candidate;
              if (!candidate || !this.locked || this.pendingInvalidationReason ||
                  !this.frameSnapshot || at !== this.frameAt ||
                  detection?.identity !== this.identity || !Number.isInteger(detection?.slotIndex) ||
                  detection.slotIndex < 0 || detection.slotIndex >= candidate.layout.cols * candidate.layout.rows ||
                  !Number.isFinite(Number(detection?.modules)) ||
                  Number(detection.modules) !== Number(candidate.observations?.[0]?.modules)) return false;
              if (detection.extendedGrid) {
                return Boolean(candidate.layout.extendedGrid) && Number(detection.gridCols) === candidate.layout.cols &&
                  Number(detection.gridRows) === candidate.layout.rows;
              }
              return !candidate.layout.extendedGrid && Number(detection.layoutId) === Number(candidate.layout.id);
            }
            recordSameFrameObservation(detection, frameWidth, frameHeight) {
              const at = Number(detection.at);
              this.lastHitAt = Math.max(this.lastHitAt, at);
              this.frameWidth = Math.max(1, frameWidth);
              this.frameHeight = Math.max(1, frameHeight);

              let existing = -1;
              for (let index = this.observations.length - 1; index >= 0; index--) {
                const item = this.observations[index];
                if (this.lastHitAt - item.at >= OBSERVATION_HISTORY_MS || item.modules !== detection.modules) {
                  this.observations.splice(index, 1);
                  continue;
                }
                if (item.slotIndex === detection.slotIndex) existing = index;
              }

              let geometryFresh = true;
              if (existing >= 0) {
                const prior = this.observations[existing];
                geometryFresh = at > prior.at || at === prior.at && Number(detection.scanId) >= Number(prior.scanId);
                if (geometryFresh) this.observations[existing] = detection;
              } else {
                this.observations.push(detection);
              }

              if (geometryFresh) {
                if (!this.correctionAt) this.correctionAt = new Float64Array(128);
                const slot = detection.slotIndex;
                if (!this.slotCorrections.has(slot) || at - this.correctionAt[slot] >= SLOT_CORRECTION_REFRESH_MS) {
                  this.learnSlotCorrection(detection);
                  this.correctionAt[slot] = at;
                }
              }

              this.notePayloadAlive();
              const snapshot = this.frameSnapshot;
              snapshot.state = this.state;
              snapshot.provisional = !this.active;
              return snapshot;
            }
            transition(next, reason, at) {''',
              "owned cache/liveness methods"
          )

          replace_once(
              '''  get active() {
              return this.state !== "SEARCH" && this.state !== "REACQUIRE";
            }''',
              '''  get active() {
              return this.state !== "SEARCH" && this.state !== "REACQUIRE" && this.state !== "DORMANT";
            }''',
              "dormant active semantics"
          )

          replace_once(
              '''  reset() {
              this.transition("SEARCH", "reset", this.lastHitAt);''',
              '''  reset() {
              this.clearRuntimeCache();
              this.transition("SEARCH", "reset", this.lastHitAt);''',
              "reset cache ownership"
          )

          replace_once(
              '''  reacquire(at, reason = "whole lattice invalidated") {
              this.transition("REACQUIRE", reason, at);''',
              '''  reacquire(at, reason = "whole lattice invalidated") {
              this.clearRuntimeCache();
              this.transition("REACQUIRE", reason, at);''',
              "reacquire cache ownership"
          )

          replace_once(
              '''  accept(detection, frameWidth, frameHeight) {
              var _a;''',
              '''  accept(detection, frameWidth, frameHeight) {
              const at = Number(detection?.at);

              if (this.sameFrameCompatible(detection)) {
                const lastFullFit = Number(this.lastFullFitAt);
                const refreshDue = this.fullFitAttemptAt !== at &&
                  (!Number.isFinite(lastFullFit) || at - lastFullFit >= FULL_FIT_REFRESH_MS);
                if (!refreshDue) return this.recordSameFrameObservation(detection, frameWidth, frameHeight);

                this.fullFitAttemptAt = at;
                const cached = this.frameSnapshot;
                this.frameSnapshot = void 0;
                const result = this.acceptMeasuredGeometry(detection, frameWidth, frameHeight);
                if (result) {
                  this.notePayloadAlive();
                  this.lastFullFitAt = at;
                  return this.cacheFrameSnapshot(at, result);
                }
                this.frameSnapshot = cached;
                return cached ?? result;
              }

              const priorAt = this.frameAt;
              const result = this.acceptMeasuredGeometry(detection, frameWidth, frameHeight);
              if (result) {
                this.notePayloadAlive();
                if (Number.isFinite(at) && priorAt !== at) {
                  this.lastFullFitAt = at;
                  this.fullFitAttemptAt = at;
                }
              }
              return this.cacheFrameSnapshot(at, result);
            }
            acceptMeasuredGeometry(detection, frameWidth, frameHeight) {
              var _a;''',
              "accept ownership"
          )

          replace_once(
              '''  noteValidPacket(at = this.lastHitAt) {
              if (!this.candidate) return false;
              const packetIsCurrent = at >= this.lastHitAt;
              this.lastHitAt = Math.max(this.lastHitAt, at);
              if (packetIsCurrent && this.locked)
                this.transition("TRACK", "valid predicted packet kept lattice alive", at);
              return true;
            }''',
              '''  noteValidPacket() {
              if (!this.candidate) return false;
              return this.notePayloadAlive();
            }''',
              "payload liveness clock"
          )

          replace_once(
              '''  nudgeMotion(motion, at = this.lastHitAt) {
              if (!this.locked || !this.candidate || !motion || at < this.lastHitAt) return null;''',
              '''  nudgeMotion(motion, at = this.lastHitAt) {
              return this.cacheFrameSnapshot(at, this.nudgeMotionGeometry(motion, at));
            }
            nudgeMotionGeometry(motion, at = this.lastHitAt) {
              if (!this.locked || !this.candidate || !motion || at < this.lastHitAt) return null;''',
              "motion cache ownership"
          )

          replace_once(
              '''  dropSlotCorrection(slot, at = monotonicNow()) {
              if (!Number.isInteger(slot) || !this.slotCorrections.has(slot)) return null;''',
              '''  dropSlotCorrection(slot, at = monotonicNow()) {
              return this.cacheOutOfBandSnapshot(this.dropSlotCorrectionMeasured(slot, at));
            }
            dropSlotCorrectionMeasured(slot, at = monotonicNow()) {
              if (!Number.isInteger(slot) || !this.slotCorrections.has(slot)) return null;''',
              "slot correction cache ownership"
          )

          replace_once(
              '''  tick(now) {
              if (this.candidate && this.pendingInvalidationReason) {''',
              '''  tick(now) {
              if (!this.candidate || this.pendingInvalidationReason) {
                return this.cacheOutOfBandSnapshot(this.tickGeometryExpiry(now));
              }

              // Geometry freshness and stream liveness are deliberately separate clocks.
              // A CRC-valid payload proves the known wall is alive at completion time even
              // when measured corners are temporarily old because of phase/rolling shutter.
              const geometryAge = now - this.lastHitAt;
              const payloadAt = Number(this.lastPayloadAt);
              const payloadAge = Number.isFinite(payloadAt) ? now - payloadAt : Infinity;
              if (payloadAge > WHOLE_GRID_HARD_LOSS_MS && geometryAge > WHOLE_GRID_HARD_LOSS_MS) {
                this.transition("DORMANT", "payload silent and whole lattice geometry stale", now);
              } else if (geometryAge > WHOLE_GRID_SOFT_LOSS_MS) {
                this.transition("PARTIAL_LOSS", "wall alive; geometry awaiting bounded refresh", now);
              }

              const snapshot = this.frameSnapshot ?? this.snapshot();
              if (!snapshot) return null;
              this.frameSnapshot = snapshot;
              snapshot.state = this.state;
              snapshot.provisional = !this.active;
              return snapshot;
            }
            tickGeometryExpiry(now) {
              if (this.candidate && this.pendingInvalidationReason) {''',
              "tick liveness ownership"
          )

          replace_once(
              '''  nudgeFromSightings(sightings, at = this.lastHitAt) {
              if (!this.locked || !this.candidate || at < this.lastHitAt || !Array.isArray(sightings) || !sightings.length) return null;''',
              '''  nudgeFromSightings(sightings, at = this.lastHitAt) {
              return this.cacheOutOfBandSnapshot(this.nudgeFromSightingsMeasured(sightings, at));
            }
            nudgeFromSightingsMeasured(sightings, at = this.lastHitAt) {
              if (!this.locked || !this.candidate || at < this.lastHitAt || !Array.isArray(sightings) || !sightings.length) return null;''',
              "sighting cache ownership"
          )

          grid_path.write_text(text)

          guard_import = 'import "./lattice-cache-guard.js";\n'
          if main.count(guard_import) != 1:
              raise SystemExit(f"main guard import: expected 1 match, found {main.count(guard_import)}")
          main_path.write_text(main.replace(guard_import, "", 1))

          if 'APP_VERSION = "0.5.465"' not in version:
              raise SystemExit("expected v0.5.465 base")
          version_path.write_text(version.replace('APP_VERSION = "0.5.465"', 'APP_VERSION = "0.5.467"', 1))

          if not guard_path.exists():
              raise SystemExit("lattice cache guard already missing")
          guard_path.unlink()
          PY
          git config user.name "AirGapper Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receive/grid-lattice.js receive/main.js receive/lattice-cache-guard.js version.js
          git commit -m "Consolidate lattice liveness ownership v0.5.467"
          git push origin HEAD:master --force-with-lease=refs/heads/master:$STAGED_SHA