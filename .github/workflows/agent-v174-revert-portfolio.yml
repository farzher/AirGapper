name: Agent v174 revert portfolio
on:
  push:
    paths:
      - '.github/v174_patch.py'
      - '.github/workflows/agent-v174-revert-portfolio.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v174_patch.py
      - name: Smoke check
        run: |
          node --check main.js
          node --check receive/main.js
          git diff --check
          ! grep -q 'decodePortfolio' receive/main.js
          ! grep -q 'PORTFOLIO_' receive/main.js
          grep -q 'adaptiveWeakSlotScheduling' receive/main.js
          grep -q 'shouldScheduleAdaptiveSlot' receive/main.js
          grep -q 'AUTO_OPTICS_ACQUISITION_RESCUE_MS = 2500' receive/main.js
          grep -q 'v0.5.174' receive/main.js
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js receive/main.js sw.js
          git commit -m 'v0.5.174 remove generalized decode portfolio'
          git push origin master
