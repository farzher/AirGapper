name: apply final hotpath optimizations

on:
  push:
    paths:
      - .github/workflows/apply-final-hotpath.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-hotpath-master
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            codec/source/emsdk
            codec/source/third_party
            codec/source/build-simd
            codec/source/build-scalar
          key: airgapper-codec-emsdk-6.0.6-zxing-${{ hashFiles('codec/source/zxing-cpp.commit') }}

      - name: Apply source optimizations
        run: |
          set -euo pipefail
          node benchmark/apply-final-hotpath-optimizations.mjs
          git diff --check
          node --input-type=module --check < shared/protocol.js
          node --input-type=module --check < receive/runtime.js
          node --input-type=module --check < receive/worker.js
          node --input-type=module --check < receive/guided-motion.js
          node --input-type=module --check < receive/track-processor-proxy.js
          node --input-type=module --check < benchmark/protocol-parse-reuse-smoke.mjs
          node benchmark/guided-motion-smoke.mjs
          node benchmark/protocol-parse-reuse-smoke.mjs
          node benchmark/rgba-luma-smoke.mjs
          node benchmark/worker-pool-reuse-smoke.mjs
          node benchmark/track-processor-proxy-smoke.mjs

      - name: Commit optimized sources locally
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/protocol.js receive/runtime.js receive/worker.js codec/source/wrapper/airgapper_codec.cpp benchmark/protocol-parse-reuse-smoke.mjs .github/workflows/fast-regression.yml
          git commit -m "finish receiver hotpath allocation pass"

      - name: Build optimized codecs
        run: |
          set -euo pipefail
          AIRGAPPER_CODEC_SIMD=1 AIRGAPPER_CODEC_OUTPUT_DIR=.. codec/source/build.sh
          AIRGAPPER_CODEC_SIMD=0 AIRGAPPER_CODEC_OUTPUT_DIR=../scalar codec/source/build.sh
          git diff --check

      - name: Run policy regressions
        run: |
          set -euo pipefail
          node benchmark/grid-lattice-regression.mjs
          node benchmark/browser-performance-policy-smoke.mjs
          node benchmark/camera-start-guard-smoke.mjs
          node benchmark/auto-phase-policy-smoke.mjs
          node benchmark/optics-guard-smoke.mjs
          node benchmark/receiver-recovery-policy-smoke.mjs
          node benchmark/version-source-smoke.mjs
          node benchmark/guided-motion-smoke.mjs
          node benchmark/protocol-parse-reuse-smoke.mjs
          node benchmark/worker-pool-reuse-smoke.mjs

      - name: Install browser regression dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Run worker/browser regressions on rebuilt codec
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs
          node benchmark/direct-y8-worker-smoke.mjs
          node benchmark/repeat-signature-worker-smoke.mjs
          node benchmark/rvfc-wrapper-smoke.mjs
          node benchmark/corpus-suite.mjs

      - name: Build Android app
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug

      - name: Commit rebuilt codec artifacts
        run: |
          set -euo pipefail
          git add codec/airgapper_codec.js codec/airgapper_codec.wasm codec/scalar/airgapper_codec.js codec/scalar/airgapper_codec.wasm
          if ! git diff --cached --quiet; then
            git commit -m "rebuild optimized QR codecs"
          fi

      - name: Push validated optimization commits
        run: |
          set -euo pipefail
          git fetch origin master
          BASE=$(git merge-base HEAD origin/master)
          if [ "$BASE" != "$(git rev-parse origin/master)" ]; then
            echo "master moved while validating; refusing to rewrite validated codec build" >&2
            exit 1
          fi
          git push origin HEAD:master
