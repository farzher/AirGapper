name: apply final hotpath optimizations

on:
  push:
    paths:
      - .github/workflows/apply-final-hotpath.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-hotpath-master
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache codec toolchain
        uses: actions/cache@v4
        with:
          path: |
            codec/source/emsdk
            codec/source/third_party
            codec/source/build-simd
            codec/source/build-scalar
          key: airgapper-codec-emsdk-6.0.6-zxing-${{ hashFiles('codec/source/zxing-cpp.commit') }}

      - name: Apply, validate, rebuild and push
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_HEAD=$(git rev-parse HEAD)
          LOG=/tmp/final-hotpath.log
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          STAGE=setup

          report_failure() {
            status=$?
            trap - ERR
            echo "FINAL HOTPATH FAILURE stage=$STAGE status=$status"
            tail -n 450 "$LOG" > /tmp/final-hotpath-tail.txt || true
            git reset --hard "$BASE_HEAD" || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            {
              printf 'stage=%s\nstatus=%s\n\n' "$STAGE" "$status"
              cat /tmp/final-hotpath-tail.txt
            } > benchmark/final-hotpath-failure.txt
            git add benchmark/final-hotpath-failure.txt
            if git diff --cached --quiet; then
              echo "failure report unchanged"
            else
              git commit -m "report final hotpath validation failure"
              git push origin HEAD:master || true
            fi
            exit "$status"
          }
          trap report_failure ERR

          rm -f benchmark/final-hotpath-failure.txt

          STAGE=generator-fix
          python3 - <<'PY'
          from pathlib import Path

          # The temporary hotpath generator emits a JS template containing its
          # own `${...}` expressions. Escape them for the outer generator.
          path = Path("benchmark/apply-final-hotpath-optimizations.mjs")
          source = path.read_text()
          start = source.index('write("benchmark/protocol-parse-reuse-smoke.mjs"')
          end = source.index('// Keep the final regression permanent', start)
          block = source[start:end].replace('${', r'\${')
          path.write_text(source[:start] + block + source[end:])

          # Exposure writes used to try an exact constraint and then an
          # advanced[] fallback. On browsers that reject exact exposure keys,
          # one logical request became two native camera/HAL mutations. Use one
          # advanced transaction; callers already verify actual settings.
          path = Path("receive/camera-constraints.js")
          source = path.read_text()
          old = '''function exactExposureConstraints(set) {
            const exact = {};
            for (const key of EXPOSURE_KEYS) if (set[key] !== void 0) exact[key] = { exact: set[key] };
            return exact;
          }
          function noteConstraintTimeout(track) {
            constraintBlockedUntil.set(track, performance.now() + CAMERA_CONSTRAINT_TIMEOUT_BACKOFF_MS);
          }
          async function applyConstraint(track, set) {
            if (!Object.keys(set).length) return false;
            if ((constraintBlockedUntil.get(track) ?? 0) > performance.now()) return false;
            const exposureOnly = Object.keys(set).every((key) => EXPOSURE_KEYS.includes(key));
            if (exposureOnly) {
              const strict = await awaitConstraint(track.applyConstraints(exactExposureConstraints(set)));
              if (strict.ok) return true;
              if (strict.timedOut) {
                noteConstraintTimeout(track);
                return false;
              }
            }
            const fallback = await awaitConstraint(track.applyConstraints({ advanced: [set] }));
            if (fallback.timedOut) noteConstraintTimeout(track);
            return fallback.ok;
          }'''
          new = '''function noteConstraintTimeout(track) {
            constraintBlockedUntil.set(track, performance.now() + CAMERA_CONSTRAINT_TIMEOUT_BACKOFF_MS);
          }
          async function applyConstraint(track, set) {
            if (!Object.keys(set).length) return false;
            if ((constraintBlockedUntil.get(track) ?? 0) > performance.now()) return false;
            const result = await awaitConstraint(track.applyConstraints({ advanced: [set] }));
            if (result.timedOut) noteConstraintTimeout(track);
            return result.ok;
          }'''
          if old not in source:
            raise SystemExit("camera-constraints applyConstraint marker drifted")
          path.write_text(source.replace(old, new, 1))
          PY

          STAGE=patch
          node benchmark/apply-final-hotpath-optimizations.mjs
          git diff --check
          node --input-type=module --check < shared/protocol.js
          node --input-type=module --check < receive/runtime.js
          node --input-type=module --check < receive/worker.js
          node --input-type=module --check < receive/camera-constraints.js
          node --input-type=module --check < receive/camera-constraint-guard.js
          node --input-type=module --check < receive/exposure-ev.js
          node --input-type=module --check < receive/acquisition-focus-recovery.js
          node --input-type=module --check < receive/guided-motion.js
          node --input-type=module --check < receive/track-processor-proxy.js
          node --input-type=module --check < benchmark/protocol-parse-reuse-smoke.mjs

          STAGE=source-smokes
          node benchmark/guided-motion-smoke.mjs
          node benchmark/protocol-parse-reuse-smoke.mjs
          node benchmark/rgba-luma-smoke.mjs
          node benchmark/worker-pool-reuse-smoke.mjs
          node benchmark/track-processor-proxy-smoke.mjs
          node benchmark/receiver-recovery-policy-smoke.mjs

          STAGE=source-commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/protocol.js receive/runtime.js receive/worker.js receive/camera-constraints.js codec/source/wrapper/airgapper_codec.cpp benchmark/protocol-parse-reuse-smoke.mjs .github/workflows/fast-regression.yml benchmark/final-hotpath-failure.txt
          git commit -m "finish receiver hotpath allocation pass"

          STAGE=codec-build
          AIRGAPPER_CODEC_SIMD=1 AIRGAPPER_CODEC_OUTPUT_DIR=.. codec/source/build.sh
          AIRGAPPER_CODEC_SIMD=0 AIRGAPPER_CODEC_OUTPUT_DIR=../scalar codec/source/build.sh
          git diff --check

          STAGE=policy-regressions
          node benchmark/grid-lattice-regression.mjs
          node benchmark/browser-performance-policy-smoke.mjs
          node benchmark/camera-start-guard-smoke.mjs
          node benchmark/auto-phase-policy-smoke.mjs
          node benchmark/optics-guard-smoke.mjs
          node benchmark/receiver-recovery-policy-smoke.mjs
          node benchmark/version-source-smoke.mjs
          node benchmark/guided-motion-smoke.mjs
          node benchmark/protocol-parse-reuse-smoke.mjs
          node benchmark/worker-pool-reuse-smoke.mjs

          STAGE=playwright-install
          npm install --no-save --package-lock=false playwright@1.55.0

          STAGE=browser-regressions
          python3 -m http.server 8080 >/tmp/airgapper-http.log 2>&1 &
          SERVER_PID=$!
          AIRGAPPER_TRIALS=3 node benchmark/offline-runner.mjs
          node benchmark/direct-y8-worker-smoke.mjs
          node benchmark/repeat-signature-worker-smoke.mjs
          node benchmark/rvfc-wrapper-smoke.mjs
          node benchmark/corpus-suite.mjs
          kill "$SERVER_PID" 2>/dev/null || true

          STAGE=android-build
          (cd android && ./gradlew assembleDebug)

          STAGE=codec-commit
          git add codec/airgapper_codec.js codec/airgapper_codec.wasm codec/scalar/airgapper_codec.js codec/scalar/airgapper_codec.wasm
          if ! git diff --cached --quiet; then
            git commit -m "rebuild optimized QR codecs"
          fi

          STAGE=push
          git fetch origin master
          if [ "$(git merge-base HEAD origin/master)" != "$(git rev-parse origin/master)" ]; then
            echo "master moved while validating; refusing to push a build validated against another base" >&2
            false
          fi
          git push origin HEAD:master
          trap - ERR
