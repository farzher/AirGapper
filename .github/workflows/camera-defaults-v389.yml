name: camera defaults v389

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/camera-defaults-v389.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply
        run: |
          set -euo pipefail
          python3 .github/scripts/camera-defaults-v389.py
          git config user.name "AirGapper Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/camera-defaults-v389.yml .github/scripts/camera-defaults-v389.py
          git add receive/main.js version.js
          git commit -m "v0.5.389: prefer main rear camera at 1440p"
          git push origin HEAD:master
# trigger
