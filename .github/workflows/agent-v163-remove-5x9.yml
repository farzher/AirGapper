name: Agent v163 remove 5x9 layout
on:
  push:
    paths:
      - '.github/v163_patch.py'
      - '.github/workflows/agent-v163-remove-5x9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/v163_patch.py
      - name: Commit patch
        run: |
          git config user.name 'AirGapper Agent'
          git config user.email 'actions@github.com'
          git add index.html main.js send/main.js receive/main.js shared/grid-layout.js shared/protocol.js sw.js
          git commit -m 'v0.5.163 remove failed 5x9 QR layout'
          git push origin master
