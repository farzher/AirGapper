<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AirGrid 1420 Acquisition Test</title>
<style>
:root{font-family:system-ui,sans-serif;color:#eee;background:#111;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111}.shell{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.build{font:12px ui-monospace,monospace;color:#83ef9b}.card{margin-top:14px;padding:14px;border:1px solid #333;border-radius:10px;background:#181818}button{font:inherit;padding:11px 14px;border:1px solid #555;border-radius:8px;background:#eee;color:#111}.modes button{background:#222;color:#eee}.modes button.active{background:#eee;color:#111}.hidden{display:none!important}.status{margin-top:10px;font:13px ui-monospace,monospace;white-space:pre-wrap}.preview{position:relative;margin-top:12px;background:#000;border-radius:10px;overflow:hidden}.preview video{display:block;width:100%;max-height:72vh}.preview canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sender{position:fixed;inset:0;background:#fff;z-index:9999;display:none;overflow:hidden;color:#000}.sender.active{display:block}.qr{position:absolute;width:23.5vmin;height:23.5vmin;transform:translate(-50%,-50%);background:#fff}.qr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}.qTL{left:13%;top:13%}.qTR{left:87%;top:13%}.qBR{left:87%;top:87%}.qBL{left:13%;top:87%}.sender-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#000;font:700 clamp(18px,3vmin,44px) ui-monospace,monospace}.sender-center small{display:block;margin-top:10px;font-size:.48em;font-weight:500}.sender-exit{position:absolute;right:10px;bottom:10px;font:12px ui-monospace,monospace;color:#333}.error{color:#ff8383}
</style>
</head>
<body>
<div class="shell">
 <div class="top"><div><b>AirGrid acquisition bring-up</b> <span class="build">AGRS-20260823-1420</span></div><div class="modes"><button id="send-mode">Sender</button><button id="recv-mode">Receiver</button></div></div>
 <section id="send-panel" class="card hidden">
  <button id="start-sender">Render + fullscreen acquisition</button>
  <button id="show-sender">Render without fullscreen</button>
  <div id="sender-status" class="status">DOM/SVG acquisition only. No canvas, animation, AirGrid data, PAM4, or render loop.</div>
 </section>
 <section id="recv-panel" class="card hidden">
  <button id="start-camera">Start camera</button> <button id="stop-camera" disabled>Stop</button>
  <div id="status" class="status">Camera stopped · AGRS-20260823-1420</div>
  <div class="preview"><video id="video" muted playsinline></video><canvas id="overlay"></canvas></div>
  <div id="details" class="status"></div>
 </section>
</div>
<div id="sender" class="sender">
 <div id="qr-TL" class="qr qTL"></div><div id="qr-TR" class="qr qTR"></div><div id="qr-BR" class="qr qBR"></div><div id="qr-BL" class="qr qBL"></div>
 <div class="sender-center">AIRGRID ACQUIRE<small>AGRS-20260823-1420 · BINARY · STATIC SVG</small></div>
 <div class="sender-exit">Esc to exit</div>
</div>
<script type="module" src="./airgrid-lab-1420.js"></script>
</body>
</html>
