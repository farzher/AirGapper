<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AirGapper — Air-gapped file transfer</title>
  <meta name="description" content="Transfer a file or text offline with animated QR codes." />
  <meta name="theme-color" content="#f7f7f5" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' data: blob:; img-src data: blob:; media-src 'self' blob: mediastream:; manifest-src 'self'; base-uri 'none'; form-action 'none'" />
  <link rel="canonical" href="%SITE_URL%" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fff'/%3E%3Cpath d='M14 46 29 14h6l15 32h-8l-3-8H25l-3 8zm14-15h8l-4-10z' fill='%23141414'/%3E%3C/svg%3E" type="image/svg+xml" />
  <link rel="stylesheet" href="./shared/style.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <button class="brand-button" id="home-button" type="button">
      <span class="brand">AirGapper</span>
      <span class="tag">Air-gapped file transfer</span>
    </button>
    <div class="header-actions"><button class="download-offline" id="download-offline" type="button">Download offline</button></div>
  </header>

  <main class="app-main">
    <section id="homeView" class="view active">
      <div class="home">
        <button class="mode" data-mode="send" type="button">Send</button>
        <button class="mode" data-mode="receive" type="button">Receive</button>
      </div>
    </section>

    <section id="sendView" class="view send-shell">
      <div class="send-start">
        <label class="file-picker drop" id="pane-file">
          <input id="cfg-file" type="file" multiple />
          <span><strong class="file-picker-button" id="file-picker-button">Drop files here</strong><span class="sub" id="file-picker-label">or select files</span></span>
        </label>
        <div class="note-composer text-wrap" id="pane-snippet">
          <label for="snippet-text" id="snippet-label" class="sr-only">Text to send</label>
          <textarea id="snippet-text" rows="7" placeholder="Or paste text…"></textarea>
          <button id="send-snippet" class="text-send" type="button">Send text</button>
        </div>
      </div>
      <div class="stage" id="stage" hidden>
        <canvas id="qr" width="16" height="16"></canvas>
        <div class="stage-bottom" id="stage-bottom">
          <div class="selection-summary" id="selection-summary" hidden></div>
          <div class="send-controls" id="send-controls" hidden>
            <label><span>Speed</span><input id="cfg-fps" type="range" min="1" max="60" step="1" value="20" /><output id="fps-value">20 fps</output></label>
            <label><span>Size</span><input id="cfg-size" type="range" min="0" max="8" step="1" value="5" /><output id="size-value">2.9 KB · 1 QR</output></label>
          </div>
        </div>
      </div>
      <div class="hint status-line" id="specs"></div>
    </section>

    <section id="receiveView" class="view receiver-shell">
      <section class="receiver-primary">
        <div class="receiver-heading"><div class="hint status-line" id="stats"></div></div>
        <button id="start" class="enable-camera" type="button" hidden>Enable camera</button>
        <div class="preview-zone" id="preview" style="display:none">
          <div class="preview receive-card">
            <video id="video" muted playsinline></video><canvas id="detect-overlay" class="detect-overlay" aria-hidden="true"></canvas>
          </div>
        </div>
        <section class="transfer-panel" id="metrics" style="display:none" aria-live="polite">
          <div class="transfer-progress" id="progress-status">
            <div class="transfer-summary">
              <strong id="progress-label">0%</strong>
              <div class="speed-feedback" id="speed-feedback"><strong id="m-rate">— KB/s</strong><span class="speed-quality" id="speed-quality">Waiting</span></div>
            </div>
            <div class="progress" id="progress" role="progressbar" aria-label="Transfer progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
            <div class="transfer-meta"><span id="eta-label">Waiting for QR</span><div class="pipeline-metrics"><span>Capture <strong id="m-cap">— fps</strong></span><span>Decode <strong id="m-dec">— fps</strong></span></div></div>
          </div>
        </section>
        <div id="result"></div>
      </section>
    </section>
  </main>

</div>

<script type="module" src="./app/main.ts"></script>
</body>
</html>
