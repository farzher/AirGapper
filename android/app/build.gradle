plugins {
    id "com.android.application"
}

def releaseKeystore = System.getenv("AIRGAPPER_RELEASE_KEYSTORE")
def releasePassword = System.getenv("AIRGAPPER_RELEASE_PASSWORD")
def hasReleaseSigning = releaseKeystore && releasePassword

android {
    namespace "com.airgapper.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.airgapper.app"
        minSdk 23
        targetSdk 29
        versionCode 357
        versionName "0.5.357"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword releasePassword
                keyAlias "airgapper"
                keyPassword releasePassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release" && gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
            if (!hasReleaseSigning) {
                throw new GradleException("Release signing requires AIRGAPPER_RELEASE_KEYSTORE and AIRGAPPER_RELEASE_PASSWORD")
            }
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
}

tasks.register("syncWebApp", Copy) {
    from(rootProject.projectDir.parentFile.parentFile) {
        exclude ".git/**"
        exclude ".github/**"
        exclude "android/**"
        exclude "node_modules/**"
        exclude "AirGapper.apk"
        exclude "*.jks"
        exclude "*.keystore"
        exclude "*.p12"
    }
    into(layout.projectDirectory.dir("src/main/assets"))
}

preBuild.dependsOn syncWebApp
