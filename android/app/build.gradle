plugins {
    id "com.android.application"
}

def releaseKeystore = System.getenv("AIRGAPPER_RELEASE_KEYSTORE")
def releasePassword = System.getenv("AIRGAPPER_RELEASE_PASSWORD")
def hasReleaseSigning = releaseKeystore && releasePassword

def versionSource = rootProject.file("../version.js").getText("UTF-8")
def versionMatch = versionSource =~ /APP_VERSION\s*=\s*"([^"]+)"/
if (!versionMatch.find()) throw new GradleException("version.js must export APP_VERSION")
def appVersion = versionMatch.group(1)
def appVersionParts = appVersion.tokenize(".")
if (appVersionParts.size() != 3 || !appVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("APP_VERSION must be numeric semver, got ${appVersion}")
}
def versionMajor = appVersionParts[0].toInteger()
def versionMinor = appVersionParts[1].toInteger()
def versionPatch = appVersionParts[2].toInteger()
if (versionMinor >= 100 || versionPatch >= 10000) {
    throw new GradleException("APP_VERSION exceeds Android versionCode allocation: ${appVersion}")
}
def appVersionCode = versionMajor * 1000000 + versionMinor * 10000 + versionPatch

android {
    namespace "com.airgapper.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.airgapper.app"
        minSdk 23
        targetSdk 29
        versionCode appVersionCode
        versionName appVersion
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword releasePassword
                keyAlias "airgapper"
                keyPassword releasePassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    lint {
        disable "ExpiredTargetSdkVersion"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir("$buildDir/generated/webAssets")
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.15.0"
}

gradle.taskGraph.whenReady { graph ->
    def releaseBuild = graph.allTasks.any { task ->
        task.name == "assembleRelease" || task.name == "packageRelease" || task.name == "bundleRelease"
    }
    if (releaseBuild && !hasReleaseSigning) {
        throw new GradleException("Release signing requires AIRGAPPER_RELEASE_KEYSTORE and AIRGAPPER_RELEASE_PASSWORD")
    }
}

def syncWebApp = tasks.register("syncWebApp", Copy) {
    from(rootProject.file("../")) {
        include "index.html"
        include "manifest.webmanifest"
        include "sw.js"
        include "version.js"
        include "icon-*.png"
        include "main.js"
        include "send/**"
        include "receive/**"
        include "shared/**"
        include "vendor/qrcode.js"
        include "vendor/raptorq/raptorq.js"
        include "vendor/raptorq/raptorq_bg.wasm"
        include "codec/airgapper_codec.js"
        include "codec/airgapper_codec.wasm"
        include "codec/scalar/airgapper_codec.js"
        include "codec/scalar/airgapper_codec.wasm"
    }
    into(layout.buildDirectory.dir("generated/webAssets"))
    doLast {
        def app = layout.buildDirectory.file("generated/webAssets/index.html").get().asFile
        app.setText(app.getText("UTF-8").replace(
                "script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'",
                "script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'"), "UTF-8")
    }
}

tasks.named("preBuild").configure {
    dependsOn(syncWebApp)
}
