plugins {
    id "com.android.application"
}

android {
    namespace "com.airgapper.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.airgapper.app"
        minSdk 23
        targetSdk 29
        versionCode 56
        versionName "0.1.63"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    lint {
        disable "ExpiredTargetSdkVersion"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir("$buildDir/generated/webAssets")
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"
}

def syncWebApp = tasks.register("syncWebApp", Copy) {
    from(rootProject.file("../index.html"))
    into(layout.buildDirectory.dir("generated/webAssets"))
    doLast {
        def app = layout.buildDirectory.file("generated/webAssets/index.html").get().asFile
        app.setText(app.getText("UTF-8").replace(
                "script-src 'unsafe-inline' 'wasm-unsafe-eval'",
                "script-src 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'"), "UTF-8")
    }
}

tasks.named("preBuild").configure {
    dependsOn(syncWebApp)
}
