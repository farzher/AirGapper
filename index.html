  <header class="app-header">

      <button class="header-qr-button" id="receiver-link-open" type="button" aria-label="Show phone receiver link" aria-haspopup="dialog">

            <button id="send-snippet" class="text-send" type="button">Send text</button>

        </div>
      </div>
      <div class="stage" id="stage" hidden>

              <div class="speed-feedback" id="speed-feedback"><strong id="m-rate">— KB/s</strong></div>
            </div>
            <div class="progress" id="progress" role="progressbar" aria-label="Transfer progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
            <div class="transfer-meta"><span class="transfer-estimate"><span id="transfer-size-label"></span><span id="eta-label">Waiting for QR</span></span><div class="pipeline-metrics" id="pipeline-metrics"><span id="m-limit"></span><span><strong id="m-cap">— fps</strong></span><span><strong id="m-dec">— QR/s</strong></span></div></div>
          </div>
        </section>
      </section>
    </section>
  </main>

</div>

<dialog class="scan-dialog" id="scan-dialog" aria-label="Captured decoder scan">
  <div class="scan-dialog-card">
    <div class="scan-dialog-header"><strong>Captured scan</strong><button class="ghost" id="close-scan" type="button">Close</button></div>
    <p class="scan-dialog-status" id="scan-dialog-status"></p>
    <canvas class="scan-capture" id="scan-capture" aria-label="Exact image submitted to the QR decoder with result overlays"></canvas>
    <p class="scan-dialog-legend"><span class="scan-track">Tracked search</span><span class="scan-hit">Decoded</span><span class="scan-sighting" id="scan-sighting-legend">Found by full scan</span></p>
  </div>
</dialog>

<dialog class="receiver-link-dialog" id="receiver-link-dialog" aria-label="Phone receiver link">
  <canvas id="receiver-link-qr-large" class="receiver-link-qr-large" aria-hidden="true"></canvas>
  <p>Scan to open AirGapper Receive.</p>
  <a id="receiver-link-url"></a>
</dialog>

</body>
</html>
