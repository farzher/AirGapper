<link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:inline-sw">if('serviceWorker' in navigator) {window.addEventListener('load', () => {navigator.serviceWorker.register('./sw.js', { scope: './' })})}</script></head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand-lockup">
      <button class="header-qr-button" id="receiver-link-open" type="button" aria-label="Show phone receiver link" aria-haspopup="dialog">
        <canvas id="receiver-link-qr" class="header-qr" data-receiver-url="https://farzher.github.io/AirGapper/?r" aria-hidden="true"></canvas>
      </button>
      <button class="brand-button" id="home-button" type="button">
        <span class="brand">AirGapper <span class="app-version">v0.1.47</span></span>
        <span class="tag">Air-gapped file transfer</span>
      </button>
    </div>
    <a class="apk-download" href="./AirGapper.apk" download>Download .apk</a>
  </header>

  <main class="app-main">
    <section id="homeView" class="view active">
      <div class="home">
        <button class="mode" data-mode="send" type="button">Send</button>
        <button class="mode" data-mode="receive" type="button">Receive</button>
      </div>
    </section>

    <section id="sendView" class="view send-shell">
      <div class="send-start">
        <div class="send-inputs">
          <label class="file-picker drop" id="pane-file">
            <input id="cfg-file" type="file" multiple />
            <span><strong class="file-picker-button" id="file-picker-button">Drop files here</strong><span class="sub" id="file-picker-label">or select files</span></span>
          </label>
          <div class="note-composer text-wrap" id="pane-snippet">
            <label for="snippet-text" id="snippet-label" class="sr-only">Text to send</label>
            <textarea id="snippet-text" rows="7" placeholder="Or paste text…"></textarea>
            <button id="send-snippet" class="text-send" type="button">Send text</button>
          </div>
        </div>
      </div>
      <div class="stage" id="stage" hidden>
        <div class="stage-error" id="stage-error" role="alert" hidden></div>
        <canvas id="qr" width="16" height="16"></canvas>
        <div class="stage-bottom" id="stage-bottom">
          <div class="selection-summary" id="selection-summary" hidden></div>
          <div class="send-controls" id="send-controls" hidden>
            <label class="speed-control"><span>Speed</span><select id="cfg-fps"><option value="1">1 fps</option><option value="5">5 fps</option><option value="10">10 fps</option><option value="15" selected>15 fps</option><option value="20">20 fps</option><option value="24">24 fps</option><option value="30">30 fps</option><option value="55">55 fps</option><option value="60">60 fps</option><option value="custom">Custom…</option></select><input id="cfg-fps-custom" type="number" min="1" max="480" step="1" value="15" aria-label="Custom frames per second" hidden /></label>
            <label><span>Size</span><select id="cfg-size"></select></label>
            <label><span>Layout</span><select id="cfg-layout"><option value="single" selected>1:1</option><option value="one-two">1:2</option><option value="two-two">2:2</option><option value="two-three">2:3</option><option value="four-three">3:4</option><option value="three-five">3:5</option><option value="five-three">5:3</option></select></label>
            <label><span>Scaling</span><select id="cfg-scaling"><option value="integer">Pixel perfect</option><option value="fit">Fit screen</option></select></label>
          </div>
        </div>
      </div>
      <div class="hint status-line" id="specs"></div>
    </section>

    <section id="receiveView" class="view receiver-shell">
      <section class="receiver-primary">
        <div class="receiver-heading"><div class="hint status-line" id="stats"></div></div>
        <button id="start" class="enable-camera" type="button" hidden>Enable camera</button>
        <div class="preview-zone camera-loading" id="preview">
          <div class="preview receive-card">
            <video id="video" muted playsinline></video><canvas id="detect-overlay" class="detect-overlay" aria-hidden="true"></canvas>
            <div class="camera-loader" role="status"><span class="camera-spinner" aria-hidden="true"></span><span>Starting camera…</span></div>
          </div>
        </div>
        <div id="result"></div>
        <details class="settings receiver-settings">
          <summary>Settings <span class="settings-actual" id="camera-actual"></span></summary>
          <div class="row">
            <label id="camera-resolution-control"><span id="camera-resolution-label">Resolution</span><select id="camera-resolution"></select></label>
            <label id="decode-workers-control"><span>Workers</span><select id="decode-workers"><option value="auto" selected>Auto</option></select></label>
            <label id="camera-exposure-control" class="exposure-auto" hidden><span>Exposure</span><span class="setting-toggle"><input id="camera-exposure-auto" type="checkbox" checked /><span>Auto</span></span></label>
            <label id="camera-exposure-manual" class="exposure-manual" hidden><span>Exposure time · <output id="camera-exposure-value"></output></span><input id="camera-exposure" type="range" min="0" max="0" value="0" step="1" /></label>
            <button class="secondary-button scan-capture-button" id="capture-scan" type="button">Capture</button>
          </div>
        </details>
        <section class="transfer-panel" id="metrics" aria-live="polite">
          <div class="transfer-progress" id="progress-status">
            <div class="transfer-summary">
              <div class="progress-amount"><strong id="progress-label">0%</strong></div>
              <div class="speed-feedback" id="speed-feedback"><strong id="m-rate">— KB/s</strong></div>
            </div>
            <div class="progress" id="progress" role="progressbar" aria-label="Transfer progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
            <div class="transfer-meta"><span class="transfer-estimate"><span id="transfer-size-label"></span><span id="eta-label">Waiting for QR</span></span><div class="pipeline-metrics" id="pipeline-metrics"><span id="m-limit"></span><span><strong id="m-cap">— fps</strong></span><span><strong id="m-dec">— QR/s</strong></span></div></div>
          </div>
        </section>
      </section>
    </section>
  </main>

</div>

<dialog class="scan-dialog" id="scan-dialog" aria-label="Captured decoder scan">
  <div class="scan-dialog-card">
    <div class="scan-dialog-header"><strong>Captured scan</strong><button class="ghost" id="close-scan" type="button">Close</button></div>
    <p class="scan-dialog-status" id="scan-dialog-status"></p>
    <canvas class="scan-capture" id="scan-capture" aria-label="Exact image submitted to the QR decoder with result overlays"></canvas>
    <p class="scan-dialog-legend"><span class="scan-track">Tracked search</span><span class="scan-hit">Decoded</span><span class="scan-sighting" id="scan-sighting-legend">Found by full scan</span></p>
  </div>
</dialog>

<dialog class="receiver-link-dialog" id="receiver-link-dialog" aria-label="Phone receiver link">
  <canvas id="receiver-link-qr-large" class="receiver-link-qr-large" aria-hidden="true"></canvas>
  <p>Scan to open AirGapper Receive.</p>
  <a id="receiver-link-url"></a>
</dialog>

</body>
</html>
