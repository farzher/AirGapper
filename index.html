<!doctype html>
<!-- AirGapper v7: ZXing-C++ WebAssembly receiver -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>AirGapper — Air-gapped file transfer</title>
<style>
  :root { color-scheme: light; --bg:#f7f7f5; --card:#fff; --ink:#141414; --muted:#777; --line:#e7e7e3; --soft:#efefec; --good:#21864a; --warn:#a56a00; --bad:#b93838; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:15px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  button,input,textarea { font:inherit; }
  button { color:inherit; }
  .app { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  header { width:min(920px,calc(100% - 32px)); margin:0 auto; padding:22px 0 10px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .brand { font-weight:750; font-size:18px; letter-spacing:-.02em; }
  .tag { color:var(--muted); font-size:12px; margin-top:2px; }
  .version { display:inline-block; margin-left:6px; color:#aaa; font-size:10px; font-weight:650; vertical-align:1px; }
  .ghost { border:1px solid var(--line); background:transparent; border-radius:10px; padding:8px 11px; cursor:pointer; }
  .ghost:hover { background:var(--card); }
  main { width:min(920px,calc(100% - 32px)); margin:auto; padding:24px 0 42px; }
  .home { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .mode { min-height:180px; border:1px solid var(--line); background:var(--card); border-radius:20px; cursor:pointer; font-weight:700; font-size:27px; letter-spacing:-.035em; transition:.16s ease; }
  .mode:hover { transform:translateY(-2px); border-color:#d3d3ce; box-shadow:0 12px 36px #00000009; }
  .view { display:none; }
  .view.active { display:block; }
  .topline { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; }
  .back { border:0; background:transparent; padding:6px 0; cursor:pointer; color:var(--muted); }
  .back:hover { color:var(--ink); }
  .title { font-weight:700; font-size:17px; }
  .sendStart { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .drop,.textWrap { min-height:240px; border:1px solid var(--line); background:var(--card); border-radius:18px; }
  .drop { display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer; position:relative; transition:.14s; }
  .drop.drag { border-color:#999; background:#fbfbfa; transform:scale(.995); }
  .drop input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .drop strong { display:block; font-size:18px; margin-bottom:5px; }
  .sub { color:var(--muted); font-size:12px; }
  .textWrap { padding:16px; display:flex; flex-direction:column; gap:10px; }
  textarea { resize:none; flex:1; border:0; outline:0; background:transparent; color:var(--ink); font-size:17px; line-height:1.45; }
  textarea::placeholder { color:#aaa; }
  .textSend { align-self:flex-end; border:0; background:#171717; color:white; border-radius:10px; padding:8px 13px; cursor:pointer; font-weight:650; }
  .textSend:disabled { opacity:.35; cursor:default; }
  .sender { display:none; }
  .sender.active { display:block; }
  .qrStage { position:relative; background:white; border:1px solid var(--line); border-radius:20px; overflow:hidden; min-height:470px; display:flex; align-items:center; justify-content:center; }
  #qrCanvas { width:100%; height:100%; min-height:470px; display:block; background:#fff; }
  .qrOverlay { position:absolute; inset:auto 12px 12px 12px; display:flex; justify-content:space-between; align-items:end; pointer-events:none; mix-blend-mode:multiply; }
  .qrMeta { background:#ffffffdd; backdrop-filter:blur(8px); border:1px solid #ecece8; border-radius:12px; padding:7px 9px; font-size:11px; color:#555; }
  .fullscreen { pointer-events:auto; border:1px solid #ddd; background:#fffffff0; border-radius:10px; padding:8px 10px; cursor:pointer; }
  .qrStage:fullscreen { width:100vw; height:100vh; border:0; border-radius:0; }
  .qrStage:fullscreen #qrCanvas { min-height:100vh; }
  .controls { margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .control { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .controlHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .controlHead b { font-size:13px; }
  .value { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  input[type=range] { width:100%; accent-color:#222; }
  .sendInfo { margin-top:9px; color:var(--muted); font-size:12px; text-align:center; }
  .receiveCard { border:1px solid var(--line); background:#111; border-radius:20px; overflow:hidden; position:relative; min-height:520px; }
  #video { width:100%; height:520px; object-fit:cover; display:block; background:#111; }
  .scanShade { position:absolute; inset:0; pointer-events:none; background:linear-gradient(#0002,#0000 22%,#0000 78%,#0002); }
  .scanBox { position:absolute; inset:50% auto auto 50%; transform:translate(-50%,-50%); width:min(78%,560px); aspect-ratio:1; border:1px solid #ffffff88; border-radius:24px; box-shadow:0 0 0 999px #00000018; pointer-events:none; }
  .scanBox:before,.scanBox:after { content:""; position:absolute; width:48px; height:48px; border-color:white; border-style:solid; }
  .scanBox:before { left:-1px; top:-1px; border-width:3px 0 0 3px; border-radius:20px 0 0 0; }
  .scanBox:after { right:-1px; bottom:-1px; border-width:0 3px 3px 0; border-radius:0 0 20px 0; }
  .receiveHud { position:absolute; left:12px; right:12px; bottom:12px; display:flex; align-items:end; justify-content:space-between; gap:10px; }
  .statusCard { min-width:220px; background:#111d; color:white; border:1px solid #ffffff25; backdrop-filter:blur(10px); border-radius:14px; padding:10px 11px; }
  .statusTop { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:650; }
  .dot { width:8px; height:8px; border-radius:50%; background:#aaa; box-shadow:0 0 0 3px #ffffff16; }
  .dot.good { background:#57d985; }
  .dot.warn { background:#f4bd59; }
  .dot.bad { background:#f26c6c; }
  .stats { margin-top:7px; display:flex; flex-wrap:wrap; gap:4px 12px; color:#ffffffb0; font-size:11px; font-variant-numeric:tabular-nums; }
  .progressBar { height:3px; background:#ffffff25; margin-top:9px; overflow:hidden; border-radius:9px; }
  .progressBar i { display:block; height:100%; width:0; background:white; transition:width .15s linear; }
  .cameraBtn { border:1px solid #ffffff35; background:#111c; color:white; border-radius:11px; padding:9px 11px; cursor:pointer; backdrop-filter:blur(8px); }
  .cameraGate { position:absolute; inset:0; display:none; place-items:center; background:#111; z-index:3; }
  .cameraGate.active { display:grid; }
  .enableCamera { border:1px solid #ffffff35; background:#fff; color:#111; border-radius:12px; padding:11px 16px; cursor:pointer; font-weight:700; }
  .result { margin-top:12px; border:1px solid var(--line); background:var(--card); border-radius:16px; padding:14px; display:none; }
  .result.active { display:block; }
  .resultHead { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .resultTitle { font-weight:700; }
  .files { display:grid; gap:8px; margin-top:10px; }
  .fileRow { display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding-top:9px; }
  .fileName { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .smallBtn { border:1px solid var(--line); background:var(--soft); border-radius:9px; padding:6px 9px; cursor:pointer; flex:none; }
  .textResult { margin-top:10px; white-space:pre-wrap; word-break:break-word; background:var(--bg); border-radius:10px; padding:12px; max-height:260px; overflow:auto; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,15px); opacity:0; pointer-events:none; background:#111; color:#fff; padding:9px 12px; border-radius:10px; font-size:12px; transition:.18s; z-index:50; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  /* Once a transfer starts, give the optical surface the whole viewport. */
  body.sending { overflow:hidden; }
  body.sending .app { height:100vh; height:100dvh; min-height:0; }
  body.sending header { display:none; }
  body.sending main { width:100%; flex:1; min-height:0; margin:0; padding:8px; }
  body.sending #sendView.active { height:100%; min-height:0; display:flex; flex-direction:column; }
  body.sending #sendView .topline { flex:none; height:34px; margin:0 4px 7px; }
  body.sending #sender.active { flex:1; min-height:0; display:flex; flex-direction:column; }
  body.sending .qrStage { flex:1; min-height:0; border-radius:14px; }
  body.sending #qrCanvas { height:100%; min-height:0; }
  body.sending .controls { flex:none; margin-top:8px; gap:8px; }
  body.sending .control { padding:9px 12px; }
  body.sending .controlHead { margin-bottom:5px; }
  body.sending .sendInfo { flex:none; margin:6px 0 0; min-height:16px; }
  @media(max-width:700px){
    header { padding-top:16px; }
    main { padding-top:12px; }
    .home,.sendStart,.controls { grid-template-columns:1fr; }
    body.sending .controls { grid-template-columns:1fr 1fr; }
    .mode { min-height:130px; }
    .drop,.textWrap { min-height:190px; }
    .qrStage,#qrCanvas { min-height:390px; }
    body.sending .qrStage,body.sending #qrCanvas { min-height:0; }
    .receiveCard,#video { height:calc(100dvh - 175px); min-height:430px; }
    .statusCard { min-width:0; flex:1; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="brand">AirGapper <span class="version">v7</span></div><div class="tag">Air-gapped file transfer</div></div>
    <button class="ghost" id="offlineBtn">Download offline</button>
  </header>

  <main>
    <section id="homeView" class="view active">
      <div class="home">
        <button class="mode" data-mode="send">Send</button>
        <button class="mode" data-mode="receive">Receive</button>
      </div>
    </section>

    <section id="sendView" class="view">
      <div class="topline"><button class="back">← Back</button><div class="title">Send</div><div style="width:42px"></div></div>
      <div id="sendStart" class="sendStart">
        <label class="drop" id="dropZone">
          <input id="fileInput" type="file" multiple>
          <div><strong>Drop files</strong><div class="sub">or click to choose</div></div>
        </label>
        <div class="textWrap"><textarea id="textInput" placeholder="Or paste text…"></textarea><button class="textSend" id="textSendBtn" disabled>Send text</button></div>
      </div>

      <div id="sender" class="sender">
        <div class="qrStage" id="qrStage">
          <canvas id="qrCanvas"></canvas>
          <div class="qrOverlay">
            <div class="qrMeta" id="qrMeta">Preparing…</div>
            <button class="fullscreen" id="fullscreenBtn">Fullscreen</button>
          </div>
        </div>
        <div class="controls">
          <div class="control">
            <div class="controlHead"><b>Speed</b><span class="value" id="fpsValue">10 FPS</span></div>
            <input id="fpsRange" type="range" min="1" max="60" step="1" value="10">
          </div>
          <div class="control">
            <div class="controlHead"><b>Size</b><span class="value" id="sizeValue">1.4 KB/frame · 1 QR</span></div>
            <input id="sizeRange" type="range" min="300" max="16800" step="100" value="1400">
          </div>
        </div>
        <div class="sendInfo" id="sendInfo"></div>
      </div>
    </section>

    <section id="receiveView" class="view">
      <div class="topline"><button class="back">← Back</button><div class="title">Receive</div><div style="width:42px"></div></div>
      <div class="receiveCard">
        <video id="video" playsinline muted></video>
        <div class="cameraGate" id="cameraGate"><button class="enableCamera" id="enableCameraBtn">Enable camera</button></div>
        <div class="scanShade"></div><div class="scanBox"></div>
        <div class="receiveHud">
          <div class="statusCard">
            <div class="statusTop"><span id="statusDot" class="dot"></span><span id="statusText">Starting camera…</span></div>
            <div class="stats"><span id="progressText">0%</span><span id="rateText">— KB/s</span><span id="etaText">— ETA</span><span id="cameraText">— camera</span><span id="scanText">— scan</span><span id="dropText">— loss</span></div>
            <div class="progressBar"><i id="progressFill"></i></div>
          </div>
          <button class="cameraBtn" id="flipBtn">Flip</button>
        </div>
      </div>
      <div class="result" id="result"></div>
      <canvas id="scanCanvas" hidden></canvas>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script data-vendor="qrcode" src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script data-vendor="zxing" src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.2/dist/iife/reader/index.js"></script>
<script data-vendor="jsqr" src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script data-vendor="fflate" src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script>
(() => {
'use strict';

const BUILD='v7';
document.documentElement.dataset.airgapperBuild=BUILD;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const enc = new TextEncoder();
const dec = new TextDecoder();

// QR Version 40-L has 4296 alphanumeric chars. Base45 lets binary use that mode
// efficiently; 2750 data bytes + our binary header stays comfortably below it.
const MAX_SYMBOL_BYTES = 2800;
const QR_COUNTS = [1, 2, 4, 6];
const PACKET_HEADER = 37;
const B45 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
const B45_REV = (() => { const a = new Int16Array(128); a.fill(-1); for (let i=0;i<B45.length;i++) a[B45.charCodeAt(i)] = i; return a; })();

const state = {
  mode:'home', stream:null, facing:'environment', scanToken:0,
  transfer:null, sendTimer:null, esi:0, displaySeq:0,
  rx:null, barcodeDetector:null,
  cameraFps:0, cameraMeasuredFps:0, cameraFrameCount:0, cameraWindowAt:0, lastPresentedFrames:null,
  scanRate:0, scanCount:0, scanWindowAt:0, lastDecodeAt:0,
  probeIndex:0, senderActualFps:0, senderFrameCount:0, senderWindowAt:0,
  scanWorkers:[], scanWorkerUrl:null, scanCaptureBusy:false, scanJobSeq:0,
  rxByteRate:0, rxRateBytes:0, rxRateAt:0,
  decodeMs:0, decodeSamples:0, scanEngine:'', wasmFailures:0,
};

function toast(msg) {
  const el=$('#toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1700);
}
function humanBytes(n) {
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(n<10240?1:0)+' KB';
  return (n/1048576).toFixed(n<10485760?1:0)+' MB';
}
function humanRate(bytesPerSec) {
  if(!bytesPerSec||bytesPerSec<1)return '— KB/s';
  const kb=bytesPerSec/1024;
  return `${kb<10?kb.toFixed(1):Math.round(kb)} KB/s`;
}
function humanEta(seconds) {
  if(!Number.isFinite(seconds)||seconds<0)return '— ETA';
  if(seconds<1)return '<1s ETA';
  if(seconds<60)return `${Math.ceil(seconds)}s ETA`;
  const m=Math.floor(seconds/60),s=Math.ceil(seconds%60);
  return `${m}:${String(s).padStart(2,'0')} ETA`;
}
function concatBytes(arrays) {
  let n=0; for(const a of arrays)n+=a.length;
  const out=new Uint8Array(n); let p=0;
  for(const a of arrays){out.set(a,p);p+=a.length;} return out;
}
function u32(n){return new Uint8Array([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]);}
function readU32(a,o){return (((a[o]<<24)>>>0)|(a[o+1]<<16)|(a[o+2]<<8)|a[o+3])>>>0;}
function writeU32(v,o,n){v.setUint32(o,n>>>0,false);}
function randomU32(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]>>>0;}
async function shortHashBytes(bytes){
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)); return h.slice(0,8);
}
function sameBytes(a,b){if(!a||!b||a.length!==b.length)return false;for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true;}
function xorInto(dst,src){for(let i=0;i<src.length;i++)dst[i]^=src[i];}

// RFC 9285 Base45, ideal for QR alphanumeric mode.
function base45Encode(bytes){
  let out='';
  for(let i=0;i<bytes.length;i+=2){
    if(i+1<bytes.length){
      let x=bytes[i]*256+bytes[i+1];
      const e=x%45; x=(x-e)/45; const d=x%45; const c=(x-d)/45;
      out+=B45[e]+B45[d]+B45[c];
    }else{
      const x=bytes[i]; out+=B45[x%45]+B45[Math.floor(x/45)];
    }
  }
  return out;
}
function base45Decode(s){
  if(s.length%3===1)throw new Error('bad base45');
  const out=new Uint8Array(Math.floor(s.length*2/3)+(s.length%3===2?1:0)); let p=0;
  for(let i=0;i<s.length;){
    const remain=s.length-i, n=remain>=3?3:2;
    const a=B45_REV[s.charCodeAt(i++)]??-1,b=B45_REV[s.charCodeAt(i++)]??-1;
    if(a<0||b<0)throw new Error('bad base45');
    if(n===3){
      const c=B45_REV[s.charCodeAt(i++)]??-1;if(c<0)throw new Error('bad base45');
      const x=a+b*45+c*2025;if(x>65535)throw new Error('bad base45');out[p++]=x>>8;out[p++]=x&255;
    }else{
      const x=a+b*45;if(x>255)throw new Error('bad base45');out[p++]=x;
    }
  }
  return out.subarray(0,p);
}

function resetSend(){
  stopSender();document.body.classList.remove('sending');state.transfer=null;state.esi=0;state.displaySeq=0;
  $('#sender').classList.remove('active');$('#sendStart').style.display='grid';
  $('#fileInput').value='';$('#textInput').value='';$('#textSendBtn').disabled=true;
}
function showView(name){
  const prev=state.mode;state.mode=name;$$('.view').forEach(v=>v.classList.remove('active'));$('#'+name+'View').classList.add('active');
  if(name!=='receive')stopCamera();
  if(name!=='send'&&prev==='send')resetSend();else if(name!=='send')stopSender();
  if(name==='receive')prepareCamera();
}
$$('.mode').forEach(b=>b.onclick=()=>showView(b.dataset.mode));
$$('.back').forEach(b=>b.onclick=()=>showView('home'));

// ---------- Pack / unpack ----------
async function packFiles(files){
  const meta={kind:'files',files:files.map(f=>({name:f.name,type:f.type||'application/octet-stream',size:f.size}))};
  const header=enc.encode(JSON.stringify(meta));const parts=[enc.encode('AGC1'),u32(header.length),header];
  for(const f of files)parts.push(new Uint8Array(await f.arrayBuffer()));return concatBytes(parts);
}
function packText(text){const body=enc.encode(text),header=enc.encode(JSON.stringify({kind:'text',size:body.length}));return concatBytes([enc.encode('AGC1'),u32(header.length),header,body]);}
function unpackContainer(bytes){
  if(dec.decode(bytes.subarray(0,4))!=='AGC1')throw new Error('Unknown AirGapper data');
  const hlen=readU32(bytes,4),meta=JSON.parse(dec.decode(bytes.subarray(8,8+hlen)));let p=8+hlen;
  if(meta.kind==='text')return{kind:'text',text:dec.decode(bytes.subarray(p,p+meta.size))};
  const files=meta.files.map(f=>{const data=bytes.slice(p,p+f.size);p+=f.size;return{...f,data};});return{kind:'files',files};
}

// ---------- Fountain code ----------
function mix32(x){
  x=(x+0x9e3779b9)>>>0;x=Math.imul(x^(x>>>16),0x21f0aaad);x=Math.imul(x^(x>>>15),0x735a2d97);return(x^(x>>>15))>>>0;
}
function rng32(seed){let x=mix32(seed)||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return x>>>0;};}
function robustSolitonCDF(K){
  if(K<=1)return new Float64Array([0,1]);
  const c=.1,delta=.1,R=c*Math.log(K/delta)*Math.sqrt(K),m=Math.max(1,Math.min(K,Math.floor(K/Math.max(R,1e-9))));
  const w=new Float64Array(K+1);let sum=0;
  for(let d=1;d<=K;d++){
    const rho=d===1?1/K:1/(d*(d-1));let tau=0;
    if(d<m)tau=R/(d*K);else if(d===m)tau=R*Math.log(Math.max(R/delta,1.000001))/K;
    w[d]=rho+tau;sum+=w[d];
  }
  const cdf=new Float64Array(K+1);let acc=0;for(let d=1;d<=K;d++){acc+=w[d]/sum;cdf[d]=acc;}cdf[K]=1;return cdf;
}
function sampleDegree(cdf,r){let lo=1,hi=cdf.length-1;const x=r/4294967296;while(lo<hi){const mid=(lo+hi)>>1;if(x<=cdf[mid])hi=mid;else lo=mid+1;}return lo;}
function fountainIndices(K,id,esi,cdf){
  if(esi<K)return[esi];
  const rnd=rng32((id^Math.imul(esi,0x85ebca6b))>>>0);const degree=Math.min(K,sampleDegree(cdf,rnd()));
  if(degree>=K)return Array.from({length:K},(_,i)=>i);
  const set=new Set();for(let j=K-degree;j<K;j++){const t=rnd()%(j+1);set.add(set.has(t)?j:t);}return[...set];
}
function makeSymbol(t,esi){
  const idxs=fountainIndices(t.K,t.id,esi,t.cdf);
  if(idxs.length===1){const src=t.sources[idxs[0]];if(src.length===t.symbolBytes)return src;const out=new Uint8Array(t.symbolBytes);out.set(src);return out;}
  const out=new Uint8Array(t.symbolBytes);for(const i of idxs)xorInto(out,t.sources[i]);return out;
}
function chooseLayout(target){
  const qrs=QR_COUNTS.find(n=>Math.ceil(target/n)<=MAX_SYMBOL_BYTES)||6;
  const symbolBytes=Math.min(MAX_SYMBOL_BYTES,Math.max(64,Math.ceil(target/qrs)));
  return{qrs,symbolBytes,frameBytes:qrs*symbolBytes};
}
function buildFountain(t){

    for(const region of regions(qrs,w,h)){
      const x=Math.round(region[0]*w),y=Math.round(region[1]*h),rw=Math.max(8,Math.min(w-x,Math.round(region[2]*w))),rh=Math.max(8,Math.min(h-y,Math.round(region[3]*h)));
      const img=ctx.getImageData(x,y,rw,rh);
      const results=await ZXingWASM.readBarcodes(img,{formats:['QRCode'],maxNumberOfSymbols:1,tryHarder:false,tryRotate:false,tryInvert:false,tryDownscale:true});
      const text=results&&results[0]&&results[0].text;if(text&&!codes.includes(text))codes.push(text);
    }
    self.postMessage({id,codes,ms:performance.now()-t0,engine:'ZXing-C++ WASM'});
  }catch(err){try{bitmap.close();}catch{}self.postMessage({id,codes:[],ms:performance.now()-t0,error:String(err?.message||err),engine:'ZXing-C++ WASM'});}
};`;
    state.scanWorkerUrl=URL.createObjectURL(new Blob([zxingSource,'\n',logic],{type:'text/javascript'}));
    const cores=navigator.hardwareConcurrency||4;
    // More workers are not automatically faster on old phones: keep CPU/cache
    // contention low and use additional workers only when the device can afford it.
    const count=cores<=4?1:cores<=8?2:3;
    for(let i=0;i<count;i++){
      const worker=new Worker(state.scanWorkerUrl),slot={worker,busy:false};
      worker.onmessage=e=>{
        slot.busy=false;if(token!==state.scanToken||state.mode!=='receive')return;
        state.scanEngine=e.data.engine||'WASM';
        if(Number.isFinite(e.data.ms)){state.decodeMs=state.decodeSamples?state.decodeMs*.82+e.data.ms*.18:e.data.ms;state.decodeSamples++;}
        if(e.data.error){
          state.wasmFailures++;
          if(state.wasmFailures>=3){
            console.warn('AirGapper WASM scanner unavailable, falling back:',e.data.error);
            stopScanWorkers();state.scanEngine='jsQR fallback';legacyScanLoop(token);return;
          }
        }else state.wasmFailures=0;
        recordCompletedScan();let hit=false;for(const raw of e.data.codes||[])hit=ingest(raw)||hit;if(!hit&&performance.now()-state.lastDecodeAt>1800)updateRxUi();
      };
      worker.onerror=e=>{slot.busy=false;console.warn('AirGapper WASM scan worker:',e.message||e);};
      state.scanWorkers.push(slot);
    }
    return state.scanWorkers.length>0;
  }catch(e){console.warn('AirGapper WASM workers unavailable:',e);stopScanWorkers();return false;}
}
function scanWidthFor(qrs){const base=qrs>=6?1500:qrs>=4?1300:qrs>=2?1050:850;const ms=state.decodeMs||0;return ms>180?Math.round(base*.68):ms>100?Math.round(base*.82):base;}
async function dispatchWorkerFrame(video,token){
  if(state.scanCaptureBusy||token!==state.scanToken||state.mode!=='receive'||video.readyState<2)return;
  const slot=state.scanWorkers.find(w=>!w.busy);if(!slot)return;
  slot.busy=true;state.scanCaptureBusy=true;
  try{
    const bitmap=await createImageBitmap(video);if(token!==state.scanToken||state.mode!=='receive'){bitmap.close();slot.busy=false;return;}
    const qrs=state.rx?.expectedQrs||QR_COUNTS[state.probeIndex++%QR_COUNTS.length];
    slot.worker.postMessage({id:++state.scanJobSeq,bitmap,qrs,maxW:scanWidthFor(qrs)},[bitmap]);
  }catch(e){slot.busy=false;console.warn('AirGapper frame capture:',e);}finally{state.scanCaptureBusy=false;}
}
function threadedScanLoop(token){
  const video=$('#video');
  if(video.requestVideoFrameCallback){
    const tick=()=>{if(token!==state.scanToken||state.mode!=='receive')return;video.requestVideoFrameCallback(tick);dispatchWorkerFrame(video,token);};video.requestVideoFrameCallback(tick);
  }else{
    const tick=()=>{if(token!==state.scanToken||state.mode!=='receive')return;dispatchWorkerFrame(video,token);setTimeout(tick,16);};tick();
  }
}
async function decodeFrameLegacy(video){
  const started=performance.now();
  if(!window.jsQR)return;
  const qrs=state.rx?.expectedQrs||QR_COUNTS[state.probeIndex++%QR_COUNTS.length],maxW=scanWidthFor(qrs),ratio=video.videoWidth&&video.videoHeight?video.videoHeight/video.videoWidth:9/16,canvas=$('#scanCanvas');
  canvas.width=Math.min(maxW,video.videoWidth||maxW);canvas.height=Math.max(360,Math.round(canvas.width*ratio));const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0,canvas.width,canvas.height);
  let hit=false;for(const region of normalizedRegions(qrs,canvas.width,canvas.height)){const raw=jsQrDecodeRegion(ctx,canvas,region);if(raw)hit=ingest(raw)||hit;}
  recordCompletedScan();if(!hit&&state.barcodeDetector){try{const codes=await state.barcodeDetector.detect(video);for(const c of codes)hit=ingest(c.rawValue)||hit;}catch{}}
  if(!hit&&performance.now()-state.lastDecodeAt>1800)updateRxUi();
}
function legacyScanLoop(token){
  const video=$('#video');const tick=async()=>{if(token!==state.scanToken||state.mode!=='receive')return;if(video.readyState>=2)await decodeFrameLegacy(video);if(token===state.scanToken&&state.mode==='receive')setTimeout(tick,0);};tick();
}
async function startScanPipeline(token){
  const threaded=await initScanWorkers(token);if(token!==state.scanToken)return;
  if(threaded){state.scanEngine='ZXing-C++ WASM';threadedScanLoop(token);}else{state.scanEngine='jsQR fallback';legacyScanLoop(token);}
}

// ---------- Offline download ----------
$('#offlineBtn').onclick=async()=>{
  const btn=$('#offlineBtn'),old=btn.textContent;btn.textContent='Preparing…';btn.disabled=true;
  try{
    const clone=document.documentElement.cloneNode(true);clone.querySelector('body')?.classList.remove('sending');clone.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));clone.querySelector('#homeView')?.classList.add('active');clone.querySelector('#sender')?.classList.remove('active');const sendStart=clone.querySelector('#sendStart');if(sendStart)sendStart.style.display='grid';clone.querySelector('#cameraGate')?.classList.remove('active');
    const fileInput=clone.querySelector('#fileInput');if(fileInput)fileInput.value='';const textInput=clone.querySelector('#textInput');if(textInput){textInput.value='';textInput.textContent='';}const textSend=clone.querySelector('#textSendBtn');if(textSend)textSend.disabled=true;
    const live=[...document.querySelectorAll('script[data-vendor]')],copies=[...clone.querySelectorAll('script[data-vendor]')];for(let i=0;i<live.length;i++){const src=live[i].src;if(!src)continue;const code=await fetch(src,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('Could not download libraries');return r.text();});copies[i].removeAttribute('src');copies[i].textContent=code.replace(new RegExp('<'+'/script','gi'),'<\\/script');}
    downloadBlob(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'}),'AirGapper-v7-offline.html');toast('Offline copy downloaded');
  }catch(e){toast(e.message||'Could not build offline copy');}finally{btn.textContent=old;btn.disabled=false;}
};
window.addEventListener('resize',()=>{if(state.transfer)renderSendFrame();});
})();
