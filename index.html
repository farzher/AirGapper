<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AirGrid RS Hardware Lab</title>
  <meta name="robots" content="noindex" />
  <script>
    (() => {
      const q = location.search;
      let mode = '';
      if (q === '?r' || q.includes('receive')) mode = '?receive';
      else if (q === '?s' || q.includes('send')) mode = '?send';
      location.replace('./airgrid.html' + mode + location.hash);
    })();
  </script>
</head>
<body>
  <p><a href="./airgrid.html">Open AirGrid RS Hardware Lab</a></p>
</body>
</html>
