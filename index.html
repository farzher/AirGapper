<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AirGrid Bandwidth Lab</title>
  <meta name="robots" content="noindex">
  <script>
    (() => {
      const q = location.search;
      let mode = q;
      if (q === '?r') mode = '?receive';
      else if (q === '?s') mode = '?send';
      location.replace('./airgrid.html' + mode + location.hash);
    })();
  </script>
</head>
<body>
  <p><a href="./airgrid.html">Open AirGrid bandwidth lab</a></p>
</body>
</html>
