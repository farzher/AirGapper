<!doctype html>
<!-- AirGapper v34f: black-field profile 3 optical mode -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AirGapper — Air-gapped file transfer</title>
<style>
  :root { color-scheme:dark; --bg:#000; --card:#0b0b0b; --ink:#f4f4f2; --muted:#999; --line:#272727; --soft:#171717; --good:#57d985; --warn:#f4bd59; --bad:#f26c6c; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:15px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  button,input,textarea { font:inherit; }
  button { color:inherit; }
  .app { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  header { width:min(920px,calc(100% - 32px)); margin:0 auto; padding:22px 0 10px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .brand { font-weight:750; font-size:18px; letter-spacing:-.02em; }
  .tag { color:var(--muted); font-size:12px; margin-top:2px; }
  .version { display:inline-block; margin-left:6px; color:#aaa; font-size:10px; font-weight:650; vertical-align:1px; }
  .ghost { border:1px solid var(--line); background:transparent; border-radius:10px; padding:8px 11px; cursor:pointer; }
  .ghost:hover { background:var(--card); }
  main { width:min(920px,calc(100% - 32px)); margin:auto; padding:24px 0 42px; }
  .home { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .mode { min-height:180px; border:1px solid var(--line); background:var(--card); border-radius:20px; cursor:pointer; font-weight:700; font-size:27px; letter-spacing:-.035em; transition:.16s ease; }
  .mode:hover { transform:translateY(-2px); border-color:#444; box-shadow:0 12px 36px #0008; }
  .view { display:none; }
  .view.active { display:block; }
  .topline { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; }
  .back { border:0; background:transparent; padding:6px 0; cursor:pointer; color:var(--muted); }
  .back:hover { color:var(--ink); }
  .title { font-weight:700; font-size:17px; }
  .sendStart { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .drop,.textWrap { min-height:240px; border:1px solid var(--line); background:var(--card); border-radius:18px; }
  .drop { display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer; position:relative; transition:.14s; }
  .drop.drag { border-color:#777; background:#111; transform:scale(.995); }
  .drop input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .drop strong { display:block; font-size:18px; margin-bottom:5px; }
  .sub { color:var(--muted); font-size:12px; }
  .textWrap { padding:16px; display:flex; flex-direction:column; gap:10px; }
  textarea { resize:none; flex:1; border:0; outline:0; background:transparent; color:var(--ink); font-size:17px; line-height:1.45; }
  textarea::placeholder { color:#aaa; }
  .textSend { align-self:flex-end; border:0; background:#f4f4f2; color:#000; border-radius:10px; padding:8px 13px; cursor:pointer; font-weight:650; }
  .textSend:disabled { opacity:.35; cursor:default; }
  .sender { display:none; }
  .sender.active { display:block; }
  .qrStage { position:relative; background:#000; border:1px solid var(--line); border-radius:20px; overflow:hidden; min-height:470px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #qrCanvas { display:block; background:#000; flex:none; image-rendering:pixelated; }
  .qrOverlay { position:absolute; inset:auto 12px 12px 12px; display:flex; justify-content:space-between; align-items:end; pointer-events:none; mix-blend-mode:multiply; }
  .qrMeta { background:#ffffffdd; backdrop-filter:blur(8px); border:1px solid #ecece8; border-radius:12px; padding:7px 9px; font-size:11px; color:#555; }
  .fullscreen { pointer-events:auto; border:1px solid #ddd; background:#fffffff0; border-radius:10px; padding:8px 10px; cursor:pointer; }
  .qrStage:fullscreen { width:100vw; height:100vh; border:0; border-radius:0; }
  .qrStage:fullscreen #qrCanvas { max-width:100vw; max-height:100vh; }
  .controls { margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .control { min-width:0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .controlHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .controlHead b { font-size:13px; }
  .transferName { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .value { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  input[type=range] { width:100%; accent-color:#222; }
  .receiveCard { border:1px solid var(--line); background:#111; border-radius:20px; overflow:hidden; position:relative; min-height:520px; }
  #video { width:100%; height:520px; object-fit:contain; display:block; background:#111; }

  .debugOverlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; display:none; }
  .receiveCard.debug .debugOverlay,.receiveCard.debug .debugPanel { display:block; }
  .debugPanel { display:none; position:absolute; right:10px; top:10px; z-index:2; width:min(58%,270px); max-height:32%; overflow:auto; background:#111b; color:#fff; border:1px solid #ffffff25; border-radius:9px; padding:6px 7px; font:9px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; backdrop-filter:blur(6px); pointer-events:none; }
  .cameraActions { display:flex; gap:7px; }

  .receiveHud { position:absolute; left:12px; right:12px; bottom:12px; display:flex; align-items:end; justify-content:space-between; gap:10px; }
  .statusCard { min-width:220px; background:#111d; color:white; border:1px solid #ffffff25; backdrop-filter:blur(10px); border-radius:14px; padding:10px 11px; }
  .statusTop { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:650; }
  .dot { width:8px; height:8px; border-radius:50%; background:#aaa; box-shadow:0 0 0 3px #ffffff16; }
  .dot.good { background:#57d985; }
  .dot.warn { background:#f4bd59; }
  .dot.bad { background:#f26c6c; }
  .liveRate { margin-top:7px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; font-variant-numeric:tabular-nums; }
  .liveRate strong { font-size:23px; line-height:1; letter-spacing:-.03em; }
  .liveRate span { color:#ffffffb5; font-size:11px; }
  .qualityBar { height:5px; background:#ffffff25; margin-top:8px; overflow:hidden; border-radius:9px; }
  .qualityBar i { display:block; height:100%; width:0; background:#f26c6c; transition:width .18s linear,background .18s; }
  .stats { margin-top:7px; display:flex; flex-wrap:wrap; gap:4px 12px; color:#ffffffb0; font-size:11px; font-variant-numeric:tabular-nums; }
  .progressBar { height:3px; background:#ffffff25; margin-top:9px; overflow:hidden; border-radius:9px; }
  .progressBar i { display:block; height:100%; width:0; background:white; transition:width .15s linear; }
  .cameraBtn { border:1px solid #ffffff35; background:#111c; color:white; border-radius:11px; padding:9px 11px; cursor:pointer; backdrop-filter:blur(8px); }
  .cameraGate { position:absolute; inset:0; display:none; place-items:center; background:#111; z-index:3; }
  .cameraGate.active { display:grid; }
  .enableCamera { border:1px solid #ffffff35; background:#fff; color:#111; border-radius:12px; padding:11px 16px; cursor:pointer; font-weight:700; }
  .result { margin-top:12px; border:1px solid var(--line); background:var(--card); border-radius:16px; padding:14px; display:none; }
  .result.active { display:block; }
  .resultHead { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .resultTitle { font-weight:700; }
  .files { display:grid; gap:8px; margin-top:10px; }
  .fileRow { display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding-top:9px; }
  .fileName { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .smallBtn { border:1px solid var(--line); background:var(--soft); border-radius:9px; padding:6px 9px; cursor:pointer; flex:none; }
  .textResult { margin-top:10px; white-space:pre-wrap; word-break:break-word; background:var(--bg); border-radius:10px; padding:12px; max-height:260px; overflow:auto; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,15px); opacity:0; pointer-events:none; background:#111; color:#fff; padding:9px 12px; border-radius:10px; font-size:12px; transition:.18s; z-index:50; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  /* Once a transfer starts, give the optical surface the whole viewport. */
  body.sending { overflow:hidden; }
  body.sending .app { height:100vh; height:100dvh; min-height:0; }
  body.sending header { display:none; }
  body.sending main { width:100%; flex:1; min-height:0; margin:0; padding:8px; }
  body.sending #sendView.active { height:100%; min-height:0; display:flex; flex-direction:column; }
  body.sending #sendView .topline { flex:none; height:34px; margin:0 4px 7px; }
  body.sending #sender.active { flex:1; min-height:0; display:flex; flex-direction:column; }
  body.sending .qrStage { flex:1; min-height:0; border-radius:14px; }
  body.sending .qrOverlay { display:none; }
  body.sending #qrCanvas { min-height:0; }
  body.sending .controls { flex:none; margin-top:8px; gap:8px; }
  body.sending .control { padding:9px 12px; }
  body.sending .controlHead { margin-bottom:5px; }
  @media(max-width:700px){
    header { padding-top:16px; }
    main { padding-top:12px; }
    .home,.sendStart,.controls { grid-template-columns:1fr; }
    body.sending .controls { grid-template-columns:1fr 1fr; }
    .mode { min-height:130px; }
    .drop,.textWrap { min-height:190px; }
    .qrStage { min-height:390px; }
    body.sending .qrStage { min-height:0; }
    .receiveCard,#video { height:calc(100dvh - 175px); min-height:430px; }
    .statusCard { min-width:0; flex:1; }
  }
  @media(orientation:landscape) and (max-height:700px){
    body.receiving { overflow:hidden; }
    body.receiving .app { height:100vh; height:100dvh; min-height:0; }
    body.receiving header,body.receiving #receiveView .topline { display:none; }
    body.receiving main { width:100%; height:100%; min-height:0; margin:0; padding:0; }
    body.receiving #receiveView.active { display:block; width:100%; height:100%; min-height:0; }
    body.receiving .receiveCard { width:100%; height:100%; min-height:0; border:0; border-radius:0; }
    body.receiving #video { width:100%; height:100%; min-height:0; object-fit:contain; }
    body.receiving .receiveHud { left:6px; right:6px; bottom:6px; }
    body.receiving .statusCard { min-width:0; max-width:270px; background:#111a; padding:7px 9px; }
    body.receiving .liveRate strong { font-size:19px; }
    body.receiving .stats { margin-top:4px; }
    body.receiving .result.active { display:block; position:fixed; left:8px; right:8px; bottom:8px; z-index:6; max-height:70dvh; overflow:auto; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="brand">AirGapper <span class="version">v34f</span></div><div class="tag">Air-gapped file transfer</div></div>
    <button class="ghost" id="offlineBtn">Download offline</button>
  </header>

  <main>
    <section id="homeView" class="view active">
      <div class="home">
        <button class="mode" data-mode="send">Send</button>
        <button class="mode" data-mode="receive">Receive</button>
      </div>
    </section>

    <section id="sendView" class="view">
      <div class="topline"><button class="back">← Back</button><div class="title">Send</div><div style="width:42px"></div></div>
      <div id="sendStart" class="sendStart">
        <label class="drop" id="dropZone">
          <input id="fileInput" type="file" multiple>
          <div><strong>Drop files</strong><div class="sub">or click to choose</div></div>
        </label>
        <div class="textWrap"><textarea id="textInput" placeholder="Or paste text…"></textarea><button class="textSend" id="textSendBtn" disabled>Send text</button></div>
      </div>

      <div id="sender" class="sender">
        <div class="qrStage" id="qrStage">
          <canvas id="qrCanvas"></canvas>
          <div class="qrOverlay">
            <div class="qrMeta" id="qrMeta">Preparing…</div>
            <button class="fullscreen" id="fullscreenBtn">Fullscreen</button>
          </div>
        </div>
        <div class="controls">
          <div class="control">
            <div class="controlHead"><b>Page rate</b><span class="value" id="fpsValue">15 fps</span></div>
            <input id="fpsRange" type="range" min="0" max="30" step="1" value="15" aria-label="AirGrid page rate; zero freezes the current page">
          </div>
          <div class="control">
            <div class="controlHead"><b class="transferName" id="transferName">File</b></div>
            <div class="sub" id="transferSizes">— uncompressed · — compressed</div>
          </div>
        </div>
      </div>
    </section>

    <section id="receiveView" class="view">
      <div class="topline"><button class="back">← Back</button><div class="title">Receive</div><div style="width:42px"></div></div>
      <div class="receiveCard">
        <video id="video" playsinline muted></video>
        <canvas class="debugOverlay" id="debugOverlay"></canvas><div class="debugPanel" id="debugPanel"></div>
        <div class="cameraGate" id="cameraGate"><button class="enableCamera" id="enableCameraBtn">Enable camera</button></div>
        <div class="receiveHud">
          <div class="statusCard">
            <div class="statusTop"><span id="statusDot" class="dot"></span><span id="statusText">Starting camera…</span></div>
            <div class="liveRate"><strong id="rateText">— KB/s</strong><span id="qualityText">Waiting for AirGrid…</span></div>
            <div class="qualityBar"><i id="qualityFill"></i></div>
            <div class="stats"><span id="progressText">0%</span><span id="etaText">— ETA</span><span id="cameraText">— camera</span><span id="scanText">— scan</span><span id="dropText">— loss</span></div>
            <div class="progressBar"><i id="progressFill"></i></div>
          </div>
          <div class="cameraActions"><button class="cameraBtn" id="debugBtn">Debug</button><button class="cameraBtn" id="flipBtn">Flip</button></div>
        </div>
      </div>
      <div class="result" id="result"></div>
      <canvas id="scanCanvas" hidden></canvas>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script data-vendor="qrcode" src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script data-vendor="zxing" src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.2/dist/iife/reader/index.js"></script>
<script data-vendor="fflate" src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script>
(() => {
'use strict';

const BUILD='v34f';
document.documentElement.dataset.airgapperBuild=BUILD;

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const enc=new TextEncoder();
const dec=new TextDecoder();

const B45='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
const B45_REV=(()=>{const a=new Int16Array(128);a.fill(-1);for(let i=0;i<B45.length;i++)a[B45.charCodeAt(i)]=i;return a;})();

// AirGrid profile 3. Every payload tile has its own four registration marks,
// and each logical shape sample is a 3×3 block. The previous profile inferred
// payload geometry by extrapolating from a neighboring QR; even a one-pixel
// error corrupted hundreds of glyphs. Local registration keeps sampling locked
// to each tile while the larger samples remain resolvable after camera scaling.
const AIR={
  protocol:3, profile:3,
  dotPx:3, glyphPx:15, glyphCols:16, glyphRows:16, cellPx:270, groupCells:2,
  symbolBytes:160, parityBytes:16,
  payloadInset:15, payloadPilotInset:5, payloadPilotSize:10,
  qrMaxPx:210, qrQuiet:2,
  pageStripX:26, pageStripY:4, pageStripW:218, pageStripH:14,
  calX:18, calY:246, calW:31, calH:16, calGap:8,
  pilotInset:3, pilotSize:14,
  interleaveStride:37,
  workerWidth:1920, detectorWidth:960, senderScale:1.5, safeInset:12, darkOptical:true,
};
AIR.glyphCount=AIR.glyphCols*AIR.glyphRows;
AIR.protectedBytes=AIR.symbolBytes+AIR.parityBytes+4;
AIR.usedGlyphs=Math.ceil(AIR.protectedBytes*8/6);
AIR.groupPx=AIR.cellPx*AIR.groupCells;
const AIR_SLOTS=[{dx:1,dy:0},{dx:0,dy:1},{dx:1,dy:1}];
const GLYPH_MASKS=[0x24846b,0x1531290,0x1886905,0xc50b0a,0x1cba20,0xc024bc,0xbe4018,0x3a156,0xd0d540,0x18882b1,0x3701a4,0x1605055,0x297888,0x128c87,0x1222b60,0x580e51];
// Similar-luminance, widely separated hues. Luminance is decoded separately.
const AIR_COLORS=[[255,105,180],[70,235,155],[110,170,255],[255,155,55]];
const COLOR32=AIR_COLORS.map(([r,g,b])=>(r|(g<<8)|(b<<16)|(255<<24))>>>0);
const BLACK32=0xff000000,WHITE32=0xffffffff,OPTICAL_BG32=AIR.darkOptical?BLACK32:WHITE32,OPTICAL_MARK32=AIR.darkOptical?WHITE32:BLACK32;

const state={
  mode:'home',stream:null,facing:'environment',cameraDeviceId:null,cameraDevices:[],cameraStartPromise:null,scanToken:0,
  transfer:null,sendTimer:null,displaySeq:0,displayedPage:-1,senderActualFps:0,senderFrameCount:0,senderWindowAt:0,airImage:null,airImage32:null,
  rx:null,debug:false,barcodeDetector:null,
  cameraFps:0,cameraMeasuredFps:0,cameraRequestedFps:0,cameraRequestedWidth:0,cameraRequestedHeight:0,cameraWidth:0,cameraHeight:0,cameraFrameCount:0,cameraWindowAt:0,lastPresentedFrames:null,cameraSkippedFrames:0,cameraSettings:null,cameraCaps:null,
  scanWorker:null,scanWorkerUrl:null,scanBusy:false,scanStartedAt:0,scanEngine:'',scanFrames:0,scanWindowFrames:0,scanRate:0,decodeMs:0,decodeTimes:[],captureMs:0,workerUtil:0,workerBusyWindowMs:0,metricsWindowAt:0,longTaskCount:0,longTaskMs:0,
  lastDecodeAt:0,lastUiAt:0,firstGridMs:0,groupsVisible:0,tilesVisible:0,tilesOk:0,tileHitRate:0,glyphConfidence:0,colorConfidence:0,knownGlyphRate:0,knownShapeRate:0,knownColorRate:0,innerCorrections:0,crcFailures:0,transitionRejects:0,qrCandidates:0,bootstrapQrs:0,
  verifiedWindowBytes:0,verifiedRate:0,verifiedKbFrame:0,rawKbFrame:0,uniquePagesWindow:new Set(),uniquePageRate:0,duplicateSymbols:0,duplicateWindow:0,uniqueWindow:0,usefulRecoveredBytes:0,verifiedBytes:0,verifiedMs:0,rxIngressSamples:[],
  lastOverlayAt:0,debugGroups:[],
};

try{new PerformanceObserver(list=>{if(state.mode!=='receive')return;for(const e of list.getEntries()){state.longTaskCount++;state.longTaskMs+=e.duration;}}).observe({type:'longtask',buffered:true});}catch{}

function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1700);}
function humanBytes(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(n<10240?1:0)+' KB';return(n/1048576).toFixed(n<10485760?1:0)+' MB';}
function humanRate(bytesPerSec){if(!bytesPerSec||bytesPerSec<1)return'— KB/s';const kb=bytesPerSec/1024;return`${kb<10?kb.toFixed(1):Math.round(kb)} KB/s`;}
function humanEta(seconds){if(!Number.isFinite(seconds)||seconds<0)return'— ETA';if(seconds<1)return'<1s ETA';if(seconds<60)return`${Math.ceil(seconds)}s ETA`;const m=Math.floor(seconds/60),s=Math.ceil(seconds%60);return`${m}:${String(s).padStart(2,'0')} ETA`;}
function concatBytes(arrays){let n=0;for(const a of arrays)n+=a.length;const out=new Uint8Array(n);let p=0;for(const a of arrays){out.set(a,p);p+=a.length;}return out;}
function u32(n){return new Uint8Array([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]);}
function readU32(a,o){return(((a[o]<<24)>>>0)|(a[o+1]<<16)|(a[o+2]<<8)|a[o+3])>>>0;}
function writeU32(v,o,n){v.setUint32(o,n>>>0,false);}
function randomU32(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]>>>0;}
async function shortHashBytes(bytes){return new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)).slice(0,8);}
function sameBytes(a,b){if(!a||!b||a.length!==b.length)return false;for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true;}
function xorInto(dst,src){for(let i=0;i<src.length;i++)dst[i]^=src[i];}
function mix32(x){x=(x+0x9e3779b9)>>>0;x=Math.imul(x^(x>>>16),0x21f0aaad);x=Math.imul(x^(x>>>15),0x735a2d97);return(x^(x>>>15))>>>0;}
function rng32(seed){let x=mix32(seed)||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return x>>>0;};}

function base45Encode(bytes){let out='';for(let i=0;i<bytes.length;i+=2){if(i+1<bytes.length){let x=bytes[i]*256+bytes[i+1];const e=x%45;x=(x-e)/45;const d=x%45,c=(x-d)/45;out+=B45[e]+B45[d]+B45[c];}else{const x=bytes[i];out+=B45[x%45]+B45[Math.floor(x/45)];}}return out;}
function base45Decode(s){if(s.length%3===1)throw new Error('bad base45');const out=new Uint8Array(Math.floor(s.length*2/3)+(s.length%3===2?1:0));let p=0;for(let i=0;i<s.length;){const n=s.length-i>=3?3:2,a=B45_REV[s.charCodeAt(i++)]??-1,b=B45_REV[s.charCodeAt(i++)]??-1;if(a<0||b<0)throw new Error('bad base45');if(n===3){const c=B45_REV[s.charCodeAt(i++)]??-1,x=a+b*45+c*2025;if(c<0||x>65535)throw new Error('bad base45');out[p++]=x>>8;out[p++]=x&255;}else{const x=a+b*45;if(x>255)throw new Error('bad base45');out[p++]=x;}}return out.subarray(0,p);}

// ---------- Pack / unpack ----------
async function packFiles(files){const meta={kind:'files',files:files.map(f=>({name:f.name,type:f.type||'application/octet-stream',size:f.size}))},header=enc.encode(JSON.stringify(meta)),parts=[enc.encode('AGC1'),u32(header.length),header];for(const f of files)parts.push(new Uint8Array(await f.arrayBuffer()));return concatBytes(parts);}

// ---------- AirGrid inner protection / modulation ----------
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

fi.onchange=async()=>{if(fi.files.length)prepareTransfer(await packFiles([...fi.files]),fi.files.length===1?fi.files[0].name:`${fi.files.length} files`);};

$$('.mode').forEach(b=>b.onclick=()=>showView(b.dataset.mode));$$('.back').forEach(b=>b.onclick=()=>showView('home'));

// ---------- Receive ----------
function isIOS(){return/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function cameraPolicyBlocked(){try{const p=document.permissionsPolicy||document.featurePolicy;return!!(p?.allowsFeature&&!p.allowsFeature('camera'));}catch{return false;}}

async function dispatchAirFrame(video,token){if(state.scanBusy||!state.scanWorker||token!==state.scanToken||state.mode!=='receive'||video.readyState<2)return;state.scanBusy=true;const t0=performance.now();try{const bitmap=await createImageBitmap(video);state.captureMs=state.captureMs?state.captureMs*.8+(performance.now()-t0)*.2:performance.now()-t0;if(token!==state.scanToken||state.mode!=='receive'){bitmap.close();state.scanBusy=false;return;}state.scanWorker.postMessage({id:state.scanFrames+1,bitmap,target:AIR.workerWidth},[bitmap]);}catch(e){state.scanBusy=false;console.warn('AirGrid capture:',e);}}
function airScanLoop(token){const video=$('#video');if(video.requestVideoFrameCallback){const tick=()=>{if(token!==state.scanToken||state.mode!=='receive')return;video.requestVideoFrameCallback(tick);if(!state.scanBusy)dispatchAirFrame(video,token);};video.requestVideoFrameCallback(tick);}else{const loop=()=>{if(token!==state.scanToken||state.mode!=='receive')return;if(!state.scanBusy)dispatchAirFrame(video,token);setTimeout(loop,20);};loop();}}
async function startAirGridPipeline(token){state.scanStartedAt=performance.now();const ok=await initAirWorker(token);if(token!==state.scanToken)return;if(!ok){setStatus('AirGrid needs Worker + OffscreenCanvas','bad');return;}airScanLoop(token);}

// ---------- Diagnostics ----------
function runSelfTests(){const failures=[],assert=(ok,msg)=>{if(!ok)failures.push(msg);};assert(AIR.usedGlyphs<=AIR.glyphCount,'payload glyph capacity');assert(AIR.payloadInset*2+AIR.glyphCols*AIR.glyphPx<=AIR.cellPx,'payload bounds');assert(AIR.payloadPilotInset+AIR.payloadPilotSize<=AIR.payloadInset,'payload pilot clearance');const physical=new Set();for(let i=0;i<AIR.glyphCount;i++)physical.add((i*AIR.interleaveStride)%AIR.glyphCount);assert(physical.size===AIR.glyphCount,'interleave permutation');for(const m of GLYPH_MASKS)assert(m.toString(2).replace(/0/g,'').length===9,'glyph weight');for(let i=0;i<GLYPH_MASKS.length;i++)for(let j=i+1;j<GLYPH_MASKS.length;j++)assert((GLYPH_MASKS[i]^GLYPH_MASKS[j]).toString(2).replace(/0/g,'').length>=10,'glyph distance');const sample=Uint8Array.from({length:AIR.protectedBytes},(_,i)=>(i*73+19)&255),syms=bytesToSymbols6(sample),round=symbols6ToBytes(syms);assert(sameBytes(sample,round),'6-bit roundtrip');const payload=Uint8Array.from({length:AIR.symbolBytes},(_,i)=>(i*29+7)&255),id=0x12345678,esi=0x10203,prot=protectSymbol(payload,id,esi);assert(verifyProtected(prot,id,esi),'inner CRC/parity');const seen=new Set();for(let page=0;page<8;page++)for(let gy=0;gy<4;gy++)for(let gx=0;gx<8;gx++)for(let slot=0;slot<AIR_SLOTS.length;slot++){const e=airEsi(page,gx,gy,slot);assert(!seen.has(e),'ESI uniqueness');seen.add(e);}function fec(){const K=31,size=AIR.symbolBytes,fid=0x1234abcd,cdf=robustSolitonCDF(K),sources=Array.from({length:K},(_,i)=>Uint8Array.from({length:size},(_,j)=>(i*73+j*29)&255)),rx={source:new Array(K),solved:0,equations:new Map(),adj:new Array(K),nextEq:1};function solve(index,data){const queue=[[index,data]];while(queue.length){const[idx,block]=queue.shift();if(rx.source[idx])continue;rx.source[idx]=block.slice();rx.solved++;for(const eqId of rx.adj[idx]||[]){const eq=rx.equations.get(eqId);if(!eq||!eq.idxs.has(idx))continue;eq.idxs.delete(idx);xorInto(eq.data,block);if(!eq.idxs.size)rx.equations.delete(eqId);else if(eq.idxs.size===1){rx.equations.delete(eqId);queue.push([eq.idxs.values().next().value,eq.data]);}}}}for(let e=0;e<12000&&rx.solved<K;e++){if(mix32(e^0x51f15e)%100<55)continue;const idxs=fountainIndices(K,fid,e,cdf,3),data=new Uint8Array(size);for(const i of idxs)xorInto(data,sources[i]);const left=new Set();for(const i of idxs){if(rx.source[i])xorInto(data,rx.source[i]);else left.add(i);}if(left.size===1)solve(left.values().next().value,data);else if(left.size>1){const n=rx.nextEq++,eq={idxs:left,data};rx.equations.set(n,eq);for(const i of left)(rx.adj[i]||(rx.adj[i]=[])).push(n);}}assert(rx.solved===K,'fountain heavy-loss reconstruction');}fec();const result={ok:!failures.length,failures,tests:1+120+1+1+seen.size+1};console[result.ok?'info':'error']('AirGapper AirGrid self-tests',result);return result;}
window.AirGapperDiagnostics={build:BUILD,air:AIR,glyphMasks:GLYPH_MASKS,runSelfTests,parseBootstrap,inspectBootstrap};
if(new URLSearchParams(location.search).get('airgapperTest')==='1')setTimeout(()=>{const r=runSelfTests();toast(r.ok?'Self-tests passed':`${r.failures.length} self-tests failed`);},0);

function bytesToBase64(bytes){let out='';const step=0x8000;for(let i=0;i<bytes.length;i+=step)out+=String.fromCharCode(...bytes.subarray(i,Math.min(bytes.length,i+step)));return btoa(out);}
async function fetchWasmBase64(url){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('Could not download WASM');return bytesToBase64(new Uint8Array(await r.arrayBuffer()));}
const offlineBtn=$('#offlineBtn');
if(offlineBtn)offlineBtn.onclick=async()=>{const btn=$('#offlineBtn'),old=btn.textContent;btn.textContent='Preparing…';btn.disabled=true;try{const clone=document.documentElement.cloneNode(true);clone.querySelector('#offlineBtn')?.remove();clone.querySelector('body')?.classList.remove('sending');clone.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));clone.querySelector('#homeView')?.classList.add('active');clone.querySelector('#sender')?.classList.remove('active');const sendStart=clone.querySelector('#sendStart');if(sendStart)sendStart.style.display='grid';clone.querySelector('#cameraGate')?.classList.remove('active');clone.querySelector('.receiveCard')?.classList.remove('debug');const dbg=clone.querySelector('#debugBtn');if(dbg)dbg.textContent='Debug';const fileInput=clone.querySelector('#fileInput');if(fileInput)fileInput.value='';const textInput=clone.querySelector('#textInput');if(textInput){textInput.value='';textInput.textContent='';}const textSend=clone.querySelector('#textSendBtn');if(textSend)textSend.disabled=true;const live=[...document.querySelectorAll('script[data-vendor]')],copies=[...clone.querySelectorAll('script[data-vendor]')];for(let i=0;i<live.length;i++){const src=live[i].src;if(!src)continue;const code=await fetch(src,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('Could not download libraries');return r.text();});copies[i].removeAttribute('src');copies[i].textContent=code.replace(new RegExp('<'+'/script','gi'),'<\\/script');}const tag=document.createElement('script');tag.type='text/plain';tag.setAttribute('data-wasm','zxing-reader');tag.textContent=await fetchWasmBase64('https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.2/dist/reader/zxing_reader.wasm');clone.querySelector('body').appendChild(tag);downloadBlob(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'}),`AirGapper-${BUILD}-offline.html`);toast('Offline copy downloaded');}catch(e){toast(e.message||'Could not build offline copy');}finally{btn.textConte
